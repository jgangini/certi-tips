<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="semantic-exact-authorized">
<title id="title">Significado para buscar; identidad para consultar</title>
<desc id="description">Para el manual se busca similitud y se confirma compatibilidad del modelo de equipo. Para órdenes se filtra por identificador exacto y estado abierto. Modificar requiere otra herramienta con autorización específica.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5C8 2 4 3 2 4v15c4-1 7-1 10 2 3-3 6-3 10-2V4c-4-1-7-1-10 1v16"/><path d="M5 8h4m-4 4h4m6-4h4m-4 4h4"/></symbol><symbol id="table" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 9h20M2 15h20M9 3v18M16 9v12"/></symbol><symbol id="shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4v7c0 5-6 8-9 9-3-1-9-4-9-9V6Z"/><path d="m7 12 3 3 7-7"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Significado para buscar; identidad para consultar</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">El agente reúne evidencias, pero cada operación tiene su criterio.</text><text x="56" y="176" font-size="25" fill="#17243b" font-weight="700" text-anchor="start">Pregunta: manual para este fallo + órdenes abiertas del equipo</text><g data-concept="Manual"><circle cx="214" cy="322" r="60" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="214" cy="315" r="60" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="book" href="#book" x="181.6" y="282.6" width="64.80000000000001" height="64.80000000000001" color="#c74436"/><text x="214" y="418" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Manual</text><text x="214" y="453" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Similitud para recuperar</text><text x="214" y="485" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">+ comprobar modelo</text></g><g data-concept="Órdenes"><circle cx="600" cy="322" r="60" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="600" cy="315" r="60" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="table" href="#table" x="567.6" y="282.6" width="64.80000000000001" height="64.80000000000001" color="#4f46b8"/><text x="600" y="418" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Órdenes</text><text x="600" y="453" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">ID exacto del equipo</text><text x="600" y="485" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">+ estado abierto</text></g><g data-concept="Modificar"><circle cx="986" cy="322" r="60" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="986" cy="315" r="60" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="shield" href="#shield" x="953.6" y="282.6" width="64.80000000000001" height="64.80000000000001" color="#087f7a"/><text x="986" y="418" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Modificar</text><text x="986" y="453" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Herramienta diferente</text><text x="986" y="485" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">+ permiso específico</text></g><rect x="111" y="494" width="977" height="42" rx="21" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="599.5" y="522" font-size="21" fill="#c74436" font-weight="600" text-anchor="middle">Recuperar un manual parecido no demuestra que sea compatible con ese equipo.</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Conserva la procedencia de cada dato y verifica antes de recomendar una acción.</text></g>
</svg>
