<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="distributed-compute">
<title id="title">Calcular, comunicar y evaluar</title>
<desc id="description">Dos nodos contienen dos GPU conectadas localmente. RDMA sobre RoCE comunica nodos. Un bloque independiente exige evaluar resultados por grupos, supervisión humana y corrección, responsabilidades distintas del cómputo.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M8 2v3m4-3v3m4-3v3M8 19v3m4-3v3m4-3v3M2 8h3m-3 4h3m-3 4h3m14-8h3m-3 4h3m-3 4h3"/></symbol><symbol id="users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3"/><path d="M2 21v-3a7 7 0 0 1 14 0v3M17 4a3 3 0 0 1 0 6m2 4a6 6 0 0 1 3 5v2"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Calcular, comunicar y evaluar</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Una GPU trabaja en paralelo; la red conecta nodos; las personas supervisan el uso.</text><rect x="56" y="172" width="717" height="354" rx="24" fill="#fff" stroke="#dce1ec" stroke-width="1.5"/><text x="414" y="212" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Entrenamiento distribuido</text><rect x="93" y="249" width="219" height="211" rx="18" fill="#eef0f8" stroke="#dce1ec" stroke-width="1.5"/><rect x="516" y="249" width="219" height="211" rx="18" fill="#eef0f8" stroke="#dce1ec" stroke-width="1.5"/><text x="203" y="286" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Nodo A</text><text x="626" y="286" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Nodo B</text><use data-icon="cpu" href="#cpu" x="118.5" y="321.5" width="59" height="59" color="#4f46b8"/><text x="148" y="410" font-size="23" fill="#4f46b8" font-weight="600" text-anchor="middle">GPU</text><use data-icon="cpu" href="#cpu" x="226.5" y="321.5" width="59" height="59" color="#4f46b8"/><text x="256" y="410" font-size="23" fill="#4f46b8" font-weight="600" text-anchor="middle">GPU</text><use data-icon="cpu" href="#cpu" x="541.5" y="321.5" width="59" height="59" color="#4f46b8"/><text x="571" y="410" font-size="23" fill="#4f46b8" font-weight="600" text-anchor="middle">GPU</text><use data-icon="cpu" href="#cpu" x="649.5" y="321.5" width="59" height="59" color="#4f46b8"/><text x="679" y="410" font-size="23" fill="#4f46b8" font-weight="600" text-anchor="middle">GPU</text><path d="M184 351L220 351" fill="none" stroke="#4f46b8" stroke-width="3"/><path d="M607 351L643 351" fill="none" stroke="#4f46b8" stroke-width="3"/><path d="M325 332H503" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M503 365H325" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="414" y="302" font-size="20" fill="#536078" font-weight="400" text-anchor="middle">Red entre nodos</text><text x="414" y="409" font-size="21" fill="#087f7a" font-weight="600" text-anchor="middle">RDMA / RoCE</text><text x="414" y="439" font-size="21" fill="#087f7a" font-weight="600" text-anchor="middle">Comunicación</text><circle cx="990" cy="277" r="56" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="990" cy="270" r="56" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="users" href="#users" x="959.76" y="239.76" width="60.480000000000004" height="60.480000000000004" color="#c74436"/><text x="990" y="374" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">IA responsable</text><text x="990" y="417" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Evaluar por grupos</text><text x="990" y="449" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Supervisar el uso</text><text x="990" y="481" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Corregir errores</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Más cómputo no sustituye una evaluación ni resuelve todos los cuellos de botella.</text></g>
</svg>
