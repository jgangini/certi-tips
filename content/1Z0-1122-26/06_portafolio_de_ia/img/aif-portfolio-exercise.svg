<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="service-assignment">
<title id="title">Asigna una capacidad a cada necesidad</title>
<desc id="description">Speech transcribe 300 grabaciones. Data Science desarrolla el clasificador propio. Un job o pipeline repite la evaluación semanal. Un endpoint de deployment solo se añade si se necesita inferencia en línea.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10v4m4-8v12m4-16v20m4-15v10m4-13v16m4-10v4"/></symbol><symbol id="flask" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8M9 2v7L2 21h20L15 9V2M7 14h10"/></symbol><symbol id="calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M7 2v5M17 2v5M3 10h18M7 14h3m4 0h3m-10 4h3"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Asigna una capacidad a cada necesidad</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">No es necesario administrar un cluster para cubrir estas tres tareas.</text><text x="219" y="175" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">300 grabaciones</text><use data-icon="wave" href="#wave" x="163" y="212" width="110" height="110" color="#c74436"/><path d="M219 334V366" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><rect x="93" y="387" width="252" height="42" rx="21" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="219" y="415" font-size="21" fill="#c74436" font-weight="600" text-anchor="middle">Speech · transcribir</text><text x="219" y="495" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Audios a texto</text><text x="219" y="527" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">para poder analizarlos</text><text x="600" y="175" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Clasificador propio</text><use data-icon="flask" href="#flask" x="545" y="212" width="110" height="110" color="#4f46b8"/><path d="M600 334V366" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><rect x="474" y="387" width="252" height="42" rx="21" fill="url(#indigo)" stroke="none" stroke-width="1.5"/><text x="600" y="415" font-size="21" fill="#4f46b8" font-weight="600" text-anchor="middle">Data Science · entrenar</text><text x="600" y="495" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Datos + etiquetas</text><text x="600" y="527" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">para aprender la tarea</text><text x="981" y="175" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Evaluación semanal</text><use data-icon="calendar" href="#calendar" x="926" y="212" width="110" height="110" color="#087f7a"/><path d="M981 334V366" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><rect x="855" y="387" width="252" height="42" rx="21" fill="url(#teal)" stroke="none" stroke-width="1.5"/><text x="981" y="415" font-size="21" fill="#087f7a" font-weight="600" text-anchor="middle">Job · repetir la prueba</text><text x="981" y="495" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Mismo procedimiento</text><text x="981" y="527" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">con resultados comparables</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Añade un deployment solo si una aplicación necesita inferencia en línea.</text></g>
</svg>
