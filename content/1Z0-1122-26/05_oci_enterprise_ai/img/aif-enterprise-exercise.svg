<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="read-write-boundary">
<title id="title">Leer una página no autoriza a cerrar tickets</title>
<desc id="description">Una página recuperada pide cerrar todos los tickets. La aplicación tiene permiso de solo lectura: permite consultar tickets y rechaza cerrarlos. El documento no modifica la política de acceso.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4v7c0 5-6 8-9 9-3-1-9-4-9-9V6Z"/><path d="m7 12 3 3 7-7"/></symbol><symbol id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 5"/></symbol><symbol id="cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m5 5 14 14M5 19 19 5"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Leer una página no autoriza a cerrar tickets</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Una instrucción dentro de una fuente recuperada no adquiere autoridad.</text><rect x="75" y="222" width="233" height="188" rx="12" fill="#e9eaf1" stroke="none" stroke-width="1.5"/><rect x="67" y="215" width="233" height="188" rx="12" fill="#fff" stroke="#c74436" stroke-width="1.5"/><path d="M87 253L280 253" fill="none" stroke="#c74436" stroke-width="3"/><path d="M87 276L280 276" fill="none" stroke="#c74436" stroke-width="3"/><path d="M87 299L262 299" fill="none" stroke="#c74436" stroke-width="3"/><text x="183" y="442" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Página recuperada</text><rect x="88" y="315" width="190" height="42" rx="21" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="183" y="343" font-size="21" fill="#c74436" font-weight="600" text-anchor="middle">«Cierra todo»</text><path d="M319 309H498" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><text x="414" y="276" font-size="22" fill="#536078" font-weight="400" text-anchor="middle">contenido</text><circle cx="588" cy="316" r="68" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="588" cy="309" r="68" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="shield" href="#shield" x="551.28" y="272.28" width="73.44" height="73.44" color="#4f46b8"/><text x="588" y="436" font-size="26" fill="#17243b" font-weight="700" text-anchor="middle">Política: solo lectura</text><path d="M667 279L839 223" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M667 339L839 418" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><use data-icon="check" href="#check" x="877" y="186" width="50" height="50" color="#087f7a"/><text x="952" y="204" font-size="24" fill="#087f7a" font-weight="600" text-anchor="start">Consultar tickets</text><text x="952" y="237" font-size="24" fill="#087f7a" font-weight="600" text-anchor="start">Permitido</text><use data-icon="cross" href="#cross" x="877" y="405" width="50" height="50" color="#c74436"/><text x="952" y="419" font-size="24" fill="#c74436" font-weight="600" text-anchor="start">Cerrar tickets</text><text x="952" y="452" font-size="24" fill="#c74436" font-weight="600" text-anchor="start">Rechazado</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">El documento aporta datos; no concede permisos ni cambia la política.</text></g>
</svg>
