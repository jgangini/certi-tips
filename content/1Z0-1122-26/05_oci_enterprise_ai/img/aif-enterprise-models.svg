<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="embed-rerank-chat">
<title id="title">Cada modelo tiene un trabajo distinto</title>
<desc id="description">Embed representa la consulta como un vector para recuperar documentos. Rerank reordena los candidatos 3,1,2 por relevancia. Chat utiliza los fragmentos seleccionados para generar una respuesta.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v14H8l-5 5zM7 7h10M7 11h7"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Cada modelo tiene un trabajo distinto</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">En recuperación, los tres pueden colaborar en una misma respuesta.</text><text x="163" y="170" font-size="28" fill="#17243b" font-weight="700" text-anchor="middle">Embed</text><rect x="92" y="234" width="75" height="115" rx="12" fill="#e9eaf1" stroke="none" stroke-width="1.5"/><rect x="84" y="227" width="75" height="115" rx="12" fill="#fff" stroke="#c74436" stroke-width="1.5"/><path d="M104 265L139 265" fill="none" stroke="#c74436" stroke-width="3"/><path d="M104 288L139 288" fill="none" stroke="#c74436" stroke-width="3"/><path d="M104 311L121 311" fill="none" stroke="#c74436" stroke-width="3"/><path d="M175 285H212" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><text x="317" y="272" font-size="22" fill="#c74436" font-weight="600" text-anchor="middle">[0,2; −0,7; …]</text><text x="317" y="303" font-size="22" fill="#c74436" font-weight="600" text-anchor="middle">Vector de consulta</text><path d="M327 345V401H465V245H481" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><text x="320" y="474" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Búsqueda de candidatos</text><text x="600" y="170" font-size="28" fill="#17243b" font-weight="700" text-anchor="middle">Rerank</text><rect x="494" y="224" width="211" height="42" rx="10" fill="#fff" stroke="#4f46b8" stroke-width="1.5"/><text x="599" y="253" font-size="21" fill="#4f46b8" font-weight="600" text-anchor="middle">Documento 3</text><rect x="494" y="279" width="211" height="42" rx="10" fill="#fff" stroke="#4f46b8" stroke-width="1.5"/><text x="599" y="308" font-size="21" fill="#4f46b8" font-weight="600" text-anchor="middle">Documento 1</text><rect x="494" y="334" width="211" height="42" rx="10" fill="#fff" stroke="#4f46b8" stroke-width="1.5"/><text x="599" y="363" font-size="21" fill="#4f46b8" font-weight="600" text-anchor="middle">Documento 2</text><text x="600" y="474" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Reordena por relevancia</text><path d="M716 281H879" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><text x="796" y="256" font-size="21" fill="#536078" font-weight="400" text-anchor="middle">selección</text><g data-concept="Chat"><circle cx="994" cy="288" r="64" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="994" cy="281" r="64" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="chat" href="#chat" x="959.44" y="246.44" width="69.12" height="69.12" color="#087f7a"/><text x="994" y="388" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Chat</text><text x="994" y="423" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Genera una respuesta</text><text x="994" y="455" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">con los fragmentos</text></g><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Embed representa; rerank ordena candidatos; chat redacta.</text></g>
</svg>
