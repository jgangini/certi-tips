<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Datos y clave tienen controles propios</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Esquema conceptual: el algoritmo utiliza material criptográfico.</text><g data-layout="icon-label"><g data-artwork="true" data-badge="true"><circle cx="148" cy="306" r="51" fill="#fff" stroke="#4f46b8" stroke-width="2.5"/><use data-icon="doc" href="#doc" x="120" y="278" width="56" height="56" color="#4f46b8"/></g><g data-layout="caption"><text x="148" y="394" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Texto legible</text></g></g><path d="M209 306H416" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><g data-layout="centered-card"><rect x="448" y="237" width="305" height="176" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><g data-layout="icon-label"><text x="600.5" y="295" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle" dominant-baseline="central">Cifrado</text><g data-artwork="true"><use data-icon="lock" href="#lock" x="572" y="320.5" width="57" height="57" color="#087f7a"/></g></g></g></g><path d="M772 306H957" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><g data-layout="icon-label"><g data-artwork="true" data-badge="true"><circle cx="1060" cy="306" r="51" fill="#fff" stroke="#c74436" stroke-width="2.5"/><use data-icon="archive" href="#archive" x="1032" y="278" width="56" height="56" color="#c74436"/></g><g data-layout="caption"><text x="1060" y="394" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Texto cifrado</text></g></g><g data-layout="icon-label" data-axis="horizontal"><g data-artwork="true"><use data-icon="key" href="#key" x="570" y="142" width="60" height="60" color="#c74436"/></g><text x="456" y="172" font-size="23" fill="#c74436" font-weight="600" text-anchor="middle" dominant-baseline="central">Clave administrada</text></g><path d="M600 207V226" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><text x="600" y="512" font-size="25" fill="#17243b" font-weight="400" text-anchor="middle">El servicio necesita autorización para usar la clave y los datos.</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">El cifrado protege información; no define quién debe poder leerla.</text></g>
