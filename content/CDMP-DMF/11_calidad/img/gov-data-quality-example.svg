<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-design-audit="08-11-compact"><title id="title">Dos Reglas Sobre la Misma Población</title><desc id="description">La cuadrícula representa 1 000 contratos, diez por cuadrado, con defectos sin superposición. La completitud alcanza 990/1 000 = 99 % y supera su umbral. La regla de fecha presente y dentro del periodo alcanza 970/1 000 = 97 % y falla el mínimo del 98 %. Distingue población, defectos y umbrales de cada regla antes de combinar o comparar porcentajes.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Dos Reglas Sobre la Misma Población</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(-2 8.6)"><rect x="230.5" y="200" width="413" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="437" y="234.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="437" y="234.8">1 000 contratos · 10 por cuadrado</tspan></text><text x="437" y="292.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="437" y="292.8">Defectos sin superposición</tspan></text><rect x="144" y="340" width="48" height="48" rx="4" fill="#397C46" stroke="#59616E" stroke-width="1.5" /><rect x="204" y="340" width="48" height="48" rx="4" fill="#397C46" stroke="#59616E" stroke-width="1.5" /><rect x="264" y="340" width="48" height="48" rx="4" fill="#397C46" stroke="#59616E" stroke-width="1.5" /><rect x="324" y="340" width="48" height="48" rx="4" fill="#397C46" stroke="#59616E" stroke-width="1.5" /><