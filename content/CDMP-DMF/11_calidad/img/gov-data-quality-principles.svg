<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-design-audit="08-11-compact"><title id="title">El Control se Cierra Cuando Mejora el Origen</title><desc id="description">El control encuentra 198 claves para 200 filas frente a una exigencia de unicidad del 100 %. Se registra el incidente D-17, se asignan responsables y se corrige la causa en el origen. Después se repite la prueba sobre la misma población y regla y se conserva resultado y decisión. El incidente se cierra cuando la nueva medición demuestra la mejora, no solo cuando se limpia una copia.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">El Control se Cierra Cuando Mejora el Origen</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 -3)"><rect x="96" y="270" width="690" height="172" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M108 270 H774 Q786 270 786 282 V334 H96 V282 Q96 270 108 270 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="start"><rect x="96" y="270" width="690" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="312.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="120" y="312.8">1 · DETECTAR</tspan></text></g></g><g data-table-cell="row" data-cell-align="start"><rect x="96" y="334" width="690" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="371.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="120" y="371.8">Control de unicidad</tspan></text></g></g><line x1="96" y1="388" x2="786" y2="388" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="start"><rect x="96" y="388" width="690" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="425.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="120" y="425.8">200 filas / 198 claves</tspan></text></g></g><rect x="1134" y="270" width="690" height="172" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1146 270 H1812 Q1824 270 1824 282 V334 H1134 V282 Q1134 270 1146 270 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="start"><rect x="1134" y="270" width="690" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1158" y="312.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="1158" y="312.8">2 · ASIGNAR</tspan></text></g></g><g data-table-cell="row" data-cell-align="start"><rect x="1134" y="334" width="690" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1158" y="371.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1158" y="371.8">Incidente D-17 · steward</tspan></text></g></g><line x1="1134" y1="388" x2="1824" y2="388" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="start"><rect x="1134" y="388" width="690" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1158" y="425.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1158" y="425.8">Propietario decide el impacto</tspan></text></g></g><rect x="1134" y="780" width="690" height="172" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1146 780 H1812 Q1824 780 1824 792 V844 H1134 V792 Q1134 780 1146 780 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="start"><rect x="1134" y="780" width="690" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1158" y="822.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="1158" y="822.8">3 · CORREGIR EL ORIGEN</tspan></text></g></g><g data-table-cell="row" data-cell-align="start"><rect x="1134" y="844" width="690" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1158" y="881.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1158" y="881.8">Ingeniería elimina la causa</tspan></text></g></g><line x1="1134" y1="898" x2="1824" y2="898" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="start"><rect x="1134" y="898" width="690" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1158" y="935.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1158" y="935.8">y conserva la evidencia</tspan></text></g></g><rect x="96" y="780" width="690" height="172" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M108 780 H774 Q786 780 786 792 V844 H96 V792 Q96 780 108 780 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="start"><rect x="96" y="780" width="690" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="822.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="120" y="822.8">4 · VOLVER A MEDIR</tspan></text></g></g><g data-table-cell="row" data-cell-align="start"><rect x="96" y="844" width="690" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="881.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="120" y="881.8">Misma población y regla</tspan></text></g></g><line x1="96" y1="898" x2="786" y2="898" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="start"><rect x="96" y="898" width="690" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="935.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="120" y="935.8">Registrar resultado y decisión</tspan></text></g></g><line x1="786" y1="356" x2="1134" y2="356" stroke="#59616E" stroke-width="3" /><path d="M1134 356 L1118.0 364.0 L1118.0 348.0 Z" fill="#59616E" /><line x1="1479" y1="442" x2="1479" y2="780" stroke="#59616E" stroke-width="3" /><path d="M1479 780 L1471.0 764.0 L1487.0 764.0 Z" fill="#59616E" /><line x1="1134" y1="866" x2="786" y2="866" stroke="#59616E" stroke-width="3" /><path d="M786 866 L802.0 858.0 L802.0 874.0 Z" fill="#59616E" /><line x1="441" y1="780" x2="441" y2="442" stroke="#59616E" stroke-width="3" /><path d="M441 442 L449.0 458.0 L433.0 458.0 Z" fill="#59616E" /><rect x="636" y="528" width="648" height="190" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M648 528 H1272 Q1284 528 1284 540 V592 H636 V540 Q636 528 648 528 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="start"><rect x="636" y="528" width="648" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="660" y="570.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="660" y="570.8">REGLA ACORDADA</tspan></text></g></g><g data-table-cell="row" data-cell-align="start"><rect x="636" y="592" width="648" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="660" y="629.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="660" y="629.8">Clave de negocio única</tspan></text></g></g><line x1="636" y1="646" x2="1284" y2="646" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="tag-row" data-cell-align="center"><rect x="636" y="646" width="648" height="72" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><rect x="861.5" y="658" width="197" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="960.0" y="692.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="960.0" y="692.8">Umbral: 100 %</tspan></text></g></g><rect x="1510.5" y="587" width="261" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1641" y="621.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1641" y="621.8">Causa y responsable</tspan></text><rect x="154.0" y="587" width="226" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="267" y="621.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="267" y="621.8">Repetir la prueba</tspan></text></g></g></svg>