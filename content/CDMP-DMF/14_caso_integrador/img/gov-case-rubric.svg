<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Cómo Evaluar una Propuesta</title><desc id="description">La rúbrica puntúa responsabilidad, significado, protección, confiabilidad y viabilidad de 0 a 2: ausente, mencionado o demostrado. Decir «hay permisos por rol» obtiene 1 en protección; una prueba de acceso permitido y administración no concedida, con identidad y resultado, permite demostrarla. Usa la meta pedagógica de 8/10 sin omitir responsabilidad ni protección, y explica qué evidencia sostiene cada puntuación.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Cómo Evaluar una Propuesta</tspan></text><text x="96" y="191.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="96" y="191.27">0 · Ausente</tspan></text><text x="365" y="191.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="365" y="191.27">1 · Mencionado</tspan></text><text x="688" y="191.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="688" y="191.27">2 · Demostrado</tspan></text><text x="96" y="271.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="271.27">CRITERIOS</tspan></text><text x="670" y="269.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="middle"><tspan x="670" y="269.59">0</tspan></text><text x="780" y="269.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="middle"><tspan x="780" y="269.59">1</tspan></text><text x="890" y="269.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="middle"><tspan x="890" y="269.59">2</tspan></text><rect x="80" y="523" width="904" height="88" rx="8" fill="#F1EFED" stroke="none" stroke-width="2"/><line x1="984" y1="565" x2="1040" y2="565" stroke="#C06D30" stroke-width="4"/><path d="M1040 565 L1024 573 L1024 557 Z" fill="#C06D30" stroke="#C06D30" stroke-width="1" stroke-linejoin="round"/><text x="96" y="351.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="351.59">Responsabilidad</tspan></text><circle cx="670" cy="344" r="26" fill="#F1EFED" stroke="#3C4545" stroke-width="2"/><circle cx="780" cy="344" r="26" fill="#F1EFED" stroke="#3C4545" stroke-width="2"/><circle cx="890" cy="344" r="26" fill="#F1EFED" stroke="#3C4545" stroke-width="2"/><text x="96" y="459.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="459.59">Significado</tspan></text><circle cx="670" cy="452" r="26" fill="#F1EFED" stroke="#3C4545" stroke-width="2"/><circle cx="780" cy="452" r="26" fill="#F1EFED" stroke="#3C4545" stroke-width="2"/><circle cx="890" cy="452" r="26" fill="#F1EFED" stroke="#3C4545" stroke-width="2"/><text x="96" y="567.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="567.59">Protección</tspan></text><circle cx="670" cy="560" r="26" fill="#F1EFED" stroke="#3C4545" stroke-width="2"/><circle cx="780" cy="560" r="26" fill="#F1EFED" stroke="#3C4545" stroke-width="2"/><circle cx="890" cy="560" r="26" fill="#F1EFED" stroke="#3C4545" stroke-width="2"/><circle cx="780" cy="560" r="26" fill="#C06D30" stroke="#C06D30" stroke-width="2"/><text x="780" y="569.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="780" y="569.27">1</tspan></text><text x="96" y="675.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="675.59">Confiabilidad</tspan></text><circle cx="670" cy="668" r="26" fill="#F1EFED" stroke="#3C4545" stroke-width="2"/><circle cx="780" cy="668" r="26" fill="#F1EFED" stroke="#3C4545" stroke-width="2"/><circle cx="890" cy="668" r="26" fill="#F1EFED" stroke="#3C4545" stroke-width="2"/><text x="96" y="783.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="783.59">Viabilidad</tspan></text><circle cx="670" cy="776" r="26" fill="#F1EFED" stroke="#3C4545" stroke-width="2"/><circle cx="780" cy="776" r="26" fill="#F1EFED" stroke="#3C4545" stroke-width="2"/><circle cx="890" cy="776" r="26" fill="#F1EFED" stroke="#3C4545" stroke-width="2"/><rect x="1040" y="242" width="784" height="646" rx="8" fill="#F1EFED" stroke="#C2D4D4" stroke-width="2"/><rect x="1040" y="242" width="784" height="8" rx="0" fill="#C06D30" stroke="none" stroke-width="2"/><g data-svgrepo-icon="shield" transform="translate(1077 267) scale(2)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
</g><text x="1145" y="301.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1145" y="301.27">EJEMPLO · PROTECCIÓN</tspan></text><text x="1077" y="360.91" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1077" y="360.91">«Hay permisos por rol»</tspan></text><text x="1077" y="426.43" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1077" y="426.43">Menciona el control, pero no muestra </tspan><tspan x="1077" y="459.07">qué puede hacer el analista.</tspan></text><line x1="1077" y1="509" x2="1788" y2="509" stroke="#C2D4D4" stroke-width="2"/><text x="1077" y="570.91" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1077" y="570.91">Para demostrarlo</tspan></text><text x="1077" y="649.895" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1077" y="649.895">Adjuntar la prueba de acceso: </tspan><tspan x="1077" y="688.145">consulta permitida sobre el producto; </tspan><tspan x="1077" y="726.395">administración general no concedida; </tspan><tspan x="1077" y="764.645">identidad y resultado registrados.</tspan></text><rect x="1064" y="806" width="736" height="60" rx="4" fill="#EEF3EC" stroke="none" stroke-width="2"/><text x="1084" y="844.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1084" y="844.27">Con evidencia verificable → 2 puntos</tspan></text><text x="96" y="929.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="929.59">Meta pedagógica: 8 / 10, sin omitir responsabilidad ni protección.</tspan></text></g></svg>
