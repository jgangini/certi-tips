<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Qué Debe Demostrar la Propuesta</title><desc id="description">Cada fila enlaza una decisión de la propuesta con evidencia, responsable y revisión. Comprueba definición y finalidad, claves y vigencias, acceso mínimo efectivo, calidad y recuperación, y viabilidad con consumo atribuible. El artefacto debe demostrar la decisión, no solo mencionarla. Si falta evidencia, devuelve esa parte de la propuesta para completarla con el responsable correspondiente.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Qué Debe Demostrar la Propuesta</tspan></text><rect x="96" y="246" width="1728" height="75" rx="0" fill="#EDF1F2" stroke="none" stroke-width="2"/><text x="118" y="293.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="118" y="293.27">DECISIÓN</tspan></text><text x="602" y="293.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="602" y="293.27">EVIDENCIA</tspan></text><text x="1212" y="293.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1212" y="293.27">RESPONSABLE</tspan></text><text x="1570" y="293.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1570" y="293.27">REVISIÓN</tspan></text><rect x="96" y="321" width="1728" height="123" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="321" width="8" height="123" rx="0" fill="#C06D30" stroke="none" stroke-width="2"/><text x="118" y="366.637" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="118" y="366.637">Definición de activo </tspan><tspan x="118" y="400.903">y finalidad permitida</tspan></text><text x="602" y="366.637" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="602" y="366.637">Definición versionada </tspan><tspan x="602" y="400.903">+ aprobación</tspan></text><text x="1212" y="366.637" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1212" y="366.637">Propietario </tspan><tspan x="1212" y="400.903">comercial</tspan></text><text x="1570" y="373.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1570" y="373.27">Comprobar</tspan></text><line x1="96" y1="443" x2="1824" y2="443" stroke="#C2D4D4" stroke-width="1"/><rect x="96" y="444" width="1728" height="123" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="96" y="444" width="8" height="123" rx="0" fill="#C06D30" stroke="none" stroke-width="2"/><text x="118" y="489.637" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="118" y="489.637">Cliente, contrato </tspan><tspan x="118" y="523.903">y consentimiento</tspan></text><text x="602" y="489.637" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="602" y="489.637">Modelo + claves </tspan><tspan x="602" y="523.903">+ vigencias</tspan></text><text x="1212" y="489.637" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1212" y="489.637">Modelador </tspan><tspan x="1212" y="523.903">y steward</tspan></text><text x="1570" y="496.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1570" y="496.27">Comprobar</tspan></text><line x1="96" y1="566" x2="1824" y2="566" stroke="#C2D4D4" stroke-width="1"/><rect x="96" y="567" width="1728" height="123" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="567" width="8" height="123" rx="0" fill="#C06D30" stroke="none" stroke-width="2"/><text x="118" y="612.637" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="118" y="612.637">Acceso mínimo </tspan><tspan x="118" y="646.903">por perfil</tspan></text><text x="602" y="612.637" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="602" y="612.637">Matriz de acceso </tspan><tspan x="602" y="646.903">+ comprobación efectiva</tspan></text><text x="1212" y="612.637" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1212" y="612.637">Seguridad </tspan><tspan x="1212" y="646.903">y custodio</tspan></text><text x="1570" y="619.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1570" y="619.27">Comprobar</tspan></text><line x1="96" y1="689" x2="1824" y2="689" stroke="#C2D4D4" stroke-width="1"/><rect x="96" y="690" width="1728" height="123" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="96" y="690" width="8" height="123" rx="0" fill="#749B6B" stroke="none" stroke-width="2"/><text x="118" y="735.637" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="118" y="735.637">Producto confiable </tspan><tspan x="118" y="769.903">y recuperable</tspan></text><text x="602" y="735.637" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="602" y="735.637">Reglas + rechazos </tspan><tspan x="602" y="769.903">+ ensayo de recuperación</tspan></text><text x="1212" y="735.637" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1212" y="735.637">Ingeniería </tspan><tspan x="1212" y="769.903">y operaciones</tspan></text><text x="1570" y="742.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1570" y="742.27">Comprobar</tspan></text><line x1="96" y1="812" x2="1824" y2="812" stroke="#C2D4D4" stroke-width="1"/><rect x="96" y="813" width="1728" height="123" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="813" width="8" height="123" rx="0" fill="#749B6B" stroke="none" stroke-width="2"/><text x="118" y="858.637" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="118" y="858.637">Solución viable </tspan><tspan x="118" y="892.903">y gasto atribuible</tspan></text><text x="602" y="858.637" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="602" y="858.637">Requisitos verificados </tspan><tspan x="602" y="892.903">+ consumo por producto</tspan></text><text x="1212" y="858.637" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1212" y="858.637">Arquitectura </tspan><tspan x="1212" y="892.903">y FinOps</tspan></text><text x="1570" y="865.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1570" y="865.27">Comprobar</tspan></text><line x1="96" y1="935" x2="1824" y2="935" stroke="#C2D4D4" stroke-width="1"/></g></svg>
