<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Un Mensaje Debe Poder Explicar su Contrato</title><desc id="description">La factura F42 viaja con clave estable, operación, versión del contrato y estado acordados. La clave permite reconocer el mismo registro al reintentar; las operaciones deben contemplar altas, correcciones y anulaciones. El intercambio también define identidad efectiva, permisos, frecuencia, calidad y responsable. Ese contrato permite comprobar el resultado del flujo y tratar sus fallos.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Un Mensaje Debe Poder Explicar su Contrato</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 38)"><rect x="500" y="230" width="920" height="116" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M512 230 H1408 Q1420 230 1420 242 V294 H500 V242 Q500 230 512 230 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="500" y="230" width="920" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="524" y="272.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="524" y="272.8">Facturación → indicador</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="500" y="294" width="920" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true