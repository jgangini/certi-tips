<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Tres Eventos; una Sola Factura</title><desc id="description">El primer evento inserta F42 como emitida. El segundo repite esa emisión: reconocer el reintento conserva una sola fila. El tercero anula F42 y actualiza el estado de la misma factura. La anulación también debe llegar al indicador consumidor. Verifica identidad estable y tratamiento de cambios para que los reintentos no dupliquen registros ni dejen estados antiguos.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Tres Eventos; una Sola Factura</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 66)"><rect x="140" y="270" width="1640" height="422" rx="16" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><path d="M152 270 H1768 Q1780 270 1780 282 V334 H140 V282 Q140 270 152 270 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="center"><rect x="140" y="270" width="820" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="550.0" y="312.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="middle"><tspan x="550.0" y="312.8">EVENTO RECIBIDO</tspan></text></g></g><g data-table-cell="header" data-cell-align="center"><rect x="960" y="270" width="820" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1370.0" y="312.8" fill="#FFFFFF" font-size="25.5" font-