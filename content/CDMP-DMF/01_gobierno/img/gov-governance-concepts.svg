<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Gobierno, Gestión y Valor</title><desc id="description">La pirámide relaciona gobierno en la base roja, gestión en el nivel verde y valor en la cima teal. Cada nivel se vincula a una tarjeta: el propietario decide, steward y custodio ejecutan, y los responsables de negocio usan los resultados. Son relaciones de soporte, no etapas universales de madurez.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Gobierno, Gestión y Valor</tspan></text><g data-level="value"><path d="M690.4 212.8 Q700 200 709.6 212.8 L877.9 437.2 Q887.5 450 871.5 450 H528.5 Q512.5 450 522.1 437.2 Z" fill="#FFFFFF" stroke="#007E87" stroke-width="2" stroke-linejoin="round"/><path d="M690.4 212.8 Q700 200 709.6 212.8 L812.5 350 H587.5 Z" fill="#007E87" stroke="none" stroke-width="0" stroke-linejoin="round"/><text x="700" y="317.3" font-size="36" fill="#FFFFFF" font-weight="400" text-anchor="middle"><tspan x="700" y="317.3">Valor</tspan></text><rect x="615" y="376" width="170" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5"/><text x="700" y="410.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="700" y="410.5">Negocio e IA</tspan></text></g><g data-level="management"><path d="M515 468 H885 Q901 468 910.6 480.8 L1068.4 691.2 Q1078 704 1062 704 H338 Q322 704 331.6 691.2 L489.4 480.8 Q499 468 515 468 Z" fill="#FFFFFF" stroke="#397C46" stroke-width="2" stroke-linejoin="round"/><path d="M515 468 H885 Q901 468 910.6 480.8 L964 552 H436 L489.4 480.8 Q499 468 515 468 Z" fill="#397C46" stroke="none" stroke-width="0" stroke-linejoin="round"/><text x="700" y="524.85" font-size="36" fill="#FFFFFF" font-weight="400" text-anchor="middle"><tspan x="700" y="524.85">Gestión de Datos</tspan></text></g><g data-level="governance"><path d="M324.5 722 H1075.5 Q1091.5 722 1101.1 734.8 L1260.4 947.2 Q1270 960 1254 960 H146 Q130 960 139.6 947.2 L298.9 734.8 Q308.5 722 324.5 722 Z" fill="#FFFFFF" stroke="#C74634" stroke-width="2" stroke-linejoin="round"/><path d="M324.5 722 H1075.5 Q1091.5 722 1101.1 734.8 L1154.5 806 H245.5 L298.9 734.8 Q308.5 722 324.5 722 Z" fill="#C74634" stroke="none" stroke-width="0" stroke-linejoin="round"/><text x="700" y="778.85" font-size="36" fill="#FFFFFF" font-weight="400" text-anchor="middle"><tspan x="700" y="778.85">Gobierno de Datos</tspan></text></g><rect x="583" y="576" width="115" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5"/><text x="640.5" y="610.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="640.5" y="610.5">Modelar</tspan></text><rect x="708" y="576" width="109" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5"/><text x="762.5" y="610.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="762.5" y="610.5">Integrar</tspan></text><rect x="527" y="632" width="118" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5"/><text x="586.0" y="666.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="586.0" y="666.5">Proteger</tspan></text><rect x="655" y="632" width="99" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5"/><text x="704.5" y="666.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="704.5" y="666.5">Operar</tspan></text><rect x="764" y="632" width="109" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5"/><text x="818.5" y="666.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="818.5" y="666.5">Mejorar</tspan></text><rect x="456.5" y="859" width="133" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5"/><text x="523.0" y="893.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="523.0" y="893.5">Autoridad</tspan></text><rect x="599.5" y="859" width="129" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5"/><text x="664.0" y="893.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="664.0" y="893.5">Propósito</tspan></text><rect x="738.5" y="859" width="205" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5"/><text x="841.0" y="893.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="841.0" y="893.5">Responsabilidad</tspan></text><line x1="796.15" y1="328.2" x2="1368" y2="328.2" stroke="#59616E" stroke-width="3"/><rect x="1368" y="243.2" width="456" height="170" rx="8" fill="#FFFFFF" stroke="none" stroke-width="2"/><path d="M1376 243.2 H1816 Q1824 243.2 1824 251.2 V315.2 H1368 V251.2 Q1368 243.2 1376 243.2 Z" fill="#59616E" stroke="none" stroke-width="3" stroke-linejoin="round"/><rect x="1368" y="243.2" width="456" height="170" rx="8" fill="none" stroke="#59616E" stroke-width="2"/><g data-person-icon="user-supplied" transform="translate(1396 257.2) scale(2.75)" fill="#FFFFFF"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"/><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z"/></g><text x="1458" y="292.4" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="1458" y="292.4">¿Para qué?</tspan></text><text x="1396" y="369.2" font-size="32" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1396" y="369.2">Decisiones del negocio</tspan></text><line x1="989.5" y1="586" x2="1368" y2="586" stroke="#59616E" stroke-width="3"/><rect x="1368" y="501" width="456" height="170" rx="8" fill="#FFFFFF" s