<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Tres Vistas del Mismo Dato</title><desc id="description">Las tres columnas describen al mismo cliente C7 con distinto nivel de detalle. La vista conceptual relaciona al cliente con sus contratos C2 y C3. La lógica define «cliente activo» como quien tiene al menos un contrato vigente en la fecha de corte, e identifica responsable y versión. La física representa el resultado con identificador, estado y fecha 30/09. Las tres vistas deben conservar el mismo significado de negocio.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Tres Vistas del Mismo Dato</tspan></text><defs><clipPath id="three-views"><rect x="96" y="248" width="1728" height="668" rx="16" /></clipPath><clipPath id="logical-view"><rect x="712" y="384" width="496" height="344" rx="12" /></clipPath><clipPath id="physical-view"><rect x="1288" y="384" width="496" height="236" rx="12" /></clipPath></defs><g data-architecture-table="three-views"><g clip-path="url(#three-views)"><rect x="96" y="248" width="1728" height="668" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><rect x="96" y="248" width="1728" height="80" rx="0" fill="#59616E" stroke="none" stroke-width="2" /><text x="384" y="298.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="384" y="298.8">Conceptual</tspan></text><text x="960" y="298.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="960" y="298.8">Lógica</tspan></text><text x="1536" y="298.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="1536" y="298.8">Física</tspan></text><line x1="672" y1="248" x2="672" y2="328" stroke="#FFFFFF" stroke-width="1.5" /><line x1="672" y1="328" x2="672" y2="916" stroke="#59616E" stroke-width="1.5" /><line x1="1248" y1="248" x2="1248" y2="328" stroke="#FFFFFF" stroke-width="1.5" /><line x1="1248" y1="328" x2="1248" y2="916" stroke="#59616E" stroke-width="1.5" /><line x1="96" y1="328" x2="1824" y2="328" stroke="#59616E" stroke-width="1.5" /><g data-architecture-view="conceptual" transform="translate(0 -41)"><circle cx="384" cy="534" r="84" fill="#FFFFFF" stroke="#59616E" stroke-width="2" /><text x="384" y="520.8" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="384" y="520.8">Cliente</tspan></text><text x="384" y="568.8" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="middle"><tspan x="384" y="568.8">C7</tspan></text><line x1="384" y1="618" x2="384" y2="640" stroke="#59616E" stroke-width="2" /><path data-architecture-branches="contracts" d="M234 672 V656 A16 16 0 0 1 250 640 H518 A16 16 0 0 1 534 656 V672" fill="none" stroke="#59616E" stroke-width="2" stroke-linejoin="round" /><rect x="130" y="672" width="208" height="64" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="2" /><text x="234" y="714.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="234" y="714.8">Contrato C2</tspan></text><rect x="430" y="672" width="208" height="64" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="2" /><text x="534" y="714.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="534" y="714.8">Contrato C3</tspan></text></g><g data-architecture-table="logical" transform="translate(0 66)"><g clip-path="url(#logical-view)"><rect x="712" y="384" width="496" height="344" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><rect x="712" y="384" width="496" height="74" rx="0" fill="#59616E" stroke="none" stroke-width="2" /><text x="960" y="431.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="960" y="431.8">Producto de Datos</tspan></text><text x="744" y="495.8" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="744" y="495.8">Clientes activos</tspan></text><text x="744" y="555.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="744" y="555.8">Al menos un contrato vigente </tspan><tspan x="744" y="597.8">en la fecha de corte.</tspan></text><line x1="736" y1="512" x2="1184" y2="512" stroke="#59616E" stroke-width="1.5" /><line x1="736" y1="620" x2="1184" y2="620" stroke="#59616E" stroke-width="1.5" /><line x1="736" y1="674" x2="1184" y2="674" stroke="#59616E" stroke-width="1.5" /><line x1="916" y1="620" x2="916" y2="728" stroke="#59616E" stroke-width="1.5" /><g data-architecture-row="logical" data-row-top="620" data-row-bottom="674"><text x="744" y="657.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="744" y="657.8">Responsable</tspan></text><text x="932" y="657.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="932" y="657.8">Comercial</tspan></text></g><g data-architecture-row="logical" data-row-top="674" data-row-bottom="728"><text x="744" y="711.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="744" y="711.8">Versión</tspan></text><text x="932" y="711.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="932" y="711.8">1</tspan></text></g></g><rect x="712" y="384" width="496" height="344" rx="12" fill="none" stroke="#59616E" stroke-width="2" /></g><g data-architecture-table="physical" transform="translate(0 46)"><g clip-path="url(#physical-view)"><rect x="1288" y="384" width="496" height="236" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><rect x="1288" y="384" width="496" height="74" rx="0" fill="#59616E" stroke="none" stroke-width="2" /><text x="1536" y="431.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="1536" y="431.8">Tabla de Cierre</tspan></text><line x1="1536" y1="458" x2="1536" y2="620" stroke="#59616E" stroke-width="1.5" /><g data-architecture-row="physical" data-row-top="458" data-row-bottom="512"><text x="1312" y="495.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1312" y="495.8">id_cliente</tspan></text><text x="1660" y="495.8" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="middle"><tspan x="1660" y="495.8">C7</tspan></text></g><line x1="1288" y1="512" x2="1784" y2="512" stroke="#59616E" stroke-width="1.5" /><g data-architecture-row="physical" data-row-top="512" data-row-bottom="566"><text x="1312" y="549.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1312" y="549.8">estado</tspan></text><text x="1660" y="549.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1660" y="549.8">Vigente</tspan></text></g><line x1="1288" y1="566" x2="1784" y2="566" stroke="#59616E" stroke-width="1.5" /><g data-architecture-row="physical" data-row-top="566" data-row-bottom="620"><text x="1312" y="603.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1312" y="603.8">fecha_corte</tspan></text><text x="1660" y="603.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1660" y="603.8">30/09</tspan></text></g></g><rect x="1288" y="384" width="496" height="236" rx="12" fill="none" stroke="#59616E" stroke-width="2" /></g><g data-layout="centered-card" data-architecture-note="conceptual" transform="translate(0 -41)"><rect x="130" y="760" width="508" height="116" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" /><g data-card-content="note"><text x="384" y="807.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="384" y="807.8">Un cliente puede tener </tspan><tspan x="384" y="849.8">varios contratos.</tspan></text></g></g><g data-layout="centered-card" data-architecture-note="physical" transform="translate(0 -62)"><rect x="1282" y="760" width="508" height="116" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" /><g data-card-content="note"><text x="1536" y="807.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1536" y="807.8">La representación física implementa </tspan><tspan x="1536" y="849.8">la regla y conserva su fecha.</tspan></text></g></g></g><rect x="96" y="248" width="1728" height="668" rx="16" fill="none" stroke="#59616E" stroke-width="2" /></g></g></svg>