<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Estado Actual y Cierre Histórico</title><desc id="description">El contrato figura vigente en septiembre y suspendido en octubre. Atención puede consultar el estado actual, mientras Finanzas necesita reproducir el cierre del 30 de septiembre. El archivo del cierre conserva los datos, las reglas aplicadas y la fecha de corte. Así se puede reconstruir aquel resultado aunque el origen cambie; consultar solo el estado de octubre no explica el cierre anterior.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Estado Actual y Cierre Histórico</tspan></text><g data-architecture-artwork="timeline" transform="translate(-27 82)"><defs><clipPath id="operational-timeline"><rect x="198" y="224" width="1578" height="314" rx="12"/></clipPath></defs><g data-architecture-section="operational"><g clip-path="url(#operational-timeline)"><rect x="198" y="224" width="1578" height="314" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="198" y="224" width="1578" height="74" rx="0" fill="#59616E" stroke="none" stroke-width="2"/><text x="230" y="271.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="230" y="271.8">Estado Operativo</tspan></text><path data-timeline-arrow="user-supplied" d="M230 419 H1744 M1744 419 L1728 403 M1744 419 L1728 435" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="354" y1="378" x2="354" y2="406" stroke="#59616E" stroke-width="2"/><g data-layout="compact-tag" data-timeline-tag="status"><rect x="298.0" y="330" width="112" height="48" rx="12" 