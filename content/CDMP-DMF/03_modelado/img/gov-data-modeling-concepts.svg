<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Las Relaciones se Ven en las Instancias</title><desc id="description">El cliente C7 se relaciona con los contratos C2 y C3. C2 tiene las facturas F42 y F43, mientras C3 tiene F44. Las marcas 1 → N muestran que un cliente puede tener varios contratos y cada contrato varias facturas. Las claves conservan cada relación y evitan confundir una persona, un contrato y una factura como si fueran la misma unidad.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Las Relaciones se Ven en las Instancias</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" transform="translate(0 148)" data-center="960 608"><rect x="96" y="180" width="1728" height="560" rx="16" fill="#FFFFFF" stroke="none" /><path d="M112 180 H1808 Q1824 180 1824 196 V252 H96 V196 Q96 180 112 180 Z" fill="#59616E" stroke="none" /><line x1="646" y1="180" x2="646" y2="252" stroke="#FFFFFF" stroke-width="1.5" /><line x1="646" y1="252" x2="646" y2="740" stroke="#59616E" stroke-width="1.5" stroke-dasharray="8 10" /><line x1="1286" y1="180" x2="1286" y2="252" stroke="#FFFFFF" stroke-width="1.5" /><line x1="1286" y1="252" x2="1286" y2="740" stroke="#59616E" stroke-width="1.5" stroke-dasharray="8 10" /><text x="371" y="225.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="371" y="225.5">CLIENTE</tspan></text><text x="966" y="225.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="966" y="225.5">CONTRATOS</tspan></text><text x="1555" y="225.5" font-size="25.5" fill="#FFFFFF" font-weight="700" t