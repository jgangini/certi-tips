<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-design-audit="08-11-compact"><title id="title">Una Corrección Conserva el Cierre Original</title><desc id="description">La publicación v1 conserva el cierre de septiembre. Una factura tardía recibida en octubre origina una corrección v2 del mismo periodo, con motivo, aprobación y vínculo a v1. El ajuste Δ cambia el importe publicado sin sobrescribir la evidencia anterior. Registra versión y relación entre ambas para explicar y reproducir el cierre original y su corrección.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Una Corrección Conserva el Cierre Original</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 62)"><line x1="240" y1="340" x2="1680" y2="340" stroke="#59616E" stroke-width="3" /><path d="M1680 340 L1664.0 348.0 L1664.0 332.0 Z" fill="#59616E" /><rect x="226.0" y="276" width="108" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="280" y="310.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="280" y="310.8">30 SEP</tspan></text><text x="280" y="392.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="280" y="392.8">Cierre v1</tspan></text><circle cx="280" cy="340" r="6" fill="#59616E" /><rect x="902.5" y="276" width="115" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="960" y="310.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="960" y="310.8">03 OCT</tspan></text><text x="960" y="392.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="960" y="392.8">Factura tardía</tspan></text><circle cx="960" cy="340" r="6" fill="#59616E" /><rect x="1582.5" y="276" width="115" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1640" y="310.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1640" y="310.8">05 OCT</tspan></text><text x="1640" y="392.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1640" y="392.8">Corrección v2</tspan></text><circle cx="1640" cy="340" r="6" fill="#59616E" /><rect x="120" y="492" width="710" height="244" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M132 492 H818 Q830 492 830 504 V556 H120 V504 Q120 492 132 492 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="start"><rect x="120" y="492" width="710" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="144" y="534.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="144" y="534.8">PUBLICACIÓN v1</tspan></text></g></g><g data-table-cell="tag-row" data-cell-align="center"><rect x="120" y="556" width="710" height="72" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><rect x="452.0" y="568" width="46" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="475.0" y="602.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="475.0" y="602.8">T</tspan></text></g></g><line x1="120" y1="628" x2="830" y2="628" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="start"><rect x="120" y="628" width="710" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="144" y="665.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="144" y="665.8">Periodo: septiembre</tspan></text></g></g><line x1="120" y1="682" x2="830" y2="682" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="start"><rect x="120" y="682" width="710" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="144" y="719.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="144" y="719.8">Se conserva sin sobrescribir</tspan></text></g></g><rect x="1090" y="492" width="710" height="244" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1102 492 H1788 Q1800 492 1800 504 V556 H1090 V504 Q1090 492 1102 492 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="start"><rect x="1090" y="492" width="710" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1114" y="534.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="1114" y="534.8">PUBLICACIÓN v2</tspan></text></g></g><g data-table-cell="tag-row" data-cell-align="center"><rect x="1090" y="556" width="710" height="72" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><rect x="1398.0" y="568" width="94" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1445.0" y="602.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1445.0" y="602.8">T + Δ</tspan></text></g></g><line x1="1090" y1="628" x2="1800" y2="628" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="start"><rect x="1090" y="628" width="710" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1114" y="665.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="s