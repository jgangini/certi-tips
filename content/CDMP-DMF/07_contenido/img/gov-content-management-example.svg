<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">La Fecha de la Consulta Elige la Evidencia</title><desc id="description">La línea temporal distingue el contrato v1 y el anexo v2 que sustituye una cláusula desde septiembre. Una consulta sobre febrero usa la cláusula de v1; una consulta sobre octubre considera el anexo v2. Selecciona la versión aplicable a la fecha y finalidad consultadas, en lugar de responder siempre con el archivo más reciente.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">La Fecha de la Consulta Elige la Evidencia</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 30)"><rect x="828.6" y="250" width="262.8" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="960" y="284.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="960" y="284.8">VERSIÓN APLICABLE</tspan></text><rect x="340" y="374" width="710" height="64" rx="12" fill="#59616E" stroke="#59616E" stroke-width="1.5" /><text x="695" y="416.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="middle"><tspan x="695" y="416.8">Contrato v1</tspan></text><rect x="481.6" y="310" width="196.8" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="580" y="344.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="580" y="344.8">Cláusula inicial</tspan></text><rect x="1050" y="486" width="690" height="64" rx="12" fill="#59616E" stroke="#59616E" stroke-width="1.5" /><text x="1395" y="528.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="middle"><tspan x="1395" y="528.8">Anexo v2</tspan></text><rect x="1274.6" y="422" width="240.8" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1395" y="456.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1395" y="456.8">Cláusula sustituida</tspan></text><line x1="340" y1="626" x2="1740" y2="626" stroke="#59616E" stroke-width="3" /><path d="M1740 626 L1724.0 634.0 L1724.0 618.0 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><line x1="340" y1="614" x2="340" y2="638" stroke="#59616E" stroke-width="3" /><rect x="291.80234375" y="654" width="96.3953125" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="340" y="688.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="340" y="688.8">Enero</tspan></text><line x1="570" y1="614" x2="570" y2="638" stroke="#59616E" stroke-width="3" /><rect x="510.6046875" y="654" width="118.790625" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="570" y="688.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="570" y="688.8">Febrero</tspan></text><line x1="1050" y1="614" x2="1050" y2="638" stroke="#59616E" stroke-width="3" /><rect x="969.45234375" y="654" width="161.0953125" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1050" y="688.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1050" y="688.8">Septiembre</tspan></text><line x1="1500" y1="614" x2="1500" y2="638" stroke="#59616E" stroke-width="3" /><rect x="1438.40234375" y="654" width="123.1953125" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1500" y="688.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1500" y="688.8">Octubre</tspan></text><line x1="570" y1="438" x2="570" y2="614" stroke="#59616E" stroke-width="3" /><path d="M570 614 L562.0 598.0 L578.0 598.0 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><line x1="1500" y1="550" x2="1500" y2="614" stroke="#59616E" stroke-width="3" /><path d="M1500 614 L1492.0 598.0 L1508.0 598.0 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><rect x="120" y="790" width="750" height="116" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M132 790 H858 Q870 790 870 802 V854 H120 V802 Q120 790 132 790 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="120" y="790" width="750" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="144" y="832.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="144" y="832.8">Consulta de febrero</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="120" y="854" width="750" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="495.0" y="890.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="495.0" y="890.8">Responder con la cláusula de v1.</tspan></text></g></g><rect x="1050" y="790" width="750" height="116" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1062 790 H1788 Q1800 790 1800 802 V854 H1050 V802 Q1050 790 1062 790 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell