<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Pirámide Dorada de Peter Aiken</title><desc id="description">Pirámide de Peter Aiken con los trazados, colores y rótulos en inglés del SVG proporcionado. Las once áreas de gestión de datos se apoyan entre sí: gobierno sostiene el conjunto; arquitectura, calidad y metadatos apoyan las capacidades operativas, la integración y los usos compartidos. La cima representa resultados de analítica, Big Data e inteligencia artificial, no una duodécima área ni una secuencia obligatoria de implantación.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Pirámide Dorada de Peter Aiken</tspan></text><g id="dama-artwork" data-source-svg="dama.svg" data-source-viewbox="0 0 1154.55 841.89" class="st10" transform="translate(960 1000) scale(1.72) translate(-530.886 -566.32)"><style type="text/css">
	
