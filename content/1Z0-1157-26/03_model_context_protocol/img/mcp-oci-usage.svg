<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
  <title id="title">MCP local, datos en Oracle Cloud</title>
  <desc id="description">Cliente y servidor MCP son procesos locales conectados por stdio. El servidor usa otra conexión, HTTPS, para consultar una API de OCI. Cada tramo tiene sus extremos y su transporte. Un informe se contrasta usando iguales periodo, moneda, zona horaria y alcance.</desc>
  <defs>
    <!-- Lucide icons, ISC. See assets/icons/LICENSE-lucide.txt. -->
    <symbol id="app-window" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 4v4M2 8h20M6 4v4"/></symbol>
    <symbol id="server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><path d="M6 6h.01M6 18h.01"/></symbol>
    <symbol id="cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></symbol>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}
      .title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}
      .body{font-size:22px;fill:#536078}.mono{font-family:Consolas,monospace;font-size:22px;fill:#536078}
      .card{fill:#fff;stroke:#dce1eb;stroke-width:1.5}
      .connector{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .bidirectional{marker-start:url(#arrow)}.divider{stroke:#dce1eb;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#f7f8fc"/>
  <text x="56" y="64" class="title" text-anchor="start">MCP local, datos en Oracle Cloud</text>
  <rect x="56" y="128" width="690" height="308" rx="24" fill="#e9e6fa" stroke="#d5d0ed"/>
  <text x="84" y="174" class="label" text-anchor="start">Máquina local</text>
  <g class="icon-badge" data-icon="app-window"><circle cx="190" cy="254" r="48" fill="#e9e6fa"/><use href="#app-window" x="164" y="228" width="52" height="52" color="#4f46b8"/></g>
  <g class="icon-badge" data-icon="server"><circle cx="575" cy="254" r="48" fill="#fae6e1"/><use href="#server" x="549" y="228" width="52" height="52" color="#c74436"/></g>
  <g class="icon-badge" data-icon="cloud"><circle cx="1010" cy="254" r="48" fill="#e1f2ee"/><use href="#cloud" x="984" y="228" width="52" height="52" color="#087f7a"/></g>
  <path d="M238 254H527" class="connector bidirectional"/>
  <text x="382" y="235" class="mono" text-anchor="middle">stdio · MCP</text>
  <path d="M623 254H962" class="connector bidirectional"/>
  <text x="793" y="235" class="mono" text-anchor="middle">HTTPS</text>
  <text x="190" y="351" class="label" text-anchor="middle">Cliente MCP</text>
  <text x="575" y="351" class="label" text-anchor="middle">Servidor de uso</text>
  <text x="1010" y="351" class="label" text-anchor="middle">API de OCI</text>
  <text x="190" y="389" class="body" text-anchor="middle">Coordina la solicitud</text>
  <text x="575" y="389" class="body" text-anchor="middle">Aplica credenciales</text>
  <text x="1010" y="389" class="body" text-anchor="middle">Devuelve datos</text>
  <rect x="56" y="488" width="1088" height="108" rx="22" class="card"/>
  <text x="86" y="531" class="label" text-anchor="start">Contrasta con el informe autorizado</text>
  <text x="86" y="568" class="body" text-anchor="start">Mismo periodo · misma moneda · misma zona horaria · mismo alcance</text>
</svg>
