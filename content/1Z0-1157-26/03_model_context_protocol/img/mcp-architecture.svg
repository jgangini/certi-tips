<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">MCP conecta capacidades, no concede permisos</title>
  <desc id="description">Un host contiene un modelo y dos clientes MCP. Cada cliente tiene una conexión independiente. Los servidores exponen herramientas para operar, recursos para aportar contexto y prompts como plantillas. Las solicitudes y los resultados viajan por cada conexión; los permisos siguen siendo responsabilidad de las aplicaciones.</desc>
  <defs>
    <!-- Lucide icons, ISC. See assets/icons/LICENSE-lucide.txt. -->
    <symbol id="app-window" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 4v4M2 8h20M6 4v4"/></symbol>
    <symbol id="cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v2M12 2v2M17 20v2M17 2v2M2 12h2M2 17h2M2 7h2M20 12h2M20 17h2M20 7h2M7 20v2M7 2v2"/><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/></symbol>
    <symbol id="plug" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5M15 8V2M17 8a1 1 0 0 1 1 1v4a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1zM9 8V2"/></symbol>
    <symbol id="server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><path d="M6 6h.01M6 18h.01"/></symbol>
    <symbol id="wrench" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/></symbol>
    <symbol id="file-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2zM14 2v5a1 1 0 0 0 1 1h5M10 9H8M16 13H8M16 17H8"/></symbol>
    <symbol id="messages-square" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2zM20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"/></symbol>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}
      .title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}
      .body{font-size:22px;fill:#536078}.mono{font-family:Consolas,monospace;font-size:22px;fill:#536078}
      .card{fill:#fff;stroke:#dce1eb;stroke-width:1.5}
      .connector{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .bidirectional{marker-start:url(#arrow)}.divider{stroke:#dce1eb;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#f7f8fc"/>
  <text x="56" y="64" class="title" text-anchor="start">MCP conecta capacidades, no concede permisos</text>
  <text x="56" y="101" class="body" text-anchor="start">Tu aplicación mantiene una conexión distinta con cada servidor.</text>
  <rect x="56" y="132" width="430" height="496" rx="22" class="card"/>
  <text x="86" y="180" class="label" text-anchor="start">Host · tu aplicación</text>
  <g class="icon-badge" data-icon="app-window"><circle cx="427" cy="173" r="30" fill="#e9e6fa"/><use href="#app-window" x="409" y="155" width="36" height="36" color="#4f46b8"/></g>
  <g class="icon-badge" data-icon="cpu"><circle cx="125" cy="274" r="44" fill="#e9e6fa"/><use href="#cpu" x="101" y="250" width="48" height="48" color="#4f46b8"/></g>
  <text x="196" y="258" class="label" text-anchor="start">Modelo</text>
  <text x="196" y="292" class="body" text-anchor="start">Interpreta y decide</text>
  <path d="M86 343H456" class="divider"/>
  <text x="86" y="330" class="body" text-anchor="start">Contexto · políticas · permisos</text>
  <rect x="86" y="368" width="372" height="80" rx="16" fill="#e9e6fa"/>
  <g class="icon-badge" data-icon="plug"><circle cx="126" cy="408" r="27" fill="#e9e6fa"/><use href="#plug" x="110" y="392" width="32" height="32" color="#4f46b8"/></g>
  <text x="175" y="417" class="label" text-anchor="start">Cliente MCP A</text>
  <rect x="86" y="516" width="372" height="80" rx="16" fill="#e9e6fa"/>
  <g class="icon-badge" data-icon="plug"><circle cx="126" cy="556" r="27" fill="#e9e6fa"/><use href="#plug" x="110" y="540" width="32" height="32" color="#4f46b8"/></g>
  <text x="175" y="565" class="label" text-anchor="start">Cliente MCP B</text>
  <rect x="746" y="132" width="398" height="340" rx="22" class="card"/>
  <g class="icon-badge" data-icon="server"><circle cx="786" cy="173" r="27" fill="#e1f2ee"/><use href="#server" x="770" y="157" width="32" height="32" color="#087f7a"/></g>
  <text x="831" y="181" class="label" text-anchor="start">Servidor MCP A</text>
  <g class="icon-badge" data-icon="wrench"><circle cx="794" cy="246" r="26" fill="#e1f2ee"/><use href="#wrench" x="779" y="231" width="30" height="30" color="#087f7a"/></g>
  <text x="840" y="237" class="label" text-anchor="start">Tools</text>
  <text x="840" y="271" class="body" text-anchor="start">Ejecutar operaciones</text>
  <g class="icon-badge" data-icon="file-text"><circle cx="794" cy="333" r="26" fill="#e1f2ee"/><use href="#file-text" x="779" y="318" width="30" height="30" color="#087f7a"/></g>
  <text x="840" y="324" class="label" text-anchor="start">Resources</text>
  <text x="840" y="358" class="body" text-anchor="start">Aportar contexto</text>
  <g class="icon-badge" data-icon="messages-square"><circle cx="794" cy="420" r="26" fill="#e1f2ee"/><use href="#messages-square" x="779" y="405" width="30" height="30" color="#087f7a"/></g>
  <text x="840" y="411" class="label" text-anchor="start">Prompts</text>
  <text x="840" y="445" class="body" text-anchor="start">Reutilizar plantillas</text>
  <rect x="746" y="516" width="398" height="112" rx="22" class="card"/>
  <g class="icon-badge" data-icon="server"><circle cx="794" cy="572" r="30" fill="#e1f2ee"/><use href="#server" x="776" y="554" width="36" height="36" color="#087f7a"/></g>
  <text x="850" y="562" class="label" text-anchor="start">Servidor MCP B</text>
  <text x="850" y="596" class="body" text-anchor="start">Otra integración</text>
  <path d="M458 408H746" class="connector bidirectional"/>
  <text x="602" y="390" class="label" text-anchor="middle">MCP</text>
  <text x="602" y="439" class="body" text-anchor="middle">Solicitud / resultado</text>
  <path d="M458 556H746" class="connector bidirectional"/>
  <text x="602" y="538" class="body" text-anchor="middle">Conexión MCP</text>
  <text x="602" y="587" class="body" text-anchor="middle">independiente</text>
</svg>
