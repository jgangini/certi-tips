<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 554" role="img" aria-labelledby="title description">
  <title id="title">Cada conexión tiene sus propios extremos</title>
  <desc id="description">En el ejercicio, el host inicia un servidor local y usa stdio para comunicarse con él. El servidor consulta OCI por HTTPS. La ubicación cloud de los datos no transforma automáticamente el transporte MCP en Streamable HTTP.</desc>
  <defs>
    <!-- Lucide icons, ISC. See assets/icons/LICENSE-lucide.txt. -->
    <symbol id="app-window" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 4v4M2 8h20M6 4v4"/></symbol>
    <symbol id="server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><path d="M6 6h.01M6 18h.01"/></symbol>
    <symbol id="cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></symbol>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}
      .title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}
      .body{font-size:22px;fill:#536078}.mono{font-family:Consolas,monospace;font-size:22px;fill:#536078}
      .card{fill:#fff;stroke:#dce1eb;stroke-width:1.5}
      .connector{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .bidirectional{marker-start:url(#arrow)}.divider{stroke:#dce1eb;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="554" fill="#f7f8fc"/>
  <text x="56" y="64" class="title" text-anchor="start">Cada conexión tiene sus propios extremos</text>
  <rect x="56" y="146" width="290" height="288" rx="22" class="card"/>
  <rect x="455" y="146" width="290" height="288" rx="22" class="card"/>
  <rect x="854" y="146" width="290" height="288" rx="22" class="card"/>
  <g class="icon-badge" data-icon="app-window"><circle cx="201" cy="223" r="48" fill="#e9e6fa"/><use href="#app-window" x="175" y="197" width="52" height="52" color="#4f46b8"/></g>
  <g class="icon-badge" data-icon="server"><circle cx="600" cy="223" r="48" fill="#fae6e1"/><use href="#server" x="574" y="197" width="52" height="52" color="#c74436"/></g>
  <g class="icon-badge" data-icon="cloud"><circle cx="999" cy="223" r="48" fill="#e1f2ee"/><use href="#cloud" x="973" y="197" width="52" height="52" color="#087f7a"/></g>
  <path d="M249 223H552" class="connector bidirectional"/>
  <text x="400" y="204" class="mono" text-anchor="middle">stdio</text>
  <path d="M648 223H951" class="connector bidirectional"/>
  <text x="799" y="204" class="mono" text-anchor="middle">HTTPS</text>
  <text x="201" y="322" class="label" text-anchor="middle">Cliente</text>
  <text x="600" y="322" class="label" text-anchor="middle">Servidor local</text>
  <text x="999" y="322" class="label" text-anchor="middle">OCI</text>
  <text x="201" y="373" class="body" text-anchor="middle">Conexión MCP</text>
  <text x="600" y="367" class="body" text-anchor="middle">Conecta ambos</text>
  <text x="600" y="398" class="body" text-anchor="middle">tramos</text>
  <text x="999" y="373" class="body" text-anchor="middle">API cloud</text>
  <text x="600" y="502" class="body" text-anchor="middle">Mantén stdio en la configuración de este cliente MCP.</text>
</svg>
