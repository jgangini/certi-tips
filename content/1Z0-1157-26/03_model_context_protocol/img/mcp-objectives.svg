<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 598" role="img" aria-labelledby="title description">
  <title id="title">Cuatro preguntas para entender MCP</title>
  <desc id="description">Los objetivos distinguen participantes, capacidades, mensajes y transporte. Los iconos representan una red de componentes, una herramienta, un intercambio de mensajes y una conexión; cada uno conserva espacio dentro de su círculo.</desc>
  <defs>
    <!-- Lucide icons, ISC. See assets/icons/LICENSE-lucide.txt. -->
    <symbol id="network" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3M12 12V8"/></symbol>
    <symbol id="wrench" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/></symbol>
    <symbol id="messages-square" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2zM20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"/></symbol>
    <symbol id="plug" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5M15 8V2M17 8a1 1 0 0 1 1 1v4a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1zM9 8V2"/></symbol>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}
      .title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}
      .body{font-size:22px;fill:#536078}.mono{font-family:Consolas,monospace;font-size:22px;fill:#536078}
      .card{fill:#fff;stroke:#dce1eb;stroke-width:1.5}
      .connector{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .bidirectional{marker-start:url(#arrow)}.divider{stroke:#dce1eb;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="598" fill="#f7f8fc"/>
  <text x="56" y="64" class="title" text-anchor="start">Cuatro preguntas para entender MCP</text>
  <rect x="56" y="122" width="518" height="188" rx="22" class="card"/>
  <g class="icon-badge" data-icon="network"><circle cx="134" cy="198" r="44" fill="#e9e6fa"/><use href="#network" x="110" y="174" width="48" height="48" color="#4f46b8"/></g>
  <text x="206" y="180" class="label" text-anchor="start">¿Quién hace qué?</text>
  <text x="206" y="224" class="body" text-anchor="start">Host, cliente y servidor</text>
  <text x="206" y="258" class="body" text-anchor="start">tienen funciones distintas.</text>
  <rect x="624" y="122" width="518" height="188" rx="22" class="card"/>
  <g class="icon-badge" data-icon="wrench"><circle cx="702" cy="198" r="44" fill="#e1f2ee"/><use href="#wrench" x="678" y="174" width="48" height="48" color="#087f7a"/></g>
  <text x="774" y="180" class="label" text-anchor="start">¿Qué necesito?</text>
  <text x="774" y="224" class="body" text-anchor="start">Tools, resources o prompts</text>
  <text x="774" y="258" class="body" text-anchor="start">según la tarea.</text>
  <rect x="56" y="352" width="518" height="188" rx="22" class="card"/>
  <g class="icon-badge" data-icon="messages-square"><circle cx="134" cy="428" r="44" fill="#fae6e1"/><use href="#messages-square" x="110" y="404" width="48" height="48" color="#c74436"/></g>
  <text x="206" y="410" class="label" text-anchor="start">¿Qué se intercambia?</text>
  <text x="206" y="454" class="body" text-anchor="start">Descubrir, llamar</text>
  <text x="206" y="488" class="body" text-anchor="start">y relacionar respuestas.</text>
  <rect x="624" y="352" width="518" height="188" rx="22" class="card"/>
  <g class="icon-badge" data-icon="plug"><circle cx="702" cy="428" r="44" fill="#e9e6fa"/><use href="#plug" x="678" y="404" width="48" height="48" color="#4f46b8"/></g>
  <text x="774" y="410" class="label" text-anchor="start">¿Por dónde viaja?</text>
  <text x="774" y="454" class="body" text-anchor="start">Identifica ambos extremos</text>
  <text x="774" y="488" class="body" text-anchor="start">antes de elegir transporte.</text>
</svg>
