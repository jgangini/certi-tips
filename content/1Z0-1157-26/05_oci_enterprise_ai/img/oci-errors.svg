<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" role="img" aria-labelledby="title description">
  <title id="title">Diagnóstico de errores comunes al integrar OCI</title>
  <desc id="description">Cinco señales guían una revisión concreta: modelo no disponible a región, endpoint cambiado a compatibilidad, proyecto confundido a identidad del recurso, acceso denegado a permisos mínimos y memoria activada a política de retención.</desc>
  <defs>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b;font-size:24px}
      .title{font-size:34px;font-weight:700}
      .label{font-size:26px;font-weight:700}
      .mistake rect{fill:#fae6e1;stroke:#efc7be;stroke-width:1.5}
      .correction rect{fill:#e1f2ee;stroke:#b7ddd5;stroke-width:1.5}
      .arrow{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .icon{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="770" fill="#f7f8fc"/>
  <text x="56" y="64" class="title">Antes de cambiar código, localiza la causa</text>
  <g class="column-headings">
    <circle cx="80" cy="118" r="16" fill="#fae6e1"/>
    <path d="m75 113 10 10m0-10-10 10" class="icon" stroke="#c74436"/>
    <text x="108" y="127" class="label">Error o confusión</text>
    <circle cx="648" cy="118" r="16" fill="#e1f2ee"/>
    <path d="m641 118 5 5 9-10" class="icon" stroke="#087f7a"/>
    <text x="676" y="127" class="label">Qué comprobar</text>
  </g>
  <g class="comparison-row" transform="translate(0 154)">
    <g class="mistake">
      <rect x="56" width="480" height="96" rx="16"/>
      <text x="82" y="57">El modelo del ejemplo no responde</text>
    </g>
    <path d="M553 48h50m-13-9 13 9-13 9" class="arrow"/>
    <g class="correction">
      <rect x="624" width="520" height="96" rx="16"/>
      <text x="650" y="40">Disponibilidad del modelo</text>
      <text x="650" y="74">en esa región</text>
    </g>
  </g>
  <g class="comparison-row" transform="translate(0 270)">
    <g class="mistake">
      <rect x="56" width="480" height="96" rx="16"/>
      <text x="82" y="40">Cambiar solo la URL</text>
      <text x="82" y="74">rompe una función</text>
    </g>
    <path d="M553 48h50m-13-9 13 9-13 9" class="arrow"/>
    <g class="correction">
      <rect x="624" width="520" height="96" rx="16"/>
      <text x="650" y="40">Soporte de la API</text>
      <text x="650" y="74">y de esa herramienta</text>
    </g>
  </g>
  <g class="comparison-row" transform="translate(0 386)">
    <g class="mistake">
      <rect x="56" width="480" height="96" rx="16"/>
      <text x="82" y="40">Proyecto y compartment</text>
      <text x="82" y="74">se mezclan</text>
    </g>
    <path d="M553 48h50m-13-9 13 9-13 9" class="arrow"/>
    <g class="correction">
      <rect x="624" width="520" height="96" rx="16"/>
      <text x="650" y="40">Tipo de recurso y OCID</text>
      <text x="650" y="74">que se solicita</text>
    </g>
  </g>
  <g class="comparison-row" transform="translate(0 502)">
    <g class="mistake">
      <rect x="56" width="480" height="96" rx="16"/>
      <text x="82" y="40">La llamada devuelve</text>
      <text x="82" y="74">acceso denegado</text>
    </g>
    <path d="M553 48h50m-13-9 13 9-13 9" class="arrow"/>
    <g class="correction">
      <rect x="624" width="520" height="96" rx="16"/>
      <text x="650" y="40">Identidad y política</text>
      <text x="650" y="74">mínima necesaria</text>
    </g>
  </g>
  <g class="comparison-row" transform="translate(0 618)">
    <g class="mistake">
      <rect x="56" width="480" height="96" rx="16"/>
      <text x="82" y="40">Se guarda más contexto</text>
      <text x="82" y="74">del esperado</text>
    </g>
    <path d="M553 48h50m-13-9 13 9-13 9" class="arrow"/>
    <g class="correction">
      <rect x="624" width="520" height="96" rx="16"/>
      <text x="650" y="57">Retención, datos personales y acceso</text>
    </g>
  </g>
</svg>
