<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 816" role="img" aria-labelledby="title description">
  <title id="title">Un proyecto organiza recursos; la API da acceso a ellos</title>
  <desc id="description">La aplicación llama a OCI Responses API usando el OCID del proyecto. La API es una interfaz; el proyecto es un recurso que organiza artefactos, retención y memoria, no un runtime que aloje la aplicación. El proyecto vincula herramientas, configuración de memoria y recursos de apoyo. Las funciones propias siguen ejecutándose en la aplicación y MCP comunica con servidores externos.</desc>
