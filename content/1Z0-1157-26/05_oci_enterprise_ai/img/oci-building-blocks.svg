  <text x="150" y="344" class="label" text-anchor="start">Proyecto OCI Generative AI</text>
  <text x="150" y="382" class="body" text-anchor="start">Organiza artefactos, retención y memoria; no aloja tu aplicación.</text>
  <rect x="80" y="412" width="512" height="332" rx="18" fill="#fae6e1"/>
  <g class="icon-badge" data-icon="wrench"><circle cx="126" cy="454" r="28" fill="#fae6e1"/><use href="#wrench" x="110" y="438" width="32" height="32" color="#c74436"/></g>
  <text x="172" y="463" class="label" text-anchor="start">Herramientas</text>
  <text x="107" y="511" class="body" text-anchor="start">File Search</text>
  <text x="320" y="511" class="body" text-anchor="start">Busca documentos</text>
  <path d="M106 533H566" fill="none" stroke="#e8c7c0" stroke-width="1.5"/>
  <text x="107" y="568" class="body" text-anchor="start">Code Interpreter</text>
  <text x="320" y="568" class="body" text-anchor="start">Sandbox gestionado</text>
  <path d="M106 590H566" fill="none" stroke="#e8c7c0" stroke-width="1.5"/>
  <text x="107" y="625" class="body" text-anchor="start">Function Calling</text>
  <text x="320" y="625" class="body" text-anchor="start">Ejecuta tu aplicación</text>
  <path d="M106 647H566" fill="none" stroke="#e8c7c0" stroke-width="1.5"/>
  <text x="107" y="682" class="body" text-anchor="start">MCP Calling</text>
  <text x="320" y="682" class="body" text-anchor="start">Servidor externo</text>
  <rect x="616" y="412" width="504" height="189" rx="18" fill="#e9e6fa"/>
  <g class="icon-badge" data-icon="brain-circuit"><circle cx="662" cy="454" r="28" fill="#e9e6fa"/><use href="#brain-circuit" x="646" y="438" width="32" height="32" color="#4f46b8"/></g>
  <text x="708" y="463" class="label" text-anchor="start">Memoria</text>
  <text x="642" y="513" class="body" text-anchor="start">Conversación · entre sesiones</text>
  <text x="642" y="553" class="body" text-anchor="start">Compaction condensa el contexto</text>
  <rect x="616" y="620" width="504" height="124" rx="18" fill="#e1f2ee"/>
