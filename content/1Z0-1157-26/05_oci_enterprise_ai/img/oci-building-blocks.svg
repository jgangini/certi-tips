  <text x="165" y="203" class="body" text-anchor="start">Lógica y funciones</text>
  <rect x="676" y="119" width="468" height="118" rx="22" class="card"/>
  <g class="icon-badge" data-icon="plug"><circle cx="730" cy="178" r="32" fill="#e1f2ee"/><use href="#plug" x="711" y="159" width="38" height="38" color="#087f7a"/></g>
  <text x="785" y="164" class="label" text-anchor="start">OCI Responses API</text>
  <text x="785" y="202" class="body" text-anchor="start">Interfaz del servicio</text>
  <path d="M396 178H676" class="connector bidirectional"/>
  <text x="536" y="159" class="body" text-anchor="middle">Solicitud + OCID</text>
  <rect x="56" y="302" width="1088" height="466" rx="24" fill="#fff" stroke="#c5ccdc" stroke-width="2"/>
  <path d="M910 237V302" class="connector"/>
