<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title description">
  <title id="title">Autonomous MCP Server conecta clientes y herramientas</title>
  <desc id="description">Dos aplicaciones MCP compatibles usan HTTPS para acceder al servidor gestionado. Este expone herramientas Select AI Agent. Identidad, roles, políticas y auditoría se aplican al acceso a los datos; el protocolo no concede acceso universal.</desc>
