<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="storage-tiers">
<title id="title">No confundas Auto-Tiering con Archive</title>
<desc id="description">No confundas Auto-Tiering con Archive</desc>
