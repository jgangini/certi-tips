<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">No confundas Auto-Tiering con Archive</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">El mecanismo de transición y el tiempo de acceso son diferentes.</text><g data-layout="icon-label"><g data-artwork="true" data-badge="true"><circle cx="175" cy="276" r="51" fill="#fff" stroke="#4f46b8" stroke-width="2.5"/><use data-icon="archive" href="#archive" x="147" y="248" width="56" height="56" color="#4f46b8"/></g><g data-layout="caption"><text x="175" y="364" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Standard</text><text x="175" y="406" font-size="22" fill="#536078" font-weight="400" text-anchor="middle">Acceso frecuente</text></g></g><g data-layout="icon-label"><g data-artwork="true" data-badge="true"><circle cx="608" cy="276" r="51" fill="#fff" stroke="#087f7a" stroke-width="2.5"/><use data-icon="archive" href="#archive" x="580" y="248" width="56" height="56" color="#087f7a"/></g><g data-layout="caption"><text x="608" y="364" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Infrequent Access</text><text x="608" y="406" font-size="22" fill="#536078" font-weight="400" text-anchor="middle">Inmediato, poco frecuente</text></g></g><path d="M237 251H542" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M542 300H237" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="389" y="225" font-size="24" fill="#087f7a" font-weight="700" text-anchor="middle">Auto-Tiering</text><g data-layout="icon-label"><g data-artwork="true" data-badge="true"><circle cx="1030" cy="276" r="51" fill="#fff" stroke="#c74436" stroke-width="2.5"/><use data-icon="archive" href="#archive" x="1002" y="248" width="56" height="56" color="#c74436"/></g><g data-layout="caption"><text x="1030" y="364" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Archive</text><text x="1030" y="406" font-size="22" fill="#536078" font-weight="400" text-anchor="middle">Restauración previa</text></g></g><path d="M175 426V505H1030V428" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><rect x="316" y="474" width="564" height="56" rx="18" fill="#f7f8fc" stroke="none" stroke-width="1.5"/><text x="598" y="510" font-size="24" fill="#c74436" font-weight="600" text-anchor="middle">Lifecycle u otra transición configurada</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Auto-Tiering intercambia Standard e Infrequent Access; no Archive.</text></g>
</svg>
