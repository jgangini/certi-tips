<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-design-audit="08-11-compact"><title id="title">La Coincidencia Propone; la Evidencia Decide</title><desc id="description">El nombre parecido y un teléfono compartido proponen una candidatura entre V-18 y F-07. La evidencia decide si representan la misma identidad. Cuando se confirma, se eligen valores por atributo con su regla y fuente. Si la evidencia es negativa o insuficiente, no se fusiona automáticamente: se rechaza con evidencia o se mantiene la revisión pendiente.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">La Coincidencia Propone; la Evidencia Decide</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 104.5)"><rect x="96" y="300" width="590" height="118" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M108 300 H674 Q686 300 686 312 V364 H96 V312 Q96 300 108 300 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="start"><rect x="96" y="300" width="590" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="342.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="120" y="342.8">V-18: Ana Pérez</tspan></text></g></g><g data-table-cell="row" data-cell-align="start"><rect x="96" y="364" width="590" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="401.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="120" y="4