<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">La Coincidencia Propone; la Evidencia Decide</title><desc id="description">El nombre parecido y un teléfono compartido proponen una candidatura entre V-18 y F-07. La evidencia decide si representan la misma identidad. Cuando se confirma, se eligen valores por atributo con su regla y fuente. Si la evidencia es negativa o insuficiente, no se fusiona automáticamente: se rechaza con evidencia o se mantiene la revisión pendiente.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">La Coincidencia Propone; la Evidencia Decide</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" transform="translate(15.000 62.500)" data-center="960 608"><rect x="80" y="219" width="670" height="267" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M92.0 219.0 H738.0 Q750.0 219.0 750.0 231.0 V291.0 H80.0 V231.0 Q80.0 219.0 92.0 219.0 Z" fill="#59616E" stroke="none" data-table-header="true" /><g data-person-icon="user-supplied" transform="translate(100 252) scale(2.625)" fill="#FFFFFF" color="#FFFFFF"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z" /><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z" /></g><g data-person-icon="user-supplied" transform="translate(100 315) scale(2.625)" fill="#3C4545"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z" /><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z" /></g><text x="445.0" y="264.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="445.0" y="264.5">V-18: Ana Pérez</tspan></text><text x="165" y="351.91" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="165" y="351.91">F-07: Ana M. Pérez</tspan></text><text x="100" y="428.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="100" y="428.27">Teléfono compartido: candidatura</tspan></text><line x1="750" y1="365" x2="960" y2="365" stroke="#3C4545" stroke-width="4" /><path d="M960 365 L944 373 L944 357 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round" /><path d="M1187.5 250 L1415 365.0 L1187.5 480 L960 365.0 Z" fill="#FFFFFF" stroke="#3C4545" stroke-width="3" stroke-linejoin="round" /><rect x="992.1" y="332.81" width="389.8" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1187.0" y="367.31" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1187.0" y="367.31">¿Evidencia de misma identidad?</tspan></text><rect x="1515" y="270" width="295" height="165" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1527.0 270.0 H1798.0 Q1810.0 270.0 1810.0 282.0 V370.0 H1515.0 V282.0 Q1515.0 270.0 1527.0 270.0 Z" fill="#59616E" stroke="none" data-table-header="true" /><g data-svgrepo-icon="check" transform="translate(1744 289) scale(1.66667)" color="#FFFFFF" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" />
  <path d="m16 9-5.5 5.5L8 12" />
</g><line x1="1415" y1="365" x2="1515" y2="365" stroke="#3C4545" stroke-width="4" /><path d="M1515 365 L1499 373 L1499 357 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round" /><rect x="1451.15" y="287.77" width="51.7" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1477.0" y="322.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1477.0" y="322.27">Sí</tspan></text><text x="1630" y="312.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="1630" y="312.5">Confirmar </tspan><tspan x="1630" y="346.5">identidad</tspan></text><line x1="1665" y1="435" x2="1665" y2="620" stroke="#3C4545" stroke-width="4" /><path d="M1665 620 L1657 604 L1673 604 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round" /><rect x="1460" y="620" width="350" height="252" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1472.0 620.0 H1798.0 Q1810.0 620.0 1810.0 632.0 V720.0 H1460.0 V632.0 Q1460.0 620.0 1472.0 620.0 Z" fill="#59616E" stroke="none" data-table-header="true" /><text x="1635.0" y="662.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="1635.0" y="662.5">Elegir valores </tspan><tspan x="1635.0" y="696.5">por atributo</tspan></text><text x="1635" y="801.43" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1635" y="801.43">Regla + fuente </tspan><tspan x="1635" y="834.07">conservadas</tspan></text><path d="M1187 480 V568 H840 V618" fill="none" stroke="#C74634" stroke-width="4" stroke-linejoin="round" /><line x1="840" y1="618" x2="840" y2="650" stroke="#C74634" stroke-width="4" /><path d="M840 650 L832 634 L848 634 Z" fill="#C74634" stroke="#C74634" stroke-width="1" stroke-linejoin="round" /><rect x="1184.0" y="515.77" width="222.497" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1295.2484375" y="550.27" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="middle"><tspan x="1295.2484375" y="550.27">No o insuficiente</tspan></text><rect x="590" y="650" width="650" height="215" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M602.0 650.0 H1228.0 Q1240.0 650.0 1240.0 662.0 V722.0 H590.0 V662.0 Q590.0 650.0 602.0 650.0 Z" fill="#59616E" stroke="none" data-table-header="true" /><text x="915.0" y="695.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="915.0" y="695.5">No fusionar automáticamente</tspan></text><text x="915" y="785.43" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="915" y="785.43">Rechazar con evidencia </tspan><tspan x="915" y="818.07">o mantener revisión pendiente</tspan></text></g></g></svg>
