/><rect x="1374" y="538" width="450" height="118" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1386 538 H1812 Q1824 538 1824 550 V602 H1374 V550 Q1374 538 1386 538 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="start"><rect x="1374" y="538" width="450" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1398" y="580.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="1398" y="580.8">Elegir valores por atributo</tspan></text></g></g><g data-table-cell="row" data-cell-align="start"><rect x="1374" y="602" width="450" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1398" y="639.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1398" y="639.8">Regla + fuente conservadas</tspan></text></g></g><line x1="1022" y1="479" x2="1022" y2="650" stroke="#59616E" stroke-width="3" /><path d="M1022 650 L1014.0 634.0 L1030.0 634.0 Z" fill="#59616E" /><rect x="1038.0" y="534" width="223" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1149.5" y="568.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1149.5" y="568.8">No o insuficiente</tspan></text><rect x="96" y="650" width="1000" height="118" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M108 650 H1084 Q1096 650 1096 662 V714 H96 V662 Q96 650 108 650 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="start"><rect x="96" y="650" width="1000" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="692.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="120" y="692.8">No fusionar automáticamente</tspan></text></g></g><g data-