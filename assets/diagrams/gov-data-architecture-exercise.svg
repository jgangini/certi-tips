<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Reconstruir un Cierre</title><desc id="description">El manifiesto identifica la versión de los datos, la regla aprobada y la fecha del cierre del 30 de septiembre, junto con las condiciones de acceso y conservación. Seis meses después, las entradas actuales pueden haber cambiado. Usa las versiones conservadas que señala el manifiesto para reconstruir el resultado; si falta alguna, registra la limitación en lugar de presentar el estado actual como evidencia histórica.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Reconstruir un Cierre</tspan></text><rect x="96" y="273" width="750" height="660" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="96" y="273" width="750" height="6" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><text x="132" y="341.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="132" y="341.59">MANIFIESTO DEL CIERRE</tspan></text><text x="132" y="432.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="132" y="432.27">Datos</tspan></text><text x="132" y="485.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="132" y="485.59">Versión del 30 de septiembre</tspan></text><text x="132" y="576.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="132" y="576.27">Reglas</tspan></text><text x="132" y="629.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="132" y="629.59">Versión aprobada para ese cierre</tspan></text><text x="132" y="720.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="132" y="720.27">Fecha de corte</tspan></text><text x="132" y="773.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="132" y="773.59">30 de septiembre</tspan></text><line x1="132" y1="850" x2="804" y2="850" stroke="#C74634" stroke-width="4"/><text x="132" y="891.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="132" y="891.27">Acceso y conservación acordados</tspan></text><rect x="1036" y="350" width="788" height="232" rx="0" fill="none" stroke="#697778" stroke-width="2"/><rect x="1036" y="660" width="788" height="289" rx="0" fill="none" stroke="#697778" stroke-width="2"/><text x="1050" y="278.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1050" y="278.59">SEIS MESES DESPUÉS</tspan></text><text x="1050" y="387.91" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1050" y="387.91">Entradas actuales</tspan></text><text x="1050" y="458.31" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1050" y="458.31">Los contratos y las reglas pudieron </tspan><tspan x="1050" y="490.95">cambiar.</tspan></text><text x="1700" y="515.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="middle"><tspan x="1700" y="515.59">?</tspan></text><line x1="1036" y1="601" x2="1824" y2="601" stroke="#C2D4D4" stroke-width="3"/><line x1="846" y1="733" x2="1036" y2="733" stroke="#3C4545" stroke-width="4"/><path d="M1036 733 L1020 741 L1020 725 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><text x="1050" y="706.91" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1050" y="706.91">Entradas conservadas</tspan></text><text x="1050" y="782.31" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1050" y="782.31">El manifiesto permite localizar el </tspan><tspan x="1050" y="814.95">estado y las reglas del cierre.</tspan></text><rect x="1036" y="879" width="788" height="70" rx="0" fill="#EEF3EC" stroke="#3C4545" stroke-width="2"/><rect x="1036" y="879" width="6" height="70" rx="0" fill="#749B6B" stroke="none" stroke-width="2"/><text x="1050" y="918.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1050" y="918.59">Resultado reconstruible</tspan></text></g></svg>
