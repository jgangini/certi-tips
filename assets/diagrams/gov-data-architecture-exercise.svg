<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Reconstruir un Cierre</title><desc id="description">El manifiesto identifica la versión de los datos, la regla aprobada y la fecha del cierre del 30 de septiembre, junto con las condiciones de acceso y conservación. La conexión punteada roja lleva a las entradas actuales, que seis meses después pueden haber cambiado y no garantizan el cierre histórico. La conexión continua lleva a las versiones conservadas. Usa las versiones conservadas que señala el manifiesto para reconstruir el resultado; si falta alguna, registra la limitación en lugar de presentar el estado actual como evidencia histórica.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Reconstruir un Cierre</tspan></text><defs><clipPath id="closure-comparison"><rect x="96" y="232" width="1728" height="752" rx="16"/></clipPath></defs><g data-architecture-artwork="reconstruction"><g clip-path="url(#closure-comparison)"><rect x="96" y="232" width="1728" height="752" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="96" y="232" width="1728" height="80" rx="0" fill="#59616E" stroke="none" stroke-width="2"/><line x1="960" y1="232" x2="960" y2="312" stroke="#FFFFFF" stroke-width="1.5"/><g data-architecture-separator="dates"><line x1="960" y1="312" x2="960" y2="984" stroke="#59616E" stroke-width="2" stroke-dasharray="12 10"/></g><text x="528" y="282.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="528" y="282.8">En la Fecha del Cierre</tspan></text><text x="1392" y="282.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="1392" y="282.8">Seis Meses Después</tspan></text><defs><clipPath id="manifest-table"><rect x="204" y="458" width="648" height="300" rx="12"/></clipPath></defs><g data-architecture-table="manifest"><g clip-path="url(#manifest-table)"><rect x="204" y="458" width="648" height="300" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="204" y="458" width="648" height="74" rx="0" fill="#59616E" stroke="none" stroke-width="2"/><text x="528.0" y="505.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="528.0" y="505.8">Manifiesto del Cierre</tspan></text><line x1="424" y1="532" x2="424" y2="694" stroke="#59616E" stroke-width="1.5"/><g data-architecture-row="manifest" data-row-top="532" data-row-bottom="586"><text x="228" y="569.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="228" y="569.8">Datos</tspan></text><text x="448" y="569.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="448" y="569.8">Versión del 30 de septiembre</tspan></text></g><g data-architecture-row="manifest" data-row-top="586" data-row-bottom="640"><text x="228" y="623.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="228" y="623.8">Reglas</tspan></text><text x="448" y="623.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="448" y="623.8">Versión aprobada para ese cierre</tspan></text></g><line x1="204" y1="586" x2="852" y2="586" stroke="#59616E" stroke-width="1.5"/><g data-architecture-row="manifest" data-row-top="640" data-row-bottom="694"><text x="228" y="677.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="228" y="677.8">Fecha de corte</tspan></text><text x="448" y="677.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="448" y="677.8">30 de septiembre</tspan></text></g><line x1="204" y1="640" x2="852" y2="640" stroke="#59616E" stroke-width="1.5"/><rect x="204" y="694" width="648" height="64" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><line x1="204" y1="694" x2="852" y2="694" stroke="#59616E" stroke-width="1.5"/><g data-layout="centered-card" data-architecture-note="manifest"><rect x="204" y="694" width="648" height="64" rx="0" fill="none" stroke="none" stroke-width="2"/><g data-card-content="note"><text x="528.0" y="736.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="528.0" y="736.8">Acceso y conservación acordados para este cierre.</tspan></text></g></g></g><rect x="204" y="458" width="648" height="300" rx="12" fill="none" stroke="#59616E" stroke-width="2"/></g><defs><clipPath id="current-table"><rect x="1268" y="352" width="448" height="246" rx="12"/></clipPath></defs><g data-architecture-table="current"><g clip-path="url(#current-table)"><rect x="1268" y="352" width="448" height="246" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="1268" y="352" width="448" height="74" rx="0" fill="#59616E" stroke="none" stroke-width="2"/><text x="1492.0" y="399.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="1492.0" y="399.8">Entradas Actuales</tspan></text><line x1="1488" y1="426" x2="1488" y2="534" stroke="#59616E" stroke-width="1.5"/><g data-architecture-row="current" data-row-top="426" data-row-bottom="480"><text x="1292" y="463.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1292" y="463.8">Datos</tspan></text><text x="1512" y="463.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1512" y="463.8">Estado actual</tspan></text></g><g data-architecture-row="current" data-row-top="480" data-row-bottom="534"><text x="1292" y="517.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1292" y="517.8">Reglas</tspan></text><text x="1512" y="517.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1512" y="517.8">Re