<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-design-audit="08-11-compact"><title id="title">Cambiar el Significado Puede Romper la Métrica</title><desc id="description">La propuesta mantiene estado = 1 y el mismo tipo de columna, pero amplía el significado de «vigentes» a «vigentes + pendientes». Ese cambio puede alterar clientes activos, reportes y respuestas de Atención sin modificar el esquema. El propietario debe resolver la definición, actualizar reglas y descripciones y registrar aprobación y fecha efectiva antes de aceptar el nuevo significado.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Cambiar el Significado Puede Romper la Métrica</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 35)"><rect x="96" y="270" width="744" height="190" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M108 270 H828 Q840 270 840 282 V334 H96 V282 Q96 270 108 270 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="start"><rect x="96" y="270" width="744" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="312.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="120" y="312.8">DEFINICIÓN APROBADA</tspan></text></g></g><g data-table-cell="tag-row" data-cell-align="center"><rect x="96" y="334" width="744" height="72" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><rect x="391.5" y="346" width="153" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="468.0" y="380.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="468.0" y="380.8">estado = 1</tspan></text></g></g><line x1="96" y1="406" x2="840" y2="406" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="start"><rect x="96" y="406" width="744" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="443.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="120" y="443.8">Solo contratos vigentes</tspan></text></g></g><rect x="1080" y="270" width="744" height="190" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1092 270 H1812 Q1824 270 1824 282 V334 H1080 V282 Q1080 270 1092 270 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="start"><rect x="1080" y="270" width="744" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1104" y="312.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="1104" y="312.8">PROPUESTA SIN VALIDAR</tspan></text></g></g><g data-table-cell="tag-row" data-cell-align="center"><rect x="1080" y="334" width="744" height="72" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><rect x="1375.5" y="346" width="153" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1452.0" y="380.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1452.0" y="380.8">estado = 1</tspan></text></g></g><line x1="1080" y1="406" x2="1824" y2="406" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="start"><rect x="1080" y="406" width="744" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1104" y="443.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1104" y="443.8">Vigentes + pendientes</tspan></text></g></g><line x1="840" y1="401" x2="1080" y2="401" stroke="#59616E" stroke-width="3" /><path d="M1080 401 L1064.0 409.0 L1064.0 393.0 Z" fill="#59616E" /><rect x="880.0" y="337" width="160" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="960" y="371.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="960" y="371.8">mismo tipo</tspan></text><rect x="96" y="650" width="744" height="226" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M108 650 H828 Q840 650 840 662 V714 H96 V662 Q96 650 108 650 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="start"><rect x="96" y="650" width="744" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="692.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="120" y="692.8">CONSUMIDORES A REVISAR</tspan></text></g></g><g data-table-cell="row" data-cell-align="start"><rect x="96" y="714" width="744" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="751.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="120" y="751.8">Clientes activos</tspan></text></g></g><line x1="96" y1="768" x2="840" y2="768" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="start"><rect x="96" y="768" width="744" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="805.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="120" y="805.8">Reporte mensual</tspan></text></g></g><line x1="96" y1="822" x2="840" y2="822" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="start"><rect x="96" y="822" width="744" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="859.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="120" y="859.8">Respuestas de atención</tspan></text></g></g><rect x="984" y="650" width="840" height="226" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M996 650 H1812 Q1824 650 1824 662 V714 H984 V662 Q984 650 996 650 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="start"><rect x="984" y="650" width="840" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1008" y="692.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="1008" y="692.8">DECISIÓN DEL PROPIETARIO</tspan></text></g></g><g data-table-cell="row" data-cell-align="start"><rect x="984" y="714" width="840" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1008" y="751.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1008" y="751.8">Separar vigente de pendiente.</tspan></text></g></g><line x1="984" y1="768" x2="1824" y2="768" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="start"><rect x="984" y="768" width="840" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1008" y="805.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1008" y="805.8">Actualizar reglas y descripciones.</tspan></text></g></g><line x1="984" y1="822" x2="1824" y2="822" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="start"><rect x="984" y="822" width="840" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1008" y="859.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1008" y="859.8">Registrar aprobación y fecha efectiva.</tspan></text></g></g><path d="M1452 460 L1452.0 539.0 Q1452 555 1436.0 555.0 L484.0 555.0 Q468 555 468.0 571.0 L468 650" fill="none" stroke="#59616E" stroke-width="3" stroke-linejoin="round" /><path d="M468 650 L460.0 634.0 L476.0 634.0 Z" fill="#59616E" /><line x1="1452" y1="555" x2="1452" y2="650" stroke="#59616E" stroke-width="3" /><path d="M1452 650 L1444.0 634.0 L1460.0 634.0 Z" fill="#59616E" /></g></g></svg>