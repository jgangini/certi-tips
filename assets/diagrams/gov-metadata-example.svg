<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Cambiar el Significado Puede Romper la Métrica</title><desc id="description">La propuesta mantiene estado = 1 y el mismo tipo de columna, pero amplía el significado de «vigentes» a «vigentes + pendientes». Ese cambio puede alterar clientes activos, reportes y respuestas de Atención sin modificar el esquema. El propietario debe resolver la definición, actualizar reglas y descripciones y registrar aprobación y fecha efectiva antes de aceptar el nuevo significado.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Cambiar el Significado Puede Romper la Métrica</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" transform="translate(20.000 41.455)" data-center="960 608"><rect x="331.805" y="219.09" width="306.391" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="485.0" y="253.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="485.0" y="253.59">DEFINICIÓN APROBADA</tspan></text><rect x="130" y="295" width="710" height="190" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M142.0 295.0 H828.0 Q840.0 295.0 840.0 307.0 V367.0 H130.0 V307.0 Q130.0 295.0 142.0 295.0 Z" fill="#59616E" stroke="none" data-table-header="true" /><text x="485.0" y="340.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="485.0" y="340.5">estado = 1</tspan></text><text x="170" y="421.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="170" y="421.59">Solo contratos vigentes</tspan></text><rect x="1263.631" y="219.09" width="322.738" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1425.0" y="253.59" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="middle"><tspan x="1425.0" y="253.59">PROPUESTA SIN VALIDAR</tspan></text><rect x="1070" y="295" width="710" height="190" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1082.0 295.0 H1768.0 Q1780.0 295.0 1780.0 307.0 V367.0 H1070.0 V307.0 Q1070.0 295.0 1082.0 295.0 Z" fill="#59616E" stroke="none" data-table-header="true" /><text x="1425.0" y="340.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="1425.0" y="340.5">estado = 1</tspan></text><text x="1110" y="421.59" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="start"><tspan x="1110" y="421.59">Vigentes + pendientes</tspan></text><line x1="840" y1="388" x2="1070" y2="388" stroke="#3C4545" stroke-width="3" /><rect x="876.2" y="315.77" width="159.6" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="956.0" y="350.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="956.0" y="350.27">mismo tipo</tspan></text><rect x="100" y="552" width="670" height="362" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M112.0 552.0 H758.0 Q770.0 552.0 770.0 564.0 V624.0 H100.0 V564.0 Q100.0 552.0 112.0 552.0 Z" fill="#59616E" stroke="none" data-table-header="true" /><g data-svgrepo-icon="chart" transform="translate(128 581) scale(2)" color="#FFFFFF" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16" />
