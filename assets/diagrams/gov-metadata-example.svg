<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Cambiar el Significado Puede Romper la Métrica</title><desc id="description">La propuesta mantiene estado = 1 y el mismo tipo de columna, pero amplía el significado de «vigentes» a «vigentes + pendientes». Ese cambio puede alterar clientes activos, reportes y respuestas de Atención sin modificar el esquema. El propietario debe resolver la definición, actualizar reglas y descripciones y registrar aprobación y fecha efectiva antes de aceptar el nuevo significado.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Cambiar el Significado Puede Romper la Métrica</tspan></text><text x="130" y="253.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="130" y="253.59">DEFINICIÓN APROBADA</tspan></text><rect x="130" y="295" width="710" height="190" rx="0" fill="#F1EFED" stroke="#3C4545" stroke-width="3"/><rect x="130" y="295" width="710" height="6" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><text x="170" y="345.23" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="170" y="345.23">estado = 1</tspan></text><text x="170" y="421.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="170" y="421.59">Solo contratos vigentes</tspan></text><text x="1070" y="253.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="1070" y="253.59">PROPUESTA SIN VALIDAR</tspan></text><rect x="1070" y="295" width="710" height="190" rx="0" fill="#FFFFFF" stroke="#C74634" stroke-width="3"/><text x="1110" y="345.23" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="1110" y="345.23">estado = 1</tspan></text><text x="1110" y="421.59" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="start"><tspan x="1110" y="421.59">Vigentes + pendientes</tspan></text><line x1="840" y1="388" x2="1070" y2="388" stroke="#3C4545" stroke-width="3"/><text x="956" y="350.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="956" y="350.27">mismo tipo</tspan></text><rect x="100" y="552" width="670" height="362" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><g data-svgrepo-icon="chart" transform="translate(128 581) scale(2)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16" />
