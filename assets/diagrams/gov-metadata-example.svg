</g><text x="200" y="609.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="200" y="609.27">CONSUMIDORES A REVISAR</tspan></text><text x="135" y="712.548" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="135" y="712.548">Clientes activos </tspan><tspan x="135" y="758.59">Reporte mensual </tspan><tspan x="135" y="804.632">Respuestas de atención</tspan></text><path d="M1425 485 V520 H435 V552" fill="none" stroke="#3C4545" stroke-width="2" stroke-linejoin="round"/><line x1="770" y1="740" x2="885" y2="740" stroke="#3C4545" stroke-width="3"/><path d="M885 740 L869 748 L869 732 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><rect x="885" y="560" width="895" height="354" rx="0" fill="#F7EFE8" stroke="#3C4545" stroke-width="2"/><text x="925" y="616.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="925" y="616.59">DECISIÓN DEL PROPIETARIO</tspan></text><text x="925" y="718.007" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="925" y="718.007">Separar vigente de pendiente. </tspan><tspan x="925" y="767.59">Actualizar reglas y descripciones. </tspan><tspan x="925" y="817.173">Registrar aprobación y fecha efectiva.</tspan></text><g data-person-icon="user-supplied" transform="translate(1703 583) scale(2.75)" fill="#181818"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"/><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z"/></g></g></svg>
