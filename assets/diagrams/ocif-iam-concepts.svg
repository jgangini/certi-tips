<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Dos preguntas antes de actuar</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">La identidad se verifica; la operación se autoriza.</text><g data-layout="icon-label"><g data-artwork="true" data-badge="true"><circle cx="160" cy="300" r="51" fill="#fff" stroke="#4f46b8" stroke-width="2.5"/><use data-icon="user" href="#user" x="132" y="272" width="56" height="56" color="#4f46b8"/></g><g data-layout="caption"><text x="160" y="388" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Ana</text></g></g><path d="M218 300H371" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><rect x="393" y="187" width="292" height="238" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><text x="539" y="222" font-size="25" fill="#4f46b8" font-weight="700" text-anchor="middle">Autenticación</text><use data-icon="key" href="#key" x="508" y="261" width="62" height="62" color="#4f46b8"/><text x="539" y="362" font-size="25" fill="#17243b" font-weight="400" text-anchor="middle">AuthN: ¿quién eres?</text><path d="M705 300H791" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><rect x="813" y="187" width="302" height="238" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><text x="964" y="222" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle">Autorización</text><use data-icon="shield" href="#shield" x="933" y="261" width="62" height="62" color="#087f7a"/><text x="964" y="362" font-size="25" fill="#17243b" font-weight="400" text-anchor="middle">AuthZ: ¿puedes leer?</text><text x="600" y="496" font-size="26" fill="#c74436" font-weight="600" text-anchor="middle">Una sesión válida puede recibir una operación denegada.</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">La autenticación no concede todos los permisos.</text></g>
