<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
  <title id="title">Dos formas de operar una aplicación de agentes en OCI</title>
  <desc id="description">A la izquierda, tu equipo mantiene una aplicación en su propio despliegue. A la derecha, una aplicación compatible se empaqueta y se publica en alojamiento gestionado de OCI Generative AI. Ambas pueden consumir OCI Responses API para modelos y herramientas compatibles. Las funciones propias siguen necesitando código y permisos. Identidad, estado, límites y observabilidad deben configurarse en ambos casos. Vista conceptual, no diagrama de servicios o escalado automático.</desc>
  <defs>
    <linearGradient id="indigo-surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6660d0"/><stop offset="1" stop-color="#40399c"/></linearGradient>
    <linearGradient id="teal-surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12988e"/><stop offset="1" stop-color="#086a67"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}.eyebrow{font-size:14px;font-weight:700;letter-spacing:2px;fill:#536078}.title{font-size:34px;font-weight:700}.subtitle{font-size:19px;fill:#536078}.label{font-size:24px;font-weight:700}.body{font-size:21px}.meta{font-size:16px;fill:#536078}.white{fill:#fff}.muted{fill:#536078}.teal{fill:#087f7a}.indigo{fill:#4f46b8}.line{fill:none;stroke:#536078;stroke-width:2.4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#f7f8fc"/>
  <text x="56" y="60" class="title">La API y el alojamiento son decisiones distintas</text>
  <text x="56" y="96" class="subtitle">Elige dónde opera tu aplicación; después configura cómo accede a modelos y herramientas.</text>
  <g transform="translate(0 -60)">
  <path d="M600 184V502" stroke="#dbe0eb" stroke-dasharray="5 8"/>
  <circle cx="78" cy="199" r="22" fill="#e9e7fa"/><text x="78" y="207" text-anchor="middle" class="body indigo" font-weight="700">1</text>
  <text x="113" y="207" class="label">Despliegue propio</text>
  <text x="113" y="237" class="body muted">Tu equipo opera la aplicación</text>
  <circle cx="658" cy="199" r="22" fill="#dcefeb"/><text x="658" y="207" text-anchor="middle" class="body teal" font-weight="700">2</text>
  <text x="693" y="207" class="label">Alojamiento gestionado</text>
  <text x="693" y="237" class="body muted">Publicas una aplicación compatible</text>
  <!-- A laptop and service rack share the deployment plane operated by the user's team. -->
  <ellipse cx="306" cy="430" rx="221" ry="34" fill="#e5e7f1"/>
  <path d="M100 405 295 366 517 406 322 451Z" fill="#eae9f7" stroke="#ccc8e9" stroke-width="2"/>
  <rect x="111" y="290" width="169" height="113" rx="12" fill="#17243b"/>
  <rect x="120" y="300" width="151" height="90" rx="5" fill="#fff"/>
  <path d="m111 403-20 19h207l-18-19" fill="#aeb5c9"/>
  <path d="M171 413h46" stroke="#f7f8fc" stroke-width="4" stroke-linecap="round"/>
  <path d="m160 331-13 14 13 14m69-28 13 14-13 14m-31-25-10 31" fill="none" stroke="#4f46b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M308 346h30" class="line"/>
  <path d="m354 289 42-18 83 18-42 19Z" fill="#a7a2e4"/>
  <path d="M354 289v111l83 21V308Z" fill="url(#indigo-surface)"/>
  <path d="m437 308 42-19v111l-42 21Z" fill="#353176"/>
  <path d="m368 318 53 12m-53 20 53 12m-53 20 53 12" stroke="#ada8f0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="370" cy="307" r="3" fill="#fff"/><circle cx="383" cy="310" r="3" fill="#fff"/>
  <text x="307" y="477" text-anchor="middle" class="body">Backend, VM o cluster de tu equipo</text>
  <!-- The boundary denotes managed hosting; multiple instances are conceptual, not an autoscaling promise. -->
  <rect x="644" y="262" width="500" height="188" rx="24" fill="#edf6f4" stroke="#bddbd6" stroke-width="1.5"/>
  <path d="M676 423h436M749 395v28m143-28v28m143-28v28" stroke="#a8cfc7" stroke-width="2"/>
  <g>
    <path d="m695 304 36-17 84 17-36 17Z" fill="#8fcfc4"/><path d="M695 304v84l84 19v-86Z" fill="url(#teal-surface)"/><path d="m779 321 36-17v84l-36 19Z" fill="#085853"/>
    <path d="m710 331 52 11m-52 16 52 11" stroke="#9ce0d4" stroke-width="4" stroke-linecap="round"/><circle cx="710" cy="314" r="3" fill="#fff"/>
    <path d="m838 304 36-17 84 17-36 17Z" fill="#8fcfc4"/><path d="M838 304v84l84 19v-86Z" fill="url(#teal-surface)"/><path d="m922 321 36-17v84l-36 19Z" fill="#085853"/>
    <path d="m853 331 52 11m-52 16 52 11" stroke="#9ce0d4" stroke-width="4" stroke-linecap="round"/><circle cx="853" cy="314" r="3" fill="#fff"/>
    <path d="m981 304 36-17 84 17-36 17Z" fill="#8fcfc4"/><path d="M981 304v84l84 19v-86Z" fill="url(#teal-surface)"/><path d="m1065 321 36-17v84l-36 19Z" fill="#085853"/>
    <path d="m996 331 52 11m-52 16 52 11" stroke="#9ce0d4" stroke-width="4" stroke-linecap="round"/><circle cx="996" cy="314" r="3" fill="#fff"/>
  </g>
  <text x="894" y="477" text-anchor="middle" class="body">Imagen · endpoint · configuración</text>
  <path d="M307 490v43m587-43v43" class="line"/>
  <rect x="136" y="546" width="928" height="62" rx="18" fill="#17243b"/>
  <path d="m170 567-9 10 9 10m29-20 9 10-9 10m-12-21-7 22" stroke="#c0baf8" stroke-width="3" stroke-linecap="round" fill="none"/>
  <text x="228" y="585" class="label white">OCI Responses API</text>
  <path d="M482 563v28" stroke="#64718a"/>
  <text x="510" y="584" class="body white">Modelos y herramientas compatibles</text>
  <g fill="none" stroke="#087f7a" stroke-width="2.6" stroke-linejoin="round"><path d="M85 630 97 635v9q-1 10-12 15-11-5-12-15v-9Z"/><path d="m79 644 4 4 9-10"/></g>
  <text x="114" y="651" class="body">En ambas vías: identidad, estado, límites y observabilidad</text>
  <text x="114" y="676" class="meta">Las funciones propias requieren código autorizado. Verifica soporte, región y cuotas.</text>
  </g>
</svg>
