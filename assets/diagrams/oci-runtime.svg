<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title description">
  <title id="title">Modelo y runtime empresarial en OCI</title>
  <desc id="description">Vista conceptual del runtime empresarial: una sesión llega al control de ejecución; este coordina el modelo y las herramientas. Identidad, políticas, trazas y evaluaciones atraviesan el ciclo completo. El modelo no es el runtime ni se encarga por sí solo de despliegue, permisos o escalado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#675f59"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#17665e"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#252321}
      .title{font-size:30px;font-weight:700}
      .subtitle{font-size:20px;fill:#675f59}
      .label{font-size:23px;font-weight:700}
      .body{font-size:20px}
      .small{font-size:18px;fill:#675f59}
      .white{fill:#fff}
      .red{fill:#b43d32}
      .teal{fill:#17665e}
      .card{fill:#fff;stroke:#d9d0c7;stroke-width:2}
      .line{fill:none;stroke:#675f59;stroke-width:2.5;marker-end:url(#arrow)}
      .return{fill:none;stroke:#17665e;stroke-width:2.5;marker-end:url(#arrow-teal)}
    </style>
  </defs>
  <rect width="1000" height="660" fill="#faf8f5"/>

  <text x="40" y="50" class="title">Un modelo no es un runtime empresarial</text>
  <text x="40" y="86" class="subtitle">Vista conceptual: operar agentes exige estado, acceso, herramientas y control.</text>
  <rect x="40" y="187" width="188" height="119" rx="16" class="card"/>
  <text x="61" y="229" class="label">Canal de uso</text>
  <text x="61" y="268" class="body">Inicia una sesión.</text>
  <path d="M 235 249 H 280" class="line"/>
  <rect x="293" y="129" width="667" height="378" rx="20" fill="#fff" stroke="#b43d32" stroke-width="2"/>
  <text x="318" y="171" class="label">Runtime del agente en OCI</text>
  <rect x="318" y="204" width="281" height="149" rx="14" fill="#f6e6e1"/>
  <text x="340" y="244" class="label">Control de ejecución</text>
  <text x="340" y="283" class="body"><tspan x="340">Sesión · contexto · estado</tspan><tspan x="340" dy="29">Pasos, errores y límites</tspan></text>
  <rect x="683" y="204" width="250" height="149" rx="14" fill="#eee9e3"/>
  <text x="707" y="245" class="label">Modelo</text>
  <text x="707" y="283" class="body"><tspan x="707">Razona y propone</tspan><tspan x="707" dy="29">la siguiente acción.</tspan></text>
  <path d="M 609 272 H 669" fill="none" stroke="#675f59" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M 459 359 V 394" class="line"/>
  <rect x="318" y="407" width="615" height="69" rx="14" fill="#e4eeeb"/>
  <text x="339" y="436" class="label">Herramientas y conocimiento</text>
  <text x="339" y="463" class="body">Datos, sistemas y operaciones con acceso autorizado</text>
  <path d="M 150 308 V 524 M 627 508 V 524" stroke="#17665e" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="40" y="538" width="920" height="59" rx="14" fill="#17665e"/>
  <text x="500" y="575" text-anchor="middle" class="label white">IAM y políticas · trazas · evaluaciones · despliegue y operación</text>
  <text x="40" y="632" class="small">Confirma en la documentación la disponibilidad y el alcance de cada servicio de OCI.</text>
</svg>
