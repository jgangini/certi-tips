<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Dos opciones para operar una aplicación de agentes con OCI</title>
  <desc id="description">En despliegue propio tu equipo opera el backend, VM o cluster. En alojamiento gestionado publicas una aplicación compatible. Ambas opciones pueden consumir OCI Responses API y requieren identidad, estado, límites y observabilidad. Las ilustraciones son conceptuales y fueron generadas con IA.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m2 2 6 3-6 3" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b;font-size:23px}.title{font-size:34px;font-weight:700}.label{font-size:27px;font-weight:700}.muted{fill:#536078}.white{fill:#fff}.edge{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="760" fill="#f7f8fc"/>
  <text x="56" y="64" class="title">La API y el alojamiento son decisiones distintas</text>
  <text x="56" y="104" class="muted">Elige quién opera tu aplicación y cómo accede a modelos y herramientas.</text>
  <rect x="56" y="144" width="520" height="424" rx="24" fill="#fff" stroke="#dce1ec"/>
  <rect x="624" y="144" width="520" height="424" rx="24" fill="#fff" stroke="#dce1ec"/>
  <text x="88" y="190" class="label">Despliegue propio</text>
  <text x="88" y="226" class="muted">Tu equipo opera la aplicación</text>
  <text x="656" y="190" class="label">Alojamiento gestionado</text>
  <text x="656" y="226" class="muted">Publicas una aplicación compatible</text>
  <image x="82" y="236" width="468" height="278" href="../illustrations/self-hosted-runtime.png" preserveAspectRatio="xMidYMid meet"/>
  <image x="650" y="236" width="468" height="278" href="../illustrations/managed-runtime.png" preserveAspectRatio="xMidYMid meet"/>
  <text x="316" y="538" text-anchor="middle">Backend, VM o cluster de tu equipo</text>
  <text x="884" y="538" text-anchor="middle">Imagen, endpoint y configuración</text>
  <path d="M316 568V612" class="edge"/><path d="M884 568V612" class="edge"/>
  <rect x="160" y="612" width="880" height="70" rx="18" fill="#17243b"/>
  <text x="194" y="656" class="label white">OCI Responses API</text>
  <path d="M493 630V664" stroke="#78849a"/>
  <text x="520" y="656" class="white">Modelos y herramientas compatibles</text>
  <text x="600" y="726" text-anchor="middle" class="muted">En ambas vías: identidad, estado, límites y observabilidad.</text>
</svg>
