<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Cuatro Controles Sobre la Misma Consulta</title><desc id="description">La misma consulta necesita controles complementarios. Autenticar comprueba quién actúa; autorizar determina si puede leer contratos; cifrar protege el contenido del canal; y auditar conserva evidencia del evento observado. El registro enlaza identidad, acción, objeto y resultado. Ninguno de estos controles sustituye la comprobación de los otros ni la finalidad acordada para usar los datos.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Cuatro Controles Sobre la Misma Consulta</tspan></text><text x="250" y="242.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="250" y="242.59">1 · Autenticar</tspan></text><text x="250" y="313.84" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="250" y="313.84">Identidad </tspan><tspan x="250" y="349.7">comprobada</tspan></text><line x1="250" y1="375" x2="250" y2="428" stroke="#3C4545" stroke-width="3"/><g data-person-icon="user-supplied" transform="translate(138 414) scale(14)" fill="#2E5C70"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"/><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z"/></g><text x="250" y="718.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="250" y="718.59">Usuario U7</tspan></text><text x="740" y="242.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="740" y="242.59">2 · Autorizar</tspan></text><text x="740" y="309.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="740" y="309.27">Acción permitida</tspan></text><line x1="740" y1="347" x2="740" y2="435" stroke="#3C4545" stroke-width="3"/><rect x="610" y="435" width="260" height="250" rx="0" fill="#F7EFE8" stroke="#3C4545" stroke-width="3"/><rect x="610" y="435" width="260" height="6" rx="0" fill="#C06D30" stroke="none" stroke-width="2"/><text x="740" y="536.34" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="740" y="536.34">Leer </tspan><tspan x="740" y="578.84">contratos</tspan></text><line x1="334" y1="590" x2="610" y2="590" stroke="#3C4545" stroke-width="4"/><path d="M610 590 L594 598 L594 582 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><text x="1180" y="242.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1180" y="242.59">3 · Cifrar</tspan></text><text x="1180" y="313.84" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1180" y="313.84">Contenido protegido </tspan><tspan x="1180" y="349.7">mediante claves</tspan></text><line x1="1180" y1="392" x2="1180" y2="527" stroke="#3C4545" stroke-width="3"/><line x1="870" y1="527" x2="1470" y2="527" stroke="#3C4545" stroke-width="3"/><line x1="870" y1="649" x2="1470" y2="649" stroke="#3C4545" stroke-width="3"/><line x1="870" y1="590" x2="1470" y2="590" stroke="#3C4545" stroke-width="4"/><path d="M1470 590 L1454 598 L1454 582 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><rect x="1470" y="425" width="354" height="285" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="1470" y="425" width="354" height="92" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="1470" y="425" width="354" height="6" rx="0" fill="#2E5C70" stroke="none" stroke-width="2"/><text x="1647" y="482.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1647" y="482.59">Contratos</tspan></text><text x="1647" y="589.668" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1647" y="589.668">C2 · vigente </tspan><tspan x="1647" y="639.872">C3 · suspendido</tspan></text><circle cx="1260" cy="590" r="9" fill="#C74634" stroke="#C74634" stroke-width="2"/><line x1="1260" y1="599" x2="1260" y2="790" stroke="#C74634" stroke-width="3"/><rect x="850" y="790" width="974" height="175" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="850" y="790" width="974" height="6" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><text x="882" y="846.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="882" y="846.27">EVENTO OBSERVADO</tspan></text><text x="882" y="913.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="882" y="913.27">U7 · leer · contratos · resultado registrado</tspan></text><text x="444" y="860.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="444" y="860.59">4 · Auditar</tspan></text><path d="M438 883 H674 V862 H850" fill="none" stroke="#3C4545" stroke-width="3" stroke-linejoin="round"/></g></svg>
