<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Cuatro Controles Sobre la Misma Consulta</title><desc id="description">La misma consulta necesita controles complementarios. Autenticar comprueba quién actúa; autorizar determina si puede leer contratos; cifrar protege el contenido del canal; y auditar conserva evidencia del evento observado. El registro enlaza identidad, acción, objeto y resultado. Ninguno de estos controles sustituye la comprobación de los otros ni la finalidad acordada para usar los datos.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Cuatro Controles Sobre la Misma Consulta</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 -6)"><rect x="96" y="270" width="1728" height="454" rx="16" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><path d="M108 270 H1812 Q1824 270 1824 282 V334 H96 V282 Q96 270 108 270 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="center"><rect x="96" y="270" width="1728" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="960" y="312.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="middle"><tspan x="960" y="312.8">3 · Cifrar · protección de toda la consulta</tspan></text></g></g><text x="960" y="376.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="960" y="376.8">Contenido protegido mediante claves</tspan></text><rect x="128" y="416" width="1664" height="284" rx="16" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><path d="M140 416 H1780 Q1792 416 1792 428 V480 H128 V428 Q128 416 140 416 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="center"><rect x="128" y="416" width="576" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="416.0" y="458.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="middle"><tspan x="416.0" y="458.8">1 · Autenticar</tspan></text></g></g><g data-table-cell="header" data-cell-align="center"><rect x="704" y="416" width="1088" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1248.0" y="458.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="middle"><tspan x="1248.0" y="458.8">2 · Autorizar</tspan></text></g></g><line x1="704" y1="416" x2="704" y2="480" stroke="#FFFFFF" stroke-width="1.5" /><line x1="704" y1="480" x2="704" y2="700" stroke="#59616E" stroke-width="1.5" stroke-dasharray="8 10" /><rect x="271.1046875" y="498" width="289.790625" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="416" y="532.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="416" y="532.8">Identidad comprobada</tspan></text><circle cx="416" cy="618" r="64" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><text x="416" y="628.8" fill="#181818" font-size="25.5" font-weight="700" text-anchor="middle"><tspan x="416" y="628.8">Usuario U7</tspan></text><rect x="878.65" y="498" width="222.7" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="990" y="532.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="990" y="532.8">Acción permitida</tspan></text><rect x="814" y="586" width="352" height="64" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M826 586 H1154 Q1166 586 1166 598 V650 H814 V598 Q814 586 826 586 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="814" y="586" width="352" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="838" y="628.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="838" y="628.8">Leer contratos</tspan></text></g></g><line x1="480" y1="618" x2="814" y2="618" stroke="#59616E" stroke-width="3" /><path d="M814 618 L798.0 626.0 L798.0 610.0 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><rect x="1400" y="516" width="350" height="168" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1412 516 H1738 Q1750 516 1750 528 V580 H1400 V528 Q1400 516 1412 516 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="1400" y="516" width="350" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1424" y="558.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="1424" y="558.8">Contratos</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="1400" y="580" width="350" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1575.0" y="616.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1575.0" y="616.8">C2 · vigente</tspan></text></g></g><line x1="1400" y1="632" x2="1750" y2="632" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="center"><rect x="1400" y="632" width="350" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1575.0" y="668.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1575.0" y="668.8">C3 · suspendido</tspan></text></g></g><line x1="1166" y1="618" x2="1400" y2="618" stroke="#59616E" stroke-width="3" /><path d="M1400 618 L1384.0 626.0 L1384.0 610.0 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><rect x="886.15" y="778" width="147.7" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="960" y="812.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="960" y="812.8">4 · Auditar</tspan></text><rect x="615" y="842" width="890" height="116" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M627 842 H1493 Q1505 842 1505 854 V906 H615 V854 Q615 842 627 842 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="615" y="842" width="890" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="639" y="884.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="639" y="884.8">EVENTO OBSERVADO</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="615" y="906" width="890" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1060.0" y="942.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1060.0" y="942.8">U7 · leer · contratos · resultado registrado</tspan></text></g></g><path d="M1300 618 L1300.0 744.0 Q1300 760 1284.0 760.0 L1076.0 760.0 Q1060 760 1060.0 776.0 L1060 842" fill="none" stroke="#59616E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M1060 842 L1052.0 826.0 L1068.0 826.0 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /></g></g></svg>
