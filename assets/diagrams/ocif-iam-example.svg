<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Permisos para personas y para aplicaciones</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">La VM no necesita guardar la contraseña de Ana.</text><text x="124" y="173" font-size="22" fill="#536078" font-weight="400" text-anchor="middle">Identidad</text><text x="420" y="173" font-size="22" fill="#536078" font-weight="400" text-anchor="middle">Membresía</text><text x="917" y="173" font-size="22" fill="#536078" font-weight="400" text-anchor="middle">Permiso por política</text><use data-icon="user" href="#user" x="89" y="218" width="70" height="70" color="#4f46b8"/><text x="124" y="315" font-size="24" fill="#17243b" font-weight="400" text-anchor="middle">Ana</text><g data-layout="centered-card"><rect x="270" y="208" width="300" height="114" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><g data-card-content="true"><text x="420" y="244" font-size="25" fill="#4f46b8" font-weight="700" text-anchor="middle" dominant-baseline="central">Grupo de usuarios</text><text x="420" y="286" font-size="23" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">Observadores</text></g></g><path d="M178 265H248" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><path d="M590 265H678" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><g data-layout="centered-card"><rect x="700" y="208" width="434" height="114" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><text x="917" y="244" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle" dominant-baseline="central">Leer instancias</text><text x="917" y="286" font-size="23" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">En Producción</text></g></g><path d="M76 357L1134 357" fill="none" stroke="#dce1ec" stroke-width="1.5"/><use data-icon="server" href="#server" x="89" y="403" width="70" height="70" color="#c74436"/><text x="124" y="500" font-size="24" fill="#17243b" font-weight="400" text-anchor="middle">App en VM</text><g data-layout="centered-card"><rect x="270" y="393" width="300" height="114" rx="18" fill="url(#coral)" stroke="#c74436" stroke-width="1.5"/><g data-card-content="true"><text x="420" y="429" font-size="25" fill="#c74436" font-weight="700" text-anchor="middle" dominant-baseline="central">Dynamic group</text><text x="420" y="471" font-size="23" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">Regla sobre recursos</text></g></g><path d="M178 450H248" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><path d="M590 450H678" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><g data-layout="centered-card"><rect x="700" y="393" width="434" height="114" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><text x="917" y="429" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle" dominant-baseline="central">Leer objetos permitidos</text><text x="917" y="471" font-size="23" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">Bucket privado</text></g></g><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">La regla del dynamic group elige miembros; la política autoriza.</text></g>
