<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Transmitir una Fecha No Acuerda su Significado</title><desc id="description">Los dos sistemas aceptan el valor 01/09, pero uno lo interpreta como fecha de emisión y el otro como fecha de vencimiento. El transporte y el formato pueden ser correctos mientras el significado es incorrecto. Acuerda qué representa el campo y su interpretación en ambos extremos antes de usarlo en conciliación o indicadores.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Transmitir una Fecha No Acuerda su Significado</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 53)"><rect x="120" y="320" width="630" height="204" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M132 320 H738 Q750 320 750 332 V384 H120 V332 Q120 320 132 320 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="120" y="320" width="630" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="144" y="362.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="144" y="362.8">SISTEMA COMERCIAL</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="120" y="384" width="630" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="435.0" y="420.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="435.0" y="420.8">Factura F42</tspan></text></g></g><line x1="120" y1="436" x2="750" y2="436" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="center" data-cell-exception="Contenido de varias líneas con al menos 12 unidades de margen."><rect x="120" y="436" width="630" height="88" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="435.0" y="472.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="435.0" y="472.8">fecha_emisión </tspan><tspan x="435.0" y="508.8">01/09</tspan></text></g></g><rect x="1170" y="320" width="630" height="204" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1182 320 H1788 Q1800 320 1800 332 V384 H1170 V332 Q1170 320 1182 320 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="1170" y="320" width="630" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1194" y="362.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="1194" y="362.8">SISTEMA FINANCIERO</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="1170" y="384" width="630" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1485.0" y="420.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1485.0" y="420.8">Factura F42</tspan></text></g></g><line x1="1170" y1="436" x2="1800" y2="436" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="center" data-cell-exception="Contenido de varias líneas con al menos 12 unidades de margen."><rect x="1170" y="436" width="630" height="88" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1485.0" y="472.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1485.0" y="472.8">fecha_vencimiento </tspan><tspan x="1485.0" y="508.8">01/09</tspan></text></g></g><line x1="750" y1="454" x2="1170" y2="454" stroke="#59616E" stroke-width="3" /><path d="M1170 454 L1154.0 462.0 L1154.0 446.0 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><rect x="879.0" y="390" width="162.0" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="960" y="424.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="960" y="424.8">2026-09-01</tspan></text><rect x="120" y="674" width="750" height="116" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M132 674 H858 Q870 674 870 686 V738 H120 V686 Q120 674 132 674 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="120" y="674" width="750" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="144" y="716.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="144" y="716.8">TRANSPORTE: CORRECTO</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="120" y="738" width="750" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="495.0" y="774.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="495.0" y="774.8">Mismo valor · formato admitido</tspan></text></g></g><rect x="1050" y="674" width="750" height="116" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1062 674 H1788 Q1800 674 1800 6