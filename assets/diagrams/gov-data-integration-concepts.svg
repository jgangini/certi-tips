<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Transmitir una Fecha No Acuerda su Significado</title><desc id="description">Los dos sistemas aceptan el valor 01/09, pero uno lo interpreta como fecha de emisión y el otro como fecha de vencimiento. El transporte y el formato pueden ser correctos mientras el significado es incorrecto. Acuerda qué representa el campo y su interpretación en ambos extremos antes de usarlo en conciliación o indicadores.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Transmitir una Fecha No Acuerda su Significado</tspan></text><rect x="120" y="233" width="670" height="397" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><rect x="1130" y="233" width="670" height="397" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><text x="140" y="273.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="140" y="273.59">SISTEMA COMERCIAL</tspan></text><rect x="140" y="320" width="630" height="290" rx="0" fill="#F1EFED" stroke="#3C4545" stroke-width="3"/><rect x="140" y="320" width="630" height="6" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><g data-svgrepo-icon="document" transform="translate(180 351) scale(2.16667)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
