<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">Una capacidad compartida por dos aplicaciones</title>
  <desc id="description">La aplicación LangChain y el asistente contienen clientes MCP independientes. Cada uno solicita consultar_pedido al mismo servidor MCP, que valida acceso y consulta pedidos. Las conexiones con extremos unidos muestran ida y vuelta; el resultado vuelve al solicitante.</desc>
  <defs>
    <!-- Lucide icons, ISC. See assets/icons/LICENSE-lucide.txt. -->
    <symbol id="app-window" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 4v4M2 8h20M6 4v4"/></symbol>
    <symbol id="bot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></symbol>
    <symbol id="server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><path d="M6 6h.01M6 18h.01"/></symbol>
    <symbol id="database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5M3 12A9 3 0 0 0 21 12"/></symbol>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}
      .title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}
      .body{font-size:22px;fill:#536078}.mono{font-family:Consolas,monospace;font-size:22px;fill:#536078}
      .card{fill:#fff;stroke:#dce1eb;stroke-width:1.5}
      .connector{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .bidirectional{marker-start:url(#arrow)}.divider{stroke:#dce1eb;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#f7f8fc"/>
  <text x="56" y="64" class="title" text-anchor="start">Una capacidad compartida por dos aplicaciones</text>
  <rect x="56" y="130" width="340" height="194" rx="22" class="card"/>
  <g class="icon-badge" data-icon="app-window"><circle cx="115" cy="190" r="38" fill="#e9e6fa"/><use href="#app-window" x="93" y="168" width="44" height="44" color="#4f46b8"/></g>
  <text x="172" y="174" class="label" text-anchor="start">Host A</text>
  <text x="172" y="208" class="body" text-anchor="start">LangChain</text>
  <text x="82" y="269" class="body" text-anchor="start">Modelo + cliente MCP</text>
  <text x="82" y="303" class="body" text-anchor="start">Permisos de la aplicación</text>
  <rect x="56" y="356" width="340" height="194" rx="22" class="card"/>
  <g class="icon-badge" data-icon="bot"><circle cx="115" cy="416" r="38" fill="#fae6e1"/><use href="#bot" x="93" y="394" width="44" height="44" color="#c74436"/></g>
  <text x="172" y="400" class="label" text-anchor="start">Host B</text>
  <text x="172" y="434" class="body" text-anchor="start">Asistente</text>
  <text x="82" y="495" class="body" text-anchor="start">Modelo + cliente MCP</text>
  <text x="82" y="529" class="body" text-anchor="start">Conexión autorizada</text>
  <rect x="584" y="208" width="276" height="272" rx="22" class="card"/>
  <g class="icon-badge" data-icon="server"><circle cx="722" cy="281" r="44" fill="#e9e6fa"/><use href="#server" x="697" y="256" width="50" height="50" color="#4f46b8"/></g>
  <text x="722" y="358" class="label" text-anchor="middle">Servidor MCP</text>
  <text x="722" y="400" class="mono" text-anchor="middle">consultar_pedido</text>
  <text x="722" y="441" class="body" text-anchor="middle">Valida el acceso</text>
  <rect x="984" y="208" width="160" height="272" rx="22" class="card"/>
  <g class="icon-badge" data-icon="database"><circle cx="1064" cy="281" r="44" fill="#e1f2ee"/><use href="#database" x="1039" y="256" width="50" height="50" color="#087f7a"/></g>
  <text x="1064" y="358" class="label" text-anchor="middle">Pedidos</text>
  <text x="1064" y="400" class="mono" text-anchor="middle">P-204</text>
  <path d="M396 248H584" class="connector bidirectional"/>
  <text x="490" y="230" class="mono" text-anchor="middle">tools/call</text>
  <path d="M396 432H584" class="connector bidirectional"/>
  <text x="490" y="414" class="mono" text-anchor="middle">tools/call</text>
  <path d="M860 344H984" class="connector bidirectional"/>
  <text x="922" y="326" class="body" text-anchor="middle">Consulta</text>
  <text x="600" y="600" class="body" text-anchor="middle">El resultado vuelve al host que realizó la solicitud.</text>
</svg>
