<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title description">
<title id="title">Una capacidad compartida por dos aplicaciones</title><desc id="description">Un agente LangChain y un asistente compatible conectan sus propios clientes con un servidor MCP de pedidos. El host decide y controla las solicitudes; el servidor valida acceso y consulta pedidos. Cada host recibe el resultado para incorporar evidencia a su contexto.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff4ef"/><stop offset="1" stop-color="#f1ccc5"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f2f0ff"/><stop offset="1" stop-color="#d8d4f5"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#effaf7"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}.title{font-size:32px;font-weight:700}.label{font-size:26px;font-weight:700}.body{font-size:23px;fill:#536078}.small{font-size:21px;fill:#536078}.mono{font-family:Consolas,monospace;font-size:22px}.line{fill:none;stroke:#536078;stroke-width:2.5;marker-end:url(#arrow)}.icon{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#dce1eb;stroke-width:1.5}</style></defs>
<rect width="1200" height="610" fill="#f7f8fc"/>
<text x="56" y="64" class="title">Una capacidad compartida por dos aplicaciones</text><rect x="56" y="133" width="350" height="159" rx="22" class="card"/><rect x="56" y="341" width="350" height="159" rx="22" class="card"/><text x="84" y="183" class="label" text-anchor="start">Host A · LangChain</text><text x="84" y="229" class="small" text-anchor="start">Modelo + cliente MCP</text><text x="84" y="260" class="small" text-anchor="start">Permisos de la aplicación</text><text x="84" y="391" class="label" text-anchor="start">Host B · Asistente</text><text x="84" y="437" class="small" text-anchor="start">Modelo + cliente MCP</text><text x="84" y="468" class="small" text-anchor="start">Conexión autorizada</text><rect x="570" y="172" width="286" height="286" rx="22" class="card"/><circle cx="718" cy="253" r="47" fill="#4f46b8" opacity=".09"/><circle cx="713" cy="246" r="47" fill="url(#indigo)" stroke="#4f46b8" stroke-opacity=".15"/><g transform="translate(713 246)" class="icon" stroke="#4f46b8"><path d="M12-27a20 20 0 0 0-25 26l-20 20a8 8 0 0 0 11 11L-2 10A20 20 0 0 0 24-16L11-3-2-16Z"/></g><text x="713" y="342" class="label" text-anchor="middle">Servidor MCP</text><text x="713" y="388" class="small" text-anchor="middle">consultar_pedido</text><text x="713" y="419" class="small" text-anchor="middle">Valida identidad y acceso</text><rect x="949" y="188" width="196" height="254" rx="22" class="card"/><circle cx="1052" cy="266" r="42" fill="#087f7a" opacity=".09"/><circle cx="1047" cy="259" r="42" fill="url(#teal)" stroke="#087f7a" stroke-opacity=".15"/><g transform="translate(1047 259)" class="icon" stroke="#087f7a"><rect x="-23" y="-29" width="46" height="58" rx="6"/><path d="M-13-14h26M-13-3h20M-13 8h26M-13 19H3"/></g><text x="1047" y="349" class="label" text-anchor="middle">Pedidos</text><text x="1047" y="392" class="mono" text-anchor="middle">P-204</text><path d="M419 211H490V265H555M419 420H490V368H555M870 305H934" class="line"/><text x="486" y="171" class="small" text-anchor="middle">tools/call</text><text x="486" y="461" class="small" text-anchor="middle">tools/call</text><text x="600" y="552" class="body" text-anchor="middle">El resultado regresa al host que hizo la solicitud.</text></svg>
