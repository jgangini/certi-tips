<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Una Población Admite Varias Métricas</title><desc id="description">En el corte del 30 de septiembre, los contratos K-01, K-02 y K-03 pertenecen al mismo cliente C-17. Contar clientes distintos produce 1; contar contratos distintos produce 3. Ambas medidas pueden ser correctas, pero responden preguntas diferentes. Define población, unidad, periodo y exclusiones antes de comparar indicadores.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Una Población Admite Varias Métricas</tspan></text><text x="130" y="228.27" font-size="25.5" fill="#697778" font-weight="400" text-anchor="start"><tspan x="130" y="228.27">Corte: 30 de septiembre · Población: contratos vigentes</tspan></text><rect x="130" y="280" width="980" height="96" rx="0" fill="#EEF3F4" stroke="#C2D4D4" stroke-width="2"/><text x="150" y="323.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="150" y="323.27">Contrato</tspan></text><line x1="410" y1="280" x2="410" y2="376" stroke="#C2D4D4" stroke-width="2"/><text x="430" y="323.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="430" y="323.27">Cliente</tspan></text><line x1="690" y1="280" x2="690" y2="376" stroke="#C2D4D4" stroke-width="2"/><text x="710" y="323.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="710" y="323.27">Estado</tspan></text><rect x="130" y="376" width="980" height="96" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><text x="150" y="419.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="150" y="419.27">K-01</tspan></text><line x1="410" y1="376" x2="410" y2="472" stroke="#C2D4D4" stroke-width="2"/><text x="430" y="419.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="430" y="419.27">C-17</tspan></text><line x1="690" y1="376" x2="690" y2="472" stroke="#C2D4D4" stroke-width="2"/><text x="710" y="419.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="710" y="419.27">Vigente</tspan></text><rect x="130" y="472" width="980" height="96" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><text x="150" y="515.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="150" y="515.27">K-02</tspan></text><line x1="410" y1="472" x2="410" y2="568" stroke="#C2D4D4" stroke-width="2"/><text x="430" y="515.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="430" y="515.27">C-17</tspan></text><line x1="690" y1="472" x2="690" y2="568" stroke="#C2D4D4" stroke-width="2"/><text x="710" y="515.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="710" y="515.27">Vigente</tspan></text><rect x="130" y="568" width="980" height="96" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><text x="150" y="611.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="150" y="611.27">K-03</tspan></text><line x1="410" y1="568" x2="410" y2="664" stroke="#C2D4D4" stroke-width="2"/><text x="430" y="611.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="430" y="611.27">C-17</tspan></text><line x1="690" y1="568" x2="690" y2="664" stroke="#C2D4D4" stroke-width="2"/><text x="710" y="611.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="710" y="611.27">Vigente</tspan></text><path d="M150 713 V723 H1070 V713" fill="none" stroke="#3C4545" stroke-width="3" stroke-linejoin="round"/><text x="610.0" y="765.27" font-size="25.5" fil