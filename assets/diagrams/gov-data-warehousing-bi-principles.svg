<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Una Población Admite Varias Métricas</title><desc id="description">En el corte del 30 de septiembre, los contratos K-01, K-02 y K-03 pertenecen al mismo cliente C-17. Contar clientes distintos produce 1; contar contratos distintos produce 3. Ambas medidas pueden ser correctas, pero responden preguntas diferentes. Define población, unidad, periodo y exclusiones antes de comparar indicadores.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Una Población Admite Varias Métricas</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" transform="translate(-10.000 40.968)" data-center="960 608"><text x="130" y="228.27" font-size="25.5" fill="#697778" font-weight="400" text-anchor="start"><tspan x="130" y="228.27">Corte: 30 de septiembre · Población: contratos vigentes</tspan></text><rect x="130" y="280" width="980" height="96" rx="0" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><path d="M142.0 280.0 H1098.0 Q1110.0 280.0 1110.0 292.0 V376.0 H130.0 V292.0 Q130.0 280.0 142.0 280.0 Z" fill="#59616E" stroke="none" data-table-header="true" /><text x="270.0" y="337.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="270.0" y="337.5">Contrato</tspan></text><line x1="410" y1="280" x2="410" y2="376" stroke="#59616E" stroke-width="2" /><text x="550.0" y="337.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="550.0" y="337.5">Cliente</tspan></text><line x1="690" y1="280" x2="690" y2="376" stroke="#59616E" stroke-width="2" /><text x="900.0" y="337.5" f