<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="grounded-arithmetic">
<title id="title">De una política a una respuesta comprobable</title>
<desc id="description">Se recupera una política de 90 días; con entrega hace 35 días, 90 menos 35 da 55 días restantes, si no hay otras condiciones. La respuesta cita la política y se revisa.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v14H8l-5 5zM7 7h10M7 11h7"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">De una política a una respuesta comprobable</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">La revisión preventiva se incluye durante 90 días desde la entrega.</text><rect x="87" y="208" width="240" height="201" rx="12" fill="#e9eaf1" stroke="none" stroke-width="1.5"/><rect x="79" y="201" width="240" height="201" rx="12" fill="#fff" stroke="#087f7a" stroke-width="1.5"/><path d="M99 239L299 239" fill="none" stroke="#087f7a" stroke-width="3"/><path d="M99 262L299 262" fill="none" stroke="#087f7a" stroke-width="3"/><path d="M99 285L281 285" fill="none" stroke="#087f7a" stroke-width="3"/><text x="199" y="448" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Política vigente [1]</text><rect x="104" y="318" width="189" height="42" rx="21" fill="url(#teal)" stroke="none" stroke-width="1.5"/><text x="198.5" y="346" font-size="21" fill="#087f7a" font-weight="600" text-anchor="middle">90 días</text><path d="M336 306H486" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><rect x="509" y="211" width="263" height="190" rx="20" fill="#fff" stroke="#4f46b8" stroke-width="1.5"/><text x="640" y="255" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Datos del equipo</text><text x="640" y="301" font-size="22" fill="#536078" font-weight="400" text-anchor="middle">Entregado hace 35 días</text><text x="640" y="365" font-size="33" fill="#4f46b8" font-weight="700" text-anchor="middle">90 − 35 = 55</text><path d="M787 306H867" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><g data-concept="Respuesta revisada"><circle cx="1006" cy="313" r="67" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="1006" cy="306" r="67" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="chat" href="#chat" x="969.82" y="269.82" width="72.36" height="72.36" color="#087f7a"/><text x="1006" y="416" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Respuesta revisada</text><text x="1006" y="451" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">«Quedan 55 días</text><text x="1006" y="483" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">del periodo [1]»</text></g><text x="640" y="471" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Si no hay otras condiciones</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Verifica la fecha, el cálculo y que la cita respalde la afirmación.</text></g>
</svg>
