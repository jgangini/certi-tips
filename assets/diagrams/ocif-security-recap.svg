<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Defensa en profundidad alrededor de los datos</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Asigna una finalidad concreta a cada control.</text><rect x="73" y="158" width="1053" height="63" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><g data-layout="icon-label" data-axis="horizontal"><g data-artwork="true"><use data-icon="user" href="#user" x="92.5" y="172" width="35" height="35" color="#4f46b8"/></g><text x="145" y="189.5" font-size="24" fill="#4f46b8" font-weight="700" text-anchor="start" dominant-baseline="central">IAM</text></g><text x="747" y="189.5" font-size="24" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">Quién puede actuar</text><rect x="73" y="234" width="1053" height="63" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-layout="icon-label" data-axis="horizontal"><g data-artwork="true"><use data-icon="network" href="#network" x="92.5" y="248" width="35" height="35" color="#087f7a"/></g><text x="145" y="265.5" font-size="24" fill="#087f7a" font-weight="700" text-anchor="start" dominant-baseline="central">Red</text></g><text x="747" y="265.5" font-size="24" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">Qué tráfico se permite</text><rect x="73" y="310" width="1053" height="63" rx="18" fill="url(#coral)" stroke="#c74436" stroke-width="1.5"/><g data-layout="icon-label" data-axis="horizontal"><g data-artwork="true"><use data-icon="code" href="#code" x="92.5" y="324" width="35" height="35" color="#c74436"/></g><text x="145" y="341.5" font-size="24" fill="#c74436" font-weight="700" text-anchor="start" dominant-baseline="central">Aplicación</text></g><text x="747" y="341.5" font-size="24" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">Validar solicitudes</text><rect x="73" y="386" width="1053" height="63" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><g data-layout="icon-label" data-axis="horizontal"><g data-artwork="true"><use data-icon="lock" href="#lock" x="92.5" y="400" width="35" height="35" color="#4f46b8"/></g><text x="145" y="417.5" font-size="24" fill="#4f46b8" font-weight="700" text-anchor="start" dominant-baseline="central">Cifrado</text></g><text x="747" y="417.5" font-size="24" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">Proteger información</text><rect x="73" y="462" width="1053" height="63" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-layout="icon-label" data-axis="horizontal"><g data-artwork="true"><use data-icon="eye" href="#eye" x="92.5" y="476" width="35" height="35" color="#087f7a"/></g><text x="145" y="493.5" font-size="24" fill="#087f7a" font-weight="700" text-anchor="start" dominant-baseline="central">Observación</text></g><text x="747" y="493.5" font-size="24" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">Detectar e investigar</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Las capas se complementan; ninguna reemplaza todas las demás.</text></g>
