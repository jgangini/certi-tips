<desc id="description">El servicio correcto depende de la operación</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v14H8l-5 5zM7 7h10M7 11h7"/></symbol><symbol id="search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="m15 15 7 7"/></symbol><symbol id="table" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 9h20M2 15h20M9 3v18M16 9v12"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">El servicio correcto depende de la operación</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Estas capacidades pueden colaborar dentro de una misma aplicación.</text><g data-concept="Generative AI"><circle cx="215" cy="292" r="72" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="215" cy="285" r="72" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="chat" href="#chat" x="176.12" y="246.12" width="77.76" height="77.76" color="#c74436"/><text x="215" y="400" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Generative AI</text><text x="215" y="435" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Generar una respuesta</text><text x="215" y="467" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">con un modelo gestionado</text></g><g data-concept="AI Vector Search"><circle cx="600" cy="292" r="72" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="600" cy="285" r="72" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="search" href="#search" x="561.12" y="246.12" width="77.76" height="77.76" color="#4f46b8"/><text x="600" y="400" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">AI Vector Search</text><text x="600" y="435" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Encontrar contenido</text><text x="600" y="467" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">por cercanía semántica</text></g><g data-concept="Select AI"><circle cx="985" cy="292" r="72" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="985" cy="285" r="72" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="table" href="#table" x="946.12" y="246.12" width="77.76" height="77.76" color="#087f7a"/><text x="985" y="400" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Select AI</text><text x="985" y="435" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Consultar tablas</text><text x="985" y="467" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">desde lenguaje natural</text></g><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Primero nombra la operación: generar, recuperar o consultar.</text></g>
