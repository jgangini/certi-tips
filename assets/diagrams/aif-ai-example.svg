<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="multimodal-case">
<title id="title">Del reclamo a una respuesta con fundamento</title>
<desc id="description">Mensaje, foto y audio se analizan. Los datos extraídos se combinan con una política para redactar una respuesta, que requiere revisión antes de aprobar acciones.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v14H8l-5 5zM7 7h10M7 11h7"/></symbol><symbol id="image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><circle cx="8" cy="8" r="2"/><path d="m3 18 6-6 4 4 4-5 5 7"/></symbol><symbol id="wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10v4m4-8v12m4-16v20m4-15v10m4-13v16m4-10v4"/></symbol><symbol id="filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h20l-8 9v8l-4 2V12Z"/></symbol><symbol id="user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Del reclamo a una respuesta con fundamento</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Caso: «El equipo vuelve a apagarse», con foto y grabación.</text><text x="187" y="180" font-size="26" fill="#17243b" font-weight="700" text-anchor="middle">Un caso, tres entradas</text><circle cx="106" cy="263" r="39" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="106" cy="256" r="39" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="chat" href="#chat" x="84.94" y="234.94" width="42.120000000000005" height="42.120000000000005" color="#c74436"/><circle cx="185" cy="343" r="39" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="185" cy="336" r="39" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="image" href="#image" x="163.94" y="314.94" width="42.120000000000005" height="42.120000000000005" color="#c74436"/><circle cx="106" cy="423" r="39" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="106" cy="416" r="39" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="wave" href="#wave" x="84.94" y="394.94" width="42.120000000000005" height="42.120000000000005" color="#c74436"/><path d="M238 336H323" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><g data-concept="Extraer"><circle cx="423" cy="343" r="67" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="423" cy="336" r="67" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="filter" href="#filter" x="386.82" y="299.82" width="72.36" height="72.36" color="#4f46b8"/><text x="423" y="446" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Extraer</text><text x="423" y="481" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Transcribir audio</text><text x="423" y="513" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">y localizar la pieza</text></g><path d="M501 336H686" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><rect x="562" y="171" width="109" height="116" rx="12" fill="#e9eaf1" stroke="none" stroke-width="1.5"/><rect x="554" y="164" width="109" height="116" rx="12" fill="#fff" stroke="#087f7a" stroke-width="1.5"/><path d="M574 202L643 202" fill="none" stroke="#087f7a" stroke-width="3"/><path d="M574 225L643 225" fill="none" stroke="#087f7a" stroke-width="3"/><text x="608.5" y="263" font-size="19" fill="#087f7a" font-weight="600" text-anchor="middle">Política</text><path d="M666 224Q776 224 776 254" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><g data-concept="Redactar"><circle cx="776" cy="343" r="67" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="776" cy="336" r="67" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="chat" href="#chat" x="739.82" y="299.82" width="72.36" height="72.36" color="#087f7a"/><text x="776" y="446" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Redactar</text><text x="776" y="481" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Explicar con datos</text><text x="776" y="513" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">y política verificada</text></g><path d="M853 336H944" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><g data-concept="Revisar"><circle cx="1040" cy="343" r="67" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="1040" cy="336" r="67" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="user" href="#user" x="1003.82" y="299.82" width="72.36" height="72.36" color="#c74436"/><text x="1040" y="446" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Revisar</text><text x="1040" y="481" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Resolver dudas</text><text x="1040" y="513" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">antes de actuar</text></g><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Una respuesta redactada no equivale a una garantía aprobada.</text></g>
</svg>
