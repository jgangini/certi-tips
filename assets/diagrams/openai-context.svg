<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Tres estrategias para aportar contexto a Responses</title>
  <desc id="description">En el historial propio, tu aplicación conserva y envía mensajes relevantes. En la cadena de respuestas, conservas el identificador de la respuesta anterior y lo envías con la nueva entrada. En Conversations, el servicio conserva elementos de una conversación y tu aplicación referencia su identificador. Ninguna estrategia elimina límites de contexto, costos o decisiones de retención.</desc>
  <!-- Lucide messages-square and database; linked response cards are native SVG. License: ../icons/LICENSE-lucide.txt -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m2 2 6 3-6 3" fill="none" stroke="#536078" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b;font-size:22px}.h{font-size:34px;font-weight:700}.label{font-size:25px;font-weight:700}.muted{fill:#536078}.small{font-size:20px}.line{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.icon{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="1200" height="720" fill="#f7f8fc"/><text x="56" y="62" class="h">El siguiente turno necesita contexto: elige cómo enviarlo</text>
  <text x="56" y="102" class="muted">Mismo caso: «Mi pedido es P-204» → «¿Cuándo llega?»</text>
  <g fill="#fff" stroke="#dce1ec"><rect x="56" y="138" width="344" height="486" rx="22"/><rect x="428" y="138" width="344" height="486" rx="22"/><rect x="800" y="138" width="344" height="486" rx="22"/></g>
  <g text-anchor="middle">
    <circle cx="228" cy="201" r="36" fill="#fae6e1"/><circle cx="600" cy="201" r="36" fill="#e9e6fa"/><circle cx="972" cy="201" r="36" fill="#e1f2ee"/>
    <text x="228" y="274" class="label">Historial propio</text><text x="600" y="274" class="label">Cadena de respuestas</text><text x="972" y="274" class="label">Conversations</text>
  </g>
  <g data-icon="messages-square" transform="translate(206 179) scale(1.83)" class="icon" stroke="#c74436"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2zM20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"/></g>
  <g fill="none" stroke="#4f46b8" stroke-width="3" stroke-linecap="round"><rect x="579" y="183" width="22" height="18" rx="5"/><rect x="599" y="203" width="22" height="18" rx="5"/><path d="m595 197 11 11"/></g>
  <g data-icon="database" transform="translate(950 179) scale(1.83)" fill="none" stroke="#087f7a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5M3 12A9 3 0 0 0 21 12"/></g>
  <text x="80" y="320" font-weight="700">Quién conserva el contexto</text><text x="80" y="355" class="muted">Tu aplicación guarda</text><text x="80" y="387" class="muted">y selecciona los mensajes.</text>
  <text x="452" y="320" font-weight="700">Qué referencia tu aplicación</text><text x="452" y="355" class="muted">El ID de la respuesta</text><text x="452" y="387" class="muted">previa conservada.</text>
  <text x="824" y="320" font-weight="700">Quién conserva el contexto</text><text x="824" y="355" class="muted">El servicio conserva los</text><text x="824" y="387" class="muted">elementos de la conversación.</text>
  <path d="M228 408V450" class="line"/><path d="M600 408V450" class="line"/><path d="M972 408V450" class="line"/>
  <rect x="80" y="450" width="296" height="146" rx="16" fill="#fae6e1"/><rect x="452" y="450" width="296" height="146" rx="16" fill="#e9e6fa"/><rect x="824" y="450" width="296" height="146" rx="16" fill="#e1f2ee"/>
  <g text-anchor="middle"><text x="228" y="484" font-weight="700">En el siguiente turno</text><text x="228" y="525">Mensajes relevantes</text><text x="228" y="559">+ nueva entrada</text><text x="600" y="484" font-weight="700">En el siguiente turno</text><text x="600" y="525" class="small">previous_response_id</text><text x="600" y="559">+ nueva entrada</text><text x="972" y="484" font-weight="700">En el siguiente turno</text><text x="972" y="525">ID de conversación</text><text x="972" y="559">+ nueva entrada</text></g>
  <text x="600" y="675" text-anchor="middle" class="muted">Comprueba límites de contexto, costos y política de retención en las tres opciones.</text>
</svg>
