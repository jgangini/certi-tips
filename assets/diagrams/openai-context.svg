<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title description">
  <title id="title">Tres estrategias para aportar contexto a Responses</title>
  <desc id="description">La aplicación puede enviar el historial necesario, enlazar una respuesta anterior mediante previous_response_id o usar una conversación. Son estrategias diferentes de continuidad; ninguna elimina el límite de contexto o los costos.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#536078" stroke-width="1.6"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b;font-size:22px}.h{font-size:34px;font-weight:700}.label{font-size:25px;font-weight:700}.muted{fill:#536078}.line{fill:none;stroke:#536078;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="570" fill="#f7f8fc"/><text x="56" y="65" class="h">¿Cómo llega el contexto al siguiente turno?</text>
  <g fill="#fff" stroke="#dce1ec"><rect x="56" y="118" width="344" height="382" rx="24"/><rect x="428" y="118" width="344" height="382" rx="24"/><rect x="800" y="118" width="344" height="382" rx="24"/></g>
  <g text-anchor="middle"><text x="228" y="167" class="label">Historial propio</text><text x="600" y="167" class="label">Cadena de respuestas</text><text x="972" y="167" class="label">Conversations</text></g>
  <rect x="99" y="207" width="258" height="48" rx="12" fill="#fae6e1"/><rect x="115" y="266" width="242" height="48" rx="12" fill="#e9e6fa"/>
  <text x="120" y="239">Usuario: pedido P-204</text><text x="132" y="298">Respuesta anterior</text><path d="M228 326v36" class="line"/><rect x="99" y="376" width="258" height="52" rx="13" fill="#17243b"/><text x="228" y="410" text-anchor="middle" style="fill:#fff">Nueva solicitud</text><text x="228" y="469" text-anchor="middle" class="muted">Tu código elige qué enviar</text>
  <rect x="482" y="218" width="236" height="66" rx="15" fill="#e9e6fa"/><text x="600" y="259" text-anchor="middle">Respuesta A · id</text><path d="M600 297v56" class="line"/><rect x="466" y="369" width="268" height="60" rx="15" fill="#e1f2ee"/><text x="600" y="407" text-anchor="middle">Nueva entrada + id de A</text><text x="600" y="469" text-anchor="middle" class="muted">previous_response_id</text>
  <path d="M853 239v154q119 47 238 0V239" fill="#e1f2ee" stroke="#9fccc6" stroke-width="2"/><ellipse cx="972" cy="239" rx="119" ry="32" fill="#eef9f6" stroke="#9fccc6" stroke-width="2"/>
  <text x="972" y="247" text-anchor="middle">conversation.id</text><text x="972" y="311" text-anchor="middle">Entradas y salidas</text><text x="972" y="350" text-anchor="middle">de la conversación</text><text x="972" y="469" text-anchor="middle" class="muted">Referencia a sus elementos</text>
</svg>
