<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Completar Antes de Autorizar</title><desc id="description">En Horizonte, un asistente solicita acceso completo al historial de clientes, pero aún no se han definido el propósito ni los datos mínimos. La ruta «No» devuelve la solicitud para precisar propósito, alcance y vigencia. Cuando el alcance está completo, el propietario evalúa y aprueba el uso; el custodio aplica los permisos autorizados y se acuerda una revisión. La autorización debe registrar esas condiciones para comprobar que el acceso corresponde al uso aprobado.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Completar Antes de Autorizar</tspan></text><defs><clipPath id="request-card"><rect x="232" y="361" width="440" height="294" rx="12"/></clipPath><clipPath id="decision-card"><rect x="1248" y="387" width="440" height="242" rx="12"/></clipPath></defs><g data-exercise-layout="flow"><g data-exercise-card="request-card"><g clip-path="url(#request-card)"><rect x="232" y="361" width="440" height="294" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="232" y="361" width="440" height="86" rx="0" fill="#59616E" stroke="none" stroke-width="2"/><text x="264" y="414.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="264" y="414.8">Solicitud del Asistente</tspan></text><text x="256" y="483.8" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="256" y="483.8">Historial de clientes</tspan></text><line x1="256" y1="499" x2="648" y2="499" stroke="#59616E" stroke-width="1.5"/><line x1="436" y1="499" x2="436" y2="655" stroke="#59616E" stroke-width="1.5"/><g data-exercise-row="0" data-row-top="499" data-row-bottom="551"><text x="256" y="535.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="256" y="535.8">Propósito</tspan></text><text x="448" y="535.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="448" y="535.8">Sin definir</tspan></text></g><line x1="256" y1="551" x2="648" y2="551" stroke="#59616E" stroke-width="1.5"/><g data-exercise-row="1" data-row-top="551" data-row-bottom="603"><text x="256" y="587.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="256" y="587.8">Datos mínimos</tspan></text><text x="448" y="587.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="448" y="587.8">Sin definir</tspan></text></g><line x1="256" y1="603" x2="648" y2="603" stroke="#59616E" stroke-width="1.5"/><g data-exercise-row="2" data-row-top="603" data-row-bottom="655"><text x="256" y="639.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="256" y="639.8">Petición</tspan></text><text x="448" y="639.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="448" y="639.8">Acceso completo</tspan></text></g></g><rect x="232" y="361" width="440" height="294" rx="12" fill="none" stroke="#59616E" stroke-width="2"/></g><g data-exercise-card="decision-card"><g clip-path="url(#decision-card)"><rect x="1248" y="387" width="440" height="242" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="1248" y="387" width="440" height="86" rx="0" fill="#59616E" stroke="none" stroke-width="2"/><text x="1280" y="440.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="1280" y="440.8">Decisión Registrada</tspan></text><g data-exercise-row="0" data-row-top="473" data-row-bottom="525"><text x="1280" y="509.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1280" y="509.8">Propietario aprueba</tspan></text></g><line x1="1272" y1="525" x2="1664" y2="525" stroke="#59616E" stroke-width="1.5"/><g data-exercise-row="1" data-row-top="525" data-row-bottom="577"><text x="1280" y="561.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1280" y="561.8">Custodio aplica</tspan></text></g><line x1="1272" y1="577" x2="1664" y2="577" stroke="#59616E" stroke-width="1.5"/><g data-exercise-row="2" data-row-top="577" data-row-bottom="629"><text x="1280" y="613.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1280" y="613.8">Revisión acordada</tspan></text></g></g><rect x="1248" y="387" width="440" height="242" rx="12" fill="none" stroke="#59616E" stroke-width="2"/></g><path d="M960.0 412 L1104 508.0 L960.0 604 L816 508.0 Z" fill="#FFFFFF" stroke="#59616E" stroke-width="3" stroke-linejoin="round"/><text x="960" y="498.8" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="960" y="498.8">¿Alcance </tspan><tspan x="960" y="538.8">Completo?</tspan></text><line x1="672" y1="508" x2="816" y2="508" stroke="#59616E" stroke-width="3"/><path d="M816 508 L800 516 L800 500 Z" fill="#59616E" stroke="#59616E" stroke-width="1" stroke-linejoin="round"/><line x1="1104" y1="508" x2="1248" y2="508" stroke="#59616E" stroke-width="3"/><path d="M1248 508 L1232 516 L1232 500 Z" fill="#59616E" stroke="#59616E" stroke-width="1" stroke-linejoin="round"/><text x="1175" y="498" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1175" y="498">Sí</tspan></text><path data-exercise-route="no" d="M960 604 V742 A16 16 0 0 1 944 758 H496 A16 16 0 0 1 480 742 V655" fill="none" stroke="#C74634" stroke-width="3" stroke-linejoin="round"/><path d="M480 655 L488 671 L472 671 Z" fill="#C74634" stroke="#C74634" stroke-width="1" stroke-linejoin="round"/><text x="968" y="691.8" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="968" y="691.8">No</tspan></text><g data-exercise-caption="complete-request"><text x="720" y="794.8" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="middle"><tspan x="720" y="794.8">Completar propósito, alcance y vigencia</tspan></text></g></g></g></svg>
