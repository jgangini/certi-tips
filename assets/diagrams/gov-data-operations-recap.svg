<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Del Incidente a la Prevención</title><desc id="description">La ausencia de P2 inicia cuatro pasos: detectar la carga incompleta, contener el impacto conservando la versión anterior, recuperar y conciliar la partición, y prevenir la repetición mediante el contrato del productor. Conserva el resultado de los controles, la fecha visible y la aceptación de datos. Una prueba posterior permite comprobar que la mejora funciona en la siguiente ejecución.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Del Incidente a la Prevención</tspan></text><line x1="300" y1="598" x2="1620" y2="598" stroke="#3C4545" stroke-width="4"/><circle cx="300" cy="598" r="14" fill="#C74634" stroke="#C74634" stroke-width="2"/><text x="300" y="690.75" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="300" y="690.75">Detectar</tspan></text><circle cx="740" cy="598" r="14" fill="#C74634" stroke="#C74634" stroke-width="2"/><text x="740" y="690.75" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="740" y="690.75">Contener</tspan></text><circle cx="1180" cy="598" r="14" fill="#C74634" stroke="#C74634" stroke-width="2"/><text x="1180" y="690.75" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1180" y="690.75">Recuperar</tspan></text><circle cx="1620" cy="598" r="14" fill="#C74634" stroke="#C74634" stroke-width="2"/><text x="1620" y="690.75" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1620" y="690.75">Prevenir</tspan></text><path d="M164 301 H436 V471 H164 Z" fill="none" stroke="#C74634" stroke-width="3" stroke-linejoin="round" stroke-dasharray="12 10"/><text x="300" y="365.55" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="middle"><tspan x="300" y="365.55">P2</tspan></text><text x="300" y="425.59" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="middle"><tspan x="300" y="425.59">Ausente</tspan></text><rect x="604" y="301" width="272" height="170" rx="0" fill="#EEF3F4" stroke="#3C4545" stroke-width="3"/><rect x="604" y="301" width="272" height="6" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><text x="740" y="366.611" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="740" y="366.611">Versión </tspan><tspan x="740" y="405.569">anterior</tspan></text><rect x="1044" y="301" width="272" height="170" rx="0" fill="#EEF3EC" stroke="#3C4545" stroke-width="3"/><rect x="1044" y="301" width="272" height="6" rx="0" fill="#749B6B" stroke="none" stroke-width="2"/><text x="1180" y="365.55" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1180" y="365.55">P2</tspan></text><text x="1180" y="427.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1180" y="427.27">Reconciliada</tspan></text><rect x="1484" y="275" width="272" height="220" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="1484" y="275" width="272" height="6" rx="0" fill="#C06D30" stroke="none" stroke-width="2"/><text x="1620" y="333.637" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1620" y="333.637">Contrato </tspan><tspan x="1620" y="367.903">del productor</tspan></text><line x1="1510" y1="404" x2="1730" y2="404" stroke="#C74634" stroke-width="4"/><text x="1620" y="449.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1620" y="449.27">P2 requerida</tspan></text><line x1="300" y1="471" x2="300" y2="584" stroke="#3C4545" stroke-width="3"/><line x1="740" y1="471" x2="740" y2="584" stroke="#3C4545" stroke-width="3"/><line x1="1180" y1="471" x2="1180" y2="584" stroke="#3C4545" stroke-width="3"/><line x1="1620" y1="495" x2="1620" y2="584" stroke="#3C4545" stroke-width="3"/><rect x="115" y="756" width="370" height="113" rx="0" fill="none" stroke="#697778" stroke-width="2"/><line x1="300" y1="718" x2="300" y2="756" stroke="#3C4545" stroke-width="3"/><rect x="555" y="756" width="370" height="113" rx="0" fill="none" stroke="#697778" stroke-width="2"/><line x1="740" y1="718" x2="740" y2="756" stroke="#3C4545" stroke-width="3"/><rect x="995" y="756" width="370" height="113" rx="0" fill="none" stroke="#697778" stroke-width="2"/><line x1="1180" y1="718" x2="1180" y2="756" stroke="#3C4545" stroke-width="3"/><rect x="1435" y="756" width="370" height="113" rx="0" fill="none" stroke="#697778" stroke-width="2"/><line x1="1620" y1="718" x2="1620" y2="756" stroke="#3C4545" stroke-width="3"/><text x="300" y="804.43" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="300" y="804.43">Resultado del </tspan><tspan x="300" y="837.07">control</tspan></text><text x="740" y="800.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="740" y="800.27">Fecha visible</tspan></text><text x="1180" y="800.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1180" y="800.27">Aceptación de datos</tspan></text><text x="1620" y="800.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1620" y="800.27">Prueba posterior</tspan></text></g></svg>
