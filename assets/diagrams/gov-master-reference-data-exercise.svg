<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-design-audit="08-11-compact"><title id="title">Un Hogar Compartido No Borra Dos Identidades</title><desc id="description">Dos clientes comparten hogar, pero tienen identificaciones verificadas distintas, facturas y consentimientos propios. La relación de hogar no justifica fusionar sus identidades. Conserva ambas y registra la candidatura rechazada con su evidencia. El propietario resuelve la política aplicable, sin trasladar el consentimiento de una persona a la otra.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Un Hogar Compartido No Borra Dos Identidades</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 50)"><rect x="840.0" y="240" width="240" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="960" y="274.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="960" y="274.8">Hogar compartido</tspan></text><path d="M840 288 L496.0 288.0 Q480 288 480.0 304.0 L480 400" fill="none" stroke="#59616E" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 10" /><path d="M480 400 L472.0 384.0 L488.0 384.0 Z" fill="#59616E" /><path d="M1080 288 L1424.0 288.0 Q1440 288 1440.0 304.0 L1440 400" fill="none" stroke="#59616E" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 10" /><path d="M1440 400 L1432.0 384.0 L1448.0 384.0 Z" fill="#59616E" /><rect x="180" y="400" width="600" height="118" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" 