<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Un Hogar Compartido No Borra Dos Identidades</title><desc id="description">Dos clientes comparten hogar, pero tienen identificaciones verificadas distintas, facturas y consentimientos propios. La relación de hogar no justifica fusionar sus identidades. Conserva ambas y registra la candidatura rechazada con su evidencia. El propietario resuelve la política aplicable, sin trasladar el consentimiento de una persona a la otra.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Un Hogar Compartido No Borra Dos Identidades</tspan></text><ellipse cx="960" cy="363" rx="170" ry="110" fill="#EEF3F4" stroke="#3C4545" stroke-width="3"/><text x="960" y="358.31" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="960" y="358.31">Hogar </tspan><tspan x="960" y="390.95">compartido</tspan></text><line x1="806" y1="410" x2="540" y2="540" stroke="#697778" stroke-width="3" stroke-dasharray="12 8"/><line x1="1114" y1="410" x2="1380" y2="540" stroke="#697778" stroke-width="3" stroke-dasharray="12 8"/><rect x="180" y="540" width="550" height="150" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="180" y="540" width="550" height="6" rx="0" fill="#749B6B" stroke="none" stroke-width="2"/><g data-person-icon="user-supplied" transform="translate(208 566) scale(2.875)" fill="#3C4545"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"/><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z"/></g><text x="455" y="590.07" font-size="25.5" fi