<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Un Hogar Compartido No Borra Dos Identidades</title><desc id="description">Dos clientes comparten hogar, pero tienen identificaciones verificadas distintas, facturas y consentimientos propios. La relación de hogar no justifica fusionar sus identidades. Conserva ambas y registra la candidatura rechazada con su evidencia. El propietario resuelve la política aplicable, sin trasladar el consentimiento de una persona a la otra.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Un Hogar Compartido No Borra Dos Identidades</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" transform="translate(0.000 -23.500)" data-center="960 608"><ellipse cx="960" cy="363" rx="170" ry="110" fill="#FFFFFF" stroke="#3C4545" stroke-width="3" /><rect x="840.397" y="340.81" width="239.206" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="960.0" y="375.31" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="960.0" y="375.31">Hogar compartido</tspan></text><line x1="806" y1="410" x2="540" y2="540" stroke="#59616E" stroke-width="3" stroke-dasharray="12 8" /><line x1="1114" y1="410" x2="1380" y2="540" stroke="#59616E" stroke-width="3" stroke-dasharray="12 8" /><rect x="180" y="540" width="550" height="150" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M192.0 540.0 H718.0 Q730.0 540.0 730.0 552.0 V612.0 H180.0 V552.0 Q180.0 540.0 192.0 540.0 Z" fill="#59616E" stroke="none" data-table-header="true" /