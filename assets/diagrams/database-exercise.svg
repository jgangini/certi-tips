  <path d="M738 392v81h140" fill="none" stroke="#c74436" stroke-width="2.5" stroke-dasharray="7 6"/>
  <circle cx="899" cy="473" r="21" fill="#fae6e2" stroke="#c74436" stroke-width="2"/><path d="m890 464 18 18m0-18-18 18" stroke="#c74436" stroke-width="3"/>
  <text x="940" y="465" class="label">Modificar stock</text><text x="940" y="499" class="body">No autorizado</text>
