<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Del Significado a las Claves</title><desc id="description">La regla «un cliente puede tener varios contratos» pasa de una relación de negocio a dos estructuras. CLIENTE usa id_cliente como clave; CONTRATO usa id_contrato y conserva id_cliente como referencia. La clave identifica cada entidad y la referencia enlaza ambas. Diseña las estructuras a partir del significado acordado, antes de decidir cómo almacenarlas.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Del Significado a las Claves</tspan></text><text x="960" y="245.39" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="960" y="245.39">«Un cliente puede tener varios contratos»</tspan></text><line x1="284" y1="293" x2="1636" y2="293" stroke="#C74634" stroke-width="4"/><circle cx="538" cy="438" r="108" fill="#EEF3F4" stroke="#3C4545" stroke-width="3"/><text x="538" y="444.75" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="538" y="444.75">Cliente</tspan></text><circle cx="1382" cy="438" r="108" fill="#EEF3EC" stroke="#3C4545" stroke-width="3"/><text x="1382" y="444.75" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1382" y="444.75">Contrato</tspan></text><line x1="646" y1="438" x2="1274" y2="438" stroke="#3C4545" stroke-width="4"/><text x="699" y="405.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="699" y="405.59">1</tspan></text><text x="1200" y="405.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1200" y="405.59">N</tspan></text><text x="960" y="491.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="960" y="491.27">Tiene</tspan></text><rect x="216" y="652" width="644" height="260" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="216" y="652" width="644" height="104" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="216" y="652" width="644" height="6" rx="0" fill="#2E5C70" stroke="none" stroke-width="2"/><text x="248" y="714.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="248" y="714.59">CLIENTE</tspan></text><text x="248" y="803.59" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="start"><tspan x="248" y="803.59">id_cliente · clave</tspan></text><text x="248" y="881.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="248" y="881.59">nombre</tspan></text><line x1="216" y1="834" x2="860" y2="834" stroke="#C2D4D4" stroke-width="2"/><rect x="1060" y="652" width="644" height="338" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="1060" y="652" width="644" height="104" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="1060" y="652" width="644" height="6" rx="0" fill="#2E5C70" stroke="none" stroke-width="2"/><text x="1092" y="714.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1092" y="714.59">CONTRATO</tspan></text><text x="1092" y="803.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1092" y="803.59">id_contrato · clave</tspan></text><text x="1092" y="881.59" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="start"><tspan x="1092" y="881.59">id_cliente · referencia</tspan></text><line x1="1060" y1="834" x2="1704" y2="834" stroke="#C2D4D4" stroke-width="2"/><text x="1092" y="959.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1092" y="959.59">estado</tspan></text><line x1="1060" y1="912" x2="1704" y2="912" stroke="#C2D4D4" stroke-width="2"/><line x1="538" y1="546" x2="538" y2="652" stroke="#3C4545" stroke-width="4"/><path d="M538 652 L530 636 L546 636 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><line x1="1382" y1="546" x2="1382" y2="652" stroke="#3C4545" stroke-width="4"/><path d="M1382 652 L1374 636 L1390 636 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/></g></svg>
