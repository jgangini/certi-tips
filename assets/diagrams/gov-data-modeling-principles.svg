<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Del Significado al Modelo Lógico</title><desc id="description">La regla «un cliente puede tener varios contratos» se representa como una relación 1 a N. En el modelo lógico, CLIENTE.id_cliente es la clave primaria. CONTRATO tiene su propia clave primaria, id_contrato, y usa id_cliente como clave foránea que apunta a CLIENTE.id_cliente. La conexión entre los campos muestra cómo cada contrato conserva su relación con el cliente. Diseña las claves a partir de la regla de negocio acordada, antes de elegir el almacenamiento.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Del Significado al Modelo Lógico</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" transform="translate(0 103)" data-center="960 608"><rect x="710.0585" y="220" width="499.883" height="64" rx="12" fill="#59616E" stroke="#59616E" stroke-width="1.5" data-business-rule="true" /><text x="960" y="262.8" font-size="25.5" fill="#FFFFFF" font-weight="400" text-anchor="middle"><tspan x="960" y="262.8">«Un cliente puede tener varios contratos»</tspan></text><line x1="626" y1="370" x2="1294" y2="370" stroke="#3C4545" stroke-width="3" /><path d="M1294 370 L1278 362 L1278 378 Z" fill="#3C4545" stroke="none" data-model-direction="CLIENTE-CONTRATO" /><circle cx="538" cy="370" r="88" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><text x="538" y="380.8" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="538" y="380.8">Cliente</tspan></text><line x1="538" y1="458" x2="538" y2="570" stroke="#59616E" stroke-width="3" /><path d="M538 570 L530 554 L546 554 Z" fill="#59616E" stroke="none" /><circle cx="1382" cy="370" r="88" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><text x="1382" y="380.8" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1382" y="380.8">Contrato</tspan></text><line x1="1382" y1="458" x2="1382" y2="570" stroke="#59616E" stroke-width="3" /><path d="M1382 570 L1374 554 L1390 554 Z" fill="#59616E" stroke="none" /><rect x="665.15" y="306" width="45.7" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="688" y="340.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="688" y="340.8">1</tspan></text><rect x="1206.45" y="306" width="51.1" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1232" y="340.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1232" y="340.8">N</tspan></text><rect x="913.7" y="388" width="92.6" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="960" y="422.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="960" y="422.8">Tiene</tspan></text><g data-model-table="CLIENTE"><rect x="318" y="570" width="440" height="168" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M330 570 H746 Q758 570 758 582 V634 H318 V582 Q318 570 330 570 Z" fill="#59616E" stroke="none" data-table-header="true" /><text x="342" y="612.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="342" y="612.8">CLIENTE</tspan></text><line x1="510" y1="634" x2="510" y2="738" stroke="#59616E" stroke-width="1.5" /><g data-model-field="id_cliente" data-row-top="634" data-row-bottom="686"><text x="342" y="670.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="342" y="670.8">id_cliente</tspan></text><text x="526" y="670.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="526" y="670.8">Clave primaria</tspan></text></g><line x1="318" y1="686" x2="758" y2="686" stroke="#59616E" stroke-width="1.5" /><g data-model-field="nombre" data-row-top="686" data-row-bottom="738"><text x="342" y="722.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="342" y="722.8">nombre</tspan></text><text x="526" y="722.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="526" y="722.8">Atributo</tspan></text></g></g><g data-model-table="CONTRATO"><rect x="1162" y="570" width="440" height="220" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1174 570 H1590 Q1602 570 1602 582 V634 H1162 V582 Q1162 570 1174 570 Z" fill="#59616E" stroke="none" data-table-header="true" /><text x="1186" y="612.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="1186" y="612.8">CONTRATO</tspan></text><line x1="1354" y1="634" x2="1354" y2="790" stroke="#59616E" stroke-width="1.5" /><g data-model-field="id_cliente" data-row-top="634" data-row-bottom="686"><text x="1186" y="670.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1186" y="670.8">id_cliente</tspan></text><text x="1370" y="670.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1370" y="670.8">Clave foránea</tspan></text></g><line x1="1162" y1="686" x2="1602" y2="686" stroke="#59616E" stroke-width="1.5" /><g data-model-field="id_contrato" data-row-top="686" data-row-bottom="738"><text x="1186" y="722.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1186" y="722.8">id_contrato</tspan></text><text x="1370" y="722.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1370" y="722.8">Clave primaria</tspan></text></g><line x1="1162" y1="738" x2="16