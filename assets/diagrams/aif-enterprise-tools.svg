<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="function-sequence">
<title id="title">Function calling: sigue quién hace cada paso</title>
<desc id="description">El modelo propone nombre y argumentos, la aplicación valida identidad permisos y parámetros, ejecuta una función, recibe el resultado real y lo devuelve al modelo asociado a la llamada.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M8 2v3m4-3v3m4-3v3M8 19v3m4-3v3m4-3v3M2 8h3m-3 4h3m-3 4h3m14-8h3m-3 4h3m-3 4h3"/></symbol><symbol id="code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 8h20m-17-3h1m3 0h1m-5 7 3 3-3 3m6 0h5"/></symbol><symbol id="tools" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3a6 6 0 0 0-6 8L2 17l5 5 6-6a6 6 0 0 0 8-6l-4 3-4-4z"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Function calling: sigue quién hace cada paso</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Esta secuencia representa una función propia ejecutada por tu aplicación.</text><text x="235" y="177" font-size="28" fill="#17243b" font-weight="700" text-anchor="middle">Modelo</text><text x="608" y="177" font-size="28" fill="#17243b" font-weight="700" text-anchor="middle">Tu aplicación</text><text x="999" y="177" font-size="28" fill="#17243b" font-weight="700" text-anchor="middle">Función</text><use data-icon="cpu" href="#cpu" x="209" y="202" width="52" height="52" color="#c74436"/><use data-icon="code" href="#code" x="582" y="202" width="52" height="52" color="#4f46b8"/><use data-icon="tools" href="#tools" x="973" y="202" width="52" height="52" color="#087f7a"/><path d="M235 272L235 533" fill="none" stroke="#dce1ec" stroke-width="2"/><path d="M608 272L608 533" fill="none" stroke="#dce1ec" stroke-width="2"/><path d="M999 272L999 533" fill="none" stroke="#dce1ec" stroke-width="2"/><path d="M242 309H599" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><text x="414" y="292" font-size="23" fill="#17243b" font-weight="600" text-anchor="middle">1 · Nombre + argumentos</text><rect x="488" y="332" width="240" height="42" rx="21" fill="url(#indigo)" stroke="none" stroke-width="1.5"/><text x="608" y="360" font-size="21" fill="#4f46b8" font-weight="600" text-anchor="middle">2 · Validar permisos</text><path d="M616 402H990" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><text x="803" y="390" font-size="23" fill="#17243b" font-weight="600" text-anchor="middle">3 · Ejecutar función</text><path d="M990 454H617" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="803" y="442" font-size="23" fill="#17243b" font-weight="600" text-anchor="middle">4 · Resultado real</text><path d="M598 514H243" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="419" y="503" font-size="23" fill="#17243b" font-weight="600" text-anchor="middle">5 · Devolver a la llamada</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Declarar una función describe la herramienta; no ejecuta su código.</text></g>
</svg>
