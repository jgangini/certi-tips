<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="iris-classification">
<title id="title">Iris: medidas adentro, especie afuera</title>
<desc id="description">Cuatro medidas de sépalos y pétalos entran al escalador y clasificador ajustados con train. La salida es una de tres especies. La especie es la etiqueta y nunca una feature.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v6m0 5v7M12 3v12m0 5v1M20 3v2m0 5v11"/><circle cx="4" cy="11" r="2"/><circle cx="12" cy="17" r="2"/><circle cx="20" cy="7" r="2"/></symbol><symbol id="tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h9l11 11-9 9L2 12Z"/><circle cx="7" cy="8" r="1.4"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Iris: medidas adentro, especie afuera</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Una nueva flor usa el mismo escalador y el mismo clasificador aprendidos.</text><text x="220" y="171" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Una flor, cuatro medidas</text><rect x="81" y="202" width="278" height="208" rx="18" fill="#fff" stroke="#dce1ec" stroke-width="1.5"/><text x="106" y="243" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">Largo de sépalo</text><text x="106" y="276" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">Ancho de sépalo</text><text x="106" y="309" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">Largo de pétalo</text><text x="106" y="342" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">Ancho de pétalo</text><path d="M376 304H489" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><g data-concept="Escalar + clasificar"><circle cx="583" cy="311" r="64" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="583" cy="304" r="64" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="sliders" href="#sliders" x="548.44" y="269.44" width="69.12" height="69.12" color="#4f46b8"/><text x="583" y="411" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Escalar + clasificar</text><text x="583" y="446" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Se ajustan solo</text><text x="583" y="478" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">con train</text></g><path d="M658 304H870" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><text x="770" y="278" font-size="21" fill="#536078" font-weight="400" text-anchor="middle">modelo fijo</text><g data-concept="Especie"><circle cx="987" cy="311" r="64" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="987" cy="304" r="64" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="tag" href="#tag" x="952.44" y="269.44" width="69.12" height="69.12" color="#087f7a"/><text x="987" y="411" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Especie</text><text x="987" y="446" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Setosa · versicolor</text><text x="987" y="478" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">o virginica</text></g><rect x="102" y="510" width="236" height="42" rx="21" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="220" y="538" font-size="21" fill="#c74436" font-weight="600" text-anchor="middle">Especie = label</text><path d="M352 531L565 531" fill="none" stroke="#c74436" stroke-width="2" stroke-dasharray="6 6"/><text x="601" y="539" font-size="23" fill="#c74436" font-weight="600" text-anchor="start">No se incluye entre las entradas</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Iris es clasificación multiclase, incluso al usar regresión logística.</text></g>
</svg>
