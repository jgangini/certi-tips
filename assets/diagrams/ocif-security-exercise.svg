<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="security-exercise">
<title id="title">Tres necesidades de protección</title>
<desc id="description">Tres necesidades de protección</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4v7c0 5-6 8-9 9-3-1-9-4-9-9V6Z"/><path d="m7 12 3 3 7-7"/></symbol><symbol id="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12Z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h20l-8 9v8l-4 2V12Z"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Tres necesidades de protección</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">El verbo del requisito distingue los servicios.</text><g data-layout="icon-label" data-axis="horizontal"><g data-artwork="true"><use data-icon="shield" href="#shield" x="78" y="195.5" width="54" height="54" color="#4f46b8"/></g><text x="144" y="222.5" font-size="25" fill="#17243b" font-weight="600" text-anchor="start" dominant-baseline="central">Denegar creación insegura</text></g><path d="M590 222.5H672" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><g data-layout="centered-card"><rect x="694" y="175" width="438" height="95" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><text x="913" y="222.5" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle" dominant-baseline="central">Security Zones</text></g></g><g data-layout="icon-label" data-axis="horizontal"><g data-artwork="true"><use data-icon="eye" href="#eye" x="78" y="321.5" width="54" height="54" color="#4f46b8"/></g><text x="144" y="348.5" font-size="25" fill="#17243b" font-weight="600" text-anchor="start" dominant-baseline="central">Detectar y corregir riesgos</text></g><path d="M590 348.5H672" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><g data-layout="centered-card"><rect x="694" y="301" width="438" height="95" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><text x="913" y="348.5" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle" dominant-baseline="central">Cloud Guard</text></g></g><g data-layout="icon-label" data-axis="horizontal"><g data-artwork="true"><use data-icon="filter" href="#filter" x="78" y="447.5" width="54" height="54" color="#4f46b8"/></g><text x="144" y="474.5" font-size="25" fill="#17243b" font-weight="600" text-anchor="start" dominant-baseline="central">Inspeccionar solicitudes web</text></g><path d="M590 474.5H672" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><g data-layout="centered-card"><rect x="694" y="427" width="438" height="95" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><text x="913" y="474.5" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle" dominant-baseline="central">WAF</text></g></g><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Configura ámbito, reglas, permisos y revisión de resultados.</text></g>
</svg>
