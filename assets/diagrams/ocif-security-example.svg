<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="security-example">
<title id="title">Corregir una violación de Security Zone</title>
<desc id="description">Corregir una violación de Security Zone</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m5 5 14 14M5 19 19 5"/></symbol><symbol id="key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path transform="translate(2 2) scale(1.25)" fill="currentColor" stroke="none" fill-rule="evenodd" clip-rule="evenodd" d="M10.5 9C12.9853 9 15 6.98528 15 4.5C15 2.01472 12.9853 0 10.5 0C8.01475 0 6.00003 2.01472 6.00003 4.5C6.00003 5.38054 6.25294 6.20201 6.69008 6.89574L0.585815 13L3.58292 15.9971L4.99714 14.5829L3.41424 13L5.00003 11.4142L6.58292 12.9971L7.99714 11.5829L6.41424 10L8.10429 8.30995C8.79801 8.74709 9.61949 9 10.5 9ZM10.5 7C11.8807 7 13 5.88071 13 4.5C13 3.11929 11.8807 2 10.5 2C9.11932 2 8.00003 3.11929 8.00003 4.5C8.00003 5.88071 9.11932 7 10.5 7Z"/></symbol><symbol id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 5"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Corregir una violación de Security Zone</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Caso: la receta exige una clave administrada por el cliente.</text><g data-layout="icon-label" data-axis="horizontal"><g data-artwork="true"><use data-icon="cross" href="#cross" x="78" y="195.5" width="54" height="54" color="#4f46b8"/></g><text x="144" y="222.5" font-size="25" fill="#17243b" font-weight="600" text-anchor="start" dominant-baseline="central">Bucket sin clave exigida</text></g><path d="M590 222.5H672" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><g data-layout="centered-card"><rect x="694" y="175" width="438" height="95" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><text x="913" y="222.5" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle" dominant-baseline="central">Denegado por la receta</text></g></g><g data-layout="icon-label" data-axis="horizontal"><g data-artwork="true"><use data-icon="key" href="#key" x="78" y="321.5" width="54" height="54" color="#4f46b8"/></g><text x="144" y="348.5" font-size="25" fill="#17243b" font-weight="600" text-anchor="start" dominant-baseline="central">Clave compatible y permisos</text></g><path d="M590 348.5H672" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><g data-layout="centered-card"><rect x="694" y="301" width="438" height="95" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><text x="913" y="348.5" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle" dominant-baseline="central">Requisito satisfecho</text></g></g><g data-layout="icon-label" data-axis="horizontal"><g data-artwork="true"><use data-icon="check" href="#check" x="78" y="447.5" width="54" height="54" color="#4f46b8"/></g><text x="144" y="474.5" font-size="25" fill="#17243b" font-weight="600" text-anchor="start" dominant-baseline="central">Bucket privado y conforme</text></g><path d="M590 474.5H672" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><g data-layout="centered-card"><rect x="694" y="427" width="438" height="95" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><text x="913" y="474.5" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle" dominant-baseline="central">Creación permitida</text></g></g><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">La receta concreta determina qué requisitos se aplican.</text></g>
</svg>
