<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Ejecutado No Significa Aceptado</title><desc id="description">El workflow terminado y la completitud aceptada son dos condiciones para publicar. Si falta una partición, la ejecución puede haber finalizado sin que los datos estén listos. La ruta «No» mantiene disponible la versión anterior, identificada con su fecha, mientras se investiga y recupera. Publica la versión nueva cuando ambas condiciones se hayan comprobado.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Ejecutado No Significa Aceptado</tspan></text><rect x="96" y="270" width="540" height="190" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="96" y="270" width="540" height="6" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><text x="128" y="336.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="128" y="336.27">EJECUCIÓN</tspan></text><text x="128" y="403.91" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="128" y="403.91">Workflow terminado</tspan></text><rect x="96" y="634" width="540" height="212" rx="0" fill="#FFFFFF" stroke="#C74634" stroke-width="3"/><text x="128" y="699.27" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="128" y="699.27">COMPLETITUD</tspan></text><text x="128" y="771.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="128" y="771.59">Partición ausente </tspan><tspan x="128" y="805.59">Datos no aceptados</tspan></text><path d="M1091.0 410 L1326 550.0 L1091.0 690 L856 550.0 Z" fill="#F7EFE8" stroke="#3C4545" stroke-width="3" stroke-linejoin="round"/><text x="1091" y="532.611" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1091" y="532.611">¿Cumplen </tspan><tspan x="1091" y="571.569">los dos?</tspan></text><path d="M636 365 H778 V550 H856 M636 740 H778 V550" fill="none" stroke="#3C4545" stroke-width="4" stroke-linejoin="round"/><rect x="1470" y="405" width="354" height="207" rx="0" fill="#EEF3EC" stroke="#3C4545" stroke-width="3"/><rect x="1470" y="405" width="354" height="6" rx="0" fill="#749B6B" stroke="none" stroke-width="2"/><text x="1647" y="481.611" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1647" y="481.611">Publicar </tspan><tspan x="1647" y="520.569">versión nueva</tspan></text><line x1="1326" y1="550" x2="1470" y2="550" stroke="#3C4545" stroke-width="4"/><path d="M1470 550 L1454 558 L1454 542 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><text x="1398" y="507.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1398" y="507.27">Sí</tspan></text><path d="M1091 690 V825 H1409" fill="none" stroke="#C74634" stroke-width="4" stroke-linejoin="round"/><line x1="1409" y1="825" x2="1430" y2="825" stroke="#C74634" stroke-width="4"/><path d="M1430 825 L1414 833 L1414 817 Z" fill="#C74634" stroke="#C74634" stroke-width="1" stroke-linejoin="round"/><text x="1137" y="750.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="1137" y="750.59">No</tspan></text><rect x="1430" y="744" width="394" height="202" rx="0" fill="#F1EFED" stroke="#3C4545" stroke-width="3"/><text x="1627" y="807.551" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1627" y="807.551">Mantener versión </tspan><tspan x="1627" y="848.989">anterior identificada</tspan></text><line x1="1091" y1="825" x2="1091" y2="865" stroke="#C74634" stroke-width="3"/><rect x="842" y="865" width="554" height="88" rx="0" fill="#FFFFFF" stroke="#697778" stroke-width="2"/><text x="1119" y="918.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="middle"><tspan x="1119" y="918.59">Investigar y recuperar</tspan></text></g></svg>
