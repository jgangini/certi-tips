<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Ejecutado No Significa Aceptado</title><desc id="description">El workflow terminado y la completitud aceptada son dos condiciones para publicar. Si falta una partición, la ejecución puede haber finalizado sin que los datos estén listos. La ruta «No» mantiene disponible la versión anterior, identificada con su fecha, mientras se investiga y recupera. Publica la versión nueva cuando ambas condiciones se hayan comprobado.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Ejecutado No Significa Aceptado</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 -12)"><rect x="120" y="350" width="440" height="116" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M132 350 H548 Q560 350 560 362 V414 H120 V362 Q120 350 132 350 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="120" y="350" width="440" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="144" y="392.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="144" y="392.8">EJECUCIÓN</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="120" y="414" width="440" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="340.0" y="450.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="340.0" y="450.8">Workflow terminado</tspan></text></g></g><rect x="120" y="630" width="440" height="168" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M132 630 H548 Q560 630 560 642 V694 H120 V642 Q120 630 132 630 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="120" y="630" width="440" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="144" y="672.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="144" y="672.8">COMPLETITUD</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="120" y="694" width="440" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="340.0" y="730.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="340.0" y="730.8">Partición ausente</tspan></text></g></g><line x1="120" y1="746" x2="560" y2="746" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="center"><rect x="120" y="746" width="440" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="340.0" y="782.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="340.0" y="782.8">Datos no aceptados</tspan></text></g></g><path d="M560 408 L654.0 408.0 Q670 408 670.0 424.0 L670.0 532.0 Q670 548 686.0 548.0 L760 548" fill="none" stroke="#59616E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M760 548 L744.0 556.0 L744.0 540.0 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><path d="M560 720 L654.0 720.0 Q670 720 670.0 704.0 L670 548" fill="none" stroke="#59616E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M960 440.0 L1160.0 548 L960 656.0 L760.0 548 Z" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><text x="960" y="558.8" fill="#181818" font-size="25.5" font-weight="700" text-anchor="middle"><tspan x="960" y="558.8">¿Cumplen los dos?</tspan></text><line x1="1160" y1="548" x2="1440" y2="548" stroke="#59616E" stroke-width="3" /><path d="M1440 548 L1424.0 556.0 L1424.0 540.0 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><rect x="1274.15" y="484" width="51.7" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1300" y="518.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1300" y="518.8">Sí</tspan></text><rect x="1440" y="516" width="360" height="96" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1452 516 H1788 Q1800 516 1800 528 V612 H1440 V528 Q1440 516 1452 516 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left" data-cell-exception="Encabezado de dos líneas para conservar el nombre completo."><rect x="1440" y="516" width="360" height="96" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1464" y="556.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="1464" y="556.8">Publicar </tspan><tspan x="1464" y="592.8">versión nueva</tspan></text></g></g><path d="M960 656 L960.0 758.0 Q960 774 976.0 774.0 L1390 774" fill="none" stroke="#59616E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M1390 774 L1374.0 782.0 L1374.0 766.0 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><rect x="982.0" y="688" w