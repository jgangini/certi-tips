<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">La Unión Repite el Total de la Factura</title><desc id="description">F42 tiene un total de cabecera de 100 y dos líneas: Servicio por 60 e Instalación por 40. Al unir cabecera y detalle, el total 100 se repite en las dos filas. Sumar ese campo produce 200 y cuenta dos veces la factura; sumar los importes de línea conserva 100. Comprueba el grano de cada medida antes de agregar el resultado de una unión.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">La Unión Repite el Total de la Factura</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" transform="translate(0.000 20.455)" data-center="960 608"><rect x="207.95" y="201.09" width="256.1" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="336.0" y="235.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="336.0" y="235.59">Cabecera de factura</tspan></text><rect x="96" y="268" width="480" height="148" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><rect x="96" y="268" width="480" height="64" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><path d="M108.0 268.0 H564.0 Q576.0 268.0 576.0 280.0 V332.0 H96.0 V280.0 Q96.0 268.0 108.0 268.0 Z" fill="#59616E" stroke="none" data-table-header="true" /><text x="247.0" y="309.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="247.0" y="309.5">Factura</tspan></text><text x="487.0" y="309.5" font-size="25.5" fill="#FFFFFF" font-weight="700" tex