h="2"/><text x="1037" y="745.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1037" y="745.27">SUMA DEL DETALLE</tspan></text><text x="1573" y="745.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1573" y="745.27">SUMA DE CABECERA</tspan></text><text x="1037" y="807.71" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1037" y="807.71">60 + 40 = 100</tspan></text><text x="1573" y="808.55" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1573" y="808.55">100 + 100 = 200</tspan></text><text x="824" y="899.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="824" y="899.27">Conserva el importe real.</tspan></text><text x="1346" y="903.43" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="start"><tspan x="1346" y="903.43">Cuenta dos veces </tspan><tspan x="1346" y="936.07">la misma factura.</tspan></text></g></svg>
