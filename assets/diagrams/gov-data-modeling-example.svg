<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">La Unión Repite el Total de la Factura</title><desc id="description">F42 tiene un total de cabecera de 100 y dos líneas: Servicio por 60 e Instalación por 40. Al unir cabecera y detalle, el total 100 se repite en las dos filas. Sumar ese campo produce 200 y cuenta dos veces la factura; sumar los importes de línea conserva 100. Comprueba el grano de cada medida antes de agregar el resultado de una unión.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">La Unión Repite el Total de la Factura</tspan></text><text x="96" y="235.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="96" y="235.59">Cabecera de factura</tspan></text><rect x="96" y="268" width="480" height="148" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="2"/><rect x="96" y="268" width="480" height="64" rx="0" fill="#F1EFED" stroke="#3C4545" stroke-width="2"/><rect x="96" y="268" width="480" height="6" rx="0" fill="#2E5C70" stroke="none" stroke-width="2"/><text x="242" y="307.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="242" y="307.59">Factura</tspan></text><text x="488" y="307.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="488" y="307.59">Total</tspan></text><line x1="398" y1="268" x2="398" y2="416" stroke="#C2D4D4" stroke-width="2"/><text x="242" y="382.23" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="242" y="382.23">F42</tspan></text><text x="488" y="382.23" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="middle"><tspan x="488" y="382.23">100</tspan></text><text x="96" y="485.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="96" y="485.59">Líneas de F42</tspan></text><rect x="96" y="514" width="480" height="234" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="2"/><rect x="96" y="514" width="480" height="64" rx="0" fill="#F1EFED" stroke="#3C4545" stroke-width="2"/><rect x="96" y="514" width="480" height="6" rx="0" fill="#2E5C70" stroke="none" stroke-width="2"/><text x="242" y="553.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="242" y="553.59">Concepto</tspan></text><text x="488" y="555.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="488" y="555.27">Importe</tspan></text><line x1="398" y1="514" x2="398" y2="748" stroke="#C2D4D4" stroke-width="2"/><line x1="96" y1="663" x2="576" y2="663" stroke="#C2D4D4" stroke-width="2"/><text x="242" y="628.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="242" y="628.59">Servicio</tspan></text><text x="488" y="625.23" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="488" y="625.23">60</tspan></text><text x="242" y="713.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="242" y="713.59">Instalación</tspan></text><text x="488" y="710.23" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="488" y="710.23">40</tspan></text><path d="M576 350 H634 V490" fill="none" stroke="#697778" stroke-width="4" stroke-linejoin="round"/><path d="M576 645 H634 V490" fill="none" stroke="#697778" stroke-width="4" stroke-linejoin="round"/><line x1="634" y1="490" x2="800" y2="490" stroke="#697778" stroke-width="4"/><path d="M800 490 L784 498 L784 482 Z" fill="#697778" stroke="#697778" stroke-width="1" stroke-linejoin="round"/><text x="708" y="445.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="708" y="445.59">UNIR</tspan></text><text x="708" y="541.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="708" y="541.27">por F42</tspan></text><text x="800" y="235.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="800" y="235.59">Resultado: una fila por línea</tspan></text><rect x="800" y="268" width="1024" height="300" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="2"/><rect x="800" y="268" width="1024" height="100" rx="0" fill="#F1EFED" stroke="#3C4545" stroke-width="2"/><rect x="800" y="268" width="1024" height="6" rx="0" fill="#2E5C70" stroke="none" stroke-width="2"/><line x1="995" y1="268" x2="995" y2="568" stroke="#C2D4D4" stroke-width="2"/><line x1="1320" y1="268" x2="1320" y2="568" stroke="#C2D4D4" stroke-width="2"/><line x1="1558" y1="268" x2="1558" y2="568" stroke="#C2D4D4" stroke-width="2"/><line x1="800" y1="468" x2="1824" y2="468" stroke="#C2D4D4" stroke-width="2"/><text x="898" y="329.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="898" y="329.27">Factura</tspan></text><text x="1158" y="327.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1158" y="327.59">Línea</tspan></text><text x="1439" y="313.231" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1439" y="313.231">Importe </tspan><tspan x="1439" y="344.309">de línea</tspan></text><text x="1691" y="313.231" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1691" y="313.231">Total </tspan><tspan x="1691" y="344.309">cabecera</tspan></text><text x="898" y="425.91" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="898" y="425.91">F42</tspan></text><text x="1158" y="427.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1158" y="427.59">Servicio</tspan></text><text x="1439" y="424.23" font-size="25.5" fill="#181818" font-weight="