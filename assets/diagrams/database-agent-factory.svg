<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Private Agent Factory: fuentes distintas, recorridos distintos</title>
  <desc id="description">Dos casos del curso: documentos aprobados alimentan Knowledge Agent para responder con citas; tablas permitidas alimentan Data Analysis Agent para análisis estructurado. Agent Builder permite configurar fuentes, modelo y herramientas, probar y publicar un flujo propio. Los dos ejemplos no pretenden enumerar todo el catálogo actual.</desc>
  <defs><linearGradient id="source" x2="1" y2="1"><stop stop-color="#e7f4ef"/><stop offset="1" stop-color="#c5e4df"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#536078" stroke-width="1.6"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}.title{font-size:34px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:22px;fill:#536078}.line{fill:none;stroke:#536078;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="620" fill="#f7f8fc"/>
  <text x="48" y="61" class="title">Construye según el tipo de información</text>
  <g transform="translate(125 173)"><circle cx="5" cy="7" r="58" fill="#cbe3df"/><circle r="58" fill="url(#source)"/><path d="M-26-35h35l21 21v52h-56Z" fill="#fff" stroke="#087f7a" stroke-width="3"/><path d="M9-35v23h21M-14-1h33M-14 13h33M-14 27h23" fill="none" stroke="#087f7a" stroke-width="3"/></g>
  <text x="217" y="160" class="label">Documentos</text><text x="217" y="196" class="body">Contenido aprobado</text><path d="M432 174h66" class="line"/>
  <rect x="528" y="129" width="280" height="92" rx="18" fill="#eae7fa"/><text x="668" y="164" text-anchor="middle" class="label">Knowledge Agent</text><text x="668" y="200" text-anchor="middle" class="body">Recupera y fundamenta</text><path d="M829 174h65" class="line"/>
  <text x="923" y="163" class="label">Respuesta + citas</text><text x="923" y="199" class="body">Revisar la fuente</text>
  <g transform="translate(125 326)"><circle cx="5" cy="7" r="58" fill="#cbe3df"/><circle r="58" fill="url(#source)"/><rect x="-35" y="-29" width="70" height="60" rx="5" fill="#fff" stroke="#087f7a" stroke-width="3"/><path d="M-35-8h70M-35 11h70M-10-29v60M14-29v60" stroke="#087f7a" stroke-width="2"/></g>
  <text x="217" y="315" class="label">Tablas</text><text x="217" y="351" class="body">Datos permitidos</text><path d="M432 327h66" class="line"/>
  <rect x="528" y="282" width="280" height="92" rx="18" fill="#eae7fa"/><text x="668" y="317" text-anchor="middle" class="label">Data Analysis Agent</text><text x="668" y="353" text-anchor="middle" class="body">Consulta y analiza</text><path d="M829 327h65" class="line"/>
  <text x="923" y="316" class="label">Resultados</text><text x="923" y="352" class="body">Tablas y explicación</text>
  <rect x="48" y="433" width="1104" height="145" rx="20" fill="#fff" stroke="#dbe0eb"/>
  <text x="76" y="478" class="label">Agent Builder</text><text x="76" y="517" class="body">Flujos propios</text>
  <path d="M325 505h61" class="line"/>
  <rect x="414" y="467" width="314" height="76" rx="13" fill="#fae6e2"/><text x="571" y="498" text-anchor="middle" class="body">Fuentes + modelo + tools</text><text x="571" y="529" text-anchor="middle" class="body">Configuración visual</text>
  <path d="M750 505h50" class="line"/><text x="824" y="514" class="label">Probar</text><path d="M921 505h43" class="line"/><text x="990" y="514" class="label">Publicar</text>
