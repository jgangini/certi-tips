<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title description">
  <title id="title">El ciclo de un agente</title>
  <desc id="description">Un objetivo y el contexto llegan al modelo. El modelo propone una acción; la aplicación valida los permisos y ejecuta la herramienta. La observación vuelve al modelo. El ciclo termina al responder o al alcanzar una condición de parada.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#675f59"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#17665e"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#252321}
      .title{font-size:30px;font-weight:700}
      .subtitle{font-size:20px;fill:#675f59}
      .label{font-size:23px;font-weight:700}
      .body{font-size:20px}
      .small{font-size:18px;fill:#675f59}
      .white{fill:#fff}
      .red{fill:#b43d32}
      .teal{fill:#17665e}
      .card{fill:#fff;stroke:#d9d0c7;stroke-width:2}
      .line{fill:none;stroke:#675f59;stroke-width:2.5;marker-end:url(#arrow)}
      .return{fill:none;stroke:#17665e;stroke-width:2.5;marker-end:url(#arrow-teal)}
    </style>
  </defs>
  <rect width="1000" height="640" fill="#faf8f5"/>

  <text x="40" y="50" class="title">El modelo decide; la aplicación actúa</text>
  <text x="40" y="86" class="subtitle">Un agente repite el ciclo con observaciones nuevas y límites explícitos.</text>
  <rect x="40" y="174" width="185" height="134" rx="18" class="card"/>
  <text x="63" y="215" class="label">Objetivo</text>
  <text x="63" y="252" class="body"><tspan x="63">Contexto</tspan><tspan x="63" dy="28">y restricciones</tspan></text>
  <rect x="290" y="133" width="280" height="187" rx="18" fill="#f6e6e1" stroke="#b43d32" stroke-width="2"/>
  <text x="314" y="176" class="label">1. Modelo</text>
  <text x="314" y="217" class="body"><tspan x="314">Interpreta el contexto.</tspan><tspan x="314" dy="29">Responde o propone</tspan><tspan x="314" dy="29">una llamada a herramienta.</tspan></text>
  <rect x="650" y="133" width="310" height="187" rx="18" class="card"/>
  <text x="674" y="176" class="label">2. Aplicación</text>
  <text x="674" y="217" class="body"><tspan x="674">Valida argumentos,</tspan><tspan x="674" dy="29">permisos y aprobación.</tspan><tspan x="674" dy="29">Ejecuta la herramienta.</tspan></text>
  <path d="M 231 240 H 277" class="line"/>
  <path d="M 577 225 H 637" class="line"/>
  <text x="601" y="195" text-anchor="middle" class="small">acción</text>
  <rect x="650" y="390" width="310" height="122" rx="18" fill="#e4eeeb" stroke="#17665e" stroke-width="2"/>
  <text x="674" y="434" class="label">3. Observación</text>
  <text x="674" y="474" class="body">Resultado o error de la acción</text>
  <path d="M 805 326 V 377" class="line"/>
  <path d="M 640 451 H 429 V 333" class="return"/>
  <text x="440" y="436" class="small teal">Actualiza el contexto</text>
  <path d="M 290 282 H 253 V 440 H 228" class="line"/>
  <rect x="40" y="386" width="185" height="129" rx="18" fill="#17665e"/>
  <text x="61" y="428" class="label white">Parar</text>
  <text x="61" y="464" class="body white"><tspan x="61">Respuesta final</tspan><tspan x="61" dy="28">o límite de pasos</tspan></text>
  <rect x="40" y="555" width="920" height="51" rx="12" fill="#eee9e3"/>
  <text x="60" y="587" class="body">Límites: pasos, tiempo, coste y condiciones de éxito; nunca un bucle sin control.</text>
</svg>
