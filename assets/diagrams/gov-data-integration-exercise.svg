<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">El Job Termina; el Indicador Cae a Cero</title><desc id="description">La carga termina sin errores, pero el indicador cae a cero porque el filtro espera A y ahora recibe ACTIVO. La definición de negocio no cambió; el mapeo sí quedó desactualizado. Valida los valores, aprueba una nueva versión del contrato y reprocesa el periodo afectado. Comprueba el indicador reconciliado antes de aceptar el resultado técnico como correcto.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">El Job Termina; el Indicador Cae a Cero</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" transform="translate(0.000 -15.000)" data-center="960 608"><rect x="100" y="265" width="490" height="220" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M112.0 265.0 H578.0 Q590.0 265.0 590.0 277.0 V337.0 H100.0 V277.0 Q100.0 265.0 112.0 265.0 Z" fill="#59616E" stroke="none" data-table-header="true" /><text x="345.0" y="310.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="345.0" y="310.5">Carga terminada</tspan></text><text x="140" y="402.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="140" y="402.27">Ejecución sin errores</tspan></text><rect x="690" y="265" width="530" height="220" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><text x="955" y="330.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="955" y="330.59">Clientes activos</tspan></text><text x="955" y="415.47" font-size=