<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">El Job Termina; el Indicador Cae a Cero</title><desc id="description">La carga termina sin errores, pero el indicador cae a cero porque el filtro espera A y ahora recibe ACTIVO. La definición de negocio no cambió; el mapeo sí quedó desactualizado. Valida los valores, aprueba una nueva versión del contrato y reprocesa el periodo afectado. Comprueba el indicador reconciliado antes de aceptar el resultado técnico como correcto.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">El Job Termina; el Indicador Cae a Cero</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 43)"><rect x="120" y="260" width="440" height="116" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M132 260 H548 Q560 260 560 272 V324 H120 V272 Q120 260 132 260 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="120" y="260" width="440" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="144" y="302.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="144" y="302.8">Carga terminada</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="120" y="324" width="440" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="340.0" y="360.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="340.0" y="360.8">Ejecución sin errores</tspan></text></g></g><rect x="720" y="260" width="420" height="116" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M732 260 H1128 Q1140 260 1140 272 V324 H720 V272 Q720 260 732 260 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="720" y="260" width="420" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="744" y="302.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="744" y="302.8">Clientes activos</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="720" y="324" width="420" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="930.0" y="360.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="930.0" y="360.8">0</tspan></text></g></g><line x1="560" y1="318" x2="720" y2="318" stroke="#59616E" stroke-width="3" /><path d="M720 318 L704.0 326.0 L704.0 310.0 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><rect x="1280" y="260" width="520" height="132" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="note" data-cell-align="center"><rect x="1280" y="260" width="520" height="132" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1540.0" y="300.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1540.0" y="300.8">El filtro esperaba A. </tspan><tspan x="1540.0" y="336.8">Ahora recibe ACTIVO. </tspan><tspan x="1540.0" y="372.8">La definición no cambió.</tspan></text></g></g><line x1="1140" y1="318" x2="1280" y2="318" stroke="#59616E" stroke-width="3" /><rect x="399.7" y="458" width="150.6" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="475" y="492.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="475" y="492.8">MAPEO v1</tspan></text><rect x="1299.5515625" y="458" width="290.896875" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1445" y="492.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1445" y="492.8">MAPEO v2 APROBADO</tspan></text><rect x="120" y="542" width="710" height="168" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M132 542 H818 Q830 542 830 554 V606 H120 V554 Q120 542 132 542 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="center"><rect x="120" y="542" width="340" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="290.0" y="584.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="middle"><tspan x="290.0" y="584.8">Entrada</tspan></text></g></g><g data-table-cell="header" data-cell-align="center"><rect x="460" y="542" width="370" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="645.0" y="584.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="middle"><tspan x="645.0" y="584.8">Interpretación</tspan></text></g></g><line x1="460" y1="542" x2="460" y2="606" stroke="#FFFFFF" stroke-width="1.5" /><line x1="460" y1="606" x2="460" y2="710" stroke="#59616E" stroke-width="1.5" /><g data-table-row="0" data-row-top="606" data-row-bottom="658"><g data-table-cell="row" data-cell-align="center"><rect x="120" y="606" width="340" height="52" rx="0" fill="none" stroke="none" 