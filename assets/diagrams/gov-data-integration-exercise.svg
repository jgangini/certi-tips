<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">El Job Termina; el Indicador Cae a Cero</title><desc id="description">La carga termina sin errores, pero el indicador cae a cero porque el filtro espera A y ahora recibe ACTIVO. La definición de negocio no cambió; el mapeo sí quedó desactualizado. Valida los valores, aprueba una nueva versión del contrato y reprocesa el periodo afectado. Comprueba el indicador reconciliado antes de aceptar el resultado técnico como correcto.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">El Job Termina; el Indicador Cae a Cero</tspan></text><rect x="100" y="265" width="490" height="220" rx="0" fill="#EEF3EC" stroke="#3C4545" stroke-width="3"/><text x="140" y="321.75" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="140" y="321.75">Carga terminada</tspan></text><text x="140" y="402.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="140" y="402.27">Ejecución sin errores</tspan></text><rect x="690" y="265" width="530" height="220" rx="0" fill="#FFFFFF" stroke="#C74634" stroke-width="3"/><text x="955" y="330.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="955" y="330.59">Clientes activos</tspan></text><text x="955" y="415.47" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="middle"><tspan x="955" y="415.47">0</tspan></text><rect x="1280" y="265" width="540" height="220" rx="0" fill="#F1EFED" stroke="#C2D4D4" stroke-width="2"/><line x1="1220" y1="375" x2="1280" y2="375" stroke="#3C4545" stroke-width="2"/><g data-svgrepo-icon="policy" transform="translate(1734 291) scale(2)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 13-8.381 8.38a1 1 0 0 1-3.001-3l8.384-8.381" />
