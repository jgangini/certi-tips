</g><text x="1320" y="328.31" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1320" y="328.31">El filtro esperaba A. </tspan><tspan x="1320" y="360.95">Ahora recibe ACTIVO.</tspan></text><text x="1320" y="415.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1320" y="415.27">La definición no cambió.</tspan></text><text x="100" y="547.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="100" y="547.59">MAPEO v1</tspan></text><rect x="100" y="590" width="760" height="78" rx="0" fill="#EEF3F4" stroke="#C2D4D4" stroke-width="2"/><text x="120" y="633.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="120" y="633.27">Entrada</tspan></text><line x1="490" y1="590" x2="490" y2="668" stroke="#C2D4D4" stroke-width="2"/><text x="510" y="633.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="510" y="633.27">Interpretación</tspan></text><rect x="100" y="668" width="760" height="78" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><text x="120" y="711.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="120" y="711.27">A</tspan></text><line x1="490" y1="668" x2="490" y2="746" stroke="#C2D4D4" stroke-width="2"/><text x="510" y="711.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="510" y="711.27">Activo</tspan></text><rect x="100" y="746" width="760" height="78" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><text x="120" y="789.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="120" y="789.27">ACTIVO</tspan></text><line x1="490" y1="746" x2="490" y2="824" stroke="#C2D4D4" stroke-width="2"/><text x="510" y="789.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="510" y="789.27">No reconocido</tspan></text><line x1="860" y1="704" x2="1120" y2="704" stroke="#3C4545" stroke-width