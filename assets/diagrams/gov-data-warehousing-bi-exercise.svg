<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Una Corrección Conserva el Cierre Original</title><desc id="description">La publicación v1 conserva el cierre de septiembre. Una factura tardía recibida en octubre origina una corrección v2 del mismo periodo, con motivo, aprobación y vínculo a v1. El ajuste Δ cambia el importe publicado sin sobrescribir la evidencia anterior. Registra versión y relación entre ambas para explicar y reproducir el cierre original y su corrección.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Una Corrección Conserva el Cierre Original</tspan></text><line x1="230" y1="354" x2="1700" y2="354" stroke="#3C4545" stroke-width="4"/><circle cx="300" cy="354" r="15" fill="#C74634" stroke="#C74634" stroke-width="2"/><text x="300" y="280.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="middle"><tspan x="300" y="280.59">30 SEP</tspan></text><text x="300" y="419.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="300" y="419.59">Cierre v1</tspan></text><circle cx="960" cy="354" r="15" fill="#C74634" stroke="#C74634" stroke-width="2"/><text x="960" y="280.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="middle"><tspan x="960" y="280.59">03 OCT</tspan></text><text x="960" y="419.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="960" y="419.59">Factura tardía</tspan></text><circle cx="1620" cy="354" r="15" fill="#C74634" stroke="#C74634" stroke-width="2"/><text x="1620" y="280.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="middle"><tspan x="1620" y="280.59">05 OCT</tspan></text><text x="1620" y="419.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1620" y="419.59">Corrección v2</tspan></text><line x1="300" y1="442" x2="300" y2="492" stroke="#3C4545" stroke-width="2"/><line x1="1620" y1="442" x2="1620" y2="492" stroke="#3C4545" stroke-width="2"/><rect x="120" y="492" width="710" height="388" rx="0" fill="#F1EFED" stroke="#3C4545" stroke-width="3"/><rect x="120" y="492" width="710" height="6" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><text x="232" y="546.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="232" y="546.59">PUBLICACIÓN v1</tspan></text><g data-svgrepo-icon="archive" transform="translate(160 517) scale(2)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1" />
  <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8" />
  <path d="M10 12h4" />
</g><text x="475" y="646.11" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="middle"><tspan x="475" y="646.11">T</tspan></text><text x="160" y="794.059" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="160" y="794.059">Periodo: septiembre </tspan><tspan x="160" y="839.481">Se conserva sin sobrescribir</tspan></text><text x="160" y="728.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="160" y="728.27">T: importe del cierre</tspan></text><rect x="1090" y="492" width="710" height="388" rx="0" fill="#F1EFED" stroke="#3C4545" stroke-width="3"/><rect x="1090" y="492" width="710" height="6" rx="0" fill="#C06D30" stroke="none" stroke-width="2"/><text x="1202" y="546.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1202" y="546.59">PUBLICACIÓN v2</tspan></text><g data-svgrepo-icon="history" transform="translate(1130 517) scale(2)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
