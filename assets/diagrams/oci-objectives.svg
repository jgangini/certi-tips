<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title description">
  <title id="title">Del prototipo de agente a una operación verificable en OCI</title>
  <desc id="description">Los objetivos conectan cuatro preguntas: qué lógica describe el framework, cómo se ejecuta en un runtime, qué configuración permite llamar a OCI y quién opera el despliegue elegido.</desc>
  <defs><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b;font-size:23px}.h{font-size:34px;font-weight:700}.label{font-size:26px;font-weight:700}.muted{fill:#536078}.icon{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style></defs>
  <rect width="1200" height="580" fill="#f7f8fc"/><text x="56" y="65" class="h">Del código que funciona al servicio que puedes operar</text>
  <g fill="#fff" stroke="#dce1ec"><rect x="56" y="117" width="527" height="184" rx="22"/><rect x="617" y="117" width="527" height="184" rx="22"/><rect x="56" y="329" width="527" height="184" rx="22"/><rect x="617" y="329" width="527" height="184" rx="22"/></g>
  <circle cx="123" cy="185" r="38" fill="#fae6e1"/><g class="icon" stroke="#c74436"><path d="m112 167-17 18 17 18m22-36 17 18-17 18"/></g><text x="185" y="184" class="label">1. Lógica del agente</text><text x="185" y="223">Modelo, herramientas y loop</text><text x="84" y="273" class="muted">Distinguir el framework del entorno de ejecución</text>
  <circle cx="684" cy="185" r="38" fill="#e9e6fa"/><g class="icon" stroke="#4f46b8"><rect x="664" y="164" width="40" height="42" rx="6"/><path d="M672 177h24m-24 14h24"/></g><text x="746" y="184" class="label">2. Runtime</text><text x="746" y="223">Estado, límites y fallos</text><text x="645" y="273" class="muted">Ubicar las responsabilidades de operación</text>
  <circle cx="123" cy="397" r="38" fill="#e9e6fa"/><g class="icon" stroke="#4f46b8"><circle cx="113" cy="395" r="11"/><path d="M124 395h25m-9 0v9m-9-9v7"/></g><text x="185" y="396" class="label">3. Primera llamada</text><text x="185" y="435">Identidad, proyecto y región</text><text x="84" y="485" class="muted">Comprobar acceso antes de añadir herramientas</text>
  <circle cx="684" cy="397" r="38" fill="#e1f2ee"/><g class="icon" stroke="#087f7a"><path d="M663 405h43v-25h-43zm8 0v10h27v-10m-14-24v13m-6-5 6 6 6-6"/></g><text x="746" y="396" class="label">4. Despliegue</text><text x="746" y="435">API o aplicación alojada</text><text x="645" y="485" class="muted">Elegir quién opera el software y su capacidad</text>
</svg>
