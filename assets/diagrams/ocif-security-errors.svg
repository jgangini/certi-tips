<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">El candado del disco no decide quién lee el objeto</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Revisa autorización y visibilidad además del cifrado.</text><g data-layout="icon-label"><g data-artwork="true" data-badge="true"><circle cx="160" cy="291" r="51" fill="#fff" stroke="#087f7a" stroke-width="2.5"/><use data-icon="archive" href="#archive" x="132" y="263" width="56" height="56" color="#087f7a"/></g><g data-layout="caption"><text x="160" y="379" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Bucket cifrado</text></g></g><use data-icon="lock" href="#lock" x="205" y="185" width="42" height="42" color="#087f7a"/><path d="M226 291H405" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><g data-layout="centered-card"><rect x="435" y="211" width="338" height="212" rx="18" fill="url(#coral)" stroke="#c74436" stroke-width="1.5"/><g data-card-content="true"><g data-layout="icon-label"><text x="604" y="287" font-size="25" fill="#c74436" font-weight="700" text-anchor="middle" dominant-baseline="central">Acceso público</text><g data-artwork="true"><use data-icon="eye" href="#eye" x="575.5" y="312.5" width="57" height="57" color="#c74436"/></g></g></g></g><path d="M789 291H948" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><g data-layout="icon-label"><g data-artwork="true" data-badge="true"><circle cx="1064" cy="291" r="51" fill="#fff" stroke="#c74436" stroke-width="2.5"/><use data-icon="user" href="#user" x="1036" y="263" width="56" height="56" color="#c74436"/></g><g data-layout="caption"><text x="1064" y="379" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Solicitante</text></g></g><text x="600" y="512" font-size="25" fill="#17243b" font-weight="400" text-anchor="middle">El servicio puede entregar el contenido legible a quien tenga acceso.</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Cifrado en reposo no equivale a acceso privado.</text></g>
