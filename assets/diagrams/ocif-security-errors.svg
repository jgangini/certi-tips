<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="security-errors">
<title id="title">El candado del disco no decide quién lee el objeto</title>
<desc id="description">El candado del disco no decide quién lee el objeto</desc>
