<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="neural-mechanisms">
<title id="title">Tres mecanismos, tres preguntas</title>
<desc id="description">Una neurona suma y activa, una convolución aplica un filtro local y una red recurrente mantiene estado entre instantes.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Tres mecanismos, tres preguntas</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">¿Qué combina? ¿Qué patrón reconoce? ¿Qué necesita recordar?</text><circle cx="213" cy="296" r="75" fill="url(#coral)" stroke="none" stroke-width="2"/><text x="213" y="313" font-size="44" fill="#c74436" font-weight="700" text-anchor="middle">Σ → f</text><g data-visual="matrix"><rect x="530" y="226" width="45" height="45" rx="3" fill="#e5e8f0" stroke="none" stroke-width="1.5"/><rect x="578" y="226" width="45" height="45" rx="3" fill="#4f46b8" stroke="none" stroke-width="1.5"/><rect x="626" y="226" width="45" height="45" rx="3" fill="#e5e8f0" stroke="none" stroke-width="1.5"/><rect x="530" y="274" width="45" height="45" rx="3" fill="#4f46b8" stroke="none" stroke-width="1.5"/><rect x="578" y="274" width="45" height="45" rx="3" fill="#4f46b8" stroke="none" stroke-width="1.5"/><rect x="626" y="274" width="45" height="45" rx="3" fill="#4f46b8" stroke="none" stroke-width="1.5"/><rect x="530" y="322" width="45" height="45" rx="3" fill="#e5e8f0" stroke="none" stroke-width="1.5"/><rect x="578" y="322" width="45" height="45" rx="3" fill="#4f46b8" stroke="none" stroke-width="1.5"/><rect x="626" y="322" width="45" height="45" rx="3" fill="#e5e8f0" stroke="none" stroke-width="1.5"/></g><path d="M854 297H1124" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><circle cx="889" cy="297" r="29" fill="#fff" stroke="#087f7a" stroke-width="2"/><text x="889" y="307" font-size="23" fill="#087f7a" font-weight="600" text-anchor="middle">h0</text><circle cx="984" cy="297" r="29" fill="#fff" stroke="#087f7a" stroke-width="2"/><text x="984" y="307" font-size="23" fill="#087f7a" font-weight="600" text-anchor="middle">h1</text><circle cx="1079" cy="297" r="29" fill="#fff" stroke="#087f7a" stroke-width="2"/><text x="1079" y="307" font-size="23" fill="#087f7a" font-weight="600" text-anchor="middle">h2</text><text x="213" y="427" font-size="28" fill="#17243b" font-weight="700" text-anchor="middle">Neurona</text><text x="600" y="427" font-size="28" fill="#17243b" font-weight="700" text-anchor="middle">Convolución</text><text x="989" y="427" font-size="28" fill="#17243b" font-weight="700" text-anchor="middle">Memoria</text><text x="213" y="465" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Combina entradas</text><text x="213" y="497" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">y aplica una activación</text><text x="600" y="465" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Busca patrones locales</text><text x="600" y="497" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">con filtros compartidos</text><text x="989" y="465" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Conserva información</text><text x="989" y="497" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">entre pasos ordenados</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Explica el mecanismo antes de elegir el nombre de la red.</text></g>
</svg>
