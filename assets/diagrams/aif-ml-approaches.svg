<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="learning-signals">
<title id="title">¿Qué señal guía el aprendizaje?</title>
<desc id="description">Supervisado separa puntos de clases conocidas. Clustering agrupa puntos similares sin etiquetas. Refuerzo forma un bucle de acción, estado y recompensa entre agente y entorno.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="bot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="3"/><path d="M12 3v4M9 16h6M1 12h3m16 0h3"/><circle cx="8.5" cy="12" r=".8" fill="currentColor"/><circle cx="15.5" cy="12" r=".8" fill="currentColor"/></symbol><symbol id="grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="8" height="8" rx="1"/><rect x="14" y="2" width="8" height="8" rx="1"/><rect x="2" y="14" width="8" height="8" rx="1"/><rect x="14" y="14" width="8" height="8" rx="1"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">¿Qué señal guía el aprendizaje?</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">No todos los métodos necesitan ejemplos con una respuesta etiquetada.</text><text x="215" y="179" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Supervisado</text><g data-visual="scatterplot"><path d="M99 393L325 393" fill="none" stroke="#536078" stroke-width="2.5"/><path d="M99 393L99 238" fill="none" stroke="#536078" stroke-width="2.5"/><circle cx="121.6" cy="366.65" r="6" fill="#c74436" stroke="none" stroke-width="2"/><circle cx="141.94" cy="346.5" r="6" fill="#c74436" stroke="none" stroke-width="2"/><circle cx="171.32" cy="358.9" r="6" fill="#c74436" stroke="none" stroke-width="2"/><circle cx="155.5" cy="331" r="6" fill="#c74436" stroke="none" stroke-width="2"/></g><circle cx="241.38" cy="292.25" r="7" fill="#087f7a" stroke="none" stroke-width="2"/><circle cx="275.28" cy="282.95" r="7" fill="#087f7a" stroke="none" stroke-width="2"/><circle cx="266.24" cy="256.6" r="7" fill="#087f7a" stroke="none" stroke-width="2"/><circle cx="302.4" cy="272.1" r="7" fill="#087f7a" stroke="none" stroke-width="2"/><path d="M126 244L315 389" fill="none" stroke="#4f46b8" stroke-width="2" stroke-dasharray="6 6"/><rect x="93" y="427" width="244" height="42" rx="21" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="215" y="455" font-size="21" fill="#c74436" font-weight="600" text-anchor="middle">Etiquetas conocidas</text><text x="215" y="501" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Aprende a predecir</text><text x="215" y="533" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">la respuesta de ejemplos</text><text x="600" y="179" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Clustering</text><g data-visual="scatterplot"><path d="M489 393L713 393" fill="none" stroke="#536078" stroke-width="2.5"/><path d="M489 393L489 238" fill="none" stroke="#536078" stroke-width="2.5"/><circle cx="511.4" cy="366.65" r="6" fill="#4f46b8" stroke="none" stroke-width="2"/><circle cx="531.56" cy="346.5" r="6" fill="#4f46b8" stroke="none" stroke-width="2"/><circle cx="560.6800000000001" cy="358.9" r="6" fill="#4f46b8" stroke="none" stroke-width="2"/><circle cx="545" cy="331" r="6" fill="#4f46b8" stroke="none" stroke-width="2"/><circle cx="630.12" cy="292.25" r="6" fill="#4f46b8" stroke="none" stroke-width="2"/><circle cx="663.72" cy="282.95" r="6" fill="#4f46b8" stroke="none" stroke-width="2"/><circle cx="654.76" cy="256.6" r="6" fill="#4f46b8" stroke="none" stroke-width="2"/><circle cx="690.6" cy="272.1" r="6" fill="#4f46b8" stroke="none" stroke-width="2"/></g><circle cx="541" cy="352" r="46" fill="none" stroke="#c74436" stroke-width="2"/><circle cx="660" cy="275" r="46" fill="none" stroke="#087f7a" stroke-width="2"/><rect x="483" y="427" width="234" height="42" rx="21" fill="url(#indigo)" stroke="none" stroke-width="1.5"/><text x="600" y="455" font-size="21" fill="#4f46b8" font-weight="600" text-anchor="middle">Grupos por similitud</text><text x="600" y="501" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Busca estructura</text><text x="600" y="533" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">sin etiqueta objetivo</text><text x="985" y="179" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Refuerzo</text><circle cx="904" cy="296" r="40" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="904" cy="289" r="40" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="bot" href="#bot" x="882.4" y="267.4" width="43.2" height="43.2" color="#087f7a"/><circle cx="1073" cy="296" r="40" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="1073" cy="289" r="40" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="grid" href="#grid" x="1051.4" y="267.4" width="43.2" height="43.2" color="#4f46b8"/><path d="M951 273H1024" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="987" y="230" font-size="21" fill="#536078" font-weight="400" text-anchor="middle">acción</text><path d="M1073 337V377H904V338" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="985" y="407" font-size="21" fill="#087f7a" font-weight="600" text-anchor="middle">estado + recompensa</text><text x="985" y="501" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Aprende decisiones</text><text x="985" y="533" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">por sus consecuencias</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Identifica la señal: respuesta conocida, estructura o recompensa.</text></g>
</svg>
