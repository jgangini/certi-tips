<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">La Trazabilidad Enlaza Significado y Ejecución</title><desc id="description">Sigue el término «contrato vigente» hasta contratos.estado, la regla R-07 versión 2, la ejecución E-308 y el indicador consumidor. Cada enlace conserva una versión relevante y un responsable: propietario, steward, ingeniería o dueño de la métrica. La trazabilidad permite relacionar significado aprobado, implementación y resultado, en lugar de conservar artefactos aislados.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">La Trazabilidad Enlaza Significado y Ejecución</tspan></text><rect x="130" y="420" width="290" height="227" rx="0" fill="#F1EFED" stroke="#3C4545" stroke-width="3"/><rect x="130" y="420" width="290" height="6" rx="0" fill="#C06D30" stroke="none" stroke-width="2"/><text x="275" y="473.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="middle"><tspan x="275" y="473.27">TÉRMINO</tspan></text><text x="275" y="551.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="275" y="551.27">Contrato vigente</tspan></text><rect x="130" y="772" width="290" height="164" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><line x1="275" y1="647" x2="275" y2="772" stroke="#3C4545" stroke-width="3"/><text x="275" y="803.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="275" y="803.27">Propietario</tspan></text><g data-person-icon="user-supplied" transform="translate(251 867) scale(3)" fill="#3C4545"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"/><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z"/></g><rect x="480" y="420" width="290" height="227" rx="0" fill="#F1EFED" stroke="#3C4545" stroke-width="3"/><rect x="480" y="420" width="290" height="6" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><text x="625" y="473.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="middle"><tspan x="625" y="473.27">COLUMNA</tspan></text><text x="625" y="551.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="625" y="551.27">contratos.estado</tspan></text><rect x="480" y="772" width="290" height="164" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><line x1="625" y1="647" x2="625" y2="772" stroke="#3C4545" stroke-width="3"/><text x="625" y="803.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="625" y="803.27">Steward</tspan></text><g data-person-icon="user-supplied" transform="translate(601 867) scale(3)" fill="#3C4545"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"/><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z"/></g><rect x="830" y="420" width="290" height="227" rx="0" fill="#F1EFED" stroke="#3C4545" stroke-width="3"/><rect x="830" y="420" width="290" height="6" rx="0" fill="#749B6B" stroke="none" stroke-width="2"/><text x="975" y="473.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="middle"><tspan x="975" y="473.27">REGLA</tspan></text><text x="975" y="555.739" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="975" y="555.739">R-07 </tspan><tspan x="975" y="590.801">versión 2</tspan></text><rect x="830" y="772" width="290" height="164" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><line x1="975" y1="647" x2="975" y2="772" stroke="#3C4545" stroke-width="3"/><text x="975" y="807.84" font-size="25.5" fill="#