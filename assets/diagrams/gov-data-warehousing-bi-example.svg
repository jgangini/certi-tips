</g><line x1="1270" y1="575" x2="1320" y2="575" stroke="#3C4545" stroke-width="2" /><text x="1350" y="390.31" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="start"><tspan x="1350" y="390.31">La cabecera se repite </tspan><tspan x="1350" y="422.95">una vez por línea.</tspan></text><text x="1350" y="550.31" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1350" y="550.31">El importe de línea </tspan><tspan x="1350" y="582.95">mantiene su grano.</tspan></text><path d="M760 619 V708 H570 V758" fill="none" stroke="#C74634" stroke-width="4" stroke-linejoin="round" /><path d="M1110 619 V708 H1390 V758" fill="none" stroke="#3C4545" stroke-width="4" stroke-linejoin="round" /><rect x="460.95" y="763.05" width="218.1" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="570.0" y="797.55" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="middle"><tspan x="570.0" y="797.55">100 + 100 = 200</tspan></text><rect x="440.367" y="833.93" width="259.266" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="570.0" y="868.43" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="middle"><tspan x="570.0" y="868.43">SUMA INCORRECTA</tspan></text><rect x="1294.65" y="763.05" width="190.7" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1390.0" y="797.55" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1390.0" y="797.55">60 + 40 = 100</tspan></text><rect x="1192.499" y="833.93" width="395.002" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1390.0" y="868.43" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1390.0" y="868.43">SUMAR EN EL GRANO DE LÍNEA</tspan></text><rect x="130.0" y="325.0" width="1140.0" height="300.0" rx="1