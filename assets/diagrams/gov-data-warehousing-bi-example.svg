<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Un Join Puede Duplicar el Importe de Cabecera</title><desc id="description">Después del join, F-01 aparece una vez por cada línea. El importe de cabecera 100 se repite y su suma produce 200. Los importes de línea 60 y 40 mantienen su grano y suman el total real de 100. Elige la medida que corresponde a la granularidad del resultado y concilia contra la factura de origen.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Un Join Puede Duplicar el Importe de Cabecera</tspan></text><text x="130" y="277.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="130" y="277.59">DESPUÉS DEL JOIN</tspan></text><rect x="130" y="325" width="1140" height="100" rx="0" fill="#EEF3F4" stroke="#C2D4D4" stroke-width="2"/><text x="150" y="368.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="150" y="368.27">Factura</tspan></text><line x1="380" y1="325" x2="380" y2="425" stroke="#C2D4D4" stroke-width="2"/><text x="400" y="368.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="400" y="368.27">Línea</tspan></text><line x1="610" y1="325" x2="610" y2="425" stroke="#C2D4D4" stroke-width="2"/><text x="630" y="368.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="630" y="368.27">Cabecera</tspan></text><line x1="950" y1="325" x2="950" y2="425" stroke="#C2D4D4" stroke-width="2"/><text x="970" y="368.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="970" y="368.27">Línea importe</tspan></text><rect x="130" y="425" width="1140" height="100" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><text x="150" y="468.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="150" y="468.27">F-01</tspan></text><line x1="380" y1="425" x2="380" y2="525" stroke="#C2D4D4" stroke-width="2"/><text x="400" y="468.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="400" y="468.27">1</tspan></text><line x1="610" y1="425" x2="610" y2="525" stroke="#C2D4D4" stroke-width="2"/><text x="630" y="468.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="630" y="468.27">100</tspan></text><line x1="950" y1="425" x2="950" y2="525" stroke="#C2D4D4" stroke-width="2"/><text x="970" y="468.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="970" y="468.27">60</tspan></text><rect x="130" y="525" width="1140" height="100" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><text x="150" y="568.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="150" y="568.27">F-01</tspan></text><line x1="380" y1="525" x2="380" y2="625" stroke="#C2D4D4" stroke-width="2"/><text x="400" y="568.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="400" y="568.27">2</tspan></text><line x1="610" y1="525" x2="610" y2="625" stroke="#C2D4D4" stroke-width="2"/><text x="630" y="568.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="630" y="568.27">100</tspan></text><line x1="950" y1="525" x2="950" y2="625" stroke="#C2D4D4" stroke-width="2"/><text x="970" y="568.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="970" y="568.27">40</tspan></text><rect x="615" y="427" width="330" height="192" rx="0" fill="none" stroke="#C74634" stroke-width="4"/><rect x="955" y="427" width="310" height="192" rx="0" fill="none" stroke="#749B6B" stroke-width="6"/><rect x="1320" y="325" width="500"