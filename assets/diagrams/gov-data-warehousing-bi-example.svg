</g><line x1="1270" y1="575" x2="1320" y2="575" stroke="#3C4545" stroke-width="2"/><text x="1350" y="390.31" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="start"><tspan x="1350" y="390.31">La cabecera se repite </tspan><tspan x="1350" y="422.95">una vez por línea.</tspan></text><text x="1350" y="550.31" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1350" y="550.31">El importe de línea </tspan><tspan x="1350" y="582.95">mantiene su grano.</tspan></text><path d="M760 619 V708 H570 V758" fill="none" stroke="#C74634" stroke-width="4" stroke-linejoin="round"/><path d="M1110 619 V708 H1390 V758" fill="none" stroke="#3C4545" stroke-width="4" stroke-linejoin="round"/><text x="570" y="797.55" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="middle"><tspan x="570" y="797.55">100 + 100 = 200</tspan></text><text x="570" y="868.43" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="middle"><tspan x="570" y="868.43">SUMA INCORRECTA</tspan></text><text x="1390" y="797.55" font-size="25.5" fill="#2E5C70" font-weight="700" text-anchor="middle"><tspan x="1390" y="797.55">60 + 40 = 100</tspan></text><text x="1390" y="868.43" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1390" y="868.43">SUMAR EN EL GRANO DE LÍNEA</tspan></text></g></svg>
