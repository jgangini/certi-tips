<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Un Join Puede Duplicar el Importe de Cabecera</title><desc id="description">Después del join, F-01 aparece una vez por cada línea. El importe de cabecera 100 se repite y su suma produce 200. Los importes de línea 60 y 40 mantienen su grano y suman el total real de 100. Elige la medida que corresponde a la granularidad del resultado y concilia contra la factura de origen.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Un Join Puede Duplicar el Importe de Cabecera</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" transform="translate(-15.000 45.490)" data-center="960 608"><rect x="577.25" y="243.09" width="245.5" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="700.0" y="277.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="700.0" y="277.59">DESPUÉS DEL JOIN</tspan></text><rect x="130" y="325" width="1140" height="100" rx="0" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><path d="M142.0 325.0 H1258.0 Q1270.0 325.0 1270.0 337.0 V425.0 H130.0 V337.0 Q130.0 325.0 142.0 325.0 Z" fill="#59616E" stroke="none" data-table-header="true" /><text x="255.0" y="384.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="255.0" y="384.5">Factura</tspan></text><line x1="380" y1="325" x2="380" y2="425" stroke="#59616E" stroke-width="2" /><text x="495.0" y="384.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="495.0" y="384.5">Línea</tspan></text><line x1="610" y1="325" x2="610" y2="425" stroke="#59616E" stroke-width="2" /><text x="780.0" y="384.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="780.0" y="384.5">Cabecera</tspan></text><line x1="950" y1="325" x2="950" y2="425" stroke="#59616E" stroke-width="2" /><text x="1110.0" y="384.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="1110.0" y="384.5">Línea importe</tspan></text><rect x="130" y="425" width="1140" height="100" rx="0" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><text x="255.0" y="484.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="255.0" y="484.5">F-01</tspan></text><line x1="380" y1="425" x2="380" y2="525" stroke="#59616E" stroke-width="2" /><text x="495.0" y="484.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="495.0" y="484.5">1</tspan></text><line x1="610" y1="425" x2="610" y2="525" stroke="#59616E" stroke-width="2" /><text x="780.0" y="484.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="780.0" y="484.5">100</tspan></text><line x1="950" y1="425" x2="950" y2="525" stroke="#59616E" stroke-width="2" /><text x="1110.0" y="484.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1110.0" y="484.5">60</tspan></text><rect x="130" y="525" width="1140" height="100" rx="0" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><text x="255.0" y="584.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="255.0" y="584.5">F-01</tspan></text><line x1="380" y1="525" x2="380" y2="625" stroke="#59616E" stroke-width="2" /><text x="495.0" y="584.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="495.0" y="584.5">2</tspan></text><line x1="610" y1="525" x2="610" y2="625" stroke="#59616E" stroke-width="2" /><text x="780.0" y="584.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middl