<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title description">
<title id="title">Descubrir no equivale a ejecutar</title><desc id="description">La lista de herramientas comunica capacidades, no ejecuta operaciones. El protocolo no concede permisos por sí mismo. La depuración debe registrar evidencia pertinente sin exponer secretos ni datos privados completos.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff4ef"/><stop offset="1" stop-color="#f1ccc5"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f2f0ff"/><stop offset="1" stop-color="#d8d4f5"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#effaf7"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}.title{font-size:32px;font-weight:700}.label{font-size:26px;font-weight:700}.body{font-size:23px;fill:#536078}.small{font-size:21px;fill:#536078}.mono{font-family:Consolas,monospace;font-size:22px}.line{fill:none;stroke:#536078;stroke-width:2.5;marker-end:url(#arrow)}.icon{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#dce1eb;stroke-width:1.5}</style></defs>
<rect width="1200" height="590" fill="#f7f8fc"/>
<text x="56" y="64" class="title">Descubrir no equivale a ejecutar</text><text x="91" y="130" class="label" text-anchor="start">Confusión</text><text x="668" y="130" class="label" text-anchor="start">Distinción útil</text><rect x="56" y="164" width="487" height="99" rx="22" class="card"/><rect x="633" y="164" width="512" height="99" rx="22" class="card"/><path d="M557 214H618" class="line"/><rect x="56" y="289" width="487" height="99" rx="22" class="card"/><rect x="633" y="289" width="512" height="99" rx="22" class="card"/><path d="M557 339H618" class="line"/><rect x="56" y="414" width="487" height="99" rx="22" class="card"/><rect x="633" y="414" width="512" height="99" rx="22" class="card"/><path d="M557 464H618" class="line"/><text x="82" y="205" class="small" text-anchor="start">tools/list</text><text x="82" y="236" class="small" text-anchor="start">«Ya ejecuté la herramienta»</text><text x="660" y="205" class="small" text-anchor="start">Lista nombres y esquemas.</text><text x="660" y="236" class="small" text-anchor="start">tools/call solicita la ejecución.</text><text x="82" y="330" class="small" text-anchor="start">«Es compatible con MCP,</text><text x="82" y="361" class="small" text-anchor="start">entonces tiene acceso»</text><text x="660" y="330" class="small" text-anchor="start">Comprueba identidad, permisos</text><text x="660" y="361" class="small" text-anchor="start">y alcance de cada operación.</text><text x="82" y="455" class="small" text-anchor="start">«Para depurar, registro</text><text x="82" y="486" class="small" text-anchor="start">toda la conversación y secretos»</text><text x="660" y="455" class="small" text-anchor="start">Registra datos mínimos y útiles.</text><text x="660" y="486" class="small" text-anchor="start">Protege credenciales y privacidad.</text><rect x="56" y="164" width="7" height="99" rx="3" fill="#c74436"/><rect x="633" y="164" width="7" height="99" rx="3" fill="#087f7a"/><rect x="56" y="289" width="7" height="99" rx="3" fill="#c74436"/><rect x="633" y="289" width="7" height="99" rx="3" fill="#087f7a"/><rect x="56" y="414" width="7" height="99" rx="3" fill="#c74436"/><rect x="633" y="414" width="7" height="99" rx="3" fill="#087f7a"/></svg>
