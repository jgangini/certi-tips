<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="authorized-query-rag">
<title id="title">Dos preguntas, dos rutas de datos</title>
<desc id="description">La pregunta de órdenes usa identidad para filtrar por sede autorizada y estado pendiente antes de COUNT. La pregunta de política recupera la versión vigente autorizada y la cita. Similitud no sustituye un conteo exacto.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></symbol><symbol id="table" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 9h20M2 15h20M9 3v18M16 9v12"/></symbol><symbol id="search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="m15 15 7 7"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Dos preguntas, dos rutas de datos</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">La identidad del usuario forma parte de la consulta, no de una suposición del modelo.</text><rect x="56" y="153" width="489" height="42" rx="21" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="300.5" y="181" font-size="21" fill="#c74436" font-weight="600" text-anchor="middle">«¿Cuántas órdenes pendientes de mi sede?»</text><circle cx="148" cy="286" r="50" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="148" cy="279" r="50" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="user" href="#user" x="121" y="252" width="54" height="54" color="#c74436"/><text x="148" y="376" font-size="24" fill="#17243b" font-weight="700" text-anchor="middle">Mi identidad</text><path d="M209 279H314" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><rect x="337" y="224" width="267" height="108" rx="16" fill="#fff" stroke="#4f46b8" stroke-width="1.5"/><text x="470" y="265" font-size="23" fill="#4f46b8" font-weight="600" text-anchor="middle">Sede autorizada</text><text x="470" y="297" font-size="23" fill="#4f46b8" font-weight="600" text-anchor="middle">+ estado pendiente</text><path d="M620 279H735" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><use data-icon="table" href="#table" x="768" y="246" width="66" height="66" color="#087f7a"/><text x="1020" y="272" font-size="24" fill="#087f7a" font-weight="600" text-anchor="middle">COUNT(*)</text><text x="1020" y="305" font-size="24" fill="#087f7a" font-weight="600" text-anchor="middle">Conteo exacto</text><path d="M56 409L1144 409" fill="none" stroke="#dce1ec" stroke-width="1.5"/><rect x="56" y="457" width="449" height="42" rx="21" fill="url(#indigo)" stroke="none" stroke-width="1.5"/><text x="280.5" y="485" font-size="21" fill="#4f46b8" font-weight="600" text-anchor="middle">«¿Qué dice la política sobre demoras?»</text><path d="M520 478H624" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><use data-icon="search" href="#search" x="664" y="449" width="58" height="58" color="#087f7a"/><path d="M738 478H820" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><rect x="869" y="441" width="74" height="91" rx="12" fill="#e9eaf1" stroke="none" stroke-width="1.5"/><rect x="861" y="434" width="74" height="91" rx="12" fill="#fff" stroke="#087f7a" stroke-width="1.5"/><path d="M881 472L915 472" fill="none" stroke="#087f7a" stroke-width="3"/><path d="M881 495L915 495" fill="none" stroke="#087f7a" stroke-width="3"/><text x="1036" y="472" font-size="23" fill="#17243b" font-weight="600" text-anchor="middle">Versión vigente</text><text x="1036" y="504" font-size="23" fill="#17243b" font-weight="600" text-anchor="middle">+ cita</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">El filtro de sede limita el conteo; el acceso al documento limita la recuperación.</text></g>
</svg>
