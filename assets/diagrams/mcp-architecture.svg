<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura del Model Context Protocol</title>
  <desc id="description">La aplicación host contiene un modelo y un cliente MCP. El cliente mantiene una conexión con un servidor MCP que publica herramientas, recursos y prompts. MCP conecta aplicaciones a capacidades; no sustituye al modelo ni constituye por sí solo un sistema de autorización.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#675f59"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#17665e"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#252321}
      .title{font-size:30px;font-weight:700}
      .subtitle{font-size:20px;fill:#675f59}
      .label{font-size:23px;font-weight:700}
      .body{font-size:20px}
      .small{font-size:18px;fill:#675f59}
      .white{fill:#fff}
      .red{fill:#b43d32}
      .teal{fill:#17665e}
      .card{fill:#fff;stroke:#d9d0c7;stroke-width:2}
      .line{fill:none;stroke:#675f59;stroke-width:2.5;marker-end:url(#arrow)}
      .return{fill:none;stroke:#17665e;stroke-width:2.5;marker-end:url(#arrow-teal)}
    </style>
  </defs>
  <rect width="1000" height="660" fill="#faf8f5"/>

  <text x="40" y="50" class="title">MCP estandariza el acceso a capacidades</text>
  <text x="40" y="86" class="subtitle">La aplicación integra el modelo y usa clientes MCP para conectar servidores.</text>
  <rect x="40" y="130" width="391" height="381" rx="20" fill="#fff" stroke="#b43d32" stroke-width="2"/>
  <text x="65" y="173" class="label">Host: aplicación de IA</text>
  <text x="65" y="207" class="small">Controla contexto y permisos.</text>
  <rect x="65" y="235" width="341" height="85" rx="14" fill="#f6e6e1"/>
  <text x="235" y="271" text-anchor="middle" class="label">Modelo</text>
  <text x="235" y="300" text-anchor="middle" class="small">Decide o genera una respuesta.</text>
  <path d="M 236 327 V 358" class="line"/>
  <rect x="65" y="372" width="341" height="102" rx="14" fill="#eee9e3"/>
  <text x="235" y="413" text-anchor="middle" class="label">Cliente MCP</text>
  <text x="235" y="446" text-anchor="middle" class="body">Conexión con este servidor</text>
  <path d="M 440 420 H 562" fill="none" stroke="#675f59" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="501" y="391" text-anchor="middle" class="label">MCP</text>
  <rect x="577" y="130" width="383" height="381" rx="20" fill="#fff" stroke="#17665e" stroke-width="2"/>
  <text x="602" y="173" class="label">Servidor MCP</text>
  <text x="602" y="207" class="small">Expone capacidades acordadas.</text>
  <rect x="603" y="237" width="331" height="64" rx="12" fill="#e4eeeb"/>
  <text x="622" y="264" class="body"><tspan font-weight="700">Tools</tspan><tspan x="622" dy="26">Funciones invocables</tspan></text>
  <rect x="603" y="319" width="331" height="64" rx="12" fill="#e4eeeb"/>
  <text x="622" y="346" class="body"><tspan font-weight="700">Resources</tspan><tspan x="622" dy="26">Contenido consultable</tspan></text>
  <rect x="603" y="401" width="331" height="64" rx="12" fill="#e4eeeb"/>
  <text x="622" y="428" class="body"><tspan font-weight="700">Prompts</tspan><tspan x="622" dy="26">Plantillas que se pueden reutilizar</tspan></text>
  <rect x="40" y="542" width="920" height="55" rx="14" fill="#eee9e3"/>
  <text x="61" y="577" class="body">Un host puede usar varios clientes; cada cliente se conecta a un servidor.</text>
  <text x="40" y="627" class="small">MCP no concede permisos por sí solo: aplica autenticación, autorización y validación.</text>
</svg>
