<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">MCP: una aplicación, conexiones explícitas</title>
  <desc id="description">Una aplicación host contiene un modelo y dos clientes MCP. Cada cliente mantiene su propia conexión con un servidor. El primer servidor expone herramientas, recursos y plantillas; el segundo representa otra integración. El protocolo comunica capacidades, pero no concede permisos ni sustituye al modelo.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 7 4 1 7" fill="none" stroke="#087f7a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <linearGradient id="host" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f0f2fa"/></linearGradient>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}
      .eyebrow{font-size:14px;font-weight:700;letter-spacing:2px;fill:#4f46b8}
      .title{font-size:34px;font-weight:700;letter-spacing:-.7px}
      .subtitle{font-size:19px;fill:#536078}
      .label{font-size:23px;font-weight:700}
      .body{font-size:21px;fill:#536078}
      .meta{font-size:16px;fill:#536078}
      .icon{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .route{fill:none;stroke:#087f7a;stroke-width:2.5;stroke-linejoin:round;marker-start:url(#arrow);marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f7f8fc"/>
  <text x="56" y="50" class="eyebrow">03 / MODEL CONTEXT PROTOCOL</text>
  <text x="56" y="98" class="title">MCP conecta capacidades, no concede permisos</text>
  <text x="56" y="134" class="subtitle">Un contrato compartido entre tu aplicación y los sistemas que necesita consultar.</text>

  <!-- The host is an application window, not an additional protocol service. -->
  <rect x="63" y="206" width="366" height="434" rx="24" fill="#e5e8f2"/>
  <rect x="56" y="195" width="366" height="434" rx="24" fill="url(#host)" stroke="#d9deec" stroke-width="1.5"/>
  <path d="M56 245H422" stroke="#d9deec" stroke-width="1.5"/>
  <circle cx="80" cy="220" r="4" fill="#c74436"/><circle cx="97" cy="220" r="4" fill="#d5aa59"/><circle cx="114" cy="220" r="4" fill="#087f7a"/>
  <text x="396" y="226" text-anchor="end" class="meta">APLICACIÓN HOST</text>
  <circle cx="132" cy="325" r="43" fill="#ebe9fb"/>
  <g class="icon" stroke="#4f46b8">
    <rect x="112" y="305" width="40" height="40" rx="8"/>
    <path d="M122 305v-8m10 8v-8m10 8v-8m-20 48v8m10-8v8m10-8v8m-30-38h-8m8 10h-8m8 10h-8m48-20h8m-8 10h8m-8 10h8"/>
    <path d="m122 327 7 7 13-17"/>
  </g>
  <text x="194" y="320" class="label">Modelo</text>
  <text x="194" y="352" class="body">Interpreta y decide</text>
  <path d="M88 389H390" stroke="#d9deec"/>
  <text x="87" y="420" class="meta">CONTEXTO · POLÍTICAS · PERMISOS</text>
  <rect x="86" y="449" width="307" height="64" rx="16" fill="#fff" stroke="#c9c4ef" stroke-width="1.5"/>
  <g class="icon" stroke="#4f46b8"><path d="M106 472h20v17h-20zM111 472v-7m10 7v-7m-5 24v9"/></g>
  <text x="146" y="488" class="label">Cliente MCP A</text>
  <circle cx="393" cy="481" r="5" fill="#087f7a"/>
  <rect x="86" y="538" width="307" height="64" rx="16" fill="#fff" stroke="#c9c4ef" stroke-width="1.5"/>
  <g class="icon" stroke="#4f46b8"><path d="M106 561h20v17h-20zM111 561v-7m10 7v-7m-5 24v9"/></g>
  <text x="146" y="577" class="label">Cliente MCP B</text>
  <circle cx="393" cy="570" r="5" fill="#087f7a"/>
  <!-- Each path is an independent one-client / one-server connection. -->
  <path d="M400 481H478Q492 481 492 467V361Q492 347 506 347H633" class="route"/>
  <text x="533" y="311" text-anchor="middle" class="label" style="fill:#087f7a">MCP</text>
  <text x="557" y="396" text-anchor="middle" class="meta">solicitud</text>
  <text x="557" y="420" text-anchor="middle" class="meta">y resultado</text>
  <path d="M400 570H476Q490 570 490 584V598Q490 612 504 612H633" class="route"/>
  <text x="536" y="655" text-anchor="middle" class="meta">otra conexión</text>

  <rect x="644" y="195" width="500" height="343" rx="24" fill="#fff" stroke="#d9deec" stroke-width="1.5"/>
  <text x="674" y="236" class="label">Servidor MCP A</text>
  <text x="674" y="266" class="meta">PUBLICA CAPACIDADES</text>
  <!-- Rack illustration with status indicators and service bus. -->
  <rect x="675" y="297" width="123" height="176" rx="14" fill="#17243b"/>
  <rect x="686" y="309" width="101" height="40" rx="7" fill="#304158"/>
  <rect x="686" y="360" width="101" height="40" rx="7" fill="#304158"/>
  <rect x="686" y="411" width="101" height="40" rx="7" fill="#304158"/>
  <g fill="#83e0cb"><circle cx="704" cy="329" r="4"/><circle cx="704" cy="380" r="4"/><circle cx="704" cy="431" r="4"/></g>
  <g stroke="#a2b0c6" stroke-width="2.5" stroke-linecap="round"><path d="M720 329h46m-46 51h46m-46 51h46"/></g>
  <path d="M701 473v14m70-14v14m-81 0h92" fill="none" stroke="#17243b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="644" cy="347" r="5" fill="#087f7a"/>
  <g class="icon" stroke="#087f7a"><path d="m831 303-8 8 8 8m19-16 8 8-8 8m-6-19-6 22"/></g>
  <text x="877" y="314" class="label">Tools</text>
  <text x="826" y="347" class="body">Ejecutar operaciones</text>
  <path d="M826 365H1112" stroke="#e5e8f0"/>
  <g class="icon" stroke="#087f7a"><path d="M827 387h23v26h-23zM833 395h11m-11 9h8"/></g>
  <text x="877" y="406" class="label">Resources</text>
  <text x="826" y="439" class="body">Aportar contexto</text>
  <path d="M826 454H1112" stroke="#e5e8f0"/>
  <g class="icon" stroke="#087f7a"><path d="M827 474h26v19h-16l-10 7zM833 481h14"/></g>
  <text x="877" y="492" class="label">Prompts</text>
  <text x="826" y="523" class="body">Reutilizar plantillas</text>
  <rect x="644" y="563" width="500" height="98" rx="20" fill="#e8f4f1" stroke="#c5e2dc" stroke-width="1.5"/>
  <g class="icon" stroke="#087f7a"><rect x="674" y="585" width="38" height="20" rx="4"/><rect x="674" y="612" width="38" height="20" rx="4"/><path d="M684 595h17m-17 27h17"/></g>
  <text x="738" y="605" class="label">Servidor MCP B</text>
  <text x="738" y="637" class="body">Otro sistema, su propia conexión</text>
  <path d="M56 698H1144" stroke="#d9deec"/>
  <text x="56" y="732" class="meta" font-weight="700" letter-spacing="1.2">CERTITIPS / GUÍA VISUAL</text>
  <text x="379" y="732" class="meta">Un cliente por conexión. El acceso siempre requiere controles explícitos.</text>
</svg>
