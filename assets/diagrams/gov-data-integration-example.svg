<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Tres Eventos; una Sola Factura</title><desc id="description">El primer evento inserta F42 como emitida. El segundo repite esa emisión: reconocer el reintento conserva una sola fila. El tercero anula F42 y actualiza el estado de la misma factura. La anulación también debe llegar al indicador consumidor. Verifica identidad estable y tratamiento de cambios para que los reintentos no dupliquen registros ni dejen estados antiguos.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Tres Eventos; una Sola Factura</tspan></text><text x="110" y="275.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="110" y="275.59">EVENTO RECIBIDO</tspan></text><text x="1020" y="275.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1020" y="275.59">ESTADO DEL DESTINO</tspan></text><rect x="100" y="340" width="500" height="126" rx="0" fill="#FFFFFF" stroke="#00B0F0" stroke-width="4"/><g data-svgrepo-icon="document" transform="translate(200 362) scale(1.75)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
