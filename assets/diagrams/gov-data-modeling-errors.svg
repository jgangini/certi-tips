<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Tres Contraejemplos para Revisar el Modelo</title><desc id="description">Los tres contraejemplos muestran decisiones de modelado distintas. Dos personas con el mismo nombre necesitan claves que distingan su identidad. Una columna de consentimiento actual no demuestra desde cuándo estuvo autorizado un uso. Y «activo» puede referirse a contrato vigente o a facturación del periodo. Conserva identidad, tiempo y definición aprobada para interpretar correctamente cada registro.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Tres Contraejemplos para Revisar el Modelo</tspan></text><rect x="76" y="185" width="568" height="757" rx="0" fill="none" stroke="#697778" stroke-width="2"/><line x1="96" y1="681" x2="624" y2="681" stroke="#C2D4D4" stroke-width="2"/><rect x="674" y="185" width="568" height="757" rx="0" fill="none" stroke="#697778" stroke-width="2"/><line x1="694" y1="681" x2="1222" y2="681" stroke="#C2D4D4" stroke-width="2"/><rect x="1270" y="185" width="568" height="757" rx="0" fill="none" stroke="#697778" stroke-width="2"/><line x1="1290" y1="681" x2="1818" y2="681" stroke="#C2D4D4" stroke-width="2"/><text x="96" y="233.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="96" y="233.27">NOMBRE ≠ IDENTIDAD</tspan></text><text x="694" y="233.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="694" y="233.27">COLUMNA ≠ REGLA</tspan></text><text x="1290" y="233.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1290" y="233.27">TÉRMINO ≠ ACUERDO</tspan></text><rect x="96" y="300" width="520" height="270" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="96" y="300" width="520" height="84" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="300" width="520" height="6" rx="0" fill="#2E5C70" stroke="none" stroke-width="2"/><text x="130" y="352.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="130" y="352.59">ID</tspan></text><text x="292" y="352.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="292" y="352.59">Nombre</tspan></text><text x="130" y="443.75" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="130" y="443.75">C7</tspan></text><text x="292" y="444.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="292" y="444.59">Ana Pérez</tspan></text><text x="130" y="532.75" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="130" y="532.75">C8</tspan></text><text x="292" y="533.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="292" y="533.59">Ana Pérez</tspan></text><line x1="96" y1="478" x2="616" y2="478" stroke="#C2D4D4" stroke-width="2"/><rect x="694" y="300" width="520" height="270" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="694" y="300" width="520" height="6" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><text x="724" y="357.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="724" y="357.59">Campos disponibles</tspan></text><text x="724" y="435.262" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="724" y="435.262">id_cliente </tspan><tspan x="724" y="482.278">consentimiento_actual</tspan></text><text x="724" y="544.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="724" y="544.27">¿Desde qué fecha?</tspan></text><text x="1290" y="322.87" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1290" y="322.87">«Activo»</tspan></text><text x="1290" y="425.637" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1290" y="425.637">Comercial: </tspan><tspan x="1290" y="459.903">contrato vigente</tspan></text><text x="1290" y="555.637" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1290" y="555.637">Finanzas: </tspan><tspan x="1290" y="589.903">facturado en el periodo</tspan></text><text x="96" y="730.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="96" y="730.59">Definir una clave</tspan></text><text x="96" y="809.43" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="96" y="809.43">Conservar el origen del </tspan><tspan x="96" y="842.07">identificador.</tspan></text><text x="694" y="730.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="694" y="730.59">Representar el tiempo</tspan></text><text x="694" y="809.43" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="694" y="809.43">Modelar propósito, estado y </tspan><tspan x="694" y="842.07">vigencia.</tspan></text><text x="1290" y="730.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1290" y="730.59">Acordar el significado</tspan></text><text x="1290" y="809.43" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1290" y="809.43">Aprobar términos y usos </tspan><tspan x="1290" y="842.07">diferentes.</tspan></text></g></svg>
