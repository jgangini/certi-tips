<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Una regla abierta no crea una ruta</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Y una ruta correcta no inicia el proceso de la aplicación.</text><g data-layout="icon-label"><g data-artwork="true" data-badge="true"><circle cx="168" cy="280" r="51" fill="#fff" stroke="#4f46b8" stroke-width="2.5"/><use data-icon="network" href="#network" x="140" y="252" width="56" height="56" color="#4f46b8"/></g><g data-layout="caption"><text x="168" y="368" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Dirección y ruta</text><text x="168" y="410" font-size="22" fill="#536078" font-weight="400" text-anchor="middle">¿Dónde está el destino?</text></g></g><path d="M225 280H391" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><g data-layout="icon-label"><g data-artwork="true" data-badge="true"><circle cx="456" cy="280" r="51" fill="#fff" stroke="#4f46b8" stroke-width="2.5"/><use data-icon="shield" href="#shield" x="428" y="252" width="56" height="56" color="#4f46b8"/></g><g data-layout="caption"><text x="456" y="368" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Reglas de red</text><text x="456" y="410" font-size="22" fill="#536078" font-weight="400" text-anchor="middle">¿Se permite el puerto?</text></g></g><path d="M513 280H679" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><g data-layout="icon-label"><g data-artwork="true" data-badge="true"><circle cx="744" cy="280" r="51" fill="#fff" stroke="#4f46b8" stroke-width="2.5"/><use data-icon="server" href="#server" x="716" y="252" width="56" height="56" color="#4f46b8"/></g><g data-layout="caption"><text x="744" y="368" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Proceso</text><text x="744" y="410" font-size="22" fill="#536078" font-weight="400" text-anchor="middle">¿Está escuchando?</text></g></g><path d="M801 280H967" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><g data-layout="icon-label"><g data-artwork="true" data-badge="true"><circle cx="1032" cy="280" r="51" fill="#fff" stroke="#087f7a" stroke-width="2.5"/><use data-icon="check" href="#check" x="1004" y="252" width="56" height="56" color="#087f7a"/></g><g data-layout="caption"><text x="1032" y="368" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Respuesta</text><text x="1032" y="410" font-size="22" fill="#536078" font-weight="400" text-anchor="middle">¿Puede regresar?</text></g></g><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Diagnostica cada salto antes de ampliar permisos.</text></g>
