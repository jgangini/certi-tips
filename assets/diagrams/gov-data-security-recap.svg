<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Cada Derivado Conserva sus Condiciones de Uso</title><desc id="description">Desde los datos operacionales surgen una copia de prueba y una consulta de Atención con usos diferentes. La copia necesita proteger valores y relaciones para reconciliar; la consulta necesita limitar los datos a contratos autorizados para atender al cliente. Cada derivado conserva finalidad, audiencia, protección y revisión propias. Reevalúa esas condiciones cuando cambie su uso.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Cada Derivado Conserva sus Condiciones de Uso</tspan></text><rect x="96" y="424" width="500" height="218" rx="0" fill="#EEF3F4" stroke="#3C4545" stroke-width="3"/><rect x="96" y="424" width="500" height="6" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><text x="346" y="478.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="346" y="478.59">Datos operacionales</tspan></text><text x="346" y="552.145" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="346" y="552.145">Clientes · contratos </tspan><tspan x="346" y="590.395">Facturas</tspan></text><path d="M596 533 H870 M870 376 V780 M870 376 H1190 M870 780 H1190" fill="none" stroke="#3C4545" stroke-width="4" stroke-linejoin="round"/><text x="659" y="273.173" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="659" y="273.173">Revisar finalidad </tspan><tspan x="659" y="310.007">y tratamiento</tspan></text><line x1="870" y1="348" x2="870" y2="376" stroke="#3C4545" stroke-width="3"/><rect x="1190" y="241" width="634" height="270" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="1190" y="241" width="634" height="79" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="1190" y="241" width="634" height="6" rx="0" fill="#2E5C70" stroke="none" stroke-width="2"/><text x="1220" y="291.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1220" y="291.59">Copia de prueba</tspan></text><text x="1220" y="380.239" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1220" y="380.239">Finalidad: reconciliar </tspan><tspan x="1220" y="423.27">Protección: valores y relaciones </tspan><tspan x="1220" y="466.301">Acceso: equipo autorizado</tspan></text><rect x="1190" y="647" width="634" height="270" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="1190" y="647" width="634" height="79" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="1190" y="647" width="634" height="6" rx="0" fill="#2E5C70" stroke="none" stroke-width="2"/><text x="1220" y="697.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1220" y="697.59">Consulta de Atención</tspan></text><text x="1220" y="786.239" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1220" y="786.239">Finalidad: resolver consultas </tspan><tspan x="1220" y="829.27">Datos: contratos vigentes </tspan><tspan x="1220" y="872.301">Revisión: cuando cambia el uso</tspan></text></g></svg>
