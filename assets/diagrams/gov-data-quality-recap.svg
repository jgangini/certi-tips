<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Una Regla Lista para Operar</title><desc id="description">La ficha R-UNI-01 define la unicidad de la clave de factura para evitar dobles conteos. Registra propósito, población y versión del cierre, medición 198/200 = 99 %, exigencia del 100 %, propietario y acción ante fallo. Conserva esos elementos junto con la decisión de bloquear, corregir y repetir para que el resultado sea reproducible y útil en operación.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Una Regla Lista para Operar</tspan></text><rect x="120" y="257" width="1680" height="105" rx="0" fill="#EDF1F2" stroke="#C2D4D4" stroke-width="2"/><rect x="120" y="257" width="1680" height="6" rx="0" fill="#2E5C70" stroke="none" stroke-width="2"/><text x="236" y="316.91" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="236" y="316.91">REGLA R-UNI-01 · UNICIDAD DE LA CLAVE DE FACTURA</tspan></text><g data-svgrepo-icon="policy" transform="translate(160 285) scale(2.16667)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 13-8.381 8.38a1 1 0 0 1-3.001-3l8.384-8.381" />
