<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 782" role="img" aria-labelledby="title description">
<title id="title">LangChain: una secuencia fija o un ciclo con decisiones</title>
<desc id="description">La composición LCEL sigue prompt, modelo y parser. En un agente, el modelo propone una llamada; la aplicación valida y ejecuta la función, devuelve el resultado con su ID y el loop continúa hasta una respuesta final o un límite.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}.title{font-size:34px;font-weight:700}.label{font-size:27px;font-weight:700}.body{font-size:24px;fill:#536078}.small{font-size:22px;fill:#536078}.flow{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.card{fill:#fff;stroke:#dce1ec;stroke-width:1.5}.white{fill:#fff}</style>
</defs>
<rect width="1200" height="782" fill="#f7f8fc"/>
<text x="56" y="64" class="title">El camino cambia cuando hay decisiones</text>
<text x="56" y="105" class="small">Una chain compone pasos; un agente decide dentro de un ciclo controlado.</text>
<rect x="56" y="140" width="1088" height="222" rx="24" class="card"/>
<text x="82" y="206" class="label">Pipeline / LCEL</text>
<text x="82" y="252" class="small"><tspan x="82">La aplicación fija</tspan><tspan x="82" dy="30">la secuencia.</tspan></text>
<g transform="translate(474 225)"><circle r="52" fill="#e9e8f8"/><g fill="none" stroke="#4f46b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-26-22H26V18H-9L-26 31Z"/><path d="M-14-8H14M-14 3H7"/></g></g><g transform="translate(757 225)"><circle r="52" fill="#fae6e1"/><g transform="translate(-30 -30) scale(2.5)" fill="none" stroke="#c74436" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v2M12 2v2M17 20v2M17 2v2M2 12h2M2 17h2M2 7h2M20 12h2M20 17h2M20 7h2M7 20v2M7 2v2"/><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/></g></g><g transform="translate(1030 225)"><circle r="52" fill="#e1f2ee"/><g transform="translate(-30 -30) scale(2.5)" fill="none" stroke="#087f7a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h20M6 12h12M9 19h6"/></g></g>
<path d="M526 225H705" class="flow"/><path d="M809 225H978" class="flow"/>
<g text-anchor="middle"><text x="474" y="319" class="label">Prompt</text><text x="757" y="319" class="label">Modelo</text><text x="1030" y="319" class="label">Parser</text></g>
<rect x="56" y="390" width="1088" height="338" rx="24" fill="#eef3f5" stroke="#dce1ec"/>
<text x="82" y="451" class="label">Agente</text>
<text x="82" y="495" class="small"><tspan x="82">El modelo propone;</tspan><tspan x="82" dy="30">el runtime coordina.</tspan></text>
<rect x="374" y="438" width="190" height="159" rx="20" class="card"/><rect x="835" y="438" width="281" height="159" rx="20" class="card"/>
<g transform="translate(469 493)"><circle r="44" fill="#fae6e1"/><g transform="translate(-30 -30) scale(2.5)" fill="none" stroke="#c74436" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v2M12 2v2M17 20v2M17 2v2M2 12h2M2 17h2M2 7h2M20 12h2M20 17h2M20 7h2M7 20v2M7 2v2"/><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/></g></g><g transform="translate(975 493)"><circle r="44" fill="#e1f2ee"/><g transform="translate(-30 -30) scale(2.5)" fill="none" stroke="#087f7a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/></g></g>
<text x="469" y="570" text-anchor="middle" class="label">Modelo</text><text x="975" y="570" text-anchor="middle" class="label">Aplicación + tool</text>
<path d="M564 497H835" class="flow"/>
<text x="700" y="470" text-anchor="middle" class="small">Llamada + argumentos</text>
<text x="700" y="537" text-anchor="middle" class="small">Validar y ejecutar</text>
<path d="M975 597V641Q975 663 953 663H491Q469 663 469 641V597" class="flow"/>
<text x="727" y="704" text-anchor="middle" class="small">Resultado + ID de llamada</text>
<rect x="82" y="625" width="176" height="58" rx="14" fill="#17243b"/>
<text x="170" y="662" text-anchor="middle" class="small white">Fin o límite</text>
<path d="M374 549H341Q319 549 319 571V632Q319 654 297 654H258" class="flow"/>
</svg>
