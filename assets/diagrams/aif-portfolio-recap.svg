<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="shared-responsibility">
<title id="title">Decide cuánto necesitas construir</title>
<desc id="description">Decide cuánto necesitas construir</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19H18a4 4 0 0 0 0-8h-1a6 6 0 0 0-12-1a4.6 4.6 0 0 0 1 9Z"/></symbol><symbol id="flask" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8M9 2v7L2 21h20L15 9V2M7 14h10"/></symbol><symbol id="server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2" width="18" height="8" rx="2"/><rect x="3" y="14" width="18" height="8" rx="2"/><path d="M6 6h.1M6 18h.1M11 6h6M11 18h6"/></symbol><symbol id="shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4v7c0 5-6 8-9 9-3-1-9-4-9-9V6Z"/><path d="m7 12 3 3 7-7"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Decide cuánto necesitas construir</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Las tres rutas comparten controles, aunque gestionen trabajos diferentes.</text><g data-concept="Consumir"><circle cx="215" cy="280" r="65" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="215" cy="273" r="65" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="cloud" href="#cloud" x="179.9" y="237.9" width="70.2" height="70.2" color="#c74436"/><text x="215" y="381" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Consumir</text><text x="215" y="416" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">API preparada para</text><text x="215" y="448" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">una tarea conocida</text></g><g data-concept="Desarrollar"><circle cx="600" cy="280" r="65" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="600" cy="273" r="65" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="flask" href="#flask" x="564.9" y="237.9" width="70.2" height="70.2" color="#4f46b8"/><text x="600" y="381" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Desarrollar</text><text x="600" y="416" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Datos, modelo</text><text x="600" y="448" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">y evaluación propios</text></g><g data-concept="Operar"><circle cx="985" cy="280" r="65" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="985" cy="273" r="65" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="server" href="#server" x="949.9" y="237.9" width="70.2" height="70.2" color="#087f7a"/><text x="985" y="381" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Operar</text><text x="985" y="416" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Cómputo, entorno</text><text x="985" y="448" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">y comunicación</text></g><path d="M215 456L215 492" fill="none" stroke="#536078" stroke-width="2"/><path d="M600 456L600 492" fill="none" stroke="#536078" stroke-width="2"/><path d="M985 456L985 492" fill="none" stroke="#536078" stroke-width="2"/><path d="M215 492L985 492" fill="none" stroke="#536078" stroke-width="2"/><use data-icon="shield" href="#shield" x="308.5" y="516.5" width="37" height="37" color="#087f7a"/><text x="366" y="543" font-size="24" fill="#17243b" font-weight="600" text-anchor="start">En todos: permisos, calidad y supervisión</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">La plataforma aporta capacidades; la responsabilidad sobre el uso permanece.</text></g>
</svg>
