<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="spatial-temporal">
<title id="title">La forma del dato orienta la arquitectura</title>
<desc id="description">Una imagen de pieza se convierte en mapas de características y se reduce mediante pooling. Una onda de vibración entra a estados recurrentes. Se evalúa con equipos y periodos nuevos.</desc>
