<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Cada Atributo Superviviente Conserva su Razón</title><desc id="description">La identidad de Ana ya está confirmada; la tabla explica qué valor sobrevive por atributo. La identificación procede de una fuente validada, la dirección de la confirmación más reciente y los identificadores de Ventas y Facturación se conservan como correspondencias. Un teléfono compartido sigue siendo un indicio. El consentimiento necesita revisión por finalidad y vigencia, separada de la consolidación de identidad.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Cada Atributo Superviviente Conserva su Razón</tspan></text><g data-person-icon="user-supplied" transform="translate(100 213) scale(2.625)" fill="#3C4545"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"/><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z"/></g><text x="165" y="253.27" font-size="25.5" fill="#697778" font-weight="400" text-anchor="start"><tspan x="165" y="253.27">Identidad de Ana confirmada · valores ilustrativos del caso</tspan></text><rect x="100" y="304" width="1720" height="140" rx="0" fill="#EEF3F4" stroke="#C2D4D4" stroke-width="2"/><text x="120" y="354.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="120" y="354.27">Atributo</tspan></text><line x1="400" y1="304" x2="400" y2="444" stroke="#C2D4D4" stroke-width="2"/><text x="420" y="358.637" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="420" y="358.637">Ventas </tspan><ts