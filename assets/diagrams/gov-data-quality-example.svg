<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Dos Reglas Sobre la Misma Población</title><desc id="description">La cuadrícula representa 1 000 contratos, diez por cuadrado, con defectos sin superposición. La completitud alcanza 990/1 000 = 99 % y supera su umbral. La regla de fecha presente y dentro del periodo alcanza 970/1 000 = 97 % y falla el mínimo del 98 %. Distingue población, defectos y umbrales de cada regla antes de combinar o comparar porcentajes.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Dos Reglas Sobre la Misma Población</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" transform="translate(0.500 36.115)" data-center="960 608"><rect x="129.0" y="195.77" width="412.397" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="335.1984375" y="230.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="335.1984375" y="230.27">1 000 contratos · 10 por cuadrado</tspan></text><rect x="884.0" y="195.77" width="332.597" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1050.2984375" y="230.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1050.2984375" y="230.27">Defectos sin superposición</tspan></text><rect x="145" y="286" width="52" height="52" rx="0" fill="#397C46" stroke="#FFFFFF" stroke-width="3" /><rect x="207" y="286" width="52" height="52" rx="0" fill="#397C46" stroke="#FFFFFF" stroke-width="3" /><rect x="269" y="286" width="52" height="52" rx="0" fi