<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="modality-mapping">
<title id="title">Mira la entrada, reconoce la tarea</title>
<desc id="description">Un reclamo se clasifica en una etiqueta; un audio se transcribe a texto; una foto se analiza para localizar una pieza. Entrada, transformación y salida quedan separadas.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v14H8l-5 5zM7 7h10M7 11h7"/></symbol><symbol id="tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h9l11 11-9 9L2 12Z"/><circle cx="7" cy="8" r="1.4"/></symbol><symbol id="wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10v4m4-8v12m4-16v20m4-15v10m4-13v16m4-10v4"/></symbol><symbol id="doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9Z"/><path d="M14 2v7h7M7 13h10M7 17h7"/></symbol><symbol id="image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><circle cx="8" cy="8" r="2"/><path d="m3 18 6-6 4 4 4-5 5 7"/></symbol><symbol id="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12Z"/><circle cx="12" cy="12" r="3"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Mira la entrada, reconoce la tarea</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Texto, audio e imagen no se procesan de la misma manera.</text><text x="164" y="175" font-size="24" fill="#536078" font-weight="600" text-anchor="middle">Entrada</text><text x="573" y="175" font-size="24" fill="#536078" font-weight="600" text-anchor="middle">Tarea</text><text x="975" y="175" font-size="24" fill="#536078" font-weight="600" text-anchor="middle">Salida</text><circle cx="103" cy="256" r="35" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="103" cy="249" r="35" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="chat" href="#chat" x="84.1" y="230.1" width="37.800000000000004" height="37.800000000000004" color="#c74436"/><text x="164" y="257" font-size="23" fill="#17243b" font-weight="600" text-anchor="start">«No enciende»</text><path d="M393 249H470" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><rect x="490" y="228" width="188" height="42" rx="21" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="584" y="256" font-size="21" fill="#c74436" font-weight="600" text-anchor="middle">Clasificar</text><path d="M700 249H794" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><use data-icon="tag" href="#tag" x="815" y="225" width="48" height="48" color="#087f7a"/><text x="883" y="257" font-size="23" fill="#17243b" font-weight="600" text-anchor="start">Avería eléctrica</text><circle cx="103" cy="377" r="35" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="103" cy="370" r="35" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="wave" href="#wave" x="84.1" y="351.1" width="37.800000000000004" height="37.800000000000004" color="#4f46b8"/><text x="164" y="378" font-size="23" fill="#17243b" font-weight="600" text-anchor="start">Audio de llamada</text><path d="M393 370H470" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><rect x="490" y="349" width="188" height="42" rx="21" fill="url(#indigo)" stroke="none" stroke-width="1.5"/><text x="584" y="377" font-size="21" fill="#4f46b8" font-weight="600" text-anchor="middle">Transcribir</text><path d="M700 370H794" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><use data-icon="doc" href="#doc" x="815" y="346" width="48" height="48" color="#087f7a"/><text x="883" y="378" font-size="23" fill="#17243b" font-weight="600" text-anchor="start">«El motor se apaga»</text><circle cx="103" cy="498" r="35" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="103" cy="491" r="35" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="image" href="#image" x="84.1" y="472.1" width="37.800000000000004" height="37.800000000000004" color="#087f7a"/><text x="164" y="499" font-size="23" fill="#17243b" font-weight="600" text-anchor="start">Foto de la pieza</text><path d="M393 491H470" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><rect x="490" y="470" width="188" height="42" rx="21" fill="url(#teal)" stroke="none" stroke-width="1.5"/><text x="584" y="498" font-size="21" fill="#087f7a" font-weight="600" text-anchor="middle">Detectar</text><path d="M700 491H794" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><use data-icon="eye" href="#eye" x="815" y="467" width="48" height="48" color="#087f7a"/><text x="883" y="499" font-size="23" fill="#17243b" font-weight="600" text-anchor="start">Pieza + ubicación</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">El mismo archivo puede servir para tareas distintas: define la salida.</text></g>
</svg>
