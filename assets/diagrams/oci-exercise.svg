<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="title description">
  <title id="title">Conservar el backend y usar OCI como proveedor de inferencia</title>
  <desc id="description">El backend existente sigue operando su lógica, funciones y despliegue. Un cliente compatible apunta al endpoint OCI con identidad, proyecto y modelo compatibles. No hace falta trasladar la aplicación completa para consumir la API.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#536078" stroke-width="1.6"/></marker><linearGradient id="surface" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#d7d2f4"/></linearGradient><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b;font-size:22px}.h{font-size:34px;font-weight:700}.label{font-size:26px;font-weight:700}.line{fill:none;stroke:#536078;stroke-width:2.5;marker-end:url(#arrow)}.icon{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style></defs>
  <rect width="1200" height="550" fill="#f7f8fc"/><text x="56" y="65" class="h">Cambiar la inferencia no obliga a mover el backend</text>
  <rect x="56" y="118" width="469" height="325" rx="25" fill="#fff" stroke="#d4d8e6" stroke-width="2"/><text x="85" y="165" class="label">Despliegue existente</text>
  <g class="icon-badge" data-icon="app-window"><circle cx="148" cy="267" r="59" fill="#ded9f2"/><circle cx="143" cy="259" r="59" fill="url(#surface)"/><g transform="translate(113 229) scale(2.5)" fill="none" stroke="#4f46b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 4v4M2 8h20M6 4v4"/></g></g>
  <text x="230" y="248" class="label">Tu aplicación</text><text x="230" y="285">Lógica y funciones</text><text x="86" y="363">Tu equipo sigue operando el backend</text><text x="86" y="402">y validando sus acciones.</text>
  <rect x="764" y="118" width="380" height="325" rx="25" fill="#e1f2ee" stroke="#bfded6" stroke-width="2"/><text x="798" y="165" class="label">OCI Generative AI</text>
  <g class="icon" stroke="#087f7a"><path d="M857 274h164a31 31 0 0 0-12-59 48 48 0 0 0-89-12 34 34 0 0 0-63 36 18 18 0 0 0 0 35Z"/></g><text x="954" y="336" text-anchor="middle" class="label">Responses API</text><text x="954" y="376" text-anchor="middle">Modelo compatible</text>
  <path d="M525 250H764" class="line"/><path d="M764 324H525" class="line"/><text x="644" y="232" text-anchor="middle">Petición</text><text x="644" y="306" text-anchor="middle">Resultado</text>
  <text x="600" y="502" text-anchor="middle" style="fill:#536078">Ajusta endpoint · autenticación · proyecto · modelo · herramientas compatibles</text>
</svg>
