<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="title description">
<title id="title">Tres llamadas para calcular una compra</title>
<desc id="description">En la primera llamada multiplicar 3 por 24 devuelve 72. En la segunda multiplicar 4 por 18 devuelve 72. En la tercera sumar ambos resultados devuelve 144. La aplicación ejecuta las operaciones que propone el modelo.</desc>
<defs>
  <linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient>
  <linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient>
  <linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}.title{font-size:34px;font-weight:700}.label{font-size:27px;font-weight:700}.body{font-size:23px;fill:#536078}.small{font-size:22px;fill:#536078}.flow{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.icon{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.white{fill:#fff}</style>
</defs>
<rect width="1200" height="530" fill="#f7f8fc"/>
<text x="56" y="70" class="title">Dos subtotales, un total comprobable</text>
<path d="M292 218H520" class="flow"/><path d="M680 218H908" class="flow"/>
<g transform="translate(212 218)"><circle cy="7" r="80" fill="#e9eaf1"/><circle r="80" fill="url(#coral)"/><path d="m-19-19 38 38m0-38-38 38" class="icon" stroke="#c74436" stroke-width="5"/></g>
<g transform="translate(600 218)"><circle cy="7" r="80" fill="#e9eaf1"/><circle r="80" fill="url(#indigo)"/><path d="m-19-19 38 38m0-38-38 38" class="icon" stroke="#4f46b8" stroke-width="5"/></g>
<g transform="translate(988 218)"><circle cy="7" r="80" fill="#e9eaf1"/><circle r="80" fill="url(#teal)"/><path d="M-25 0h50M0-25v50" class="icon" stroke="#087f7a" stroke-width="5"/></g>
<g text-anchor="middle"><text x="212" y="117" class="small">1 · multiplicar</text><text x="600" y="117" class="small">2 · multiplicar</text><text x="988" y="117" class="small">3 · sumar</text>
<text x="212" y="350" class="label">3 × 24 = 72</text><text x="600" y="350" class="label">4 × 18 = 72</text><text x="988" y="350" class="label">72 + 72 = 144</text>
<text x="212" y="387" class="body">Primer subtotal</text><text x="600" y="387" class="body">Segundo subtotal</text><text x="988" y="387" class="body">Total comprobado</text></g>
<rect x="340" y="442" width="520" height="56" rx="18" fill="#17243b"/><text x="600" y="479" text-anchor="middle" class="label white">Respuesta al usuario: USD 144</text>
</svg>
