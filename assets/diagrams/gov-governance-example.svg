<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Dos Definiciones de Cliente Activo</title><desc id="description">Cada letra representa un cliente ficticio de Horizonte. Comercial cuenta a quienes tienen contrato vigente: A y B. Finanzas cuenta a quienes fueron facturados en el periodo: B y C. B cumple ambas reglas y aparece en la intersección; A solo cumple la primera y C solo la segunda. Los dos indicadores cuentan dos clientes, pero incluyen personas distintas. Por eso hay que acordar la regla, el nombre y el responsable de cada indicador antes de comparar sus resultados.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Dos Definiciones de Cliente Activo</tspan></text><circle cx="800" cy="576" r="240" fill="#FFFFFF" stroke="none" stroke-width="0"/><circle cx="1120" cy="576" r="240" fill="#FFFFFF" stroke="none" stroke-width="0"/><path d="M960 397.115 A240 240 0 1 0 960 754.885" fill="none" stroke="#397C46" stroke-width="4" stroke-linejoin="round"/><path d="M960 397.115 A240 240 0 1 1 960 754.885" fill="none" stroke="#C74634" stroke-width="4" stroke-linejoin="round"/><path d="M960 397.115 A240 240 0 0 1 960 754.885 A240 240 0 0 1 960 397.115 Z" fill="#FFFFFF" stroke="#59616E" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 8"/><rect x="96" y="524" width="340" height="104" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5"/><text x="266" y="566.8" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="266" y="566.8">Contrato Vigente</tspan></text><text x="266" y="606.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="266" y="606.8">Responsable: Comercial</tspan></text><line x1="436" y1="576" x2="560" y2="576" stroke="#59616E" stroke-width="2"/><path d="M560 576 L544 584 L544 568 Z" fill="#59616E" stroke="#59616E" stroke-width="1" stroke-linejoin="round"/><rect x="1484" y="524" width="340" height="104" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5"/><text x="1654" y="566.8" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1654" y="566.8">Facturado en el Periodo</tspan></text><text x="1654" y="606.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1654" y="606.8">Responsable: Finanzas</tspan></text><line x1="1484" y1="576" x2="1360" y2="576" stroke="#59616E" stroke-width="2"/><path d="M1360 576 L1376 568 L1376 584 Z" fill="#59616E" stroke="#59616E" stroke-width="1" stroke-linejoin="round"/><g data-client="A"><g data-person-icon="user-supplied" transform="translate(672 505.2) scale(6)" fill="#181818"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"/><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z"/></g><text x="720" y="634.8" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="720" y="634.8">Cliente A</tspan></text></g><g data-client="B"><g data-person-icon="user-supplied" transform="translate(912 505.2) scale(6)" fill="#181818"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"/><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z"/></g><text x="960" y="634.8" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="960" y="634.8">Cliente B</tspan></text></g><g data-client="C"><g data-person-icon="user-supplied" transform="translate(1152 505.2) scale(6)" fill="#181818"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"/><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z"/></g><text x="1200" y="634.8" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1200" y="634.8">Cliente C</tspan></text></g><rect x="730" y="840" width="140" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5"/><text x="800" y="874.8" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="800" y="874.8">A + B</tspan></text><rect x="1050" y="840" width="140" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5"/><text x="1120" y="874.8" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1120" y="874.8">B + C</tspan></text></g></svg>
