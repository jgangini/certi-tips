<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">El Mismo Título Puede Ocultar Dos Contratos</title><desc id="description">Los dos paneles se llaman «Clientes activos», pero usan poblaciones, fechas, versiones de definición y formas de lectura diferentes. El comercial incluye vigentes y pendientes hoy; el financiero usa solo vigentes del cierre de septiembre. Un SQL válido no demuestra equivalencia de indicadores. Compara sus contratos antes de conciliar cifras o explicar diferencias.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">El Mismo Título Puede Ocultar Dos Contratos</tspan></text><rect x="120" y="270" width="780" height="535" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="120" y="270" width="780" height="6" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><g data-svgrepo-icon="chart" transform="translate(160 296) scale(2.16667)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16" />
