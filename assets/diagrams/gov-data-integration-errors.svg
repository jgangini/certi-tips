<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Busca la Falla Dentro del Intercambio</title><desc id="description">Localiza el fallo en cada intercambio. Entregar de inmediato un dato equivocado no corrige su significado. Una credencial compartida puede hacer que la fuente vea al servicio, no al usuario final. Un flujo que solo transmite altas deja activa una factura anulada. Comprueba semántica, identidad efectiva y propagación de bajas y correcciones, además de la latencia.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Busca la Falla Dentro del Intercambio</tspan></text><rect x="82" y="217" width="1740" height="238" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><text x="100" y="262.27" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="100" y="262.27">LATENCIA</tspan></text><text x="105" y="326.43" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="105" y="326.43">Dato equivocado</tspan></text><line x1="450" y1="316" x2="600" y2="316" stroke="#3C4545" stroke-width="4"/><path d="M600 316 L584 324 L584 308 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><rect x="600" y="272" width="530" height="104" rx="0" fill="#EEF3F4" stroke="#3C4545" stroke-width="3"/><text x="865" y="329.43" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="865" y="329.43">Entrega inmediata</tspan></text><line x1="1130" y1="316" x2="1290" y2="316" stroke="#3C4545" stroke-width="4"/><path d="M1290 316 L1274 324 L1274 308 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><text x="1330" y="326.43" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1330" y="326.43">Indicador equivocado</tspan></text><line x1="865" y1="376" x2="865" y2="394" stroke="#3C4545" stroke-width="2"/><g data-svgrepo-icon="audit" transform="translate(600 399) scale(1.58333)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
