</g><text x="660" y="431.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="660" y="431.27">Revisar significado y calidad.</tspan></text><line x1="96" y1="460" x2="1824" y2="460" stroke="#C2D4D4" stroke-width="2"/><rect x="82" y="467" width="1740" height="238" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><text x="100" y="512.27" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="100" y="512.27">IDENTIDAD</tspan></text><g data-person-icon="user-supplied" transform="translate(105 533) scale(2.625)" fill="#3C4545"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"/><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z"/></g><text x="170" y="576.43" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="170" y="576.43">Usuario final</tspan></text><line x1="450" y1="566" x2="600" y2="566" stroke="#3C4545" stroke-width="4"/><path d="M600 566 L584 574 L584 558 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><rect x="600" y="522" width="530" height="104" rx="0" fill="#F7EFE8" stroke="#3C4545" stroke-width="3"/><text x="865" y="579.43" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="865" y="579.43">Credencial compartida</tspan></text><line x1="1130" y1="566" x2="1290" y2="566" stroke="#3C4545" stroke-width="4"/><path d="M1290 566 L1274 574 L1274 558 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><text x="1330" y="576.43" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1330" y="576.43">Fuente ve al servicio</tspan></text><line x1="865" y1="626" x2="865" y2="644" stroke="#3C4545" stroke-width="2"/><g data-svgrepo-icon="key" transform="translate(600 649) scale(1.58333)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejo