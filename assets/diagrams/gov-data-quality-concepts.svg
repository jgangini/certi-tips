<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Una Fecha Presente Puede Seguir Siendo Incorrecta</title><desc id="description">El contrato verificado indica 01 SEP, pero el dato capturado contiene 31 AGO. La fecha está presente y tiene un formato admitido: cumple completitud y validez. Falla exactitud porque no coincide con la evidencia. Consistencia, unicidad y oportunidad siguen sin prueba. Evalúa cada dimensión con su evidencia específica; superar dos controles no demuestra calidad en todos los usos.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Una Fecha Presente Puede Seguir Siendo Incorrecta</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" transform="translate(10.000 36.452)" data-center="960 608"><rect x="364.925" y="215.09" width="310.15" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="520.0" y="249.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="520.0" y="249.59">CONTRATO VERIFICADO</tspan></text><rect x="130" y="285" width="780" height="130" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M142.0 285.0 H898.0 Q910.0 285.0 910.0 297.0 V357.0 H130.0 V297.0 Q130.0 285.0 142.0 285.0 Z" fill="#59616E" stroke="none" data-table-header="true" /><g data-svgrepo-icon="contract" transform="translate(164 325) scale(2.33333)" color="#FFFFFF" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.364 13.634a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506l4.013-4.009a1 1 0 0 0-3.004-3.004z" />
