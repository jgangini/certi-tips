"><tspan x="840" y="713.27">CUMPLE</tspan></text><text x="130" y="809.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="130" y="809.59">Exactitud</tspan></text><text x="130" y="863.27" font-size="25.5" fill="#697778" font-weight="400" text-anchor="start"><tspan x="130" y="863.27">No coincide con el contrato</tspan></text><text x="840" y="836.27" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="end"><tspan x="840" y="836.27">FALLA</tspan></text><text x="1405.0" y="498.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="1405.0" y="498.5">TODAVÍA SIN EVIDENCIA</tspan></text><text x="1040" y="572.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1040" y="572.59">Consistencia</tspan></text><text x="1040" y="626.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1040" y="626.27">Comparar con otros sistemas</tspan></text><text x="1040" y="695.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1040" y="695.59">Unicidad</tspan></text><text x="1040" y="749.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1040" y="749.27">Revisar registros duplicados</tspan></text><text x="1040" y="818.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1040" y="818.59">Oportunidad</tspan></text><text x="1040" y="872.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1040" y="872.27">Medir disponibilidad a tiempo</tspan></text></g></g></svg>
