<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Una Fecha Presente Puede Seguir Siendo Incorrecta</title><desc id="description">El contrato verificado indica 01 SEP, pero el dato capturado contiene 31 AGO. La fecha está presente y tiene un formato admitido: cumple completitud y validez. Falla exactitud porque no coincide con la evidencia. Consistencia, unicidad y oportunidad siguen sin prueba. Evalúa cada dimensión con su evidencia específica; superar dos controles no demuestra calidad en todos los usos.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Una Fecha Presente Puede Seguir Siendo Incorrecta</tspan></text><text x="130" y="249.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="130" y="249.59">CONTRATO VERIFICADO</tspan></text><rect x="130" y="285" width="780" height="130" rx="0" fill="#EEF3EC" stroke="#3C4545" stroke-width="3"/><g data-svgrepo-icon="contract" transform="translate(164 325) scale(2.33333)" color="#181818" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.364 13.634a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506l4.013-4.009a1 1 0 0 0-3.004-3.004z" />
  <path d="M14.487 7.858A1 1 0 0 1 14 7V2" />
  <path d="M20 19.645V20a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l2.516 2.516" />
  <path d="M8 18h1" />
</g><text x="520" y="354.83" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="520" y="354.83">01 SEP</tspan></text><text x="1010" y="249.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1010" y="249.59">DATO CAPTURADO</tspan></text><rect x="1010" y="285" width="780" height="130" rx="0" fill="#EEF3F4" stroke="#3C4545" stroke-width="3"/><g data-svgrepo-icon="calendar" transform="translate(1044 325) scale(2.33333)" color="#181818" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v3" />
