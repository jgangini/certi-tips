</g><text x="1400" y="354.83" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1400" y="354.83">31 AGO</tspan></text><rect x="100" y="453" width="810" height="475" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><rect x="1010" y="453" width="790" height="475" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><path d="M520 415 V434 H1400 V415" fill="none" stroke="#3C4545" stroke-width="2" stroke-linejoin="round"/><line x1="520" y1="434" x2="520" y2="453" stroke="#3C4545" stroke-width="2"/><line x1="1400" y1="434" x2="1400" y2="453" stroke="#3C4545" stroke-width="2"/><text x="130" y="496.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="130" y="496.59">PRUEBAS REALIZADAS</tspan></text><text x="130" y="563.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="130" y="563.59">Completitud</tspan></text><text x="130" y="617.27" font-size="25.5" fill="#697778" font-weight="400" text-anchor="start"><tspan x="130" y="617.27">La fecha está presente</tspan></text><text x="840" y="590.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="end"><tspan x="840" y="590.27">CUMPLE</tspan></text><text x="130" y="686.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="130" y="686.59">Validez</tspan></text><text x="130" y="740.27" font-size="25.5" fill="#697778" font-weight="400" text-anchor="start"><tspan x="130" y="740.27">El formato es admitido</tspan></text><text x="840" y="713.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="end"><tspan x="840" y="713.27">CUMPLE</tspan></text><text x="130" y="809.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="130" y="809.59">Exactitud</tspan></text><text x="130" y="863.27" font-size="25.5" fill="#697778" font-weight="400" text-anchor="start"><tspan x="130" y="863.27">No coincide con el contrato</tspan></text><text x="840" y="836.27" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="end"><tspan x="840" y="836.27">FALLA</tspan></text><text x="1040" y="496.59" font-size="25.5" fill="#697778" font-weight="700" text-anchor="start"><tspan x="1040" y="496.59">TODAVÍA SIN EVIDENCIA</tspan></text><text x="1040" y="572.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1040" y="572.59">Consistencia</tspan></text><text x="1040" y="626.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1040" y="626.27">Comparar con otros sistemas</tspan></text><text x="1040" y="695.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1040" y="695.59">Unicidad</tspan></text><text x="1040" y="749.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1040" y="749.27">Revisar registros duplicados</tspan></text><text x="1040" y="818.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1040" y="818.59">Oportunidad</tspan></text><text x="1040" y="872.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1040" y="872.27">Medir disponibilidad a tiempo</tspan></text></g></svg>
