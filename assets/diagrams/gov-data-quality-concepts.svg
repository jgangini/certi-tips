ue"><text x="206.0" y="780.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="206.0" y="780.8">Exactitud</tspan></text></g></g><g data-table-cell="row" data-cell-align="center" data-cell-exception="Comparison row holds wrapped values and matching rules"><rect x="316" y="734" width="414" height="72" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="523.0" y="780.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="523.0" y="780.8">No coincide con el contrato</tspan></text></g></g><g data-table-cell="tag-row" data-cell-align="center"><rect x="730" y="734" width="176" height="72" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><rect x="767.0" y="746.0" width="102" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="818.0" y="780.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="818.0" y="780.8">FALLA</tspan></text></g></g><rect x="1014" y="526" width="810" height="226" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1026 526 H1812 Q1824 526 1824 538 V590 H1014 V538 Q1014 526 1026 526 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="center"><rect x="1014" y="526" width="244" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1136.0" y="568.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="1136.0" y="568.8">TODAVÍA</tspan></text></g></g><g data-table-cell="header" data-cell-align="center"><rect x="1258" y="526" width="566" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1541.0" y="568.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="1541.0" y="568.8">SIN EVIDENCIA</tspan></text></g></g><line x1="1