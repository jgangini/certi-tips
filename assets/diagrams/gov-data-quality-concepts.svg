<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-design-audit="08-11-compact"><title id="title">Una Fecha Presente Puede Seguir Siendo Incorrecta</title><desc id="description">El contrato verificado indica 01 SEP, pero el dato capturado contiene 31 AGO. La fecha está presente y tiene un formato admitido: cumple completitud y validez. Falla exactitud porque no coincide con la evidencia. Consistencia, unicidad y oportunidad siguen sin prueba. Evalúa cada dimensión con su evidencia específica; superar dos controles no demuestra calidad en todos los usos.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Una Fecha Presente Puede Seguir Siendo Incorrecta</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 70)"><rect x="96" y="270" width="810" height="136" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M108 270 H894 Q906 270 906 282 V334 H96 V282 Q96 270 108 270 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="start"><rect x="96" y="270" width="810" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="312.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="120" y="312.8">CONTRATO VERIFICADO</tspan></text></g></g><g data-table-cell="tag-row" data-cell-align="center"><rect x="96" y="334" width="810" height="72" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><rect x="447.0" y="346" width="108" height="48" rx="12" fill="#FFFFFF