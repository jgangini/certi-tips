<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Similitud: proximidad semántica y métricas de distancia</title>
  <desc id="description">Un mapa de dos dimensiones, meramente ilustrativo y sin puntuaciones medidas, agrupa mochila y bolso para laptop junto a una consulta compatible. Una bicicleta aparece distante. A la derecha, cosine compara la orientación de dos vectores y Euclidean su separación geométrica.</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e4e7f0"/></pattern><linearGradient id="near" x2="1" y2="1"><stop stop-color="#e1f4ed"/><stop offset="1" stop-color="#c0e3de"/></linearGradient><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}.title{font-size:34px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:22px;fill:#536078}</style></defs>
  <rect width="1200" height="600" fill="#f7f8fc"/>
  <text x="48" y="61" class="title">El significado se compara en un espacio de vectores</text>
  <rect x="48" y="103" width="650" height="421" rx="24" fill="#fff" stroke="#dbe0eb"/>
  <rect x="68" y="123" width="610" height="380" rx="15" fill="url(#grid)"/>
  <ellipse cx="291" cy="325" rx="147" ry="110" fill="url(#near)" opacity=".8"/>
  <path d="M240 382 346 272M240 382l-58-110" stroke="#087f7a" stroke-width="2" stroke-dasharray="7 6"/>
  <g fill="#087f7a" stroke="#fff" stroke-width="3"><circle cx="346" cy="272" r="11"/><circle cx="182" cy="272" r="11"/></g>
  <path d="m240 365 6 11 13 2-9 9 2 13-12-6-12 6 2-13-9-9 13-2Z" fill="#c74436" stroke="#fff" stroke-width="2"/>
  <circle cx="573" cy="181" r="11" fill="#4f46b8" stroke="#fff" stroke-width="3"/>
  <text x="365" y="229" class="body">Mochila</text><text x="365" y="259" class="body">para laptop</text>
  <text x="110" y="234" class="body">Bolso para laptop</text>
  <text x="240" y="447" text-anchor="middle" class="label" fill="#c74436">Consulta</text>
  <text x="573" y="146" text-anchor="middle" class="body">Bicicleta</text>
  <text x="74" y="562" class="body">Mapa 2D ilustrativo, no distancias medidas.</text>
  <text x="752" y="143" class="label">Cosine: orientación</text>
  <path d="M810 288 924 183M810 288l194-68" fill="none" stroke="#4f46b8" stroke-width="4"/>
  <path d="M845 256a48 48 0 0 1 11 17" fill="none" stroke="#c74436" stroke-width="4"/>
  <circle cx="810" cy="288" r="6" fill="#4f46b8"/>
  <text x="978" y="178" class="body">Ángulo</text>
  <text x="752" y="368" class="label">Euclidean: separación</text>
  <path d="m803 479 259-55" stroke="#087f7a" stroke-width="4" stroke-dasharray="8 6"/>
  <circle cx="803" cy="479" r="12" fill="#4f46b8"/><circle cx="1062" cy="424" r="12" fill="#c74436"/>
  <text x="927" y="521" text-anchor="middle" class="body">Distancia entre puntos</text>
</svg>
