</g><line x1="600" y1="756" x2="600" y2="785" stroke="#3C4545" stroke-width="2"/><text x="200" y="832.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="200" y="832.59">Consulta de febrero</tspan></text><text x="125" y="897.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="125" y="897.59">Responder con la cláusula de v1.</tspan></text><rect x="1000" y="785" width="820" height="157" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><g data-svgrepo-icon="calendar" transform="translate(1025 811) scale(2.16667)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v3" />
