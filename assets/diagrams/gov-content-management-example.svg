<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">La Fecha de la Consulta Elige la Evidencia</title><desc id="description">La línea temporal distingue el contrato v1 y el anexo v2 que sustituye una cláusula desde septiembre. Una consulta sobre febrero usa la cláusula de v1; una consulta sobre octubre considera el anexo v2. Selecciona la versión aplicable a la fecha y finalidad consultadas, en lugar de responder siempre con el archivo más reciente.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">La Fecha de la Consulta Elige la Evidencia</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" transform="translate(10.000 17.455)" data-center="960 608"><rect x="80.0" y="239.09" width="262.8" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="211.4" y="273.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="211.4" y="273.59">VERSIÓN APLICABLE</tspan></text><rect x="370" y="340" width="685" height="120" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M382.0 340.0 H1043.0 Q1055.0 340.0 1055.0 352.0 V412.0 H370.0 V352.0 Q370.0 340.0 382.0 340.0 Z" fill="#59616E" stroke="none" data-table-header="true" /><text x="712.5" y="385.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="712.5" y="385.5">Contrato v1</tspan></text><rect x="1055" y="495" width="710" height="120" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1067.0 495.0 H1753.0 Q1765.0 495.0 1