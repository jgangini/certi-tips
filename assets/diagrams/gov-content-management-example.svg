</g><line x1="1500" y1="756" x2="1500" y2="785" stroke="#3C4545" stroke-width="2"/><text x="1105" y="832.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1105" y="832.59">Consulta de octubre</tspan></text><text x="1025" y="897.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1025" y="897.59">Responder considerando el anexo v2.</tspan></text></g></svg>
