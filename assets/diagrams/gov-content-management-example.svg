<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">La Fecha de la Consulta Elige la Evidencia</title><desc id="description">La línea temporal distingue el contrato v1 y el anexo v2 que sustituye una cláusula desde septiembre. Una consulta sobre febrero usa la cláusula de v1; una consulta sobre octubre considera el anexo v2. Selecciona la versión aplicable a la fecha y finalidad consultadas, en lugar de responder siempre con el archivo más reciente.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">La Fecha de la Consulta Elige la Evidencia</tspan></text><text x="96" y="273.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="273.59">VERSIÓN APLICABLE</tspan></text><rect x="370" y="340" width="685" height="120" rx="0" fill="#EEF3F4" stroke="#00B0F0" stroke-width="3"/><text x="710" y="407.07" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="710" y="407.07">Contrato v1</tspan></text><rect x="1055" y="495" width="710" height="120" rx="0" fill="#EEF3EC" stroke="#749B6B" stroke-width="3"/><text x="1410" y="563.07" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1410" y="563.07">Anexo v2</tspan></text><line x1="370" y1="685" x2="1770" y2="685" stroke="#3C4545" stroke-width="4"/><line x1="370" y1="674" x2="370" y2="697" stroke="#3C4545" stroke-width="3"/><text x="370" y="739.43" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="370" y="739.43">Enero</tspan></text><line x1="600" y1="674" x2="600" y2="697" stroke="#3C4545" stroke-width="3"/><text x="600" y="739.43" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="600" y="739.43">Febrero</tspan></text><line x1="1055" y1="674" x2="1055" y2="697" stroke="#3C4545" stroke-width="3"/><text x="1055" y="739.43" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1055" y="739.43">Septiembre</tspan></text><line x1="1500" y1="674" x2="1500" y2="697" stroke="#3C4545" stroke-width="3"/><text x="1500" y="739.43" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1500" y="739.43">Octubre</tspan></text><line x1="600" y1="460" x2="600" y2="673" stroke="#C74634" stroke-width="3" stroke-dasharray="10 8"/><line x1="1500" y1="615" x2="1500" y2="673" stroke="#C74634" stroke-width="3" stroke-dasharray="10 8"/><line x1="279" y1="408" x2="370" y2="408" stroke="#3C4545" stroke-width="2"/><line x1="930" y1="558" x2="1055" y2="558" stroke="#3C4545" stroke-width="2"/><text x="96" y="412.31" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="96" y="412.31">Cláusula </tspan><tspan x="96" y="444.95">inicial</tspan></text><text x="730" y="562.31" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="730" y="562.31">Cláusula </tspan><tspan x="730" y="594.95">sustituida</tspan></text><rect x="96" y="785" width="855" height="157" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><g data-svgrepo-icon="calendar" transform="translate(121 811) scale(2.16667)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v3" />
