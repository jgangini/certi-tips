</g><text x="221" y="406.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="221" y="406.59">CONSERVACIÓN HISTÓRICA</tspan></text><text x="145" y="474.87" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="145" y="474.87">Versión v1 + relación con v2 </tspan><tspan x="145" y="507.51">Acceso acorde con la política</tspan></text><line x1="820" y1="470" x2="990" y2="470" stroke="#3C4545" stroke-width="4" /><path d="M990 470 L974 478 L974 462 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round" /><text x="1060" y="409.75" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1060" y="409.75">Evidencia para auditoría</tspan></text><text x="1060" y="481.43" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1060" y="481.43">Propietario: decide conservación </tspan><tspan x="1060" y="514.07">Steward: documenta la relación</tspan></text><rect x="100" y="640" width="1705" height="232" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><g data-svgrepo-icon="catalog" transform="translate(145 663) scale(2.16667)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14" />
