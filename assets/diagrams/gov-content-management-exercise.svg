</g><text x="221" y="691.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="221" y="691.59">RECUPERACIÓN ACTUAL</tspan></text><text x="145" y="759.87" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="145" y="759.87">Conjunto autorizado con v2 </tspan><tspan x="145" y="792.51">Retirar v1 de este uso actual</tspan></text><line x1="820" y1="755" x2="990" y2="755" stroke="#3C4545" stroke-width="4" /><path d="M990 755 L974 763 L974 747 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round" /><text x="1060" y="694.75" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1060" y="694.75">Respuesta con versión vigente</tspan></text><text x="1060" y="764.43" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1060" y="764.43">Custodio: comprueba el índice </tspan><tspan x="1060" y="797.07">Prueba: consulta anterior y actual</tspan></text></g></g></svg>
