<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Conservar la Historia; Responder con la Versión Vigente</title><desc id="description">La versión v1 sustituida tiene dos tratamientos. Para auditoría puede conservarse con su relación a v2 y acceso según la política. Para recuperación actual se usa el conjunto autorizado con v2 y se retira v1 de ese uso. El propietario decide conservación, el steward documenta la relación y el custodio comprueba el índice. Prueba consultas históricas y actuales para verificar que cada una recibe la versión que corresponde.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Conservar la Historia; Responder con la Versión Vigente</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" transform="translate(7.500 59.833)" data-center="960 608"><g data-svgrepo-icon="contract" transform="translate(100 220) scale(2.16667)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.364 13.634a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506l4.013-4.009a1 1 0 0 0-3.004-3.004z" />
  <path d="M14.487 7.858A1 1 0 0 1 14 7V2" />
  <path d="M20 19.645V20a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l2.516 2.516" />
  <path d="M8 18h1" />
</g><rect x="164.0" y="229.41" width="343.15" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="335.575" y="263.91" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="335.575" y="263.91">CONTRATO SUSTITUIDO v1</tspan></text><line x1="100" y1="310" x2="1805" y2="310" stroke="#3C4545" stroke-width="3" /><rect x="100" y="355" width="1705" height="232" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" /><g data-svgrepo-icon="archive" transform="translate(145 378) scale(2.16667)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1" />
