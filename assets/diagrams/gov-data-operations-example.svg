-weight="400" text-anchor="middle"><tspan x="1201" y="432.27">Recibida</tspan></text><rect x="1340" y="300" width="206" height="185" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1352.0 300.0 H1534.0 Q1546.0 300.0 1546.0 312.0 V372.0 H1340.0 V312.0 Q1340.0 300.0 1352.0 300.0 Z" fill="#59616E" stroke="none" data-table-header="true" /><text x="1443.0" y="345.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="1443.0" y="345.5">P2</tspan></text><text x="1443" y="432.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1443" y="432.27">Recibida</tspan></text><rect x="1582" y="300" width="206" height="185" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1594.0 300.0 H1776.0 Q1788.0 300.0 1788.0 312.0 V372.0 H1582.0 V312.0 Q1582.0 300.0 1594.0 300.0 Z" fill="#59616E" stroke="none" data-table-header="true" /><text x="1685.0" y="345.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="1685.0" y="345.5">P3</tspan></text><text x="1685" y="432.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1685" y="432.27">Recibida</tspan></text><line x1="806" y1="392" x2="1078" y2="392" stroke="#3C4545" stroke-width="4" /><path d="M1078 392 L1062 400 L1062 384 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round" /><rect x="820.202" y="427.934" width="243.595" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="942.0" y="462.434" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="942.0" y="462.434">Corregir y conciliar</tspan></text><rect x="80.0" y="536.09" width="400.797" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="280.3984375" y="570.59" font-size="25.5" fill="#C74634" font-weight="400" text-