<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Una Partición Ausente Cambia la Publicación</title><desc id="description">La primera carga contiene P1 y P3, pero falta P2: se detiene la publicación candidata y continúa disponible la versión anterior con fecha visible. Después de recuperar P2, reprocesar sin duplicar facturas y conciliar el conjunto, se acepta una nueva versión. La recuperación debe corregir la carga y comprobar el resultado antes de sustituir la publicación.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Una Partición Ausente Cambia la Publicación</tspan></text><text x="96" y="227.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="96" y="227.59">CARGA INCOMPLETA</tspan></text><text x="1098" y="227.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1098" y="227.59">CARGA RECONCILIADA</tspan></text><rect x="76" y="274" width="730" height="235" rx="0" fill="none" stroke="#697778" stroke-width="2"/><rect x="1078" y="274" width="730" height="235" rx="0" fill="none" stroke="#697778" stroke-width="2"/><rect x="96" y="300" width="206" height="185" rx="0" fill="#749B6B" stroke="#3C4545" stroke-width="3"/><text x="199" y="365.07" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="199" y="365.07">P1</tspan></text><text x="199" y="432.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="199" y="432.27">Recibida</tspan></text><path d="M338 300 H544 V485 H338 Z" fill="none" stroke="#C74634" stroke-width="3" stroke-linejoin="round" stroke-dasharray="12 10"/><text x="441" y="365.07" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="middle"><tspan x="441" y="365.07">P2</tspan></text><text x="441" y="432.27" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="middle"><tspan x="441" y="432.27">Ausente</tspan></text><rect x="580" y="300" width="206" height="185" rx="0" fill="#749B6B" stroke="#3C4545" stroke-width="3"/><text x="683" y="365.07" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="683" y="365.07">P3</tspan></text><text x="683" y="432.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="683" y="432.27">Recibida</tspan></text><rect x="1098" y="300" width="206" height="185" rx="0" fill="#749B6B" stroke="#3C4545" stroke-width="3"/><text x="1201" y="365.07" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1201" y="365.07">P1</tspan></text><text x="1201" y="432.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1201" y="432.27">Recibida</tspan></text><rect x="1340" y="300" width="206" height="185" rx="0" fill="#749B6B" stroke="#3C4545" stroke-width="3"/><text x="1443" y="365.07" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1443" y="365.07">P2</tspan></text><text x="1443" y="432.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1443" y="432.27">Recibida</tspan></text><rect x="1582" y="300" width="206" height="185" rx="0" fill="#749B6B" stroke="#3C4545" stroke-width="3"/><text x="1685" y="365.07" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1685" y="365.07">P3</tspan></text><text x="1685" y="432.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1685" y="432.27">Recibida</tspan></text><line x1="806" y1="392" x2="1078" y2="392" stroke="#3C4545" stroke-width="4"/><path d="M1078 392 L1062 400 L1062 384 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><text x="942" y="445.434" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="942" y="445.434">Corregir </tspan><tspan x="942" y="478.106">y conciliar</tspan></text><text x="96" y="570.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="96" y="570.59">Detener la publicación candidata</tspan></text><rect x="212" y="686" width="500" height="221" rx="0" fill="#EEF3F4" stroke="#3C4545" stroke-width="3"/><rect x="212" y="686" width="500" height="6" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><text x="248" y="750.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="248" y="750.27">VERSIÓN ANTERIOR</tspan></text><text x="248" y="826.145" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="248" y="826.145">Sigue disponible </tspan><tspan x="248" y="864.395">Fecha de corte visible</tspan></text><rect x="1209" y="686" width="500" height="221" rx="0" fill="#EEF3EC" stroke="#3C4545" stroke-width="3"/><rect x="1209" y="686" width="500" height="6" rx="0" fill="#749B6B" stroke="none" stroke-width="2"/><text x="1245" y="750.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1245" y="750.27">VERSIÓN NUEVA</tspan></text><text x="1245" y="826.145" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1245" y="826.145">Sin duplicar facturas </tspan><tspan x="1245" y="864.395">Conjunto reconciliado</tspan></text><line x1="1459" y1="509" x2="1459" y2="686" stroke="#3C4545" stroke-width="4"/><path d="M1459 686 L1451 670 L1467 670 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/></g></svg>
