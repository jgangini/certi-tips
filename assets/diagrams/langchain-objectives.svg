<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title description">
<title id="title">De una llamada a un agente</title><desc id="description">Tres niveles de invocación: model.invoke pide una respuesta al modelo; chain.invoke ejecuta una secuencia; agent.invoke coordina decisiones, herramientas y resultados con límites.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff4ef"/><stop offset="1" stop-color="#f1ccc5"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f2f0ff"/><stop offset="1" stop-color="#d8d4f5"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#effaf7"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}.title{font-size:32px;font-weight:700}.label{font-size:26px;font-weight:700}.body{font-size:23px;fill:#536078}.small{font-size:21px;fill:#536078}.mono{font-family:Consolas,monospace;font-size:22px}.line{fill:none;stroke:#536078;stroke-width:2.5;marker-end:url(#arrow)}.icon{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#dce1eb;stroke-width:1.5}</style></defs>
<rect width="1200" height="540" fill="#f7f8fc"/>
<text x="56" y="64" class="title">De una llamada a un agente</text><rect x="72" y="120" width="326" height="352" rx="22" class="card"/><rect x="437" y="120" width="326" height="352" rx="22" class="card"/><rect x="802" y="120" width="326" height="352" rx="22" class="card"/><circle cx="240" cy="212" r="52" fill="#c74436" opacity=".09"/><circle cx="235" cy="205" r="52" fill="url(#coral)" stroke="#c74436" stroke-opacity=".15"/><g transform="translate(235 205)" class="icon" stroke="#c74436"><rect x="-23" y="-23" width="46" height="46" rx="9"/><path d="M-13-23v-10M0-23v-10M13-23v-10M-13 23v10M0 23v10M13 23v10M-23-13h-10M-23 0h-10M-23 13h-10M23-13h10M23 0h10M23 13h10"/><circle cx="0" cy="-8" r="5"/><circle cx="-11" cy="11" r="5"/><circle cx="11" cy="11" r="5"/><path d="m-2-3-6 10M2-3l6 10M-6 11H6"/></g><circle cx="605" cy="212" r="52" fill="#4f46b8" opacity=".09"/><circle cx="600" cy="205" r="52" fill="url(#indigo)" stroke="#4f46b8" stroke-opacity=".15"/><g transform="translate(600 205)" class="icon" stroke="#4f46b8"><rect x="-23" y="-29" width="46" height="58" rx="6"/><path d="M-13-14h26M-13-3h20M-13 8h26M-13 19H3"/></g><circle cx="970" cy="212" r="52" fill="#087f7a" opacity=".09"/><circle cx="965" cy="205" r="52" fill="url(#teal)" stroke="#087f7a" stroke-opacity=".15"/><g transform="translate(965 205)" class="icon" stroke="#087f7a"><path d="M-25-9A27 27 0 0 1 23-18l6 8M29-28v18H11M25 9A27 27 0 0 1-23 18l-6-8M-29 28V10h18"/></g><text x="235" y="305" class="mono" text-anchor="middle">model.invoke</text><text x="600" y="305" class="mono" text-anchor="middle">chain.invoke</text><text x="965" y="305" class="mono" text-anchor="middle">agent.invoke</text><text x="235" y="355" class="body" text-anchor="middle">Solicita una respuesta</text><text x="235" y="386" class="body" text-anchor="middle">al modelo configurado.</text><text x="600" y="355" class="body" text-anchor="middle">Ejecuta los pasos</text><text x="600" y="386" class="body" text-anchor="middle">de la composición.</text><text x="965" y="355" class="body" text-anchor="middle">Coordina el loop,</text><text x="965" y="386" class="body" text-anchor="middle">tools y resultados.</text></svg>
