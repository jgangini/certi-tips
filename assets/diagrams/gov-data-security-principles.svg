<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Seleccionar Filas y Proteger Valores</title><desc id="description">El conjunto original tiene cuatro clientes. El subsetting selecciona C7 y C8 y reduce el conjunto a dos filas. El masking sustituye los nombres sensibles, mientras conserva contratos e importes necesarios para la prueba. Comprueba por separado qué filas se incluyen y cómo se protegen los valores: reducir la población no equivale a proteger los datos que permanecen.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Seleccionar Filas y Proteger Valores</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" transform="translate(20.000 53.455)" data-center="960 608"><rect x="353.761" y="192.09" width="284.478" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="496.0" y="226.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="496.0" y="226.59">CONJUNTO ORIGINAL</tspan></text><rect x="1280.271" y="304.09" width="353.458" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1457.0" y="338.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1457.0" y="338.59">SUBCONJUNTO PROTEGIDO</tspan></text><rect x="96" y="280" width="800" height="464" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><rect x="96" y="280" width="800" height="88" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><path d="M108.0 280.0 H884.0 Q896.0 280.0 8