<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Seleccionar Filas y Proteger Valores</title><desc id="description">El conjunto original tiene cuatro clientes. El subsetting selecciona C7 y C8 y reduce el conjunto a dos filas. El masking sustituye los nombres sensibles, mientras conserva contratos e importes necesarios para la prueba. Comprueba por separado qué filas se incluyen y cómo se protegen los valores: reducir la población no equivale a proteger los datos que permanecen.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Seleccionar Filas y Proteger Valores</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 39)"><rect x="332.7609375" y="300" width="284.478125" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="475" y="334.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="475" y="334.8">CONJUNTO ORIGINAL</tspan></text><rect x="1268.27109375" y="300" width="353.4578125" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1445" y="334.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1445" y="334.8">SUBCONJUNTO PROTEGIDO</tspan></text><rect x="110" y="398" width="730" height="272" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M122 398 H828 Q840 398 840 410 V462 H110 V410 Q110 398 122 398 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-line