<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Seleccionar Filas y Proteger Valores</title><desc id="description">El conjunto original tiene cuatro clientes. El subsetting selecciona C7 y C8 y reduce el conjunto a dos filas. El masking sustituye los nombres sensibles, mientras conserva contratos e importes necesarios para la prueba. Comprueba por separado qué filas se incluyen y cómo se protegen los valores: reducir la población no equivale a proteger los datos que permanecen.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Seleccionar Filas y Proteger Valores</tspan></text><text x="96" y="226.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="96" y="226.59">CONJUNTO ORIGINAL</tspan></text><text x="1090" y="338.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1090" y="338.59">SUBCONJUNTO PROTEGIDO</tspan></text><rect x="96" y="280" width="800" height="464" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="96" y="280" width="800" height="88" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="280" width="800" height="6" rx="0" fill="#2E5C70" stroke="none" stroke-width="2"/><text x="156.0" y="335.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="156.0" y="335.27">ID</tspan></text><text x="346.0" y="335.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="346.0" y="335.27">Nombre</tspan></text><line x1="216" y1="280" x2="216" y2="744" stroke="#C2D4D4" stroke-width="2"/><text x="576.0" y="335.27" font-size="25.5" fill="#1