<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Los Objetivos Necesitan Pruebas Diferentes</title><desc id="description">Contrasta tres supuestos con sus objetivos. Un respaldo diario deja hasta 24 horas entre copias y no acredita un RPO de una hora. Una restauración sin ensayo no demuestra un RTO de dos horas. Una alerta de consumo necesita análisis y una acción acordada. Cada objetivo requiere su propia prueba, en lugar de usar la misma señal como evidencia de los tres.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Los Objetivos Necesitan Pruebas Diferentes</tspan></text><text x="96" y="221.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="96" y="221.27">RESPALDO DIARIO FRENTE A RPO DE 1 HORA</tspan></text><rect x="240" y="322" width="1440" height="97" rx="0" fill="#00B0F0" stroke="#3C4545" stroke-width="3"/><rect x="1620" y="322" width="60" height="97" rx="0" fill="#C06D30" stroke="#3C4545" stroke-width="2"/><text x="870" y="378.75" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="870" y="378.75">24 horas entre respaldos</tspan></text><text x="240" y="486.739" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="240" y="486.739">Respaldo </tspan><tspan x="240" y="521.801">00:00</tspan></text><text x="1680" y="486.739" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1680" y="486.739">Día siguiente </tspan><tspan x="1680" y="521.801">00:00</tspan></text><path d="M1650 322 V281 H1730" fill="none" stroke="#C74634" stroke-width="3" stroke-linejoin="round"/><text x="1745" y="285.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="1745" y="285.59">1 h</tspan></text><text x="96" y="640.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="96" y="640.59">RTO: 2 HORAS</tspan></text><rect x="76" y="602" width="884" height="374" rx="0" fill="none" stroke="#697778" stroke-width="2"/><g data-svgrepo-icon="clock" transform="translate(288 697) scale(8.58333)" color="#2E5C70" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" />
  <path d="M12 6v6l4 2" />
</g><text x="548" y="773.611" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="548" y="773.611">Restauración </tspan><tspan x="548" y="812.569">sin ensayo</tspan></text><rect x="1056" y="602" width="768" height="374" rx="0" fill="none" stroke="#697778" stroke-width="2"/><text x="1080" y="640.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1080" y="640.59">ALERTA DE CONSUMO</tspan></text><line x1="1110" y1="901" x2="1780" y2="901" stroke="#3C4545" stroke-width="3"/><path d="M1110 868 L1240 820 L1390 795 L1510 742 L1650 704 L1780 675" fill="none" stroke="#2E5C70" stroke-width="5" stroke-linejoin="round"/><line x1="1390" y1="696" x2="1390" y2="901" stroke="#697778" stroke-width="3" stroke-dasharray="10 8"/><text x="1110" y="693.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1110" y="693.27">Consumo</tspan></text><text x="1780" y="934.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="end"><tspan x="1780" y="934.27">Tiempo</tspan></text><text x="1390" y="950.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1390" y="950.27">Analizar y decidir una acción</tspan></text></g></svg>
