<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Los Objetivos Necesitan Pruebas Diferentes</title><desc id="description">Contrasta tres supuestos con sus objetivos. Un respaldo diario deja hasta 24 horas entre copias y no acredita un RPO de una hora. Una restauración sin ensayo no demuestra un RTO de dos horas. Una alerta de consumo necesita análisis y una acción acordada. Cada objetivo requiere su propia prueba, en lugar de usar la misma señal como evidencia de los tres.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Los Objetivos Necesitan Pruebas Diferentes</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(-10.7031 4.5)"><rect x="685.165625" y="245" width="549.66875" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="960" y="279.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="960" y="279.8">RESPALDO DIARIO FRENTE A RPO DE 1 HORA</tspan></text><rect x="240" y="380" width="1440" height="64" rx="12" fill="#59616E" stroke="#59616E" stroke-width="1.5" /><rect x="1620" y="380" width="60" height="64" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" /><text x="900" y="422.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="middle"><tspan x="900" y="422.8">24 horas entre respaldos</tspan></text><rect x="138.6078125" y="460" width="202.784375" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="240" y="494.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="240" y="494.8">Respaldo 00:00</tspan></text><rect x="1557.2015625" y="460" width="245.596875" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1680" y="494.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1680" y="494.8">Día siguiente 00:00</tspan></text><rect x="1616.45" y="316" width="67.1" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1650" y="350.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1650" y="350.8">1 h</tspan></text><line x1="1650" y1="364" x2="1650" y2="380" stroke="#59616E" stroke-width="3" /><rect x="240" y="590" width="650" height="152" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M252 590 H878 Q890 590 890 602 V654 H240 V602 Q240 590 252 590 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="240" y="590" width="650" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="264" y="632.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="264" y="632.8">RTO: 2 HORAS</tspan></text></g></g><g data-table-cell="row" data-cell-align="center" data-cell-exception="Contenido de varias líneas con al menos 12 unidades de margen."><rect x="240" y="654" width="650" height="88" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="565.0" y="690.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="565.0" y="690.8">Restauración </tspan><tspan x="565.0" y="726.8">sin ensayo</tspan></text></g></g><rect x="1010" y="590" width="670" height="64" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1022 590 H1668 Q1680 590 1680 602 V654 H1010 V602 Q1010 590 1022 590 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="1010" y="590" width="670" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1034" y="632.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="1034" y="632.8">ALERTA DE CONSUMO</tspan></text></g></g><rect x="1010" y="654" width="670" height="232" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><line x1="1050" y1="834" x2="1640" y2="834" stroke="#59616E" stroke-width="3" /><path d="M1640 834 L1624.0 842.0 L1624.0 826.0 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><path d="M1060 812 L1180 798 L1300 752 L1430 738 L1610 692" fill="none" stroke="#59616E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="1390" y1="690" x2="1390" y2="834" stroke="#59616E" stroke-width="1.5" stroke-dasharray="8 10" /><text x="1120" y="694.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1120" y="694.8">Consumo</tspan></text><text x="1600" y="872.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1600" y="872.8">Tiempo</tspan></text><rect x="1168.9" y="914" width="352.2" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1345" y="948.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1345" y="948.8">Analizar y decidir una acción</tspan></text></g></g></svg>
