<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Cada Catálogo Gobierna un Ámbito Diferente</title><desc id="description">Cada bloque representa un catálogo con alcance propio. Master Catalog de Oracle AI Data Platform organiza activos y permisos en su plataforma. El catálogo federado de Oracle Autonomous AI Database monta fuentes mediante conexiones configuradas. Oracle AI Data Catalog ofrece una interfaz REST de Iceberg, con acceso al almacenamiento comprobado aparte. Documenta cada integración y responsable: las líneas no representan sincronización automática entre catálogos.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Cada Catálogo Gobierna un Ámbito Diferente</tspan></text><rect x="96" y="232" width="552" height="650" rx="8" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><rect x="96" y="232" width="552" height="12" rx="0" fill="#2E5C70" stroke="none" stroke-width="2"/><text x="120" y="301.43" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="120" y="301.43">Master Catalog de </tspan><tspan x="120" y="334.07">Oracle AI Data Platform</tspan></text><rect x="684" y="232" width="552" height="650" rx="8" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><rect x="684" y="232" width="552" height="12" rx="0" fill="#749B6B" stroke="none" stroke-width="2"/><text x="708" y="301.43" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="708" y="301.43">Catálogo federado de </tspan><tspan x="708" y="334.07">Oracle Autonomous AI Database</tspan></text><rect x="1272" y="232" width="552" height="650" rx="8" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><rect x="1272" y="232" width="552" height="12" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><text x="1296" y="297.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1296" y="297.27">Oracle AI Data Catalog</tspan></text><g data-svgrepo-icon="catalog" transform="translate(348 358) scale(2)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14" />
