</g><text x="125" y="446.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="125" y="446.27">Catálogo → esquema → activo</tspan></text><rect x="124" y="465" width="480" height="62" rx="6" fill="#F1EFED" stroke="#C2D4D4" stroke-width="2"/><text x="144" y="502.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="144" y="502.27">Catálogo comercial</tspan></text><rect x="152" y="550" width="452" height="62" rx="6" fill="#F1EFED" stroke="#C2D4D4" stroke-width="2"/><text x="172" y="587.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="172" y="587.27">Esquema facturación</tspan></text><rect x="180" y="635" width="424" height="62" rx="6" fill="#F1EFED" stroke="#C2D4D4" stroke-width="2"/><text x="200" y="672.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="200" y="672.27">Tabla contratos</tspan></text><text x="124" y="791.43" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="124" y="791.43">Objetos y permisos </tspan><tspan x="124" y="824.07">en su plataforma.</tspan></text><text x="714" y="449.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="714" y="449.59">DBMS_CATALOG</tspan></text><rect x="714" y="478" width="490" height="104" rx="6" fill="#F1EFED" stroke="#C2D4D4" stroke-width="2"/><text x="959" y="521.43" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="959" y="521.43">Catálogo montado </tspan><tspan x="959" y="554.07">Conexión configurada</tspan></text><line x1="959" y1="607" x2="959" y2="669" stroke="#3C4545" stroke-width="4"/><path d="M959 669 L951 653 L967 653 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><text x="995" y="642.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="995" y="642.27">consulta</tspan></text><rect x="714" y="694" width="490" height="64" rx="6" fill="#FFFFFF" stroke="#3C4545" stroke-width="2"/><text x="959" y="732.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="959" y="732.59">Fuente externa</tspan></text><text x="714" y="815.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="714" y="815.27">Identidad de acceso al origen.</tspan></text><text x="1301" y="444.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1301" y="444.59">Interfaz REST de Iceberg</tspan></text><rect x="1302" y="472" width="490" height="91" rx="6" fill="#F1EFED" stroke="#C2D4D4" stroke-width="2"/><text x="1547" y="524.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1547" y="524.27">Metadatos y transacciones</tspan></text><line x1="1547" y1="563" x2="1547" y2="681" stroke="#3C4545" stroke-width="3" stroke-dasharray="8 8"/><text x="1580" y="618.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1580" y="618.27">referencia</tspan></text><rect x="1302" y="681" width="490" height="76" rx="6" fill="#FFFFFF" stroke="#3C4545" stroke-width="2"/><text x="1547" y="725.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1547" y="725.59">Archivos de datos</tspan></text><text x="1302" y="814.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1302" y="814.27">Acceso al almacenamiento aparte.</tspan></text><text x="96" y="939.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="939.59">Entre catálogos: documentar explícitamente cada integración y su responsable.</tspan></text></g></svg>
