<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title description">
  <title id="title">OpenAI Agent Stack: responsabilidades por nivel</title>
  <desc id="description">Tres tarjetas alineadas separan tu aplicación, Agents SDK y Responses API. La aplicación conserva negocio, permisos, funciones y despliegue; el SDK coordina el loop; Responses conecta con modelos y herramientas. También puedes llamar directamente a la API. Tracing registra pasos, llamadas y errores.</desc>
  <!-- Lucide icons adapted; license: ../icons/LICENSE-lucide.txt -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m2 2 6 3-6 3" fill="none" stroke="#536078" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b;font-size:22px}.h{font-size:34px;font-weight:700}.label{font-size:27px;font-weight:700}.muted{fill:#536078}.icon{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.white{fill:#fff}</style>
  </defs>
  <rect width="1200" height="690" fill="#f7f8fc"/>
  <text x="56" y="62" class="h">Tres niveles, tres responsabilidades distintas</text>
  <text x="56" y="101" class="muted">La API conecta con el modelo; el SDK coordina; tu aplicación conserva el control.</text>
  <rect x="120" y="142" width="710" height="140" rx="22" fill="#fff" stroke="#dce1ec"/>
  <circle cx="178" cy="212" r="36" fill="#e9e6fa"/>
  <g transform="translate(156 190) scale(1.83)" class="icon" stroke="#4f46b8"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18M9 21V9"/></g>
  <text x="236" y="186" class="label">Tu aplicación</text>
  <text x="236" y="223">Negocio · permisos · funciones · despliegue</text>
  <text x="236" y="259" class="muted">El SDK no aloja tu aplicación.</text>
  <path d="M475 282V325" class="route"/>
  <rect x="120" y="325" width="710" height="118" rx="22" fill="#e9e6fa" stroke="#d4cef2"/>
  <circle cx="178" cy="384" r="36" fill="#fff"/>
  <g transform="translate(156 362) scale(1.83)" class="icon" stroke="#4f46b8"><path d="m2 9 3-3 3 3M13 18H7a2 2 0 0 1-2-2V6m17 9-3 3-3-3M11 6h6a2 2 0 0 1 2 2v10"/></g>
  <text x="236" y="371" class="label">Agents SDK</text><text x="236" y="408">Runner · herramientas · handoffs · guardrails</text>
  <path d="M475 443V486" class="route"/>
  <rect x="120" y="486" width="710" height="118" rx="22" fill="#fae6e1" stroke="#ebcec7"/>
  <circle cx="178" cy="545" r="36" fill="#fff"/>
  <g fill="none" stroke="#c74436" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m165 530-13 15 13 15M191 530l13 15-13 15m-9-34-8 38"/></g>
  <text x="236" y="532" class="label">Responses API</text><text x="236" y="569">Entrada y contexto → modelos y herramientas</text>
  <path d="M120 212H90Q70 212 70 232V525Q70 545 90 545H120" class="route" stroke-dasharray="6 6"/>
  <text x="120" y="651" class="muted">También puedes llamar a Responses directamente, sin Agents SDK.</text>
  <rect x="886" y="325" width="258" height="279" rx="22" fill="#17243b"/>
  <text x="915" y="370" class="label white">Tracing</text>
  <text x="915" y="411" class="white">1. Invocación</text><text x="915" y="458" class="white">2. Herramienta</text><text x="915" y="505" class="white">3. Resultado</text>
  <path d="M915 529H1115" stroke="#65718a"/>
  <text x="915" y="566" class="white">Tiempos y errores</text>
  <path d="M830 384H886" class="route" stroke-dasharray="6 6"/>
</svg>
