<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="artifact-endpoint-job">
<title id="title">Tres recursos que no son intercambiables</title>
<desc id="description">Model Catalog conserva artefacto y metadatos. Model Deployment sirve predicciones en un endpoint. Job ejecuta un trabajo con comienzo y fin; no es un endpoint siempre disponible.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="archive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M2 3h20v4H2zM9 12h6"/></symbol><symbol id="server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2" width="18" height="8" rx="2"/><rect x="3" y="14" width="18" height="8" rx="2"/><path d="M6 6h.1M6 18h.1M11 6h6M11 18h6"/></symbol><symbol id="calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M7 2v5M17 2v5M3 10h18M7 14h3m4 0h3m-10 4h3"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Tres recursos que no son intercambiables</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Reconoce qué queda guardado, qué atiende peticiones y qué ejecuta una tarea.</text><g data-concept="Conservar"><circle cx="216" cy="286" r="74" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="216" cy="279" r="74" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="archive" href="#archive" x="176.04" y="239.04" width="79.92" height="79.92" color="#c74436"/><text x="216" y="396" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Conservar</text><text x="216" y="431" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Model Catalog</text><text x="216" y="463" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Artefacto + metadatos</text></g><g data-concept="Servir"><circle cx="600" cy="286" r="74" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="600" cy="279" r="74" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="server" href="#server" x="560.04" y="239.04" width="79.92" height="79.92" color="#4f46b8"/><text x="600" y="396" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Servir</text><text x="600" y="431" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Model Deployment</text><text x="600" y="463" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Endpoint de inferencia</text></g><g data-concept="Ejecutar"><circle cx="984" cy="286" r="74" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="984" cy="279" r="74" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="calendar" href="#calendar" x="944.04" y="239.04" width="79.92" height="79.92" color="#087f7a"/><text x="984" y="396" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Ejecutar</text><text x="984" y="431" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Job</text><text x="984" y="463" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Trabajo con inicio y fin</text></g><path d="M410 180L410 508" fill="none" stroke="#dce1ec" stroke-width="1.5"/><path d="M793 180L793 508" fill="none" stroke="#dce1ec" stroke-width="1.5"/><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Catálogo ≠ endpoint. Job ≠ servicio siempre disponible.</text></g>
</svg>
