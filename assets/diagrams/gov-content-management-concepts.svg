<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Un Archivo, un Documento y una Evidencia</title><desc id="description">Los tres bloques representan objetos distintos. C-104.pdf es el archivo digital; el contrato C-104 es el documento cuyo significado depende de versión y vigencia; y la aprobación de la versión 2 es un registro de evidencia. Cambiar el nombre del PDF no cambia la vigencia del acuerdo. Conserva contexto y evidencia para demostrar qué contenido aplica y quién lo aprobó.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Un Archivo, un Documento y una Evidencia</tspan></text><rect x="100" y="250" width="500" height="675" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="100" y="250" width="500" height="6" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><g data-svgrepo-icon="document" transform="translate(132 287) scale(3)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
