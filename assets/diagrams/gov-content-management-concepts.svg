  <path d="M10 9H8" />
  <path d="M16 13H8" />
  <path d="M16 17H8" />
</g><text x="233" y="336.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="233" y="336.59">ARCHIVO</tspan></text><text x="132" y="440.91" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="132" y="440.91">C-104.pdf</tspan></text><text x="132" y="530.43" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="132" y="530.43">Representación digital</tspan></text><line x1="132" y1="754" x2="568" y2="754" stroke="#C2D4D4" stroke-width="2"/><text x="132" y="825.145" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="132" y="825.145">Cambiar el nombre del PDF </tspan><tspan x="132" y="863.395">no cambia la vigencia.</tspan></text><rect x="710" y="250" width="500" height="675" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="710" y="250" width="500" height="6" rx="0" fill="#749B6B" stroke="none" stroke-width="2"/><g data-svgrepo-icon="contract" transform="translate(742 287) scale(3)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.364 13.634a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506l4.013-4.009a1 1 0 0 0-3.004-3.004z" />
