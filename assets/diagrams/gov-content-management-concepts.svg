</g><text x="1600.0" y="295.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="1600.0" y="295.5">REGISTRO</tspan></text><rect x="1336.0" y="406.41" width="230.691" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1451.3453125" y="440.91" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1451.3453125" y="440.91">Aprobación de v2</tspan></text><text x="1352" y="547.43" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1352" y="547.43">Quién aprobó </tspan><tspan x="1352" y="598.43">Cuándo y para qué </tspan><tspan x="1352" y="649.43">Evidencia conservada</tspan></text><line x1="1352" y1="754" x2="1788" y2="754" stroke="#59616E" stroke-width="2" /><text x="1352" y="825.145" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1352" y="825.145">El registro demuestra </tspan><tspan x="1352" y="863.395">una actividad o decisión.</tspan></text><line x1="600" y1="572" x2="710" y2="572" stroke="#3C4545" stroke-width="3" /><line x1="1210" y1="572" x2="1320" y2="572" stroke="#3C4545" stroke-width="3" /></g></g></svg>
