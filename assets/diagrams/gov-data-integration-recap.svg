<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Primero Procesar; Después Publicar</title><desc id="description">Sigue F42 desde el origen hasta el producto publicado. El origen conserva una clave estable; el contrato versionado define los cambios admitidos; el procesamiento registra ejecución, reintentos y controles; y el producto necesita cierre validado, uso y responsable. Devuelve las incidencias al productor indicando qué cambió, qué falló y quién debe corregirlo antes de publicar.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Primero Procesar; Después Publicar</tspan></text><rect x="100" y="270" width="365" height="435" rx="0" fill="#F1EFED" stroke="#3C4545" stroke-width="3"/><rect x="100" y="270" width="365" height="6" rx="0" fill="#C2D4D4" stroke="none" stroke-width="2"/><text x="124" y="332.55" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="124" y="332.55">01</tspan></text><text x="124" y="403.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="124" y="403.27">ORIGEN</tspan></text><line x1="120" y1="450" x2="445" y2="450" stroke="#C2D4D4" stroke-width="2"/><g data-svgrepo-icon="database" transform="translate(128 488) scale(1.66667)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3" />
