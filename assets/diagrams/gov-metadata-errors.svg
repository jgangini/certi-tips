</g><text x="150" y="427.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="150" y="427.59">Registro técnico</tspan></text><text x="150" y="485.27" font-size="25.5" fill="#697778" font-weight="400" text-anchor="start"><tspan x="150" y="485.27">Columna encontrada</tspan></text><rect x="1260" y="389" width="495" height="94" rx="0" fill="#EEF3F4" stroke="#C2D4D4" stroke-width="2"/><rect x="1260" y="389" width="6" height="94" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><text x="1507" y="444.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1507" y="444.27">DETECTADO</tspan></text><line x1="145" y1="513" x2="1765" y2="513" stroke="#C2D4D4" stroke-width="2"/><text x="150" y="564.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="150" y="564.59">Descripción sugerida por IA</tspan></text><text x="150" y="622.27" font-size="25.5" fill="#697778" font-weight="400" text-anchor="start"><tspan x="150" y="622.27">Texto pendiente de revisión</tspan></text><rect x="1260" y="526" width="495" height="94" rx="0" fill="#F7EFE8" stroke="#C2D4D4" stroke-width="2"/><rect x="1260" y="526" width="6" height="94" rx="0" fill="#C06D30" stroke="none" stroke-width="2"/><text x="1507" y="581.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1507" y="581.27">BORRADOR</tspan></text><line x1="145" y1="650" x2="1765" y2="650" stroke="#C2D4D4" stroke-width="2"/><text x="150" y="701.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="150" y="701.59">Definición empresarial</tspan></text><text x="150" y="759.27" font-size="25.5" fill="#697778" font-weight="400" text-anchor="start"><tspan x="150" y="759.27">Propietario debe validar</tspan></text><rect x="1260" y="663" width="495" height="94" rx="0" fill="#F7EFE8" stroke="#C2D4D4" stroke-width="2"/><rect x="1260" y="663" width="6" height="94" rx="0" fill="#C06D30" stroke="none" stro