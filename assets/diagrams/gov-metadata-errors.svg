<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Descubrir, Describir y Aprobar Son Estados Distintos</title><desc id="description">Los estados del activo son distintos. Encontrar una columna demuestra detección técnica. Una descripción sugerida por IA es un borrador pendiente de revisión. La definición empresarial necesita validación del propietario. El linaje observado solo demuestra el periodo y los sistemas capturados. No uses una de esas señales como prueba de aprobación o de historia completa.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Descubrir, Describir y Aprobar Son Estados Distintos</tspan></text><rect x="120" y="248" width="1680" height="113" rx="0" fill="#EDF1F2" stroke="#C2D4D4" stroke-width="2"/><text x="235" y="311.23" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="235" y="311.23">ACTIVO · contratos.estado</tspan></text><rect x="120" y="248" width="1680" height="6" rx="0" fill="#2E5C70" stroke="none" stroke-width="2"/><rect x="120" y="361" width="1680" height="574" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><g data-svgrepo-icon="catalog" transform="translate(155 274) scale(2.33333)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14" />
