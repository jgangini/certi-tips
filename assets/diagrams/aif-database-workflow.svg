<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 688" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="vector-ingest-query">
<title id="title">Dos recorridos que se encuentran en la base</title>
<desc id="description">Preparar extrae texto, divide fragmentos, genera embeddings y guarda vector texto y metadatos. Consulta genera un embedding compatible, aplica filtros y distancia, y devuelve fragmentos. RAG agrega una etapa de generación con el LLM.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9Z"/><path d="M14 2v7h7M7 13h10M7 17h7"/></symbol><symbol id="layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 11 6-11 6L1 8Zm-11 12 11 6 11-6M1 18l11 6 11-6"/></symbol><symbol id="cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M8 2v3m4-3v3m4-3v3M8 19v3m4-3v3m4-3v3M2 8h3m-3 4h3m-3 4h3m14-8h3m-3 4h3m-3 4h3"/></symbol><symbol id="database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 4 18 4 18 0V5M3 12c0 4 18 4 18 0"/></symbol></defs>
<rect width="1200" height="688" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Dos recorridos que se encuentran en la base</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Preparar los documentos y responder una consulta son trabajos diferentes.</text><rect x="56" y="149" width="210" height="42" rx="21" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="161" y="177" font-size="21" fill="#c74436" font-weight="600" text-anchor="middle">PREPARAR</text><path d="M239 247H368" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="306.5" y="225" font-size="20" fill="#536078" font-weight="400" text-anchor="middle">dividir</text><path d="M532 247H662" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="600" y="225" font-size="20" fill="#536078" font-weight="400" text-anchor="middle">modelo</text><path d="M826 247H955" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="893.5" y="225" font-size="20" fill="#536078" font-weight="400" text-anchor="middle">almacenar</text><g data-concept="Extraer"><circle cx="160" cy="254" r="48" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="160" cy="247" r="48" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="doc" href="#doc" x="134.07999999999998" y="221.07999999999998" width="51.84" height="51.84" color="#c74436"/><text x="160" y="338" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Extraer</text><text x="160" y="373" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Texto y origen</text></g><g data-concept="Fragmentar"><circle cx="453" cy="254" r="48" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="453" cy="247" r="48" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="layers" href="#layers" x="427.08" y="221.07999999999998" width="51.84" height="51.84" color="#c74436"/><text x="453" y="338" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Fragmentar</text><text x="453" y="373" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Unidades coherentes</text></g><g data-concept="Representar"><circle cx="747" cy="254" r="48" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="747" cy="247" r="48" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="cpu" href="#cpu" x="721.08" y="221.07999999999998" width="51.84" height="51.84" color="#4f46b8"/><text x="747" y="338" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Representar</text><text x="747" y="373" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Embeddings</text></g><g data-concept="Guardar"><circle cx="1040" cy="254" r="48" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="1040" cy="247" r="48" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="database" href="#database" x="1014.08" y="221.07999999999998" width="51.84" height="51.84" color="#4f46b8"/><text x="1040" y="338" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Guardar</text><text x="1040" y="373" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Vector + texto</text><text x="1040" y="405" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">+ metadatos</text></g><path d="M56 428L1144 428" fill="none" stroke="#dce1ec" stroke-width="1.5"/><rect x="56" y="449" width="210" height="42" rx="21" fill="url(#teal)" stroke="none" stroke-width="1.5"/><text x="161" y="477" font-size="21" fill="#087f7a" font-weight="600" text-anchor="middle">CONSULTAR</text><text x="139" y="535" font-size="24" fill="#17243b" font-weight="700" text-anchor="middle">Pregunta</text><path d="M216 524H320" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="431" y="519" font-size="23" fill="#17243b" font-weight="600" text-anchor="middle">Embedding</text><text x="431" y="551" font-size="23" fill="#17243b" font-weight="600" text-anchor="middle">compatible</text><path d="M543 524H625" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="745" y="519" font-size="23" fill="#17243b" font-weight="600" text-anchor="middle">Filtrar y ordenar</text><text x="745" y="551" font-size="23" fill="#17243b" font-weight="600" text-anchor="middle">por distancia</text><path d="M868 524H921" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="1046" y="519" font-size="23" fill="#17243b" font-weight="600" text-anchor="middle">Fragmentos</text><text x="1046" y="551" font-size="23" fill="#17243b" font-weight="600" text-anchor="middle">→ LLM si hay RAG</text><rect x="56" y="610" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="644" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Recuperar selecciona evidencia; generar redacta una respuesta con esa evidencia.</text></g>
</svg>
