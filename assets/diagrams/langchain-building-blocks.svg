<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title description">
<title id="title">Componer sin mezclar responsabilidades</title><desc id="description">El prompt template combina instrucciones y variables. El modelo genera una respuesta. El parser extrae o valida el formato. El contexto conservado por la aplicación se incorpora al prompt; no significa aprendizaje permanente del modelo.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff4ef"/><stop offset="1" stop-color="#f1ccc5"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f2f0ff"/><stop offset="1" stop-color="#d8d4f5"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#effaf7"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}.title{font-size:32px;font-weight:700}.label{font-size:26px;font-weight:700}.body{font-size:23px;fill:#536078}.small{font-size:21px;fill:#536078}.mono{font-family:Consolas,monospace;font-size:22px}.line{fill:none;stroke:#536078;stroke-width:2.5;marker-end:url(#arrow)}.icon{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#dce1eb;stroke-width:1.5}</style></defs>
<rect width="1200" height="610" fill="#f7f8fc"/>
<text x="56" y="64" class="title">Componer sin mezclar responsabilidades</text><circle cx="225" cy="220" r="52" fill="#4f46b8" opacity=".09"/><circle cx="220" cy="213" r="52" fill="url(#indigo)" stroke="#4f46b8" stroke-opacity=".15"/><g transform="translate(220 213)" class="icon" stroke="#4f46b8"><rect x="-23" y="-29" width="46" height="58" rx="6"/><path d="M-13-14h26M-13-3h20M-13 8h26M-13 19H3"/></g><circle cx="605" cy="220" r="52" fill="#c74436" opacity=".09"/><circle cx="600" cy="213" r="52" fill="url(#coral)" stroke="#c74436" stroke-opacity=".15"/><g transform="translate(600 213)" class="icon" stroke="#c74436"><rect x="-23" y="-23" width="46" height="46" rx="9"/><path d="M-13-23v-10M0-23v-10M13-23v-10M-13 23v10M0 23v10M13 23v10M-23-13h-10M-23 0h-10M-23 13h-10M23-13h10M23 0h10M23 13h10"/><circle cx="0" cy="-8" r="5"/><circle cx="-11" cy="11" r="5"/><circle cx="11" cy="11" r="5"/><path d="m-2-3-6 10M2-3l6 10M-6 11H6"/></g><circle cx="985" cy="220" r="52" fill="#087f7a" opacity=".09"/><circle cx="980" cy="213" r="52" fill="url(#teal)" stroke="#087f7a" stroke-opacity=".15"/><g transform="translate(980 213)" class="icon" stroke="#087f7a"><path d="m-26-20 26-9 26 9v21Q26 21 0 34-26 21-26 1Z"/><path d="m-13 2 9 10L16-11"/></g><path d="M284 213H534M664 213H914" class="line"/><text x="220" y="313" class="label" text-anchor="middle">Prompt template</text><text x="600" y="313" class="label" text-anchor="middle">Modelo</text><text x="980" y="313" class="label" text-anchor="middle">Parser</text><text x="220" y="357" class="body" text-anchor="middle">Instrucciones +</text><text x="220" y="388" class="body" text-anchor="middle">variables + roles</text><text x="600" y="357" class="body" text-anchor="middle">Genera la respuesta</text><text x="600" y="388" class="body" text-anchor="middle">según el contexto</text><text x="980" y="357" class="body" text-anchor="middle">Extrae o valida</text><text x="980" y="388" class="body" text-anchor="middle">la forma de salida</text><rect x="56" y="459" width="385" height="105" rx="22" class="card"/><text x="82" y="500" class="label" text-anchor="start">Contexto de la aplicación</text><text x="82" y="539" class="small" text-anchor="start">Mensajes pertinentes guardados</text><path d="M220 459V406" class="line"/><rect x="668" y="459" width="475" height="105" rx="22" class="card"/><text x="698" y="500" class="label" text-anchor="start">Formato ≠ veracidad</text><text x="698" y="539" class="small" text-anchor="start">Una estructura válida puede ser incorrecta.</text></svg>
