<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title description">
<title id="title">Componer sin mezclar responsabilidades</title><desc id="description">El prompt template combina instrucciones y variables. El modelo genera una respuesta. El parser extrae o valida el formato. El contexto conservado por la aplicación se incorpora al prompt; no significa aprendizaje permanente del modelo.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff4ef"/><stop offset="1" stop-color="#f1ccc5"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f2f0ff"/><stop offset="1" stop-color="#d8d4f5"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#effaf7"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}.title{font-size:32px;font-weight:700}.label{font-size:26px;font-weight:700}.body{font-size:23px;fill:#536078}.small{font-size:22px;fill:#536078}.mono{font-family:Consolas,monospace;font-size:22px}.line{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.icon{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#dce1eb;stroke-width:1.5}</style></defs>
<rect width="1200" height="610" fill="#f7f8fc"/>
<text x="56" y="64" class="title">Componer sin mezclar responsabilidades</text><circle cx="225" cy="220" r="52" fill="#4f46b8" opacity=".09"/><circle cx="220" cy="213" r="52" fill="url(#indigo)" stroke="#4f46b8" stroke-opacity=".15"/><g transform="translate(220 213)" class="icon" stroke="#4f46b8"><rect x="-23" y="-29" width="46" height="58" rx="6"/><path d="M-13-14h26M-13-3h20M-13 8h26M-13 19H3"/></g><circle cx="605" cy="220" r="52" fill="#c74436" opacity=".09"/><circle cx="600" cy="213" r="52" fill="url(#coral)" stroke="#c74436" stroke-opacity=".15"/><g transform="translate(600 213)" class="icon" stroke="#c74436"><g transform="translate(-30 -30) scale(2.5)" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v2M12 2v2M17 20v2M17 2v2M2 12h2M2 17h2M2 7h2M20 12h2M20 17h2M20 7h2M7 20v2M7 2v2"/><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/></g></g><circle cx="985" cy="220" r="52" fill="#087f7a" opacity=".09"/><circle cx="980" cy="213" r="52" fill="url(#teal)" stroke="#087f7a" stroke-opacity=".15"/><g transform="translate(980 213)" class="icon" stroke="#087f7a"><g transform="translate(-30 -30) scale(2.5)" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h20M6 12h12M9 19h6"/></g></g><path d="M272 213H548" class="line"/><path d="M652 213H928" class="line"/><text x="220" y="313" class="label" text-anchor="middle">Prompt template</text><text x="600" y="313" class="label" text-anchor="middle">Modelo</text><text x="980" y="313" class="label" text-anchor="middle">Parser</text><text x="220" y="357" class="body" text-anchor="middle">Instrucciones +</text><text x="220" y="388" class="body" text-anchor="middle">variables + roles</text><text x="600" y="357" class="body" text-anchor="middle">Genera la respuesta</text><text x="600" y="388" class="body" text-anchor="middle">según el contexto</text><text x="980" y="357" class="body" text-anchor="middle">Extrae o valida</text><text x="980" y="388" class="body" text-anchor="middle">la forma de salida</text><rect x="56" y="459" width="385" height="105" rx="22" class="card"/><text x="82" y="500" class="label" text-anchor="start">Contexto de la aplicación</text><text x="82" y="539" class="small" text-anchor="start">Mensajes pertinentes guardados</text><path d="M220 459V406" class="line"/><rect x="668" y="459" width="475" height="105" rx="22" class="card"/><text x="698" y="500" class="label" text-anchor="start">Formato ≠ veracidad</text><text x="698" y="539" class="small" text-anchor="start">Una estructura válida puede ser incorrecta.</text></svg>
