<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Estado Actual y Cierre Histórico</title><desc id="description">El contrato figura vigente en septiembre y suspendido en octubre. Atención puede consultar el estado actual, mientras Finanzas necesita reproducir el cierre del 30 de septiembre. El archivo del cierre conserva los datos, las reglas aplicadas y la fecha de corte. Así se puede reconstruir aquel resultado aunque el origen cambie; consultar solo el estado de octubre no explica el cierre anterior.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Estado Actual y Cierre Histórico</tspan></text><text x="96" y="271.59" font-size="25.5" fill="#2E5C70" font-weight="700" text-anchor="start"><tspan x="96" y="271.59">ESTADO OPERATIVO</tspan></text><line x1="264" y1="419" x2="1740" y2="419" stroke="#2E5C70" stroke-width="4"/><path d="M1740 419 L1724 427 L1724 411 Z" fill="#2E5C70" stroke="#2E5C70" stroke-width="1" stroke-linejoin="round"/><circle cx="354" cy="419" r="13" fill="#3C4545" stroke="#3C4545" stroke-width="2"/><text x="354" y="360.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="354" y="360.59">Vigente</tspan></text><text x="354" y="479.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="354" y="479.27">15 de septiembre</tspan></text><circle cx="980" cy="419" r="13" fill="#3C4545" stroke="#3C4545" stroke-width="2"/><text x="980" y="360.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="980" y="360.59">Vigente</tspan></text><text x="980" y="479.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="980" y="479.27">30 de septiembre</tspan></text><circle cx="1620" cy="419" r="13" fill="#C74634" stroke="#C74634" stroke-width="2"/><text x="1620" y="360.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="middle"><tspan x="1620" y="360.59">Suspendido</tspan></text><text x="1620" y="479.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1620" y="479.27">15 de octubre</tspan></text><text x="96" y="669.882" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="96" y="669.882">ARCHIVO </tspan><tspan x="96" y="705.298">DEL CIERRE</tspan></text><path d="M850 508 V520 H1110 V508" fill="none" stroke="#3C4545" stroke-width="3" stroke-linejoin="round"/><line x1="980" y1="520" x2="980" y2="646" stroke="#3C4545" stroke-width="4"/><path d="M980 646 L972 630 L988 630 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><rect x="728" y="646" width="532" height="265" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="728" y="646" width="532" height="6" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><path d="M1200 646 V706 H1260" fill="none" stroke="#3C4545" stroke-width="3" stroke-linejoin="round"/><text x="762" y="711.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="762" y="711.59">CIERRE SEPTIEMBRE</tspan></text><text x="762" y="789.856" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="762" y="789.856">Estado: vigente </tspan><tspan x="762" y="833.684">Datos + reglas + fecha</tspan></text><rect x="1415" y="690" width="409" height="230" rx="0" fill="#FFFFFF" stroke="#697778" stroke-width="2"/><line x1="1260" y1="781" x2="1415" y2="781" stroke="#3C4545" stroke-width="4"/><path d="M1415 781 L1399 789 L1399 773 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><text x="1450" y="747.879" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1450" y="747.879">Reproducir </tspan><tspan x="1450" y="782.941">el cierre</tspan></text><text x="1450" y="874.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1450" y="874.27">Aunque el origen cambió</tspan></text></g></svg>
