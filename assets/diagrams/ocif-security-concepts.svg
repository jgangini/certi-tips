<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="security-concepts">
<title id="title">La seguridad tiene responsabilidades compartidas</title>
<desc id="description">La seguridad tiene responsabilidades compartidas</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></symbol><symbol id="doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9Z"/><path d="M14 2v7h7M7 13h10M7 17h7"/></symbol><symbol id="shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4v7c0 5-6 8-9 9-3-1-9-4-9-9V6Z"/><path d="m7 12 3 3 7-7"/></symbol><symbol id="server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2" width="18" height="8" rx="2"/><rect x="3" y="14" width="18" height="8" rx="2"/><path d="M6 6h.1M6 18h.1M11 6h6M11 18h6"/></symbol><symbol id="network" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="2.5"/><circle cx="4" cy="19" r="2.5"/><circle cx="20" cy="19" r="2.5"/><path d="M11 6 5 17m8-11 6 11M7 19h10"/></symbol><symbol id="cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19H18a4 4 0 0 0 0-8h-1a6 6 0 0 0-12-1a4.6 4.6 0 0 0 1 9Z"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">La seguridad tiene responsabilidades compartidas</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">El reparto de tareas cambia con el servicio; la responsabilidad del cliente permanece.</text><rect x="117" y="175" width="966" height="166" rx="18" fill="url(#coral)" stroke="#c74436" stroke-width="1.5"/><text x="600" y="210" font-size="25" fill="#c74436" font-weight="700" text-anchor="middle">Cliente: datos, acceso y configuración</text><use data-icon="user" href="#user" x="272.5" y="240.5" width="63" height="63" color="#c74436"/><use data-icon="doc" href="#doc" x="568.5" y="240.5" width="63" height="63" color="#c74436"/><use data-icon="shield" href="#shield" x="864.5" y="240.5" width="63" height="63" color="#c74436"/><rect x="117" y="376" width="966" height="164" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><text x="600" y="411" font-size="25" fill="#4f46b8" font-weight="700" text-anchor="middle">Oracle: infraestructura y componentes gestionados</text><use data-icon="server" href="#server" x="272.5" y="442.5" width="63" height="63" color="#4f46b8"/><use data-icon="network" href="#network" x="568.5" y="442.5" width="63" height="63" color="#4f46b8"/><use data-icon="cloud" href="#cloud" x="864.5" y="442.5" width="63" height="63" color="#4f46b8"/><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">En una VM, el cliente también administra y parchea el sistema invitado.</text></g>
</svg>
