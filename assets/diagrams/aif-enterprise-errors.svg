<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="security-layers">
<title id="title">La seguridad tiene capas y responsables</title>
<desc id="description">Una frontera común aplica identidad IAM red y políticas de datos. Dentro, controles de entrada, contexto de modelo, autorización de herramientas y revisión de salida actúan en puntos diferentes. Informar no implica bloquear.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h20l-8 9v8l-4 2V12Z"/></symbol><symbol id="cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M8 2v3m4-3v3m4-3v3M8 19v3m4-3v3m4-3v3M2 8h3m-3 4h3m-3 4h3m14-8h3m-3 4h3m-3 4h3"/></symbol><symbol id="shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4v7c0 5-6 8-9 9-3-1-9-4-9-9V6Z"/><path d="m7 12 3 3 7-7"/></symbol><symbol id="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12Z"/><circle cx="12" cy="12" r="3"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">La seguridad tiene capas y responsables</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Los controles de contenido complementan los controles de acceso.</text><rect x="63" y="162" width="1074" height="373" rx="28" fill="#fff" stroke="#dce1ec" stroke-width="1.5"/><text x="600" y="202" font-size="26" fill="#17243b" font-weight="700" text-anchor="middle">Límite de acceso: identidad + IAM + red + datos</text><path d="M239 320H368" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><path d="M532 320H662" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><path d="M826 320H955" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><g data-concept="Entrada"><circle cx="160" cy="327" r="53" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="160" cy="320" r="53" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="filter" href="#filter" x="131.38" y="291.38" width="57.24" height="57.24" color="#c74436"/><text x="160" y="416" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Entrada</text><text x="160" y="451" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Detectar riesgos</text><text x="160" y="483" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">en texto y archivos</text></g><g data-concept="Modelo"><circle cx="453" cy="327" r="53" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="453" cy="320" r="53" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="cpu" href="#cpu" x="424.38" y="291.38" width="57.24" height="57.24" color="#4f46b8"/><text x="453" y="416" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Modelo</text><text x="453" y="451" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Contexto delimitado</text><text x="453" y="483" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">y salida evaluada</text></g><g data-concept="Herramienta"><circle cx="747" cy="327" r="53" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="747" cy="320" r="53" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="shield" href="#shield" x="718.38" y="291.38" width="57.24" height="57.24" color="#4f46b8"/><text x="747" y="416" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Herramienta</text><text x="747" y="451" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Permisos y validación</text><text x="747" y="483" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">antes de ejecutar</text></g><g data-concept="Salida"><circle cx="1040" cy="327" r="53" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="1040" cy="320" r="53" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="eye" href="#eye" x="1011.38" y="291.38" width="57.24" height="57.24" color="#087f7a"/><text x="1040" y="416" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Salida</text><text x="1040" y="451" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Revisar y aplicar</text><text x="1040" y="483" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">la acción configurada</text></g><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Detectar o informar un riesgo solo bloquea si la aplicación aplica ese control.</text></g>
</svg>
