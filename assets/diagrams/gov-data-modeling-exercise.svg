<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">El Consentimiento se Interpreta en una Fecha</title><desc id="description">El consentimiento comercial de C7 comienza el 1 de marzo y se retira el 20 de abril. La campaña del 15 de abril cae dentro del intervalo mostrado, pero la decisión también debe corresponder a la finalidad autorizada y a su evidencia. Modela sujeto, finalidad, inicio y retirada; un indicador de consentimiento actual no reconstruye por sí solo la autorización de una fecha pasada.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">El Consentimiento se Interpreta en una Fecha</tspan></text><rect x="76" y="800" width="492" height="150" rx="0" fill="none" stroke="#697778" stroke-width="2"/><rect x="644" y="800" width="520" height="150" rx="0" fill="none" stroke="#697778" stroke-width="2"/><rect x="1214" y="800" width="610" height="150" rx="0" fill="none" stroke="#697778" stroke-width="2"/><g data-person-icon="user-supplied" transform="translate(96 825) scale(3.5)" fill="#2E5C70"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"/><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z"/></g><text x="330" y="333.91" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="330" y="333.91">Autoriza</tspan></text><text x="1620" y="333.91" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1620" y="333.91">Retira</tspan></text><rect x="330" y="470" width="1290" height="194" rx="0" fill="#749B6B" stroke="#3C4545" stroke-width="3"/><rect x="1620" y="470" width="204" height="194" rx="0" fill="#FFFFFF" stroke="#C74634" stroke-width="3"/><text x="975" y="549.07" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="975" y="549.07">Autorizado para uso comercial</tspan></text><text x="975" y="615.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="975" y="615.27">Finalidad y periodo delimitados</tspan></text><text x="1722" y="576.27" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="middle"><tspan x="1722" y="576.27">Retirado</tspan></text><line x1="330" y1="361" x2="330" y2="470" stroke="#3C4545" stroke-width="3"/><line x1="1620" y1="361" x2="1620" y2="470" stroke="#3C4545" stroke-width="3"/><text x="330" y="723.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="330" y="723.59">1 de marzo</tspan></text><text x="1620" y="723.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1620" y="723.59">20 de abril</tspan></text><text x="1070" y="215.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="1070" y="215.59">Campaña: 15 de abril</tspan></text><line x1="1491" y1="255" x2="1491" y2="470" stroke="#C74634" stroke-width="5"/><path d="M1491 470 L1483 454 L1499 454 Z" fill="#C74634" stroke="#C74634" stroke-width="1" stroke-linejoin="round"/><text x="172" y="851.27" font-size="25.5" fill="#697778" font-weight="400" text-anchor="start"><tspan x="172" y="851.27">SUJETO</tspan></text><text x="96" y="913.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="96" y="913.59">Cliente C7</tspan></text><text x="665" y="851.27" font-size="25.5" fill="#697778" font-weight="400" text-anchor="start"><tspan x="665" y="851.27">FINALIDAD</tspan></text><text x="665" y="913.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="665" y="913.59">Uso comercial</tspan></text><text x="1234" y="851.27" font-size="25.5" fill="#697778" font-weight="400" text-anchor="start"><tspan x="1234" y="851.27">EVIDENCIA</tspan></text><text x="1234" y="913.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1234" y="913.59">Aceptación y retiro</tspan></text></g></svg>
