  <g text-anchor="middle"><text x="200" y="283" class="label">Embed</text><text x="200" y="320">Vectores para recuperar candidatos</text><text x="600" y="283" class="label">Rerank · opcional</text><text x="600" y="320">Prioriza por relevancia</text><text x="1000" y="283" class="label">Chat</text><text x="1000" y="320">Redacta con el contexto elegido</text></g>
