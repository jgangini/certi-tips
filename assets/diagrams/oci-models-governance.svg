<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
  <title id="title">Tareas del modelo, capacidad de servicio y gobierno en OCI</title>
  <desc id="description">En una recuperación documental, embeddings ayudan a recuperar candidatos, rerank puede priorizarlos y chat redacta con el contexto elegido. La capacidad de modelos puede ser on-demand o dedicada. Red, IAM y guardrails protegen aspectos diferentes de todo el flujo.</desc>
