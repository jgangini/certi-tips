<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 654" role="img" aria-labelledby="title description">
  <title id="title">Errores de control y su corrección</title>
  <desc id="description">Una petición no equivale a permiso. Un argumento con formato válido aún necesita validación de negocio. Los documentos recuperados son datos. Las ejecuciones necesitan límites y supervisión.</desc>
  <defs>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b;font-size:24px}
      .title{font-size:34px;font-weight:700}
      .label{font-size:26px;font-weight:700}
      .mistake rect{fill:#fae6e1;stroke:#efc7be;stroke-width:1.5}
      .correction rect{fill:#e1f2ee;stroke:#b7ddd5;stroke-width:1.5}
      .arrow{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .icon{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="654" fill="#f7f8fc"/>
  <text x="56" y="64" class="title">Qué comprobar antes de actuar</text>
  <g class="column-headings">
    <circle cx="80" cy="118" r="16" fill="#fae6e1"/>
    <path d="m75 113 10 10m0-10-10 10" class="icon" stroke="#c74436"/>
    <text x="108" y="127" class="label">Error o confusión</text>
    <circle cx="648" cy="118" r="16" fill="#e1f2ee"/>
    <path d="m641 118 5 5 9-10" class="icon" stroke="#087f7a"/>
    <text x="676" y="127" class="label">Qué comprobar</text>
  </g>
  <g class="comparison-row" transform="translate(0 154)">
    <g class="mistake">
      <rect x="56" width="480" height="96" rx="16"/>
      <text x="82" y="57">«El modelo lo pidió»</text>
    </g>
    <path d="M553 48h50m-13-9 13 9-13 9" class="arrow"/>
    <g class="correction">
      <rect x="624" width="520" height="96" rx="16"/>
      <text x="650" y="57">Identidad y permiso para la acción</text>
    </g>
  </g>
  <g class="comparison-row" transform="translate(0 270)">
    <g class="mistake">
      <rect x="56" width="480" height="96" rx="16"/>
      <text x="82" y="57">«El JSON tiene formato válido»</text>
    </g>
    <path d="M553 48h50m-13-9 13 9-13 9" class="arrow"/>
    <g class="correction">
      <rect x="624" width="520" height="96" rx="16"/>
      <text x="650" y="57">Argumentos y reglas de negocio</text>
    </g>
  </g>
  <g class="comparison-row" transform="translate(0 386)">
    <g class="mistake">
      <rect x="56" width="480" height="96" rx="16"/>
      <text x="82" y="57">«El documento da instrucciones»</text>
    </g>
    <path d="M553 48h50m-13-9 13 9-13 9" class="arrow"/>
    <g class="correction">
      <rect x="624" width="520" height="96" rx="16"/>
      <text x="650" y="57">Origen y separación de instrucciones</text>
    </g>
  </g>
  <g class="comparison-row" transform="translate(0 502)">
    <g class="mistake">
      <rect x="56" width="480" height="96" rx="16"/>
      <text x="82" y="57">«Que continúe hasta resolverlo»</text>
    </g>
    <path d="M553 48h50m-13-9 13 9-13 9" class="arrow"/>
    <g class="correction">
      <rect x="624" width="520" height="96" rx="16"/>
      <text x="650" y="57">Límites de pasos, tiempo y gasto</text>
    </g>
  </g>
</svg>
