<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
<title id="title">Cuatro preguntas para entender MCP</title><desc id="description">Los objetivos se organizan en cuatro preguntas: qué responsabilidad corresponde al host, cliente y servidor; qué capacidad hace falta; qué mensajes circulan; y qué transporte conecta cliente y servidor.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff4ef"/><stop offset="1" stop-color="#f1ccc5"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f2f0ff"/><stop offset="1" stop-color="#d8d4f5"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#effaf7"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}.title{font-size:32px;font-weight:700}.label{font-size:26px;font-weight:700}.body{font-size:23px;fill:#536078}.small{font-size:21px;fill:#536078}.mono{font-family:Consolas,monospace;font-size:22px}.line{fill:none;stroke:#536078;stroke-width:2.5;marker-end:url(#arrow)}.icon{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#dce1eb;stroke-width:1.5}</style></defs>
<rect width="1200" height="600" fill="#f7f8fc"/>
<text x="56" y="64" class="title">Cuatro preguntas para entender MCP</text><rect x="56" y="116" width="518" height="196" rx="22" class="card"/><rect x="624" y="116" width="518" height="196" rx="22" class="card"/><rect x="56" y="350" width="518" height="196" rx="22" class="card"/><rect x="624" y="350" width="518" height="196" rx="22" class="card"/><circle cx="139" cy="199" r="42" fill="#4f46b8" opacity=".09"/><circle cx="134" cy="192" r="42" fill="url(#indigo)" stroke="#4f46b8" stroke-opacity=".15"/><g transform="translate(134 192)" class="icon" stroke="#4f46b8"><rect x="-33" y="-26" width="66" height="52" rx="6"/><path d="M-33-11h66M-23-19h1m8 0h1m8 0h1M-18 0l10 8-10 8M1 16h17"/></g><circle cx="707" cy="199" r="42" fill="#087f7a" opacity=".09"/><circle cx="702" cy="192" r="42" fill="url(#teal)" stroke="#087f7a" stroke-opacity=".15"/><g transform="translate(702 192)" class="icon" stroke="#087f7a"><path d="M12-27a20 20 0 0 0-25 26l-20 20a8 8 0 0 0 11 11L-2 10A20 20 0 0 0 24-16L11-3-2-16Z"/></g><circle cx="139" cy="433" r="42" fill="#c74436" opacity=".09"/><circle cx="134" cy="426" r="42" fill="url(#coral)" stroke="#c74436" stroke-opacity=".15"/><g transform="translate(134 426)" class="icon" stroke="#c74436"><rect x="-23" y="-29" width="46" height="58" rx="6"/><path d="M-13-14h26M-13-3h20M-13 8h26M-13 19H3"/></g><circle cx="707" cy="433" r="42" fill="#4f46b8" opacity=".09"/><circle cx="702" cy="426" r="42" fill="url(#indigo)" stroke="#4f46b8" stroke-opacity=".15"/><g transform="translate(702 426)" class="icon" stroke="#4f46b8"><path d="m-3-17 8-8a18 18 0 0 1 25 25l-8 8M3 17l-8 8A18 18 0 0 1-30 0l8-8M-13 13 13-13"/></g><text x="208" y="179" class="label" text-anchor="start">¿Quién hace qué?</text><text x="208" y="223" class="small" text-anchor="start">Host, cliente y servidor</text><text x="208" y="254" class="small" text-anchor="start">tienen funciones distintas.</text><text x="776" y="179" class="label" text-anchor="start">¿Qué necesito?</text><text x="776" y="223" class="small" text-anchor="start">Elegir tools, resources</text><text x="776" y="254" class="small" text-anchor="start">o prompts según la tarea.</text><text x="208" y="413" class="label" text-anchor="start">¿Qué se intercambia?</text><text x="208" y="457" class="small" text-anchor="start">Descubrir, llamar</text><text x="208" y="488" class="small" text-anchor="start">y relacionar respuestas.</text><text x="776" y="413" class="label" text-anchor="start">¿Por dónde viaja?</text><text x="776" y="457" class="small" text-anchor="start">Identificar ambos extremos</text><text x="776" y="488" class="small" text-anchor="start">antes de elegir transporte.</text></svg>
