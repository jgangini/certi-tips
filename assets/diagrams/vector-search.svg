<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
  <title id="title">Del documento al vecino semántico y a una respuesta con evidencia</title>
  <desc id="description">Preparación: documentos se dividen en fragmentos y se convierten en embeddings. Los vectores se almacenan con el texto y sus metadatos. Consulta: la pregunta se transforma con el mismo modelo compatible; el punto de consulta encuentra vecinos semánticos permitidos. El mapa de dos dimensiones es una representación didáctica, no los vectores reales. Para RAG, los fragmentos recuperados y la pregunta se entregan al LLM, que genera una respuesta sustentada en fuentes. Buscar similitud no es generar una respuesta.</desc>
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#e1e5f1" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#c74436" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}.title{font-size:34px;font-weight:700}.subtitle{font-size:21px;fill:#536078}.label{font-size:23px;font-weight:700}.body{font-size:21px}.meta{font-size:21px;fill:#536078}.muted{fill:#536078}.white{fill:#fff}.coral{fill:#c74436}.teal{fill:#087f7a}.line{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#f7f8fc"/>
  <g transform="translate(0 -50)">
  <text x="56" y="98" class="title">Primero encuentra evidencia. Después responde.</text>
  <text x="56" y="134" class="subtitle">Un embedding sitúa el significado; la búsqueda recupera texto y el LLM construye la respuesta.</text>
  <text x="56" y="196" class="meta" font-weight="700">01 / PREPARAR LOS DATOS</text>
  <!-- Document fan, text fragments and an embedding encoder form a literal pipeline. -->
  <path d="M90 236h63l17 18v83H90Z" fill="#e5e2f5" stroke="#c5c0e5" stroke-width="2" transform="rotate(-10 130 287)"/>
  <path d="M106 230h63l18 18v100h-81Z" fill="#fff" stroke="#a8a3d8" stroke-width="2"/>
  <path d="M169 230v20h18M121 269h48m-48 14h48m-48 14h37m-37 14h44m-44 14h26" fill="none" stroke="#aaa5d7" stroke-width="3" stroke-linecap="round"/>
  <text x="140" y="382" text-anchor="middle" class="body">Documentos</text>
  <path d="M187 290H270" class="line"/>
  <rect x="270" y="239" width="118" height="28" rx="7" fill="#eae7fb" stroke="#a8a3d8"/>
  <rect x="270" y="280" width="118" height="28" rx="7" fill="#eae7fb" stroke="#a8a3d8"/>
  <rect x="270" y="321" width="118" height="28" rx="7" fill="#eae7fb" stroke="#a8a3d8"/>
  <path d="M284 253h89m-89 41h72m-72 41h82" stroke="#7770be" stroke-width="3" stroke-linecap="round"/>
  <text x="329" y="382" text-anchor="middle" class="body">Fragmentos</text>
  <path d="M388 290H462" class="line"/>
  <circle cx="523" cy="291" r="61" fill="#4f46b8"/>
  <path d="M493 302v-18m15 35v-53m15 61v-72m15 58v-44m15 33v-18" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <text x="523" y="382" text-anchor="middle" class="body">Embeddings</text>
  <path d="M584 291H706" class="line"/>
  <!-- Meaning space: a query star and its three illustrative neighbours. -->
  <rect x="706" y="215" width="438" height="312" rx="22" fill="#fff" stroke="#d8dcec" stroke-width="1.5"/>
  <path d="M726 245h398v260H726Z" fill="url(#grid)"/>
  <text x="727" y="196" class="label">Espacio semántico</text>
  <g fill="#aaa6d5">
    <circle cx="765" cy="283" r="6"/><circle cx="794" cy="302" r="6"/><circle cx="825" cy="276" r="6"/><circle cx="800" cy="260" r="6"/><circle cx="749" cy="315" r="6"/>
    <circle cx="1042" cy="282" r="6"/><circle cx="1096" cy="303" r="6"/><circle cx="1066" cy="335" r="6"/><circle cx="1110" cy="363" r="6"/>
    <circle cx="1021" cy="455" r="6"/><circle cx="1072" cy="476" r="6"/><circle cx="1101" cy="443" r="6"/><circle cx="764" cy="462" r="6"/>
  </g>
  <ellipse cx="922" cy="397" rx="76" ry="68" fill="#e0f1eb" stroke="#087f7a" stroke-dasharray="6 6" stroke-width="1.8"/>
  <path d="M910 410 882 376m28 34 48-39m-48 39 32 32" stroke="#087f7a" stroke-width="2"/>
  <g fill="#087f7a" stroke="#fff" stroke-width="3"><circle cx="882" cy="376" r="9"/><circle cx="958" cy="371" r="9"/><circle cx="942" cy="442" r="9"/></g>
  <path d="m910 395 5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2Z" fill="#c74436" stroke="#fff" stroke-width="2"/>
  <text x="957" y="495" class="meta">Vecinos próximos</text>
  <text x="727" y="549" class="meta">Vista 2D ilustrativa · vectores + texto</text>
  <text x="56" y="439" class="meta" font-weight="700">02 / BUSCAR CON LA PREGUNTA</text>
  <path d="M73 458h290q12 0 12 12v36q0 12-12 12H111l-21 17v-17H73q-12 0-12-12v-36q0-12 12-12Z" fill="#fae9e5" stroke="#e3b0a8" stroke-width="1.5"/>
  <text x="88" y="495" class="body">«Mochila para laptop»</text>
  <path d="M375 489H492" class="line"/>
  <circle cx="523" cy="489" r="31" fill="#c74436"/>
  <path d="M507 493v-7m8 14v-22m8 26v-31m8 24v-17m8 11v-6" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="523" y="548" text-anchor="middle" class="meta">Mismo modelo compatible</text>
  <path d="M554 489H629Q651 489 651 467V432Q651 410 673 410H894" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/>
  <path d="M56 573h1088" stroke="#dbe0eb"/>
  <text x="56" y="608" class="meta" font-weight="700">03 / GENERAR CON RAG</text>
  <text x="56" y="641" class="body">Pregunta del usuario</text>
  <text x="423" y="640" text-anchor="middle" class="label muted">+</text>
  <path d="M469 604h44l12 12v40h-56Z" fill="#fff" stroke="#087f7a" stroke-width="2"/><path d="M482 622h26m-26 11h26m-26 11h18" stroke="#087f7a" stroke-width="2"/>
  <text x="547" y="623" class="body">Fragmentos</text><text x="547" y="650" class="body">permitidos</text>
  <path d="M665 631H735" class="line"/>
  <rect x="735" y="601" width="99" height="58" rx="16" fill="#17243b"/><text x="784" y="638" class="label white" text-anchor="middle">LLM</text>
  <path d="M834 631H900" class="line"/>
  <text x="917" y="623" class="body teal" font-weight="700">Respuesta</text><text x="917" y="650" class="body">con fuentes</text>
  </g>
</svg>
