  <text x="160" y="499" text-anchor="middle" class="label">Triage</text><text x="160" y="535" text-anchor="middle" class="small muted">Identifica la intención</text>
  <text x="258" y="394" text-anchor="middle" class="small muted">deriva</text>
  <rect x="306" y="243" width="250" height="80" rx="18" fill="#f0f2f7"/>
  <g transform="translate(331 267) scale(1.33)" class="icon" stroke="#536078"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M12 11h4M12 16h4M8 11h.01M8 16h.01"/></g>
  <text x="388" y="292">Políticas</text>
  <rect x="306" y="353" width="250" height="124" rx="18" fill="#fae6e1" stroke="#c74436" stroke-width="2"/>
  <g transform="translate(330 393) scale(1.5)" class="icon" stroke="#c74436"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73zM12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></g>
  <text x="388" y="393" class="label">Pedidos</text>
  <rect x="382" y="414" width="151" height="39" rx="12" fill="#c74436"/><text x="457" y="440" text-anchor="middle" class="small white">Agente activo</text>
  <rect x="306" y="513" width="250" height="80" rx="18" fill="#f0f2f7"/>
  <g transform="translate(331 537) scale(1.33)" class="icon" stroke="#536078"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></g><text x="388" y="562">Reembolsos</text>
