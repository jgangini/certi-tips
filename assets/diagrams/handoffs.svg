<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title description">
  <title id="title">Handoff frente a llamada a herramienta: quién conserva el control</title>
  <desc id="description">En el handoff, triage deriva la tarea al especialista de pedidos y este pasa a ser el agente activo. Políticas y reembolsos son otras ramas posibles. En la consulta como herramienta, el manager recibe un resultado y sigue a cargo de la respuesta. El handoff no garantiza volver al agente original.</desc>
  <!-- Lucide headset, package, clipboard-list, dollar-sign and bot adapted; license: ../icons/LICENSE-lucide.txt -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m2 2 6 3-6 3" fill="none" stroke="#536078" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b;font-size:22px}.h{font-size:34px;font-weight:700}.label{font-size:26px;font-weight:700}.muted{fill:#536078}.small{font-size:20px}.icon{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.white{fill:#fff}</style>
  </defs>
  <rect width="1200" height="740" fill="#f7f8fc"/>
  <text x="56" y="62" class="h">¿Derivas la tarea o pides ayuda?</text><text x="56" y="102" class="muted">La diferencia es quién conserva la responsabilidad de responder.</text>
  <g fill="#fff" stroke="#dce1ec"><rect x="56" y="139" width="528" height="551" rx="24"/><rect x="608" y="139" width="536" height="551" rx="24"/></g>
  <text x="82" y="184" class="label">A · Handoff</text><text x="82" y="221" class="muted">El especialista toma el control</text>
  <text x="634" y="184" class="label">B · Agente como herramienta</text><text x="634" y="221" class="muted">El manager conserva el control</text>
  <path d="M208 413H244Q262 413 262 395V301Q262 283 280 283H306" class="route" stroke-dasharray="5 6"/>
  <path d="M208 413H306" class="route"/>
  <path d="M208 413H244Q262 413 262 431V535Q262 553 280 553H306" class="route" stroke-dasharray="5 6"/>
  <circle cx="160" cy="413" r="48" fill="#e9e6fa"/>
