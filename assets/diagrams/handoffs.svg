  <g transform="translate(990 372) scale(2.33)" class="icon" stroke="#4f46b8"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></g>
  <text x="732" y="499" text-anchor="middle" class="label">Manager</text><text x="732" y="535" text-anchor="middle" class="small muted">Sigue a cargo</text>
  <text x="1018" y="477" text-anchor="middle" class="label">Especialista</text><text x="1018" y="513" text-anchor="middle" class="small muted">Como herramienta</text>
  <rect x="82" y="624" width="476" height="42" rx="12" fill="#fae6e1"/><text x="320" y="652" text-anchor="middle">El especialista continúa la tarea</text>
  <rect x="634" y="624" width="484" height="42" rx="12" fill="#e1f2ee"/><text x="876" y="652" text-anchor="middle">El manager integra y responde</text>
</svg>
