-tag" /><text x="445" y="632.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="445" y="632.8">REFERENCIA</tspan></text><rect x="130" y="662" width="630" height="118" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M142 662 H748 Q760 662 760 674 V726 H130 V674 Q130 662 142 662 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="center"><rect x="130" y="662" width="260" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="260.0" y="704.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="260.0" y="704.8">Código</tspan></text></g></g><g data-table-cell="header" data-cell-align="center"><rect x="390" y="662" width="370" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="575.0" y="704.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="575.0" y="704.8">Significado</tspan></text></g></g><line x1="390" y1="662" x2="390" y2="726" stroke="#FFFFFF" stroke-width="1.5" /><line x1="390" y1="726" x2="390" y2="780" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="center"><rect x="130" y="726" width="260" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="260.0" y="763.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="260.0" y="763.8">ACTIVO</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="390" y="726" width="370" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="575.0" y="763.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="575.0" y="763.8">Contrato vigente</tspan></text></g></g><rect x="1278.5" y="276" width="203" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.