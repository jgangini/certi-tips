<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">La Factura Usa Entidades y Códigos Compartidos</title><desc id="description">Cliente C-17 y plan P-2 son identidades maestras compartidas. ACTIVO es un código de referencia cuyo significado es «contrato vigente». La factura F42 es una transacción que usa esas claves y códigos. Relacionarse con un maestro no convierte la factura en maestro: cada objeto conserva su identidad, significado y función dentro del intercambio.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">La Factura Usa Entidades y Códigos Compartidos</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" transform="translate(0.000 0.455)" data-center="960 608"><rect x="360.452" y="244.09" width="159.097" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="440.0" y="278.59" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="middle"><tspan x="440.0" y="278.59">MAESTROS</tspan></text><rect x="105" y="325" width="670" height="82" rx="0" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><path d="M117.0 325.0 H763.0 Q775.0 325.0 775.0 337.0 V407.0 H105.0 V337.0 Q105.0 325.0 117.0 325.0 Z" fill="#59616E" stroke="none" data-table-header="true" /><text x="222.5" y="375.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="222.5" y="375.5">Entidad</tspan></text><line x1="340" y1="325" x2="340" y2="407" stroke="#59616E" stroke-width="2" /><text x="557.5" y="375.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="557.5" y