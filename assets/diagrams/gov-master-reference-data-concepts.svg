<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">La Factura Usa Entidades y Códigos Compartidos</title><desc id="description">Cliente C-17 y plan P-2 son identidades maestras compartidas. ACTIVO es un código de referencia cuyo significado es «contrato vigente». La factura F42 es una transacción que usa esas claves y códigos. Relacionarse con un maestro no convierte la factura en maestro: cada objeto conserva su identidad, significado y función dentro del intercambio.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">La Factura Usa Entidades y Códigos Compartidos</tspan></text><text x="105" y="278.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="105" y="278.59">MAESTROS</tspan></text><rect x="105" y="325" width="670" height="82" rx="0" fill="#EEF3F4" stroke="#C2D4D4" stroke-width="2"/><text x="125" y="368.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="125" y="368.27">Entidad</tspan></text><line x1="340" y1="325" x2="340" y2="407" stroke="#C2D4D4" stroke-width="2"/><text x="360" y="368.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="360" y="368.27">Identidad</tspan></text><rect x="105" y="407" width="670" height="82" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><text x="125" y="450.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="125" y="450.27">Cliente</tspan></text><line x1="340" y1="407" x2="340" y2="489" stroke="#C2D4D4" stroke-width="2"/><text x="360" y="450.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="360" y="450.27">C-17</tspan></text><rect x="105" y="489" width="670" height="82" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><text x="125" y="532.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="125" y="532.27">Plan</tspan></text><line x1="340" y1="489" x2="340" y2="571" stroke="#C2D4D4" stroke-width="2"/><text x="360" y="532.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="360" y="532.27">P-2</tspan></text><text x="105" y="650.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="105" y="650.59">REFERENCIA</tspan></text><rect x="105" y="696" width="670" height="82" rx="0" fill="#F7EFE8" stroke="#C2D4D4" stroke-width="2"/><text x="125" y="739.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="125" y="739.27">Código</tspan></text><line x1="340" y1="696" x2="340" y2="778" stroke="#C2D4D4" stroke-width="2"/><text x="360" y="739.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="360" y="739.27">Significado</tspan></text><rect x="105" y="778" width="670" height="82" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><text x="125" y="821.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="125" y="821.27">ACTIVO</tspan></text><line x1="340" y1="778" x2="340" y2="860" stroke="#C2D4D4" stroke-width="2"/><text x="360" y="821.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="360" y="821.27">Contrato vigente</tspan></text><text x="1000" y="278.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="1000" y="278.59">TRANSACCIÓN</tspan></text><rect x="1000" y="325" width="800" height="540" rx="0" fill="#F1EFED" stroke="#3C4545" stroke-width="3"/><rect x="1000" y="325" width="800" height="6" rx="0" fill="#2E5C70" stroke="none" stroke-width="2"/><g data-svgrepo-icon="document" transform="translate(1