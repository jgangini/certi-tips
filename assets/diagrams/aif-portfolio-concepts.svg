<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="portfolio-routing">
<title id="title">El portafolio se elige por responsabilidad</title>
<desc id="description">AI Services ofrece capacidades preparadas; Data Science permite desarrollar y operar modelos propios; infraestructura permite controlar cómputo especializado. Cada nivel conserva responsabilidades sobre datos calidad y operación.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10v4m4-8v12m4-16v20m4-15v10m4-13v16m4-10v4"/></symbol><symbol id="cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19H18a4 4 0 0 0 0-8h-1a6 6 0 0 0-12-1a4.6 4.6 0 0 0 1 9Z"/></symbol><symbol id="flask" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8M9 2v7L2 21h20L15 9V2M7 14h10"/></symbol><symbol id="code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 8h20m-17-3h1m3 0h1m-5 7 3 3-3 3m6 0h5"/></symbol><symbol id="server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2" width="18" height="8" rx="2"/><rect x="3" y="14" width="18" height="8" rx="2"/><path d="M6 6h.1M6 18h.1M11 6h6M11 18h6"/></symbol><symbol id="network" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="2.5"/><circle cx="4" cy="19" r="2.5"/><circle cx="20" cy="19" r="2.5"/><path d="M11 6 5 17m8-11 6 11M7 19h10"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">El portafolio se elige por responsabilidad</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Consumir una API, desarrollar un modelo y operar cómputo son decisiones distintas.</text><text x="85" y="174" font-size="24" fill="#536078" font-weight="600" text-anchor="start">Necesitas…</text><text x="641" y="174" font-size="24" fill="#536078" font-weight="600" text-anchor="start">Empieza por…</text><circle cx="111" cy="257" r="42" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="111" cy="250" r="42" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="wave" href="#wave" x="88.32" y="227.32" width="45.36" height="45.36" color="#c74436"/><text x="179" y="244" font-size="26" fill="#17243b" font-weight="700" text-anchor="start">Una capacidad preparada</text><text x="179" y="279" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Transcribir, analizar, extraer</text><path d="M561 250H673" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><use data-icon="cloud" href="#cloud" x="704" y="220" width="60" height="60" color="#c74436"/><text x="793" y="244" font-size="27" fill="#17243b" font-weight="700" text-anchor="start">AI Services</text><text x="793" y="279" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Datos y evaluación</text><circle cx="111" cy="380" r="42" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="111" cy="373" r="42" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="flask" href="#flask" x="88.32" y="350.32" width="45.36" height="45.36" color="#4f46b8"/><text x="179" y="367" font-size="26" fill="#17243b" font-weight="700" text-anchor="start">Un modelo para tu problema</text><text x="179" y="402" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Explorar, entrenar, comparar</text><path d="M561 373H673" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><use data-icon="code" href="#code" x="704" y="343" width="60" height="60" color="#4f46b8"/><text x="793" y="367" font-size="27" fill="#17243b" font-weight="700" text-anchor="start">Data Science</text><text x="793" y="402" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Ciclo del modelo propio</text><circle cx="111" cy="503" r="42" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="111" cy="496" r="42" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="server" href="#server" x="88.32" y="473.32" width="45.36" height="45.36" color="#087f7a"/><text x="179" y="490" font-size="26" fill="#17243b" font-weight="700" text-anchor="start">Controlar el cómputo</text><text x="179" y="525" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Memoria, GPU, distribución</text><path d="M561 496H673" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><use data-icon="network" href="#network" x="704" y="466" width="60" height="60" color="#087f7a"/><text x="793" y="490" font-size="27" fill="#17243b" font-weight="700" text-anchor="start">Infraestructura de IA</text><text x="793" y="525" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Entorno y operación</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Empieza por la capacidad que necesitas y el trabajo que puedes gestionar.</text></g>
