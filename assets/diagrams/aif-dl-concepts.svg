<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="neuron">
<title id="title">Una neurona transforma sus entradas</title>
<desc id="description">Tres entradas se multiplican por pesos, se suman con un bias y pasan por una función de activación. Durante entrenamiento se ajustan los parámetros.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Una neurona transforma sus entradas</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Cada conexión pesa; la activación decide cómo pasa la señal.</text><text x="180" y="180" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Entradas</text><text x="396" y="180" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Pesos</text><circle cx="180" cy="246" r="35" fill="#fff" stroke="#c74436" stroke-width="2"/><text x="180" y="256" font-size="29" fill="#c74436" font-weight="700" text-anchor="middle">x₁</text><path d="M219 246H328" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><rect x="340" y="225" width="110" height="42" rx="21" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="395" y="253" font-size="21" fill="#c74436" font-weight="600" text-anchor="middle">× w₁</text><path d="M463 246L565 347" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><circle cx="180" cy="347" r="35" fill="#fff" stroke="#c74436" stroke-width="2"/><text x="180" y="357" font-size="29" fill="#c74436" font-weight="700" text-anchor="middle">x₂</text><path d="M219 347H328" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><rect x="340" y="326" width="110" height="42" rx="21" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="395" y="354" font-size="21" fill="#c74436" font-weight="600" text-anchor="middle">× w₂</text><path d="M463 347L565 347" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><circle cx="180" cy="448" r="35" fill="#fff" stroke="#c74436" stroke-width="2"/><text x="180" y="458" font-size="29" fill="#c74436" font-weight="700" text-anchor="middle">x₃</text><path d="M219 448H328" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><rect x="340" y="427" width="110" height="42" rx="21" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="395" y="455" font-size="21" fill="#c74436" font-weight="600" text-anchor="middle">× w₃</text><path d="M463 448L565 347" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><circle cx="638" cy="347" r="70" fill="url(#indigo)" stroke="none" stroke-width="2"/><text x="638" y="364" font-size="53" fill="#4f46b8" font-weight="700" text-anchor="middle">Σ</text><text x="638" y="457" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Suma + bias</text><rect x="578" y="193" width="120" height="42" rx="21" fill="url(#indigo)" stroke="none" stroke-width="1.5"/><text x="638" y="221" font-size="21" fill="#4f46b8" font-weight="600" text-anchor="middle">+ b</text><path d="M638 242V268" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><path d="M716 347H842" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><rect x="860" y="280" width="185" height="132" rx="18" fill="#fff" stroke="#087f7a" stroke-width="1.5"/><text x="952" y="312" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle">Activación</text><text x="952" y="380" font-size="35" fill="#087f7a" font-weight="700" text-anchor="middle">f(z)</text><path d="M1051 347H1138" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="952" y="457" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Salida no lineal</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Entrenar ajusta pesos y bias; inferir usa los valores aprendidos.</text></g>
</svg>
