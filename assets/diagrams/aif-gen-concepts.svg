<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="token-probabilities">
<title id="title">Generar es elegir el siguiente token</title>
<desc id="description">El contexto El equipo está pasa por un LLM, que asigna probabilidades ilustrativas de 55, 30 y 15 por ciento a tres continuaciones. Selecciona listo, lo añade al contexto y repite. La tokenización concreta depende del modelo.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M8 2v3m4-3v3m4-3v3M8 19v3m4-3v3m4-3v3M2 8h3m-3 4h3m-3 4h3m14-8h3m-3 4h3m-3 4h3"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Generar es elegir el siguiente token</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">El contexto cambia las probabilidades; no garantiza que la frase sea cierta.</text><rect x="62" y="222" width="284" height="119" rx="18" fill="#fff" stroke="#c74436" stroke-width="1.5"/><text x="204" y="264" font-size="24" fill="#c74436" font-weight="700" text-anchor="middle">Contexto</text><text x="204" y="307" font-size="27" fill="#17243b" font-weight="600" text-anchor="middle">«El equipo está»</text><path d="M360 281H430" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><circle cx="503" cy="288" r="58" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="503" cy="281" r="58" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="cpu" href="#cpu" x="471.68" y="249.68" width="62.64" height="62.64" color="#4f46b8"/><text x="503" y="390" font-size="28" fill="#17243b" font-weight="700" text-anchor="middle">LLM</text><path d="M574 281H634" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><text x="763" y="208" font-size="23" fill="#17243b" font-weight="600" text-anchor="end">listo</text><rect x="785" y="186" width="132" height="29" rx="5" fill="#087f7a" stroke="none" stroke-width="1.5"/><text x="1041" y="208" font-size="22" fill="#087f7a" font-weight="600" text-anchor="start">55%</text><text x="763" y="277" font-size="23" fill="#17243b" font-weight="600" text-anchor="end">apagado</text><rect x="785" y="255" width="72" height="29" rx="5" fill="#d6d2ef" stroke="none" stroke-width="1.5"/><text x="1041" y="277" font-size="22" fill="#536078" font-weight="600" text-anchor="start">30%</text><text x="763" y="346" font-size="23" fill="#17243b" font-weight="600" text-anchor="end">caliente</text><rect x="785" y="324" width="36" height="29" rx="5" fill="#d6d2ef" stroke="none" stroke-width="1.5"/><text x="1041" y="346" font-size="22" fill="#536078" font-weight="600" text-anchor="start">15%</text><text x="869" y="390" font-size="21" fill="#536078" font-weight="400" text-anchor="middle">Probabilidades ilustrativas</text><path d="M886 418V471H369V355" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><rect x="500" y="450" width="361" height="42" rx="21" fill="url(#teal)" stroke="none" stroke-width="1.5"/><text x="680.5" y="478" font-size="21" fill="#087f7a" font-weight="600" text-anchor="middle">Añade «listo» al contexto</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Repite la predicción con el contexto ampliado hasta llegar a un límite.</text></g>
</svg>
