<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title description">
<title id="title">Operar, aportar contexto o preparar un prompt</title><desc id="description">Tools exponen operaciones que el modelo puede solicitar bajo controles de ejecución. Resources aportan contexto gestionado por la aplicación. Prompts son plantillas que el usuario puede seleccionar. Ninguna de estas capacidades concede permisos por sí sola.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff4ef"/><stop offset="1" stop-color="#f1ccc5"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f2f0ff"/><stop offset="1" stop-color="#d8d4f5"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#effaf7"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient>
