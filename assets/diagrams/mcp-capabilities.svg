<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 578" role="img" aria-labelledby="title description">
  <title id="title">Operar, aportar contexto o preparar un prompt</title>
  <desc id="description">Tools exponen operaciones que el modelo solicita bajo control de ejecución. Resources aportan contexto que gestiona la aplicación. Prompts son plantillas seleccionadas por el usuario. Cada capacidad conserva su patrón de control y no concede permisos por sí sola.</desc>
  <defs>
    <!-- Lucide icons, ISC. See assets/icons/LICENSE-lucide.txt. -->
    <symbol id="wrench" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/></symbol>
    <symbol id="file-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2zM14 2v5a1 1 0 0 0 1 1h5M10 9H8M16 13H8M16 17H8"/></symbol>
    <symbol id="messages-square" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2zM20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"/></symbol>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}
      .title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}
      .body{font-size:22px;fill:#536078}.mono{font-family:Consolas,monospace;font-size:22px;fill:#536078}
      .card{fill:#fff;stroke:#dce1eb;stroke-width:1.5}
      .connector{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .bidirectional{marker-start:url(#arrow)}.divider{stroke:#dce1eb;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="578" fill="#f7f8fc"/>
  <text x="56" y="64" class="title" text-anchor="start">Operar, aportar contexto o preparar un prompt</text>
  <rect x="56" y="122" width="332" height="398" rx="22" class="card"/>
  <g class="icon-badge" data-icon="wrench"><circle cx="222" cy="206" r="48" fill="#fae6e1"/><use href="#wrench" x="196" y="180" width="52" height="52" color="#c74436"/></g>
  <text x="222" y="300" class="label" text-anchor="middle">Tools</text>
  <text x="222" y="343" class="body" text-anchor="middle">Consultar un pedido</text>
  <text x="222" y="378" class="body" text-anchor="middle">Operación con esquema</text>
  <path d="M84 409H360" class="divider"/>
  <text x="222" y="450" class="body" text-anchor="middle">El modelo solicita;</text>
  <text x="222" y="484" class="body" text-anchor="middle">la aplicación controla.</text>
  <rect x="434" y="122" width="332" height="398" rx="22" class="card"/>
  <g class="icon-badge" data-icon="file-text"><circle cx="600" cy="206" r="48" fill="#e1f2ee"/><use href="#file-text" x="574" y="180" width="52" height="52" color="#087f7a"/></g>
  <text x="600" y="300" class="label" text-anchor="middle">Resources</text>
  <text x="600" y="343" class="body" text-anchor="middle">Leer una política</text>
  <text x="600" y="378" class="body" text-anchor="middle">Información con URI</text>
  <path d="M462 409H738" class="divider"/>
  <text x="600" y="450" class="body" text-anchor="middle">La aplicación incorpora</text>
  <text x="600" y="484" class="body" text-anchor="middle">el contexto pertinente.</text>
  <rect x="812" y="122" width="332" height="398" rx="22" class="card"/>
  <g class="icon-badge" data-icon="messages-square"><circle cx="978" cy="206" r="48" fill="#e9e6fa"/><use href="#messages-square" x="952" y="180" width="52" height="52" color="#4f46b8"/></g>
  <text x="978" y="300" class="label" text-anchor="middle">Prompts</text>
  <text x="978" y="343" class="body" text-anchor="middle">Preparar un diagnóstico</text>
  <text x="978" y="378" class="body" text-anchor="middle">Plantilla reutilizable</text>
  <path d="M840 409H1116" class="divider"/>
  <text x="978" y="450" class="body" text-anchor="middle">El usuario selecciona</text>
  <text x="978" y="484" class="body" text-anchor="middle">la interacción.</text>
</svg>
