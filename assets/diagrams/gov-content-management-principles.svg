<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">La Disposición Tiene una Condición de Salida</title><desc id="description">El documento se identifica, revisa, publica para una audiencia y conserva según su categoría. La disposición tiene una condición de salida: necesita autorización. Si no existe, se mantiene la conservación y se registra la suspensión y su motivo; si existe, se dispone con un acta. Una nueva versión o el fin de un plazo no sustituye la comprobación de excepciones y autorización.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">La Disposición Tiene una Condición de Salida</tspan></text><rect x="100" y="320" width="350" height="175" rx="0" fill="#EEF3F4" stroke="#3C4545" stroke-width="3"/><text x="275" y="375.91" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="275" y="375.91">Capturar</tspan></text><text x="275" y="442.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="275" y="442.27">Identificar C-104</tspan></text><g data-svgrepo-icon="document" transform="translate(118 341) scale(1.5)" color="#181818" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
  <path d="M14 2v5a1 1 0 0 0 1 1h5" />
