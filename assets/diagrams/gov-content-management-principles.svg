<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">La Disposición Tiene una Condición de Salida</title><desc id="description">El documento se identifica, revisa, publica para una audiencia y conserva según su categoría. La disposición tiene una condición de salida: necesita autorización. Si no existe, se mantiene la conservación y se registra la suspensión y su motivo; si existe, se dispone con un acta. Una nueva versión o el fin de un plazo no sustituye la comprobación de excepciones y autorización.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">La Disposición Tiene una Condición de Salida</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 27)"><rect x="120" y="330" width="360" height="116" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M132 330 H468 Q480 330 480 342 V394 H120 V342 Q120 330 132 330 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="120" y="330" width="360" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="144" y="372.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="144" y="372.8">Capturar</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="120" y="394" width="360" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="300.0" y="430.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="300.0" y="430.8">Identificar C-104</tspan></text></g></g><rect x="560" y="330" width="360" height="116" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M572 330 H908 Q920 330 920 342 V394 H560 V342 Q560 330 572 330 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="560" y="330" width="360" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="584" y="372.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="584" y="372.8">Revisar</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="560" y="394" width="360" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="740.0" y="430.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="740.0" y="430.8">Aprobar versión</tspan></text></g></g><rect x="1000" y="330" width="360" height="116" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1012 330 H1348 Q1360 330 1360 342 V394 H1000 V342 Q1000 330 1012 330 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="1000" y="330" width="360" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1024" y="372.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="1024" y="372.8">Publicar</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="1000" y="394" width="360" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1180.0" y="430.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1180.0" y="430.8">Aplicar audiencia</tspan></text></g></g><rect x="1440" y="330" width="360" height="204" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1452 330 H1788 Q1800 330 1800 342 V394 H1440 V342 Q1440 330 1452 330 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="1440" y="330" width="360" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1464" y="372.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="1464" y="372.8">Conservar</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="1440" y="394" width="360" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1620.0" y="430.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1620.0" y="430.8">Política por categoría</tspan></text></g></g><line x1="1440" y1="446" x2="1800" y2="446" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="center" data-cell-exception="Contenido de varias líneas con al menos 12 unidades de margen."><rect x="1440" y="446" width="360" height="88" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1620.0" y="482.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1620.0" y="482.8">Sin plazo universal </tspan><tspan x="1620.0" y="518.8">Incluye excepciones</tspan></text></g></g><line x1="480" y1="388" x2="560" y2="388" stroke="#59616E" stroke-width="3" /><path d="M560 388 L544.0 396.0 L544.0 380.0 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-l