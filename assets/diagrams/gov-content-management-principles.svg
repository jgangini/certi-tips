ill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1275" y="720.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1275" y="720.8">No</tspan></text><rect x="520" y="692" width="590" height="116" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M532 692 H1098 Q1110 692 1110 704 V756 H520 V704 Q520 692 532 692 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="520" y="692" width="590" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="544" y="734.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="544" y="734.8">Mantener conservación</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="520" y="756" width="590" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="815.0" y="792.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="815.0" y="792.8">Registrar suspensión y motivo</tspan></text></g></g><line x1="1620" y1="850" x2="1620" y2="910" stroke="#59616E" stroke-width="3" /><path d="M1620 910 L1612.0 894.0 L1628.0 894.0 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><rect x="1664.15" y="850" width="51.7" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1690" y="884.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1690" y="884.8">Sí</tspan></text><rect x="1400" y="910" width="400" height="60" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="note" data-cell-align="center"><rect x="1400" y="910" width="400" height="60" rx="0" fill="none" str