" x2="1565" y2="878" stroke="#3C4545" stroke-width="4"/><path d="M1565 878 L1557 862 L1573 862 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><text x="1630" y="842.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1630" y="842.27">Sí</tspan></text><rect x="1360" y="878" width="420" height="86" rx="0" fill="#F1EFED" stroke="#C2D4D4" stroke-width="2"/><g data-svgrepo-icon="audit" transform="translate(1380 899) scale(1.75)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
