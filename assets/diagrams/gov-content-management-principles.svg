</g><line x1="1310" y1="409" x2="1390" y2="409" stroke="#3C4545" stroke-width="4"/><path d="M1390 409 L1374 417 L1374 401 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><rect x="1390" y="320" width="350" height="248" rx="0" fill="#F1EFED" stroke="#3C4545" stroke-width="3"/><text x="1565" y="375.91" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1565" y="375.91">Conservar</tspan></text><text x="1565" y="442.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1565" y="442.27">Política por categoría</tspan></text><g data-svgrepo-icon="archive" transform="translate(1408 341) scale(1.5)" color="#181818" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1" />
