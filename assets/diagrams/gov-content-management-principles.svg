</g><line x1="450" y1="409" x2="530" y2="409" stroke="#3C4545" stroke-width="4"/><path d="M530 409 L514 417 L514 401 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><rect x="530" y="320" width="350" height="175" rx="0" fill="#F7EFE8" stroke="#3C4545" stroke-width="3"/><text x="705" y="375.91" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="705" y="375.91">Revisar</tspan></text><text x="705" y="442.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="705" y="442.27">Aprobar versión</tspan></text><g data-person-icon="user-supplied" transform="translate(548 341) scale(2.25)" fill="#181818"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"/><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z"/></g><line x1="880" y1="409" x2="960" y2="409" stroke="#3C4545" stroke-width="4"/><path d="M960 409 L944 417 L944 401 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><rect x="960" y="320" width="350" height="175" rx="0" fill="#EEF3EC" stroke="#3C4545" stroke-width="3"/><text x="1135" y="375.91" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1135" y="375.91">Publicar</tspan></text><text x="1135" y="442.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1135" y="442.27">Aplicar audiencia</tspan></text><g data-svgrepo-icon="check" transform="translate(978 341) scale(1.5)" color="#181818" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" />
