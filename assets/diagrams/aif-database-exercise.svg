<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="mcp-scoped-function">
<title id="title">Publica una herramienta, no privilegios ilimitados</title>
<desc id="description">Un cliente MCP autenticado usa HTTPS para invocar una herramienta del servidor. Se validan argumentos y privilegios antes de ejecutar la función PL SQL autorizada de inventario. No se da acceso libre a todas las tablas.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 8h20m-17-3h1m3 0h1m-5 7 3 3-3 3m6 0h5"/></symbol><symbol id="link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m9 15 6-6M8 17l-2 2a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0m2-1 2-2a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0"/></symbol><symbol id="database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 4 18 4 18 0V5M3 12c0 4 18 4 18 0"/></symbol><symbol id="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="12" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 15v3"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Publica una herramienta, no privilegios ilimitados</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Una función autorizada de inventario puede tener un contrato MCP específico.</text><g data-concept="Cliente MCP"><circle cx="181" cy="325" r="62" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="181" cy="318" r="62" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="code" href="#code" x="147.51999999999998" y="284.52" width="66.96000000000001" height="66.96000000000001" color="#c74436"/><text x="181" y="423" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Cliente MCP</text><text x="181" y="458" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Se autentica y solicita</text><text x="181" y="490" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">consultar inventario</text></g><path d="M254 318H417" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><text x="334" y="288" font-size="22" fill="#536078" font-weight="400" text-anchor="middle">HTTPS</text><rect x="440" y="179" width="703" height="344" rx="24" fill="#fff" stroke="#dce1ec" stroke-width="1.5"/><text x="791" y="220" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Autonomous AI Database · alcance autorizado</text><g data-concept="Servidor MCP"><circle cx="557" cy="325" r="53" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="557" cy="318" r="53" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="link" href="#link" x="528.38" y="289.38" width="57.24" height="57.24" color="#4f46b8"/><text x="557" y="414" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Servidor MCP</text><text x="557" y="449" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Expone la herramienta</text></g><path d="M622 318H768" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><text x="695" y="288" font-size="22" fill="#536078" font-weight="400" text-anchor="middle">validar</text><g data-concept="Función PL/SQL"><circle cx="887" cy="325" r="53" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="887" cy="318" r="53" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="database" href="#database" x="858.38" y="289.38" width="57.24" height="57.24" color="#087f7a"/><text x="887" y="414" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Función PL/SQL</text><text x="887" y="449" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Devuelve inventario</text><text x="887" y="481" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">dentro de sus privilegios</text></g><use data-icon="lock" href="#lock" x="1051" y="286" width="54" height="54" color="#087f7a"/><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Exponer una operación acotada no requiere abrir acceso libre a todas las tablas.</text></g>
</svg>
