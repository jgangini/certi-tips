<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Las Relaciones se Ven en las Instancias</title><desc id="description">El cliente C7 se relaciona con los contratos C2 y C3. C2 tiene las facturas F42 y F43, mientras C3 tiene F44. Las marcas 1 → N muestran que un cliente puede tener varios contratos y cada contrato varias facturas. Las claves conservan cada relación y evitan confundir una persona, un contrato y una factura como si fueran la misma unidad.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Las Relaciones se Ven en las Instancias</tspan></text><text x="96" y="213.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="96" y="213.59">CLIENTE</tspan></text><text x="782" y="213.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="782" y="213.59">CONTRATOS</tspan></text><text x="1470" y="213.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1470" y="213.59">FACTURAS</tspan></text><rect x="96" y="450" width="380" height="180" rx="0" fill="#EEF3F4" stroke="#3C4545" stroke-width="3"/><rect x="96" y="450" width="380" height="6" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><text x="286" y="513.91" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="286" y="513.91">Cliente</tspan></text><text x="286" y="576.55" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="286" y="576.55">C7</tspan></text><rect x="782" y="260" width="340" height="160" rx="0" fill="#EEF3EC" stroke="#3C4545" stroke-width="3"/><rect x="782" y="260" width="340" height="6" rx="0" fill="#749B6B" stroke="none" stroke-width="2"/><text x="952" y="322.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="952" y="322.59">Contrato C2</tspan></text><text x="952" y="380.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="952" y="380.27">Cliente: C7</tspan></text><rect x="782" y="650" width="340" height="160" rx="0" fill="#EEF3EC" stroke="#3C4545" stroke-width="3"/><rect x="782" y="650" width="340" height="6" rx="0" fill="#749B6B" stroke="none" stroke-width="2"/><text x="952" y="712.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="952" y="712.59">Contrato C3</tspan></text><text x="952" y="770.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="952" y="770.27">Cliente: C7</tspan></text><rect x="1470" y="230" width="354" height="140" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><text x="1647" y="282.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1647" y="282.59">Factura F42</tspan></text><text x="1647" y="337.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1647" y="337.27">Contrato: C2</tspan></text><rect x="1470" y="440" width="354" height="140" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><text x="1647" y="492.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1647" y="492.59">Factura F43</tspan></text><text x="1647" y="547.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1647" y="547.27">Contrato: C2</tspan></text><rect x="1470" y="730" width="354" height="140" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><text x="1647" y="782.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1647" y="782.59">Factura F44</tspan></text><text x="1647" y="837.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1647" y="837.27">Contrato: C3</tspan></text><path d="M476 540 H640 M640 340 V730 M640 340 H782 M640 730 H782" fill="none" stroke="#3C4545" stroke-width="4" stroke-linejoin="round"/><path d="M1122 340 H1290 M1290 300 V510 M1290 300 H1470 M1290 510 H1470" fill="none" stroke="#3C4545" stroke-width="4" stroke-linejoin="round"/><path d="M1122 730 H1290 V800 H1470" fill="none" stroke="#3C4545" stroke-width="4" stroke-linejoin="round"/><text x="640" y="277.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="middle"><tspan x="640" y="277.59">1 → N</tspan></text><text x="1290" y="213.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="middle"><tspan x="1290" y="213.59">1 → N</tspan></text></g></svg>
