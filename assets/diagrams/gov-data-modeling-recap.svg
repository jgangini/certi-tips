<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Cinco Preguntas Sobre un Registro</title><desc id="description">Usa el contrato C2 para responder cinco preguntas: qué entidad representa, qué clave lo identifica, con qué cliente se relaciona, desde cuándo está vigente y qué representa cada fila. C2 pertenece a C7 y conserva una fecha de inicio. Esa ficha permite comprobar que identidad, relación, tiempo y granularidad mantienen el significado del contrato.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Cinco Preguntas Sobre un Registro</tspan></text><rect x="625" y="340" width="690" height="350" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="625" y="340" width="690" height="82" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="625" y="340" width="690" height="6" rx="0" fill="#2E5C70" stroke="none" stroke-width="2"/><text x="970" y="389.75" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="970" y="389.75">CONTRATO C2</tspan></text><rect x="625" y="422" width="220" height="89" rx="0" fill="#EEF3F4" stroke="#3C4545" stroke-width="2"/><text x="654" y="477.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="654" y="477.59">Cliente</tspan></text><text x="1024" y="477.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1024" y="477.59">C7</tspan></text><line x1="625" y1="511" x2="1315" y2="511" stroke="#C2D4D4" stroke-width="2"/><rect x="625" y="511" width="220" height="89" rx="0" fill="#EEF3F4" stroke="#3C4545" stroke-width="2"/><text x="654" y="566.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="654" y="566.59">Estado</tspan></text><text x="1024" y="566.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1024" y="566.59">Vigente</tspan></text><line x1="625" y1="600" x2="1315" y2="600" stroke="#C2D4D4" stroke-width="2"/><rect x="625" y="600" width="220" height="89" rx="0" fill="#EEF3F4" stroke="#3C4545" stroke-width="2"/><text x="654" y="655.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="654" y="655.59">Inicio</tspan></text><text x="1024" y="655.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1024" y="655.59">1 de septiembre</tspan></text><text x="96" y="296.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="96" y="296.59">Entidad</tspan></text><text x="96" y="364.43" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="96" y="364.43">Representa un </tspan><tspan x="96" y="397.07">contrato</tspan></text><text x="1460" y="296.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="1460" y="296.59">Identidad</tspan></text><text x="1460" y="364.43" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1460" y="364.43">C2 distingue el </tspan><tspan x="1460" y="397.07">contrato</tspan></text><text x="96" y="655.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="96" y="655.59">Relación</tspan></text><text x="96" y="723.43" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="96" y="723.43">Pertenece al cliente </tspan><tspan x="96" y="756.07">C7</tspan></text><text x="1460" y="655.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="1460" y="655.59">Tiempo</tspan></text><text x="1460" y="723.43" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1460" y="723.43">Vigente desde una </tspan><tspan x="1460" y="756.07">fecha</tspan></text><path d="M480 275 H504 V422 H480 M480 626 H504 V773 H480 M1438 275 H1414 V422 H1438 M1438 626 H1414 V773 H1438" fill="none" stroke="#3C4545" stroke-width="3" stroke-linejoin="round"/><line x1="504" y1="365" x2="625" y2="365" stroke="#3C4545" stroke-width="3"/><line x1="1315" y1="365" x2="1414" y2="365" stroke="#3C4545" stroke-width="3"/><path d="M504 698 H563 V466 H625 M1315 644 H1364 V698 H1414" fill="none" stroke="#3C4545" stroke-width="3" stroke-linejoin="round"/><path d="M970 690 V819 M766 844 V819 H1174 V844" fill="none" stroke="#3C4545" stroke-width="3" stroke-linejoin="round"/><text x="970" y="885.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="middle"><tspan x="970" y="885.59">Granularidad</tspan></text><text x="970" y="939.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="970" y="939.59">Una fila por contrato</tspan></text></g></svg>
