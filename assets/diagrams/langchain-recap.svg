<g text-anchor="middle"><text x="204" y="305" class="label">Modelo</text><text x="600" y="305" class="label">LangChain</text><text x="996" y="305" class="label">Función</text>
<text x="204" y="350" class="body">Propone la llamada</text><text x="600" y="347" class="body"><tspan x="600">Coordina mensajes</tspan><tspan x="600" dy="30">y conserva estado</tspan></text><text x="996" y="350" class="body">Ejecuta la operación</text></g>
