<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title description">
<title id="title">Explica quién hace cada parte</title><desc id="description">El modelo propone acciones, LangChain coordina mensajes y estado, y la función ejecuta operaciones. El resultado vuelve al contexto. Revisar nombre, argumentos, identificador y resultado permite reconstruir la ejecución observable.</desc>
