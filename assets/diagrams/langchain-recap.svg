<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" role="img" aria-labelledby="title description">
<title id="title">Explica quién hace cada parte</title>
<desc id="description">El modelo propone la llamada, LangChain coordina mensajes y estado y la función ejecuta la operación. El resultado vuelve al contexto del modelo. Nombre, argumentos, identificador y resultado permiten reconstruir el recorrido.</desc>
<defs>
