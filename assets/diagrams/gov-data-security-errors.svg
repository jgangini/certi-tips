<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Una Etiqueta No Demuestra la Protección</title><desc id="description">Los tres ejemplos conservan riesgos pese a una señal favorable. Un canal cifrado puede permitir leer todos los clientes. Una sola fila puede identificar a una persona por nombre y dirección. Una política propuesta por IA puede carecer de aprobación. Revisa alcance de permisos, valores y contexto, y decisión del responsable; la etiqueta del control no demuestra por sí sola una protección suficiente.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Una Etiqueta No Demuestra la Protección</tspan></text><rect x="76" y="185" width="568" height="782" rx="0" fill="none" stroke="#697778" stroke-width="2"/><line x1="96" y1="787" x2="624" y2="787" stroke="#C2D4D4" stroke-width="2"/><rect x="677" y="185" width="568" height="782" rx="0" fill="none" stroke="#697778" stroke-width="2"/><line x1="697" y1="787" x2="1225" y2="787" stroke="#C2D4D4" stroke-width="2"/><rect x="1278" y="185" width="568" height="782" rx="0" fill="none" stroke="#697778" stroke-width="2"/><line x1="1298" y1="787" x2="1826" y2="787" stroke="#C2D4D4" stroke-width="2"/><text x="96" y="230.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="96" y="230.59">CANAL CIFRADO</tspan></text><text x="697" y="230.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="697" y="230.59">SOLO UNA FILA</tspan></text><text x="1298" y="230.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1298" y="230.59">PROPUESTA DE IA</tspan></text><rect x="145" y="286" width="364" height="326" rx="0" fill="#EEF3F4" stroke="#3C4545" stroke-width="3"/><rect x="145" y="286" width="364" height="6" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><g data-svgrepo-icon="lock" transform="translate(211 298) scale(9.66667)" color="#181818" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
</g><text x="96" y="698.611" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="96" y="698.611">Lectura permitida: </tspan><tspan x="96" y="737.569">todos los clientes</tspan></text><text x="949" y="340.67" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="949" y="340.67">1</tspan></text><rect x="697" y="428" width="520" height="210" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><text x="727" y="496.069" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="727" y="496.069">Ana Pérez </tspan><tspan x="727" y="542.111">Calle Ejemplo 10</tspan></text><text x="697" y="726.27" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="697" y="726.27">Sigue siendo identificable</tspan></text><rect x="1298" y="291" width="526" height="425" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="1298" y="291" width="526" height="100" rx="0" fill="#F1EFED" stroke="#3C4545" stroke-width="2"/><rect x="1298" y="291" width="526" height="6" rx="0" fill="#C06D30" stroke="none" stroke-width="2"/><text x="1330" y="349.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1330" y="349.59">Política propuesta</tspan></text><text x="1330" y="432.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1330" y="432.27">Finalidad…</tspan></text><text x="1330" y="499.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1330" y="499.27">Permisos…</tspan></text><text x="1330" y="566.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1330" y="566.27">Excepciones…</tspan></text><line x1="1330" y1="609" x2="1790" y2="609" stroke="#C2D4D4" stroke-width="2"/><text x="1330" y="670.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="1330" y="670.59">Aprobación: —</tspan></text><text x="96" y="846.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="96" y="846.59">Revisar permisos y alcance</tspan></text><text x="697" y="846.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="697" y="846.59">Revisar valores y contexto</tspan></text><text x="1298" y="853.31" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1298" y="853.31">Obtener aprobación del </tspan><tspan x="1298" y="885.95">responsable</tspan></text></g></svg>
