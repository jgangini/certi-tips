<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Dato, Metadatos y Evidencia</title><desc id="description">La factura F42, contrato C-104 e importe 100 son datos. Los metadatos explican qué significa total, el grano de la tabla, su responsable y la regla de cálculo. La evidencia registra una lectura con identidad, objeto, acción y resultado. Fecha e identificador de ejecución enlazan el evento con su contexto. Distingue lo registrado, su significado y lo que ocurrió sobre el activo.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Dato, Metadatos y Evidencia</tspan></text><g data-svgrepo-icon="database" transform="translate(96 232) scale(2)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3" />
