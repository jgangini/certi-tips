</g><text x="160" y="264.91" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="160" y="264.91">DATO · ¿qué se registra?</tspan></text><rect x="96" y="313" width="750" height="140" rx="6" fill="#FFFFFF" stroke="#3C4545" stroke-width="2"/><rect x="96" y="313" width="750" height="59" rx="6" fill="#EDF1F2" stroke="none" stroke-width="2"/><text x="122" y="352.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="122" y="352.27">factura_id</tspan></text><text x="380" y="352.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="380" y="352.27">contrato_id</tspan></text><text x="670" y="352.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="670" y="352.27">total</tspan></text><text x="122" y="414.91" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="122" y="414.91">F42</tspan></text><text x="380" y="414.91" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="380" y="414.91">C-104</tspan></text><text x="670" y="414.91" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="670" y="414.91">100</tspan></text><line x1="332" y1="314" x2="332" y2="452" stroke="#C2D4D4" stroke-width="2"/><line x1="614" y1="314" x2="614" y2="452" stroke="#C2D4D4" stroke-width="2"/><rect x="1030" y="251" width="794" height="309" rx="8" fill="#F1EFED" stroke="#C2D4D4" stroke-width="2"/><rect x="1030" y="251" width="794" height="8" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><g data-svgrepo-icon="catalog" transform="translate(1065 280) scale(2)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14" />
