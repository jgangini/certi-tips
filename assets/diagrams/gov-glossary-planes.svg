</g><text x="1130" y="310.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1130" y="310.59">METADATOS · ¿qué significa?</tspan></text><text x="1065" y="382.895" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1065" y="382.895">total = importe de la factura </tspan><tspan x="1065" y="421.145">Grano: una fila por factura </tspan><tspan x="1065" y="459.395">Responsable: facturación </tspan><tspan x="1065" y="497.645">Regla: sumar líneas, sin repetir cabecera</tspan></text><line x1="846" y1="397" x2="1030" y2="397" stroke="#3C4545" stroke-width="3"/><text x="938" y="369.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="938" y="369.27">describe</tspan></text><path d="M471 453 V550 H940 V664" fill="none" stroke="#3C4545" stroke-width="3" stroke-linejoin="round"/><text x="510" y="528.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="510" y="528.27">Acción sobre el activo</tspan></text><g data-svgrepo-icon="audit" transform="translate(96 580) scale(2)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
