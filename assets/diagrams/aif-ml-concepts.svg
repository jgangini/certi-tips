<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="train-inference">
<title id="title">Entrenar aprende; inferir aplica lo aprendido</title>
<desc id="description">Entrenamiento usa horas de uso y una etiqueta de fallo para ajustar un modelo. Una entrada nueva utiliza ese modelo aprendido para obtener una predicción sin conocer la respuesta.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v6m0 5v7M12 3v12m0 5v1M20 3v2m0 5v11"/><circle cx="4" cy="11" r="2"/><circle cx="12" cy="17" r="2"/><circle cx="20" cy="7" r="2"/></symbol><symbol id="cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M8 2v3m4-3v3m4-3v3M8 19v3m4-3v3m4-3v3M2 8h3m-3 4h3m-3 4h3m14-8h3m-3 4h3m-3 4h3"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Entrenar aprende; inferir aplica lo aprendido</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Las etiquetas enseñan durante el entrenamiento, no durante la predicción.</text><rect x="56" y="151" width="205" height="42" rx="21" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="158.5" y="179" font-size="21" fill="#c74436" font-weight="600" text-anchor="middle">ENTRENAR</text><rect x="78" y="233" width="300" height="110" rx="12" fill="#fff" stroke="#c74436" stroke-width="1.5"/><path d="M78 281L378 281" fill="none" stroke="#dce1ec" stroke-width="1.5"/><text x="160" y="264" font-size="22" fill="#17243b" font-weight="600" text-anchor="middle">Horas de uso</text><text x="310" y="264" font-size="22" fill="#c74436" font-weight="600" text-anchor="middle">Fallo</text><text x="160" y="317" font-size="25" fill="#17243b" font-weight="600" text-anchor="middle">1 500</text><text x="310" y="317" font-size="25" fill="#c74436" font-weight="600" text-anchor="middle">Sí</text><text x="228" y="383" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Features + label conocida</text><path d="M394 286H493" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><g data-concept="Ajustar parámetros"><circle cx="580" cy="293" r="58" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="580" cy="286" r="58" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="sliders" href="#sliders" x="548.68" y="254.68" width="62.64" height="62.64" color="#4f46b8"/><text x="580" y="387" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Ajustar parámetros</text></g><path d="M650 286H854" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><circle cx="962" cy="293" r="58" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="962" cy="286" r="58" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="cpu" href="#cpu" x="930.68" y="254.68" width="62.64" height="62.64" color="#4f46b8"/><text x="962" y="390" font-size="26" fill="#17243b" font-weight="700" text-anchor="middle">Modelo aprendido</text><rect x="56" y="439" width="205" height="42" rx="21" fill="url(#teal)" stroke="none" stroke-width="1.5"/><text x="158.5" y="467" font-size="21" fill="#087f7a" font-weight="600" text-anchor="middle">INFERIR</text><rect x="314" y="474" width="231" height="42" rx="21" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="429.5" y="502" font-size="21" fill="#c74436" font-weight="600" text-anchor="middle">Nueva entrada</text><path d="M558 495H829" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><path d="M1032 286H1110V495H1085" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><rect x="850" y="458" width="224" height="73" rx="18" fill="url(#teal)" stroke="none" stroke-width="1.5"/><text x="962" y="504" font-size="28" fill="#087f7a" font-weight="700" text-anchor="middle">Predicción</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Durante inferencia no entregas la respuesta correcta: el modelo la estima.</text></g>
</svg>
