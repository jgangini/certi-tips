<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">El Permiso Sigue la Tarea del Asistente</title><desc id="description">El asistente de Atención necesita consultar contratos autorizados para resolver consultas. La matriz permite esa acción y excluye administrar la plataforma o modificar roles. Comprueba la identidad efectiva usada por la conexión del agente y el alcance real de los datos accesibles. Conserva evidencia del acceso observado para contrastarlo con la tarea y los permisos acordados.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">El Permiso Sigue la Tarea del Asistente</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" transform="translate(0.000 -22.000)" data-center="960 608"><rect x="96" y="280" width="510" height="597" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M108.0 280.0 H594.0 Q606.0 280.0 606.0 292.0 V380.0 H96.0 V292.0 Q96.0 280.0 108.0 280.0 Z" fill="#59616E" stroke="none" data-table-header="true" /><text x="351.0" y="322.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="351.0" y="322.5">ASISTENTE </tspan><tspan x="351.0" y="356.5">DE ATENCIÓN</tspan></text><text x="128" y="506.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="128" y="506.27">Tarea acordada</tspan></text><text x="128" y="573.611" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="128" y="573.611">Resolver consultas </tspan><tspan x="128" y="612.569">sobre contratos</tspan></text><text x="128" y="742.145" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="128" y="742.145">Identidad: conexión </tspan><tspan x="128" y="780.395">efectiva del agente</tspan></text><rect x="720" y="280" width="1104" height="520" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><rect x="720" y="280" width="1104" height="100" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><path d="M732.0 280.0 H1812.0 Q1824.0 280.0 1824.0 292.0 V380.0 H720.0 V292.0 Q720.0 280.0 732.0 280.0 Z" fill="#59616E" stroke="none" data-table-header="true" /><rect x="1480" y="380" width="344" height="140" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><text x="1100.0" y="339.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="1100.0" y="339.5">Acción</tspan></text><text x="1652.0" y="339.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="1652.0" y="339.5">Permiso</tspan></text><line x1="1480" y1="280" x2="1480" y2="800" stroke="#59616E" stroke-width="2" /><text x="756" y="462.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="756" y="462.59">Consultar contratos autorizados</tspan></text><rect x="1591.807" y="425.0" width="120.386" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1652.0" y="459.5" font-size="25.5" fill="#397C46" font-weight="400" text-anchor="middle"><tspan x="1652.0" y="459.5">Permitir</tspan></text><line x1="720" y1="520" x2="1824" y2="520" stroke="#59616E" stroke-width="2" /><text x="756" y="602.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="756" y="602.59">Administrar la plataforma</tspan></text><rect x="1592.952" y="568.09" width="104.097" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1645.0" y="602.59" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="middle"><tspan x="1645.0" y="602.59">Excluir</tspan></text><line x1="720" y1="660" x2="1824" y2="660" stroke="#59616E" stroke-width="2" /><text x="756" y="742.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="756" y="742.59">Modificar roles</tspan></text><rect x="1592.952" y="708.09" width="104.097" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1645.0" y="742.59" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="middle"><tspan x="1645.0" y="742.59">Excluir</tspan></text><path d="M606 570 H666 V330" fill="none" stroke="#3C4545" stroke-width="4" stroke-linejoin="round" /><line x1="666" y1="330" x2="720" y2="330" stroke="#3C4545" stroke-width="4" /><path d="M720 330 L704 338 L704 322 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round" /><rect x="720" y="843" width="1104" height="137" rx="12" fill="none" stroke="#59616E" stroke-width="1.5" /><line x1="1272" y1="800" x2="1272" y2="843" stroke="#3C4545" stroke-width="3" /><text x="752" y="882.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="752" y="882.27">Verificar identidad efectiva y alcance de datos</tspan></text><text x="752" y="945.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="752" y="945.27">Conservar evidencia del acceso observado</tspan></text></g></g></svg>
