<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">El Permiso Sigue la Tarea del Asistente</title><desc id="description">El asistente de Atención necesita consultar contratos autorizados para resolver consultas. La matriz permite esa acción y excluye administrar la plataforma o modificar roles. Comprueba la identidad efectiva usada por la conexión del agente y el alcance real de los datos accesibles. Conserva evidencia del acceso observado para contrastarlo con la tarea y los permisos acordados.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">El Permiso Sigue la Tarea del Asistente</tspan></text><rect x="96" y="280" width="510" height="597" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="96" y="280" width="510" height="6" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><text x="128" y="349.319" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="128" y="349.319">ASISTENTE </tspan><tspan x="128" y="386.861">DE ATENCIÓN</tspan></text><text x="128" y="506.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="128" y="506.27">Tarea acordada</tspan></text><text x="128" y="573.611" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="128" y="573.611">Resolver consultas </tspan><tspan x="128" y="612.569">sobre contratos</tspan></text><text x="128" y="742.145" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="128" y="742.145">Identidad: conexión </tspan><tspan x="128" y="780.395">efectiva del agente</tspan></text><rect x="720" y="280" width="1104" height="520" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="720" y="280" width="1104" height="100" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="720" y="280" width="1104" height="6" rx="0" fill="#2E5C70" stroke="none" stroke-width="2"/><rect x="1480" y="380" width="344" height="140" rx="0" fill="#EEF3EC" stroke="#3C4545" stroke-width="2"/><rect x="1480" y="380" width="6" height="140" rx="0" fill="#749B6B" stroke="none" stroke-width="2"/><text x="756" y="342.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="756" y="342.59">Acción</tspan></text><text x="1645" y="342.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1645" y="342.59">Permiso</tspan></text><line x1="1480" y1="280" x2="1480" y2="800" stroke="#C2D4D4" stroke-width="2"/><text x="756" y="462.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="756" y="462.59">Consultar contratos autorizados</tspan></text><text x="1645" y="462.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1645" y="462.59">Permitir</tspan></text><line x1="720" y1="520" x2="1824" y2="520" stroke="#C2D4D4" stroke-width="2"/><text x="756" y="602.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="756" y="602.59">Administrar la plataforma</tspan></text><text x="1645" y="602.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="middle"><tspan x="1645" y="602.59">Excluir</tspan></text><line x1="720" y1="660" x2="1824" y2="660" stroke="#C2D4D4" stroke-width="2"/><text x="756" y="742.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="756" y="742.59">Modificar roles</tspan></text><text x="1645" y="742.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="middle"><tspan x="1645" y="742.59">Excluir</tspan></text><path d="M606 570 H666 V330" fill="none" stroke="#3C4545" stroke-width="4" stroke-linejoin="round"/><line x1="666" y1="330" x2="720" y2="330" stroke="#3C4545" stroke-width="4"/><path d="M720 330 L704 338 L704 322 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><rect x="720" y="843" width="1104" height="137" rx="0" fill="none" stroke="#697778" stroke-width="2"/><line x1="1272" y1="800" x2="1272" y2="843" stroke="#3C4545" stroke-width="3"/><text x="752" y="882.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="752" y="882.27">Verificar identidad efectiva y alcance de datos</tspan></text><text x="752" y="945.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="752" y="945.27">Conservar evidencia del acceso observado</tspan></text></g></svg>
