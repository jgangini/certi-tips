<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Mapa de responsabilidades para repasar el stack</title>
  <desc id="description">La interfaz Responses transmite entradas y devuelve elementos; el SDK coordina agentes, herramientas y handoffs; la aplicación conserva permisos, reglas y despliegue. La revisión del flujo pregunta por contexto, ejecutor, control y evidencia.</desc>
  <defs><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b;font-size:23px}.h{font-size:34px;font-weight:700}.label{font-size:26px;font-weight:700}.icon{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style></defs>
  <rect width="1200" height="560" fill="#f7f8fc"/><text x="56" y="65" class="h">Explica el sistema señalando quién hace cada cosa</text>
  <g fill="#fff" stroke="#dce1ec"><rect x="56" y="119" width="1088" height="100" rx="18"/><rect x="56" y="237" width="1088" height="100" rx="18"/><rect x="56" y="355" width="1088" height="100" rx="18"/></g>
  <circle cx="109" cy="169" r="36" fill="#fae6e1"/><g data-icon="plug" transform="translate(88 148) scale(1.75)" fill="none" stroke="#c74436" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5M15 8V2M17 8a1 1 0 0 1 1 1v4a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1zM9 8V2"/></g><text x="163" y="178" class="label">Responses API</text><text x="440" y="160">Entradas, contexto y herramientas declaradas</text><text x="440" y="195">Texto y otros elementos de salida</text>
  <!-- Lucide plug, workflow and app-window; license: ../icons/LICENSE-lucide.txt -->
  <circle cx="109" cy="287" r="36" fill="#e9e6fa"/><g data-icon="workflow" transform="translate(88 266) scale(1.75)" fill="none" stroke="#4f46b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></g><text x="163" y="296" class="label">Agents SDK</text><text x="440" y="278">Loop, agentes, handoffs y herramientas</text><text x="440" y="313">Guardrails y trazado según configuración</text>
  <circle cx="109" cy="405" r="36" fill="#e1f2ee"/><g data-icon="app-window" transform="translate(88 384) scale(1.75)" fill="none" stroke="#087f7a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 4v4M2 8h20M6 4v4"/></g><text x="163" y="414" class="label">Tu aplicación</text><text x="440" y="396">Reglas de negocio, identidad y permisos</text><text x="440" y="431">Funciones propias, datos y despliegue</text>
  <text x="600" y="514" text-anchor="middle" style="fill:#536078">Contexto → ejecución → responsabilidad → evidencia</text>
</svg>
