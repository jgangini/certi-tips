<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Qué No Demuestra una Señal Operativa</title><desc id="description">Cada señal deja una comprobación pendiente. «Terminada» no demuestra completitud si P2 falta; una copia guardada no demuestra recuperación si nunca se restauró; y una alerta no reduce el gasto mientras nadie actúe sobre el consumo. Revisa los datos recibidos, ensaya la restauración y asigna la decisión de consumo antes de dar por resuelto cada caso.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Qué No Demuestra una Señal Operativa</tspan></text><rect x="76" y="185" width="568" height="744" rx="0" fill="none" stroke="#697778" stroke-width="2"/><line x1="96" y1="780" x2="624" y2="780" stroke="#C2D4D4" stroke-width="2"/><rect x="678" y="185" width="568" height="744" rx="0" fill="none" stroke="#697778" stroke-width="2"/><line x1="698" y1="780" x2="1226" y2="780" stroke="#C2D4D4" stroke-width="2"/><rect x="1280" y="185" width="568" height="744" rx="0" fill="none" stroke="#697778" stroke-width="2"/><line x1="1300" y1="780" x2="1828" y2="780" stroke="#C2D4D4" stroke-width="2"/><text x="96" y="234.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="96" y="234.59">EJECUCIÓN</tspan></text><text x="698" y="234.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="698" y="234.59">RESPALDO</tspan></text><text x="1300" y="234.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1300" y="234.59">PRESUPUESTO</tspan></text><text x="333" y="383.07" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="333" y="383.07">TERMINADA</tspan></text><rect x="128" y="440" width="410" height="214" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="128" y="440" width="410" height="88" rx="0" fill="#749B6B" stroke="#3C4545" stroke-width="2"/><text x="162" y="492.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="162" y="492.59">P1 · recibida</tspan></text><line x1="128" y1="528" x2="538" y2="528" stroke="#C2D4D4" stroke-width="2"/><text x="162" y="583.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="162" y="583.59">P2 · ausente</tspan></text><path d="M1137 370 H1157 V576 H779 V556 H1137 Z" fill="#F1EFED" stroke="none" stroke-width="3" stroke-linejoin="round"/><path d="M1137 370 H1157 V576 H779 V556" fill="none" stroke="#3C4545" stroke-width="2" stroke-linejoin="round"/><path d="M1117 350 H1137 V556 H759 V536 H1117 Z" fill="#F1EFED" stroke="none" stroke-width="3" stroke-linejoin="round"/><path d="M1117 350 H1137 V556 H759 V536" fill="none" stroke="#3C4545" stroke-width="2" stroke-linejoin="round"/><rect x="739" y="330" width="378" height="206" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="2"/><rect x="739" y="330" width="378" height="6" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><text x="928" y="416.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="928" y="416.59">Copia guardada</tspan></text><text x="698" y="645.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="698" y="645.59">Ensayo: no realizado</tspan></text><line x1="1320" y1="647" x2="1824" y2="647" stroke="#3C4545" stroke-width="3"/><line x1="1320" y1="328" x2="1320" y2="647" stroke="#3C4545" stroke-width="3"/><path d="M1320 617 L1400 568 L1490 538 L1580 457 L1660 420 L1824 350" fill="none" stroke="#C74634" stroke-width="5" stroke-linejoin="round"/><line x1="1580" y1="318" x2="1580" y2="647" stroke="#697778" stroke-width="3" stroke-dasharray="12 10"/><text x="1320" y="305.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1320" y="305.27">Consumo</tspan></text><text x="1580" y="706.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1580" y="706.27">Alerta</tspan></text><text x="1824" y="706.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="end"><tspan x="1824" y="706.27">Tiempo</tspan></text><text x="96" y="841.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="96" y="841.59">Completitud pendiente</tspan></text><text x="698" y="841.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="698" y="841.59">Recuperación no probada</tspan></text><text x="1300" y="841.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1300" y="841.59">Acción aún por decidir</tspan></text></g></svg>
