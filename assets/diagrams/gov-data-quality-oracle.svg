<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">La Regla Decide Qué Llega al Consumo</title><desc id="description">Una regla aprobada se evalúa mediante notebooks y workflows de Oracle AI Data Platform, identificados como extensión implementada. Los datos conformes siguen hacia una publicación autorizada en Oracle Autonomous AI Lakehouse. Los que fallan conservan motivo, responsable y estado; se corrigen y vuelven a medir. La ruta de publicación necesita aceptar la regla y los demás controles correspondientes al uso.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">La Regla Decide Qué Llega al Consumo</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" transform="translate(0.000 8.500)" data-center="960 608"><rect x="96" y="245" width="1140" height="709" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" /><svg x="126" y="274" width="96" height="96" viewBox="0 0 720 720" aria-hidden="true" data-official-icon="oci-ai-data-platform-workbench">
