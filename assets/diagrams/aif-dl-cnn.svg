<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="convolution">
<title id="title">De píxeles a patrones reconocibles</title>
<desc id="description">Un filtro local recorre una imagen de píxeles; las características se reúnen en mapas, pooling reduce su tamaño y las capas finales clasifican.</desc>
