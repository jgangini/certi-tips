<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">No Todas las Señales Prueban Identidad</title><desc id="description">Cada señal limita lo que puedes concluir. Nombre y teléfono iguales proponen una candidatura, sin confirmar identidad. Un dato reciente exige comparar fuente y autoridad. Una tabla en la capa Gold necesita reglas y aprobación para considerarse un maestro publicado. Contrasta los indicios con identificación verificada y evidencia de la decisión; ni novedad ni ubicación sustituyen autoridad.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">No Todas las Señales Prueban Identidad</tspan></text><text x="115" y="259.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="115" y="259.59">LO QUE OBSERVAS</tspan></text><text x="1050" y="259.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1050" y="259.59">LO QUE PERMITE DECIDIR</tspan></text><rect x="95" y="295" width="715" height="145" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><g data-svgrepo-icon="key" transform="translate(118 323) scale(2)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 21 9.6-9.6" />
  <path d="m7.5 15.5 2.3 2.3a1 1 0 0 1 0 1.4l-2.1 2.1a1 1 0 0 1-1.4 0L4 19" />
  <circle cx="15.5" cy="7.5" r="5.5" />
</g><text x="195" y="349.75" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="195" y="349.75">Nombre y teléfono iguales</tspan></text><line x1="810" y1="375" x2="990" y2="375" stroke="#2E5C70" stroke-width="3"/><path d="M990 375 L974 383 L974 367 Z" fill="#2E5C70" stroke="#2E5C70" stroke-width="1" stroke-linejoin="round"/><text x="1050" y="350.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1050" y="350.59">Candidatura para revisar</tspan></text><text x="1050" y="417.27" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="start"><tspan x="1050" y="417.27">Indicio, no confirmación</tspan></text><rect x="1018" y="317" width="6" height="119" rx="0" fill="#C06D30" stroke="none" stroke-width="2"/><line x1="115" y1="469" x2="1780" y2="469" stroke="#C2D4D4" stroke-width="2"/><rect x="95" y="488" width="715" height="145" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><g data-svgrepo-icon="clock" transform="translate(118 516) scale(2)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" />
  <path d="M12 6v6l4 2" />
</g><text x="195" y="542.75" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="195" y="542.75">Dato más reciente</tspan></text><line x1="810" y1="568" x2="990" y2="568" stroke="#2E5C70" stroke-width="3"/><path d="M990 568 L974 576 L974 560 Z" fill="#2E5C70" stroke="#2E5C70" stroke-width="1" stroke-linejoin="round"/><text x="1050" y="543.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1050" y="543.59">Comparar fuente y autoridad</tspan></text><text x="1050" y="610.27" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="start"><tspan x="1050" y="610.27">Novedad, no autoridad</tspan></text><rect x="1018" y="510" width="6" height="119" rx="0" fill="#C06D30" stroke="none" stroke-width="2"/><line x1="115" y1="662" x2="1780" y2="662" stroke="#C2D4D4" stroke-width="2"/><rect x="95" y="681" width="715" height="145" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><g data-svgrepo-icon="database" transform="translate(118 709) scale(2)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3" />
  <path d="M3 5V19A9 3 0 0 0 21 19V5" />
