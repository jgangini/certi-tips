</g><text x="195" y="735.75" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="195" y="735.75">Tabla en capa Gold</tspan></text><line x1="810" y1="761" x2="990" y2="761" stroke="#2E5C70" stroke-width="3"/><path d="M990 761 L974 769 L974 753 Z" fill="#2E5C70" stroke="#2E5C70" stroke-width="1" stroke-linejoin="round"/><text x="1050" y="736.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1050" y="736.59">Verificar reglas y aprobación</tspan></text><text x="1050" y="803.27" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="start"><tspan x="1050" y="803.27">Ubicación, no maestro aprobado</tspan></text><rect x="1018" y="703" width="6" height="119" rx="0" fill="#C06D30" stroke="none" stroke-width="2"/><rect x="95" y="863" width="1710" height="100" rx="0" fill="#F1EFED" stroke="#C2D4D4" stroke-width="2"/><g data-svgrepo-icon="audit" transform="translate(120 889) scale(2)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
  <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
  <path d="M12 11h4" />
  <path d="M12 16h4" />
  <path d="M8 11h.01" />
  <path d="M8 16h.01" />
</g><text x="205" y="922.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="205" y="922.59">La identificación verificada puede confirmar o contradecir la candidatura.</tspan></text></g></svg>
