  <title id="title">Publicación de una aplicación compatible en OCI Generative AI</title>
  <desc id="description">La aplicación probada se empaqueta como imagen, se sube a OCI Container Registry, se configura una aplicación, se crea su deployment y se atienden solicitudes por el endpoint. La evaluación y la versión anterior permiten detectar regresiones y volver atrás.</desc>
