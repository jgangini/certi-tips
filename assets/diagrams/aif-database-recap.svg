<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Sigue el trabajo de cada componente</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Combinar capacidades funciona mejor cuando sus límites están claros.</text><g data-concept="Recuperar"><circle cx="215" cy="295" r="70" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="215" cy="288" r="70" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="search" href="#search" x="177.2" y="250.2" width="75.60000000000001" height="75.60000000000001" color="#c74436"/><text x="215" y="401" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Recuperar</text><text x="215" y="436" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Vectores + filtros</text><text x="215" y="468" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">devuelven evidencia</text></g><g data-concept="Coordinar"><circle cx="600" cy="295" r="70" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="600" cy="288" r="70" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="bot" href="#bot" x="562.2" y="250.2" width="75.60000000000001" height="75.60000000000001" color="#4f46b8"/><text x="600" y="401" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Coordinar</text><text x="600" y="436" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Un agente organiza</text><text x="600" y="468" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">tareas y herramientas</text></g><g data-concept="Conectar"><circle cx="985" cy="295" r="70" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="985" cy="288" r="70" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="link" href="#link" x="947.2" y="250.2" width="75.60000000000001" height="75.60000000000001" color="#087f7a"/><text x="985" y="401" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Conectar</text><text x="985" y="436" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">MCP ofrece operaciones</text><text x="985" y="468" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">a clientes compatibles</text></g><path d="M215 468L215 514" fill="none" stroke="#536078" stroke-width="2"/><path d="M600 468L600 514" fill="none" stroke="#536078" stroke-width="2"/><path d="M985 468L985 514" fill="none" stroke="#536078" stroke-width="2"/><path d="M215 514L985 514" fill="none" stroke="#536078" stroke-width="2"/><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">En cada paso: identidad, permisos, procedencia y evaluación del resultado.</text></g>
