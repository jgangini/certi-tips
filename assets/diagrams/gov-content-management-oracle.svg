<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Recuperar el Documento Que Sí Aplica</title><desc id="description">Un documento aprobado y vigente entra en una carpeta autorizada de un volumen de Oracle AI Data Platform. La ingesta de una Knowledge Base genera fragmentos y embeddings que una herramienta RAG del agente recupera. El gráfico identifica Oracle Autonomous AI Lakehouse 26ai o superior como base vectorial. La aprobación, la vigencia y la conservación siguen siendo decisiones documentales que deben comprobarse junto con el acceso y los cambios del índice.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Recuperar el Documento Que Sí Aplica</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" transform="translate(0.000 -13.000)" data-center="960 608"><rect x="568" y="242" width="1256" height="523" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" /><svg x="600" y="273" width="96" height="96" viewBox="0 0 720 720" aria-hidden="true" data-official-icon="oci-ai-data-platform-workbench">
