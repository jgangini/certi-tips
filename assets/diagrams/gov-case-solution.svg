<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Superar una Regla No Autoriza Todavía la Publicación</title><desc id="description">De 12 400 contratos, 12 280 tienen referencia válida y 120 se conservan en cuarentena: esa regla alcanza el 99,03 %. El porcentaje no autoriza por sí solo la publicación. También se comprueban las otras reglas, el acceso efectivo y la aprobación. Los rechazados conservan motivo, responsable y resolución; se corrigen en origen y vuelven a validar antes de incorporarlos al producto.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Superar una Regla No Autoriza Todavía la Publicación</tspan></text><rect x="96" y="239" width="1728" height="54" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><text x="96" y="198.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="198.27">12 280 / 12 400 = 99,03 % de referencias válidas</tspan></text><rect x="96" y="239" width="1711.2774193548387" height="54" rx="0" fill="#749B6B" stroke="none" stroke-width="2"/><rect x="1807.2774193548387" y="239" width="16.722580645161315" height="54" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="338.91" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="338.91">12 280 con referencia válida</tspan></text><text x="1824" y="340.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="end"><tspan x="1824" y="340.59">120 sin cliente válido</tspan></text><line x1="600" y1="367" x2="600" y2="462" stroke="#3C4545" stroke-width="4"/><path d="M600 462 L592 446 L608 446 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><line x1="1635" y1="367" x2="1635" y2="462" stroke="#C74634" stroke-width="4"/><path d="M1635 462 L1627 446 L1643 446 Z" fill="#C74634" stroke="#C74634" stroke-width="1" stroke-linejoin="round"/><rect x="96" y="462" width="1008" height="217" rx="8" fill="#FFFFFF" stroke="#3C4545" stroke-width="2"/><g data-svgrepo-icon="alert" transform="translate(130 490) scale(2)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
  <path d="M12 9v4" />
  <path d="M12 17h.01" />
</g><text x="196" y="519.91" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="196" y="519.91">Aún faltan comprobaciones</tspan></text><rect x="135" y="556" width="26" height="26" rx="2" fill="#FFFFFF" stroke="#3C4545" stroke-width="2"/><text x="177" y="578.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="177" y="578.27">Otras reglas de calidad</tspan></text><rect x="590" y="556" width="26" height="26" rx="2" fill="#FFFFFF" stroke="#3C4545" stroke-width="2"/><text x="632" y="578.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="632" y="578.27">Acceso efectivo</tspan></text><rect x="135" y="612" width="26" height="26" rx="2" fill="#FFFFFF" stroke="#3C4545" stroke-width="2"/><text x="177" y="634.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="177" y="634.27">Aprobación de publicación</tspan></text><rect x="1190" y="462" width="634" height="440" rx="8" fill="#F1EFED" stroke="#C74634" stroke-width="2"/><g data-svgrepo-icon="archive" transform="translate(1226 489) scale(2)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1" />
  <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8" />
  <path d="M10 12h4" />
</g><text x="1296" y="521.91" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1296" y="521.91">CUARENTENA</tspan></text><text x="1226" y="592.247" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1226" y="592.247">Registro + motivo del rechazo </tspan><tspan x="1226" y="639.262">Responsable de resolución </tspan><tspan x="1226" y="686.278">Corrección en origen </tspan><tspan x="1226" y="733.293">Nueva validación</tspan></text><path d="M1190 864 H1140 V647" fill="none" stroke="#C74634" stroke-width="4" stroke-linejoin="round"/><line x1="1140" y1="647" x2="1104" y2="647" stroke="#C74634" stroke-width="4"/><path d="M1104 647 L1120 639 L1120 655 Z" fill="#C74634" stroke="#C74634" stroke-width="1" stroke-linejoin="round"/><text x="1226" y="852.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1226" y="852.27">Conservar y reprocesar</tspan></text><line x1="600" y1="679" x2="600" y2="800" stroke="#3C4545" stroke-width="4"/><path d="M600 800 L592 784 L608 784 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><rect x="96" y="800" width="1008" height="102" rx="8" fill="#EEF3EC" stroke="#C2D4D4" stroke-width="2"/><text x="600" y="861.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="middle"><tspan x="600" y="861.27">Publicar solo cuando todos los controles se aceptan</tspan></text></g></svg>
