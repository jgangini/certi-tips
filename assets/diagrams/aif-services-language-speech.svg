<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="speech-language-chain">
<title id="title">Primero transcribe; después analiza</title>
<desc id="description">Una onda de audio se transcribe con Speech a Reparación buena, entrega muy lenta. Language distingue sentimiento positivo sobre reparación y negativo sobre entrega.</desc>
