<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="srt-boxes-table">
<title id="title">Mira la salida para elegir el servicio</title>
<desc id="description">Speech produce un subtítulo con intervalo de uno a tres segundos. Vision devuelve tres cajas numeradas. Document Understanding conserva cantidad y precio en filas y columnas.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2" width="18" height="8" rx="2"/><rect x="3" y="14" width="18" height="8" rx="2"/><path d="M6 6h.1M6 18h.1M11 6h6M11 18h6"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Mira la salida para elegir el servicio</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Tiempo para subtítulos, coordenadas para objetos y celdas para facturas.</text><text x="217" y="174" font-size="29" fill="#17243b" font-weight="700" text-anchor="middle">Subtítulos</text><rect x="66" y="219" width="305" height="210" rx="16" fill="#fff" stroke="#c74436" stroke-width="1.5"/><text x="92" y="256" font-size="23" fill="#c74436" font-weight="700" text-anchor="start">1</text><text x="92" y="292" font-size="22" fill="#17243b" font-weight="600" text-anchor="start">00:00:01 → 00:00:03</text><text x="92" y="338" font-size="23" fill="#536078" font-weight="400" text-anchor="start">El motor se apaga</text><text x="92" y="370" font-size="23" fill="#536078" font-weight="400" text-anchor="start">durante la prueba.</text><text x="217" y="482" font-size="26" fill="#17243b" font-weight="700" text-anchor="middle">Speech · SRT</text><text x="600" y="174" font-size="29" fill="#17243b" font-weight="700" text-anchor="middle">Tres objetos</text><rect x="451" y="219" width="297" height="210" rx="16" fill="#eef2f5" stroke="#dce1ec" stroke-width="1.5"/><use data-icon="server" href="#server" x="468.5" y="271.5" width="51" height="51" color="#4f46b8"/><rect x="461" y="258" width="66" height="80" rx="3" fill="none" stroke="#4f46b8" stroke-width="1.5"/><text x="471" y="249" font-size="20" fill="#4f46b8" font-weight="700" text-anchor="middle">1</text><use data-icon="server" href="#server" x="574.5" y="328.5" width="51" height="51" color="#4f46b8"/><rect x="567" y="315" width="66" height="80" rx="3" fill="none" stroke="#4f46b8" stroke-width="1.5"/><text x="577" y="306" font-size="20" fill="#4f46b8" font-weight="700" text-anchor="middle">2</text><use data-icon="server" href="#server" x="676.5" y="259.5" width="51" height="51" color="#4f46b8"/><rect x="669" y="246" width="66" height="80" rx="3" fill="none" stroke="#4f46b8" stroke-width="1.5"/><text x="679" y="237" font-size="20" fill="#4f46b8" font-weight="700" text-anchor="middle">3</text><text x="600" y="482" font-size="26" fill="#17243b" font-weight="700" text-anchor="middle">Vision · cajas</text><text x="983" y="174" font-size="29" fill="#17243b" font-weight="700" text-anchor="middle">Filas y columnas</text><rect x="830" y="219" width="306" height="210" rx="16" fill="#fff" stroke="#087f7a" stroke-width="1.5"/><path d="M830 277L1136 277" fill="none" stroke="#087f7a" stroke-width="1.5"/><path d="M980 219L980 429" fill="none" stroke="#087f7a" stroke-width="1.5"/><text x="905" y="256" font-size="22" fill="#087f7a" font-weight="700" text-anchor="middle">Cantidad</text><text x="1057" y="256" font-size="22" fill="#087f7a" font-weight="700" text-anchor="middle">Precio</text><text x="905" y="323" font-size="29" fill="#17243b" font-weight="600" text-anchor="middle">2</text><text x="1057" y="323" font-size="29" fill="#17243b" font-weight="600" text-anchor="middle">50</text><path d="M830 349L1136 349" fill="none" stroke="#dce1ec" stroke-width="1.5"/><text x="905" y="396" font-size="29" fill="#17243b" font-weight="600" text-anchor="middle">1</text><text x="1057" y="396" font-size="29" fill="#17243b" font-weight="600" text-anchor="middle">30</text><text x="983" y="482" font-size="24" fill="#17243b" font-weight="600" text-anchor="middle">Document Understanding</text><text x="983" y="515" font-size="24" fill="#17243b" font-weight="600" text-anchor="middle">Extracción de tablas</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">La respuesta correcta se reconoce por su estructura, no solo por su texto.</text></g>
</svg>
