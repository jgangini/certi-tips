</g><path d="M370 496 V533 H1240 V393 H1300" fill="none" stroke="#3C4545" stroke-width="2" stroke-linejoin="round"/><line x1="960" y1="496" x2="960" y2="533" stroke="#3C4545" stroke-width="2"/><text x="1350" y="350.91" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1350" y="350.91">Promedio: 99,5 %</tspan></text><text x="1350" y="426.736" font-size="25.5" fill="#C74634" font-weight="400" text-anchor="start"><tspan x="1350" y="426.736">No demuestra </tspan><tspan x="1350" y="461.444">unicidad del 100 %.</tspan></text><line x1="130" y1="560" x2="1790" y2="560" stroke="#C2D4D4" stroke-width="3"/><rect x="130" y="659" width="510" height="166" rx="0" fill="#EEF3F4" stroke="#3C4545" stroke-width="2"/><g data-svgrepo-icon="database" transform="translate(157 703) scale(2.16667)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3" />
  <path d="M3 5V19A9 3 0 0 0 21 19V5" />
