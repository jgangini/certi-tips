</g><text x="410" y="722.31" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="middle"><tspan x="410" y="722.31">Origen que repite </tspan><tspan x="410" y="754.95">la misma clave</tspan></text><rect x="1140" y="659" width="640" height="235" rx="0" fill="#F1EFED" stroke="#3C4545" stroke-width="3"/><rect x="1140" y="659" width="640" height="6" rx="0" fill="#749B6B" stroke="none" stroke-width="2"/><g data-svgrepo-icon="archive" transform="translate(1180 691) scale(2)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1" />
