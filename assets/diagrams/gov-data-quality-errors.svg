<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Un Promedio Puede Ocultar el Control Que Bloquea</title><desc id="description">La completitud del 100 % y la unicidad del 99 % producen un promedio del 99,5 %, pero ese promedio no demuestra unicidad del 100 %. Además, limpiar una copia sin corregir el origen permite que el defecto reaparezca en la siguiente carga. Mantén independientes los controles críticos y verifica la eliminación de la causa antes de dar la incidencia por resuelta.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Un Promedio Puede Ocultar el Control Que Bloquea</tspan></text><text x="130" y="248.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="130" y="248.59">CONTROLES INDEPENDIENTES</tspan></text><rect x="130" y="290" width="480" height="206" rx="0" fill="#EEF3EC" stroke="#3C4545" stroke-width="3"/><rect x="130" y="290" width="480" height="6" rx="0" fill="#749B6B" stroke="none" stroke-width="2"/><text x="370" y="346.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="370" y="346.59">Completitud</tspan></text><text x="370" y="426.83" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="370" y="426.83">100 %</tspan></text><rect x="720" y="290" width="480" height="206" rx="0" fill="#F7EFE8" stroke="#3C4545" stroke-width="3"/><rect x="720" y="290" width="480" height="6" rx="0" fill="#C06D30" stroke="none" stroke-width="2"/><text x="960" y="346.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="960" y="346.59">Unicidad</tspan></text><text x="960" y="426.83" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="960" y="426.83">99 %</tspan></text><rect x="1300" y="290" width="500" height="206" rx="0" fill="#FFFFFF" stroke="#C74634" stroke-width="3"/><g data-svgrepo-icon="alert" transform="translate(1715 313) scale(1.75)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
