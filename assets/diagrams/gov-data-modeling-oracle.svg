<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Del Término de Negocio a la Medida</title><desc id="description">La definición aprobada establece qué significa «contrato vigente» en una fecha de corte. En el ejemplo, C2 está vigente y C3 suspendido, pero ambos pertenecen a C7: la medida resultante cuenta un cliente activo. El recorrido enlaza regla, registros y resultado entre Oracle AI Data Platform y Oracle Autonomous AI Lakehouse. El bloque de ontologías empresariales está identificado como anunciado y requiere comprobar disponibilidad antes de incorporarlo.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Del Término de Negocio a la Medida</tspan></text><rect x="76" y="180" width="496" height="556" rx="0" fill="none" stroke="#697778" stroke-width="2"/><rect x="640" y="180" width="636" height="556" rx="0" fill="none" stroke="#697778" stroke-width="2"/><rect x="1324" y="180" width="520" height="556" rx="0" fill="none" stroke="#697778" stroke-width="2"/><text x="96" y="232.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="96" y="232.27">DEFINICIÓN APROBADA</tspan></text><rect x="96" y="301" width="456" height="213" rx="0" fill="#F7EFE8" stroke="#3C4545" stroke-width="3"/><rect x="96" y="301" width="456" height="6" rx="0" fill="#C06D30" stroke="none" stroke-width="2"/><text x="128" y="376.633" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="128" y="376.633">Contrato </tspan><tspan x="128" y="410.827">vigente</tspan></text><text x="96" y="591.348" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="96" y="591.348">Aprueba el propietario </tspan><tspan x="96" y="631.192">La regla define el uso</tspan></text><text x="660" y="230.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="660" y="230.59">Oracle AI Data Platform</tspan></text><rect x="660" y="301" width="596" height="288" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="660" y="301" width="596" height="96" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="660" y="301" width="596" height="6" rx="0" fill="#2E5C70" stroke="none" stroke-width="2"/><text x="752" y="359.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="752" y="359.27">Contrato</tspan></text><text x="940" y="359.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="940" y="359.27">Cliente</tspan></text><text x="1150" y="359.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1150" y="359.27">Estado</tspan></text><text x="752" y="455.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="752" y="455.59">C2</tspan></text><text x="940" y="455.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="940" y="455.59">C7</tspan></text><text x="1150" y="457.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1150" y="457.27">Vigente</tspan></text><text x="752" y="551.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="752" y="551.59">C3</tspan></text><text x="940" y="551.59" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="940" y="551.59">C7</tspan></text><text x="1150" y="553.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1150" y="553.27">Suspendido</tspan></text><line x1="660" y1="493" x2="1256" y2="493" stroke="#C2D4D4" stroke-width="2"/><line x1="848" y1="301" x2="848" y2="589" stroke="#C2D4D4" stroke-width="2"/><line x1="1036" y1="301" x2="1036" y2="589" stroke="#C2D4D4" stroke-width="2"/><line x1="552" y1="407" x2="660" y2="407" stroke="#C74634" stroke-width="3" stroke-dasharray="10 8"/><text x="660" y="656.739" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="660" y="656.739">Regla: contrato vigente </tspan><tspan x="660" y="691.801">en la fecha de corte</tspan></text><text x="1344" y="236.637" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="1344" y="236.637">Oracle Autonomous  </tspan><tspan x="1344" y="270.903">AI Lakehouse</tspan></text><rect x="1344" y="350" width="480" height="334" rx="0" fill="#EEF3EC" stroke="#3C4545" stroke-width="3"/><rect x="1344" y="350" width="480" height="6" rx="0" fill="#749B6B" stroke="none" stroke-width="2"/><text x="1584" y="399.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1584" y="399.59">Clientes activos</tspan></text><text x="1584" y="514.99" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1584" y="514.99">1</tspan></text><text x="1584" y="647.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1584" y="647.27">Cliente C7</tspan></text><line x1="1256" y1="445" x2="1344" y2="445" stroke="#3C4545" stroke-width="4"/><path d="M1344 445 L1328 453 L1328 437 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><rect x="96" y="814" width="1728" height="130" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="2"/><text x="128" y="864.27" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="start"><tspan x="128" y="864.27">ONTOLOGÍAS EMPRESARIALES · ANUNCIADAS</tspan></text><text x="128" y="916.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="128" y="916.27">Verificar la disponibilidad operativa de cada función; mantener aprobación humana del significado.</tspan></text></g></svg>
