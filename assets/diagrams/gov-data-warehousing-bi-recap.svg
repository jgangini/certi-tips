<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">La Métrica Necesita una Ficha Reproducible</title><desc id="description">La métrica de importe facturado suma líneas: en F-01, 60 + 40 = 100, conciliado contra el origen. Su ficha declara grano, periodo, población incluida, audiencia autorizada, versión de definición y publicación, y propietario. Estos datos permiten reproducir la cifra y comprobar que otro consumidor interpreta y calcula la misma medida.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">La Métrica Necesita una Ficha Reproducible</tspan></text><rect x="120" y="270" width="575" height="647" rx="0" fill="#EDF1F2" stroke="#C2D4D4" stroke-width="2"/><rect x="120" y="270" width="575" height="6" rx="0" fill="#2E5C70" stroke="none" stroke-width="2"/><g data-svgrepo-icon="chart" transform="translate(598 313) scale(2)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16" />
