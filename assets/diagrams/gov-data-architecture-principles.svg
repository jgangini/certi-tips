<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Elegir el Patrón de Acceso</title><desc id="description">Compara cada patrón por ubicación de los datos, conservación de historia y dependencias. Consultar en origen depende de la fuente, la red y sus permisos. Materializar conserva un resultado, pero exige actualizarlo y registrar versiones y reglas. Compartir añade condiciones para el receptor y puede combinarse con ambos caminos. Elige según el uso: consultar el presente y reproducir un cierre requieren evidencias distintas.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Elegir el Patrón de Acceso</tspan></text><defs><clipPath id="access-table"><rect x="96" y="384" width="1728" height="372" rx="20"/></clipPath></defs><g data-architecture-table="access-patterns"><g clip-path="url(#access-table)"><rect x="96" y="384" width="1728" height="84" rx="0" fill="#59616E" stroke="none" stroke-width="2"/><rect x="96" y="468" width="1728" height="288" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="120" y="436.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="120" y="436.8">Criterio</tspan></text><text x="411" y="436.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="411" y="436.8">Consulta En Origen</tspan></text><text x="891" y="436.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="891" y="436.8">Materialización</tspan></text><text x="1371" y="436.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="1371" y="436.8">Publicación Compartida</tspan></text><line x1="96" y1="468" x2="1824" y2="468" stroke="#59616E" stroke-width="2"/><g data-architecture-row="access" data-row-top="468" data-row-bottom="564"><text x="120" y="526.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="120" y="526.8">Ubicación</tspan></text><text x="411" y="526.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="411" y="526.8">Datos en la fuente</tspan></text><text x="891" y="526.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="891" y="526.8">Resultado persistente</tspan></text><text x="1371" y="526.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1371" y="526.8">Según el producto publicado</tspan></text></g><line x1="96" y1="564" x2="1824" y2="564" stroke="#59616E" stroke-width="2"/><g data-architecture-row="access" data-row-top="564" data-row-bottom="660"><text x="120" y="622.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="120" y="622.8">Historia</tspan></text><text x="411" y="622.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="411" y="622.8">Depende del historial de la fuente</tspan></text><text x="891" y="622.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="891" y="622.8">Conservar versión y reglas</tspan></text><text x="1371" y="622.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1371" y="622.8">Acordar versión y vigencia</tspan></text></g><line x1="96" y1="660" x2="1824" y2="660" stroke="#59616E" stroke-width="2"/><g data-architecture-row="access" data-row-top="660" data-row-bottom="756"><text x="120" y="718.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="120" y="718.8">Dependencias</tspan></text><text x="411" y="718.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="411" y="718.8">Fuente, red y permisos</tspan></text><text x="891" y="718.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="891" y="718.8">Carga y actualización</tspan></text><text x="1371" y="718.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1371" y="718.8">Receptor y condiciones</tspan></text></g><line x1="384" y1="384" x2="384" y2="468" stroke="#FFFFFF" stroke-width="2"/><line x1="384" y1="468" x2="384" y2="756" stroke="#59616E" stroke-width="2"/><line x1="864" y1="384" x2="864" y2="468" stroke="#FFFFFF" stroke-width="2"/><line x1="864" y1="468" x2="864" y2="756" stroke="#59616E" stroke-width="2"/><line x1="1344" y1="384" x2="1344" y2="468" stroke="#FFFFFF" stroke-width="2"/><line x1="1344" y1="468" x2="1344" y2="756" stroke="#59616E" stroke-width="2"/></g><rect x="96" y="384" width="1728" height="372" rx="20" fill="none" stroke="#59616E" stroke-width="2"/></g><g data-layout="centered-card" data-architecture-note="access-patterns"><rect x="96" y="792" width="1728" height="88" rx="16" fill="#59616E" stroke="none" stroke-width="2"/><g data-card-content="note"><text x="960" y="846.8" font-size="25.5" fill="#FFFFFF" font-weight="400" text-anchor="middle"><tspan x="960" y="846.8">Un cierre reproducible y una consulta del estado actual pueden necesitar caminos distintos.</tspan></text></g></g></g></svg>
