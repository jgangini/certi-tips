<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">El Último Grafo No Reconstruye el Pasado</title><desc id="description">Para auditar una ejecución de hace tres meses reúne versiones de notebook y regla, identificador de ejecución, entradas, salidas y aprobación aplicable al periodo. El último linaje y el código actual explican relaciones presentes, pero no prueban aquella ejecución. Si falta evidencia histórica, registra la limitación y evita reconstruirla como si hubiera sido capturada.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">El Último Grafo No Reconstruye el Pasado</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" transform="translate(-5.000 -2.545)" data-center="960 608"><line x1="200" y1="318" x2="1710" y2="318" stroke="#3C4545" stroke-width="4" /><circle cx="365" cy="318" r="16" fill="#C74634" stroke="#C74634" stroke-width="2" /><rect x="245.002" y="219.09" width="239.995" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="365.0" y="253.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="365.0" y="253.59">HACE TRES MESES</tspan></text><circle cx="1510" cy="318" r="16" fill="#3C4545" stroke="#3C4545" stroke-width="2" /><rect x="1468.302" y="219.09" width="83.395" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1510.0" y="253.59" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1510.0" y="253.59">HOY</tspan></text><line x1="365" y1="334" x2="365" y2="430