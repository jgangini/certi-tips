<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="agent-loop">
<title id="title">Decide. Actúa. Observa.</title>
<desc id="description">Objetivo y contexto llegan al modelo, que propone una llamada. La aplicación valida y ejecuta una herramienta, obtiene una observación y actualiza el contexto. El loop termina con respuesta o límite.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M8 2v3m4-3v3m4-3v3M8 19v3m4-3v3m4-3v3M2 8h3m-3 4h3m-3 4h3m14-8h3m-3 4h3m-3 4h3"/></symbol><symbol id="code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 8h20m-17-3h1m3 0h1m-5 7 3 3-3 3m6 0h5"/></symbol><symbol id="doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9Z"/><path d="M14 2v7h7M7 13h10M7 17h7"/></symbol></defs>
<rect width="1200" height="675" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Decide. Actúa. Observa.</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">El modelo propone; el runtime coordina acciones, contexto y límites.</text><rect x="56" y="150" width="317" height="42" rx="21" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="214.5" y="178" font-size="21" fill="#c74436" font-weight="600" text-anchor="middle">Entrada: objetivo + contexto</text><path d="M215 201V220" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><path d="M294 303H515" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="407.5" y="281" font-size="20" fill="#536078" font-weight="400" text-anchor="middle">llamada</text><path d="M679 303H900" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="792.5" y="281" font-size="20" fill="#536078" font-weight="400" text-anchor="middle">resultado</text><g data-concept="Modelo"><circle cx="215" cy="310" r="72" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="215" cy="303" r="72" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="cpu" href="#cpu" x="176.12" y="264.12" width="77.76" height="77.76" color="#c74436"/><text x="215" y="418" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Modelo</text><text x="215" y="453" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Propone el siguiente paso</text></g><g data-concept="Aplicación"><circle cx="600" cy="310" r="72" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="600" cy="303" r="72" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="code" href="#code" x="561.12" y="264.12" width="77.76" height="77.76" color="#4f46b8"/><text x="600" y="418" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Aplicación</text><text x="600" y="453" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Valida y ejecuta</text><text x="600" y="485" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">la herramienta</text></g><g data-concept="Observación"><circle cx="985" cy="310" r="72" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="985" cy="303" r="72" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="doc" href="#doc" x="946.12" y="264.12" width="77.76" height="77.76" color="#087f7a"/><text x="985" y="418" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Observación</text><text x="985" y="453" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Devuelve un resultado</text><text x="985" y="485" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">o un error</text></g><path d="M985 488V521Q985 544 963 544H239Q215 544 215 521V487" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><rect x="387" y="523" width="426" height="42" rx="21" fill="url(#teal)" stroke="none" stroke-width="1.5"/><text x="600" y="551" font-size="21" fill="#087f7a" font-weight="600" text-anchor="middle">La memoria conserva contexto útil</text><rect x="56" y="599" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="633" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">El loop continúa o termina según resultado, pasos, tiempo y costo.</text></g>
</svg>
