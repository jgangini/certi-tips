<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="authorized-ticket">
<title id="title">Del pedido del empleado al ticket real</title>
<desc id="description">Identificar empleado y equipo, leer políticas autorizadas, validar permiso de creación y campos, crear una sola vez y devolver el número real. Los reintentos usan identidad de operación para evitar duplicados.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></symbol><symbol id="book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5C8 2 4 3 2 4v15c4-1 7-1 10 2 3-3 6-3 10-2V4c-4-1-7-1-10 1v16"/><path d="M5 8h4m-4 4h4m6-4h4m-4 4h4"/></symbol><symbol id="shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4v7c0 5-6 8-9 9-3-1-9-4-9-9V6Z"/><path d="m7 12 3 3 7-7"/></symbol><symbol id="ticket" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h20v5a2 2 0 0 0 0 4v5H2v-5a2 2 0 0 0 0-4Z M16 5v3m0 3v2m0 3v3"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Del pedido del empleado al ticket real</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">«Consulta la política y abre un ticket por mi equipo».</text><path d="M239 291H368" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="306.5" y="269" font-size="20" fill="#536078" font-weight="400" text-anchor="middle">acceso</text><path d="M532 291H662" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="600" y="269" font-size="20" fill="#536078" font-weight="400" text-anchor="middle">propuesta</text><path d="M826 291H955" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="893.5" y="269" font-size="20" fill="#536078" font-weight="400" text-anchor="middle">ejecución</text><g data-concept="Identificar"><circle cx="160" cy="298" r="58" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="160" cy="291" r="58" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="user" href="#user" x="128.68" y="259.68" width="62.64" height="62.64" color="#c74436"/><text x="160" y="392" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Identificar</text><text x="160" y="427" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Empleado y equipo</text></g><g data-concept="Consultar"><circle cx="453" cy="298" r="58" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="453" cy="291" r="58" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="book" href="#book" x="421.68" y="259.68" width="62.64" height="62.64" color="#4f46b8"/><text x="453" y="392" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Consultar</text><text x="453" y="427" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Solo políticas</text><text x="453" y="459" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">que puede leer</text></g><g data-concept="Autorizar"><circle cx="747" cy="298" r="58" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="747" cy="291" r="58" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="shield" href="#shield" x="715.68" y="259.68" width="62.64" height="62.64" color="#4f46b8"/><text x="747" y="392" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Autorizar</text><text x="747" y="427" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Validar la creación</text><text x="747" y="459" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">y sus campos</text></g><g data-concept="Crear una vez"><circle cx="1040" cy="298" r="58" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="1040" cy="291" r="58" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="ticket" href="#ticket" x="1008.68" y="259.68" width="62.64" height="62.64" color="#087f7a"/><text x="1040" y="392" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Crear una vez</text><text x="1040" y="427" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Devolver el número</text><text x="1040" y="459" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">real del ticket</text></g><rect x="683" y="490" width="400" height="42" rx="21" fill="url(#teal)" stroke="none" stroke-width="1.5"/><text x="883" y="518" font-size="21" fill="#087f7a" font-weight="600" text-anchor="middle">Mismo intento → misma operación</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Un reintento debe recuperar el resultado sin duplicar el ticket.</text></g>
</svg>
