<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">La Unicidad Decide Si se Publica</title><desc id="description">La población tiene 200 filas y 198 claves distintas: unicidad del 99 % frente a una exigencia del 100 %, aunque la completitud sea del 100 %. La ruta bloquea la publicación, investiga las filas y repite la prueba después de corregir. Una excepción formal, si se autoriza, registra propietario, motivo, alcance y vigencia; no convierte el resultado en cumplimiento del umbral.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">La Unicidad Decide Si se Publica</tspan></text><rect x="130" y="265" width="610" height="250" rx="0" fill="#EEF3F4" stroke="#3C4545" stroke-width="3"/><text x="175" y="321.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="175" y="321.59">POBLACIÓN EVALUADA</tspan></text><text x="175" y="395.55" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="175" y="395.55">198 / 200 = 99 %</tspan></text><text x="175" y="470.27" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="175" y="470.27">Completitud: 100 %</tspan></text><path d="M1235.0 264 L1450 389.0 L1235.0 514 L1020 389.0 Z" fill="#FFFFFF" stroke="#C74634" stroke-width="3" stroke-linejoin="round"/><text x="1235" y="362.319" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="middle"><tspan x="1235" y="362.319">Unicidad </tspan><tspan x="1235" y="399.861">exigida: 100 %</tspan></text><line x1="740" y1="390" x2="1020" y2="390" stroke="#3C4545" stroke-width="4"/><path d="M1020 390 L1004 398 L1004 382 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><rect x="1510" y="295" width="310" height="205" rx="0" fill="#FFFFFF" stroke="#C74634" stroke-width="3"/><g data-svgrepo-icon="lock" transform="translate(1641 319) scale(2)" color="#C74634" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
</g><line x1="1450" y1="390" x2="1510" y2="390" stroke="#C74634" stroke-width="4"/><path d="M1510 390 L1494 398 L1494 382 Z" fill="#C74634" stroke="#C74634" stroke-width="1" stroke-linejoin="round"/><text x="1665" y="422.145" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="middle"><tspan x="1665" y="422.145">BLOQUEAR </tspan><tspan x="1665" y="460.395">publicación</tspan></text><path d="M1235 514 V588 H455 V667" fill="none" stroke="#3C4545" stroke-width="3" stroke-linejoin="round"/><path d="M1235 588 H1390 V667" fill="none" stroke="#3C4545" stroke-width="3" stroke-linejoin="round"/><rect x="130" y="667" width="650" height="222" rx="0" fill="#F1EFED" stroke="#3C4545" stroke-width="3"/><rect x="130" y="667" width="650" height="6" rx="0" fill="#749B6B" stroke="none" stroke-width="2"/><text x="170" y="720.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="170" y="720.59">REMEDIAR</tspan></text><text x="170" y="792.653" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="170" y="792.653">Separar e investigar las filas. </tspan><tspan x="170" y="834.887">Corregir y repetir la prueba.</tspan></text><rect x="1050" y="667" width="750" height="222" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="1050" y="667" width="750" height="6" rx="0" fill="#C06D30" stroke="none" stroke-width="2"/><g data-person-icon="user-supplied" transform="translate(1724 749) scale(2.625)" fill="#3C4545"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"/><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z"/></g><text x="1090" y="722.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1090" y="722.27">EXCEPCIÓN FORMAL, SI SE AUTORIZA</tspan></text><text x="1090" y="792.653" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1090" y="792.653">Propietario, motivo, alcance y vigencia. </tspan><tspan x="1090" y="834.887">No equivale a cumplir el umbral.</tspan></text></g></svg>
