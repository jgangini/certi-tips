<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Operar Exige Tres Clases de Evidencia</title><desc id="description">Los tres bloques separan evidencia de ejecución, recuperación y consumo. En Oracle AI Data Platform revisa tareas, resultados, fallos y reintentos. En Oracle Autonomous AI Lakehouse identifica el estado recuperable y comprueba su recuperación con sus dependencias. Cost Analysis y Budgets de Oracle Cloud Infrastructure apoyan la atribución del consumo y la decisión de una acción. Una ejecución, un respaldo y una alerta responden preguntas distintas.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Operar Exige Tres Clases de Evidencia</tspan></text><rect x="76" y="205" width="1768" height="218" rx="0" fill="none" stroke="#697778" stroke-width="2"/><rect x="76" y="479" width="1768" height="218" rx="0" fill="none" stroke="#697778" stroke-width="2"/><rect x="76" y="730" width="1768" height="259" rx="0" fill="none" stroke="#697778" stroke-width="2"/><rect x="1360" y="229" width="464" height="156" rx="0" fill="none" stroke="#697778" stroke-width="2"/><rect x="1360" y="499" width="464" height="178" rx="0" fill="none" stroke="#697778" stroke-width="2"/><rect x="1360" y="753" width="464" height="177" rx="0" fill="none" stroke="#697778" stroke-width="2"/><line x1="1250" y1="307" x2="1360" y2="307" stroke="#3C4545" stroke-width="4"/><path d="M1360 307 L1344 315 L1344 299 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><line x1="1250" y1="588" x2="1360" y2="588" stroke="#3C4545" stroke-width="4"/><path d="M1360 588 L1344 596 L1344 580 Z" fill="#3C4545" st