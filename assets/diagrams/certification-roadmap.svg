  <path d="M56 698H1144" stroke="#dce1eb"/>
  <text x="56" y="730" class="eyebrow">CERTITIPS / GUÍA VISUAL</text>
  <text x="1144" y="730" text-anchor="end" class="meta">La práctica orienta el repaso; no garantiza aprobar.</text>
