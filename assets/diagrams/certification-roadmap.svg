  <circle cx="230" cy="380" r="24" fill="#c74436" stroke="#f7f8fc" stroke-width="6"/>
  <circle cx="600" cy="380" r="24" fill="#4f46b8" stroke="#f7f8fc" stroke-width="6"/>
  <circle cx="970" cy="380" r="24" fill="#087f7a" stroke="#f7f8fc" stroke-width="6"/>
  <g text-anchor="middle" font-size="21" font-weight="700"><text x="230" y="387" class="white">1</text><text x="600" y="387" class="white">2</text><text x="970" y="387" class="white">3</text></g>
  <g text-anchor="middle">
    <text x="230" y="442" class="label">Estudia con casos</text>
    <text x="230" y="478" class="body"><tspan x="230">Conecta las seis áreas.</tspan><tspan x="230" dy="29">Explica cómo y por qué.</tspan></text>
    <text x="600" y="442" class="label">Practica y revisa</text>
    <text x="600" y="478" class="body"><tspan x="600">Responde sin ayuda.</tspan><tspan x="600" dy="29">Comprende cada alternativa.</tspan></text>
    <text x="970" y="442" class="label">Examen oficial</text>
    <text x="970" y="478" class="body"><tspan x="970">Consulta requisitos en MyLearn.</tspan><tspan x="970" dy="29">Demuestra lo aprendido.</tspan></text>
  </g>
  <path d="M600 535v60q0 14-14 14H244q-14 0-14-14v-43" fill="none" stroke="#087f7a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="292" y="588" width="246" height="42" rx="21" fill="#e1f2ef"/>
  <text x="415" y="615" text-anchor="middle" class="body teal">Refuerza tus errores</text>
  <path d="M970 535v24" fill="none" stroke="#087f7a" stroke-width="2.5" marker-end="url(#arrow)"/>
