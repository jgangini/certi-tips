<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Una ruta de aprendizaje, tres hitos</title>
  <desc id="description">Con bases de LLM, Python y OCI, estudia las seis áreas y sus casos, practica con retroalimentación y vuelve a tus temas débiles. Después realiza la evaluación oficial en MyLearn. Solo Oracle otorga la credencial; la práctica no garantiza aprobar.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}.eyebrow{font-size:14px;font-weight:700;letter-spacing:2px;fill:#536078}.title{font-size:34px;font-weight:700;letter-spacing:-.7px}.sub{font-size:19px;fill:#536078}.label{font-size:27px;font-weight:700}.body{font-size:21px;fill:#536078}.meta{font-size:16px;fill:#536078}.white{fill:#fff}.teal{fill:#087f7a}.icon{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="1200" height="760" fill="#f7f8fc"/>
  <text x="56" y="50" class="eyebrow">01 / RUTA DE CERTIFICACIÓN</text>
  <text x="56" y="98" class="title">Comprender. Practicar. Demostrar.</text>
  <text x="56" y="134" class="sub">Tres hitos para avanzar con criterio, no solo memorizar respuestas.</text>
  <rect x="56" y="174" width="500" height="46" rx="23" fill="#e9e8f8"/>
  <circle cx="81" cy="197" r="6" fill="#4f46b8"/>
  <text x="100" y="204" class="body">Punto de partida: LLM + Python + OCI</text>
  <path d="M82 380H1118" fill="none" stroke="#e1e5ef" stroke-width="16" stroke-linecap="round"/>
  <path d="M82 380H1118" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="5 9"/>
  <circle cx="82" cy="380" r="6" fill="#536078"/>
  <circle cx="1118" cy="380" r="6" fill="#536078"/>
  <g transform="translate(230 292)">
    <circle r="60" fill="#f8e6e2"/>
    <g class="icon" stroke="#c74436">
      <path d="M-39-24q20-9 39 2 19-11 39-2v48q-19-9-39 2-19-11-39-2Z" fill="#fff"/>
      <path d="M0-22v48M-28-10q10-3 18 0m-18 11q10-3 18 0M12-10q9-3 17 0m-17 11q9-3 17 0"/>
      <path d="M-39 34q20-7 39 2 19-9 39-2"/>
    </g>
  </g>
  <g transform="translate(600 292)">
    <circle r="60" fill="#e9e8f8"/>
    <g class="icon" stroke="#4f46b8">
      <rect x="-29" y="-37" width="58" height="76" rx="8" fill="#fff"/>
      <rect x="-14" y="-42" width="28" height="12" rx="5" fill="#e9e8f8"/>
      <path d="m-18-12 4 4 8-8M5-11h13m-36 19 4 4 8-8M5 9h13m-36 17h12M5 26h13"/>
      <circle cx="33" cy="30" r="17" fill="#4f46b8" stroke="#f7f8fc" stroke-width="4"/>
      <path d="m26 30 5 5 9-10" stroke="#fff" stroke-width="2.5"/>
    </g>
  </g>
  <g transform="translate(970 292)">
    <circle r="60" fill="#e1f2ef"/>
    <g class="icon" stroke="#087f7a">
      <path d="M-23 38v-76m0 2c18-10 34 11 56 0v43c-22 11-38-10-56 0" fill="#fff"/>
      <path d="M-37 38h29m2-46 8 8 14-17"/>
