<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title description">
  <title id="title">Tu ruta hacia la certificación</title>
  <desc id="description">Tres etapas: estudiar los seis temas, practicar y revisar los errores, y rendir el examen oficial de Oracle. La práctica devuelve al estudio los temas que requieren refuerzo; la credencial la emite Oracle.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#675f59"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#17665e"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#252321}
      .title{font-size:30px;font-weight:700}
      .subtitle{font-size:20px;fill:#675f59}
      .label{font-size:23px;font-weight:700}
      .body{font-size:20px}
      .small{font-size:18px;fill:#675f59}
      .white{fill:#fff}
      .red{fill:#b43d32}
      .teal{fill:#17665e}
      .card{fill:#fff;stroke:#d9d0c7;stroke-width:2}
      .line{fill:none;stroke:#675f59;stroke-width:2.5;marker-end:url(#arrow)}
      .return{fill:none;stroke:#17665e;stroke-width:2.5;marker-end:url(#arrow-teal)}
    </style>
  </defs>
  <rect width="1000" height="640" fill="#faf8f5"/>

  <text x="40" y="50" class="title">De comprender a demostrar</text>
  <text x="40" y="86" class="subtitle">Una ruta de estudio; la evaluación y la credencial pertenecen a Oracle.</text>
  <rect x="40" y="132" width="270" height="270" rx="20" class="card"/>
  <rect x="365" y="132" width="270" height="270" rx="20" class="card"/>
  <rect x="690" y="132" width="270" height="270" rx="20" class="card"/>
  <circle cx="79" cy="177" r="24" fill="#b43d32"/><text x="79" y="185" text-anchor="middle" class="label white">1</text>
  <circle cx="404" cy="177" r="24" fill="#b43d32"/><text x="404" y="185" text-anchor="middle" class="label white">2</text>
  <circle cx="729" cy="177" r="24" fill="#17665e"/><text x="729" y="185" text-anchor="middle" class="label white">3</text>
  <text x="64" y="236" class="label">Estudiar</text>
  <text x="64" y="281" class="body"><tspan x="64">Entiende los seis temas.</tspan><tspan x="64" dy="30">Relaciona cada concepto</tspan><tspan x="64" dy="30">con un caso concreto.</tspan></text>
  <text x="389" y="236" class="label">Practicar</text>
  <text x="389" y="281" class="body"><tspan x="389">Responde sin ayuda.</tspan><tspan x="389" dy="30">Explica cada alternativa.</tspan><tspan x="389" dy="30">Refuerza tus errores.</tspan></text>
  <text x="714" y="236" class="label">Examen oficial</text>
  <text x="714" y="281" class="body"><tspan x="714">Consulta los requisitos.</tspan><tspan x="714" dy="30">Accede desde MyLearn.</tspan><tspan x="714" dy="30">Demuestra lo aprendido.</tspan></text>
  <path d="M 317 267 H 353" class="line"/>
  <path d="M 642 267 H 678" class="line"/>
  <path d="M 501 405 V 470 H 176 V 417" class="return"/>
  <rect x="197" y="450" width="282" height="40" rx="20" fill="#e4eeeb"/>
  <text x="338" y="476" text-anchor="middle" class="body teal">Volver a los temas débiles</text>
  <path d="M 825 404 V 470" class="line"/>
  <rect x="690" y="487" width="270" height="64" rx="16" fill="#17665e"/>
  <text x="825" y="526" text-anchor="middle" class="label white">Credencial de Oracle</text>
  <text x="40" y="602" class="small">La puntuación de práctica orienta el repaso; no garantiza aprobar el examen.</text>
</svg>
