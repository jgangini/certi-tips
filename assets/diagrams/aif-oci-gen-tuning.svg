<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="tuning-hosting">
<title id="title">Entrenar y servir usan recursos distintos</title>
<desc id="description">En fase de fine-tuning los ejemplos en Object Storage alimentan un cluster de entrenamiento y producen un modelo personalizado. Una fase separada de hosting usa cómputo y endpoint para servir inferencia.</desc>
