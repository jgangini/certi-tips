-anchor="middle"><tspan x="420" y="568.8">07:00</tspan></text><rect x="160" y="610" width="520" height="96" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="note" data-cell-align="center"><rect x="160" y="610" width="520" height="96" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="420.0" y="650.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="420.0" y="650.8">Último estado mínimo </tspan><tspan x="420.0" y="686.8">que debe poder recuperarse</tspan></text></g></g><line x1="420" y1="582" x2="420" y2="610" stroke="#59616E" stroke-width="3" /><line x1="800" y1="446" x2="800" y2="510" stroke="#59616E" stroke-width="3" /><circle cx="800" cy="510" r="8" fill="#59616E" /><rect x="753.85" y="534" width="92.3" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="800" y="568.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="800" y="568.8">08:00</tspan></text><rect x="732.1015625" y="654" width="135.796875" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="800" y="688.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="800" y="688.8">Incidente</tspan></text><line x1="800" y1="582" x2="800" y2="638" stroke="#59616E" stroke-width="3" /><line x1="1560" y1="446" x2="1560" y2="510" stroke="#59616E" stroke-width="3" /><circle cx="1560" cy="510" r="8" fill="#59616E" /><rect x="1513.85" y="534" width="92.3" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1560" y="568.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1560" y="568.8">10:00</tspan></text><rect x="1300" y="610" width="520" height="96" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="note" data-cell-align="center"><rect x="1300" y="610" width="520" height="96" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1560.0" y="650.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1560.0" y="650.8">Límite objetivo </tspan><tspan x="1560.0" y="686.8">de recuperación</tspan></text></g></g><line x1="1560" y1="582" x2="1560" y2="610" stroke="#59616E" stroke-width="3" /></g></g></svg>
