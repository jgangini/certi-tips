<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">RPO y RTO: Dos Límites Distintos</title><desc id="description">Los objetivos ilustrativos separan pérdida de datos y tiempo de recuperación. Ante un incidente a las 08:00, un RPO de una hora exige recuperar al menos el estado de las 07:00. Un RTO de dos horas fija las 10:00 como límite objetivo para recuperar el servicio. Comprueba ambos mediante evidencia de estados recuperables y ensayos; disponer de un respaldo no demuestra por sí solo que se cumplen.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">RPO y RTO: Dos Límites Distintos</tspan></text><text x="96" y="232.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="96" y="232.27">OBJETIVOS DE HORIZONTE</tspan></text><rect x="420" y="366" width="420" height="220" rx="0" fill="#00B0F0" stroke="#3C4545" stroke-width="3"/><rect x="840" y="366" width="840" height="220" rx="0" fill="#749B6B" stroke="#3C4545" stroke-width="3"/><text x="630" y="430.23" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="630" y="430.23">RPO</tspan></text><text x="630" y="499.07" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="630" y="499.07">≤ 1 hora</tspan></text><text x="1260" y="430.23" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1260" y="430.23">RTO</tspan></text><text x="1260" y="499.07" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1260" y="499.07">≤ 2 horas</tspan></text><line x1="168" y1="586" x2="1790" y2="586" stroke="#3C4545" stroke-width="4"/><path d="M1790 586 L1774 594 L1774 578 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><circle cx="420" cy="586" r="13" fill="#3C4545" stroke="#3C4545" stroke-width="2"/><text x="420" y="655.91" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="420" y="655.91">07:00</tspan></text><circle cx="840" cy="586" r="13" fill="#C74634" stroke="#C74634" stroke-width="2"/><text x="840" y="655.91" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="840" y="655.91">08:00</tspan></text><circle cx="1680" cy="586" r="13" fill="#3C4545" stroke="#3C4545" stroke-width="2"/><text x="1680" y="655.91" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="1680" y="655.91">10:00</tspan></text><rect x="147" y="707" width="546" height="127" rx="0" fill="none" stroke="#697778" stroke-width="2"/><line x1="420" y1="678" x2="420" y2="707" stroke="#3C4545" stroke-width="3"/><rect x="1400" y="707" width="470" height="127" rx="0" fill="none" stroke="#697778" stroke-width="2"/><line x1="1680" y1="678" x2="1680" y2="707" stroke="#3C4545" stroke-width="3"/><text x="420" y="751.145" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="420" y="751.145">Último estado mínimo </tspan><tspan x="420" y="789.395">que debe poder recuperarse</tspan></text><text x="840" y="857.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="middle"><tspan x="840" y="857.59">Incidente</tspan></text><line x1="840" y1="684" x2="840" y2="815" stroke="#C74634" stroke-width="3"/><text x="1650" y="751.145" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1650" y="751.145">Límite objetivo </tspan><tspan x="1650" y="789.395">de recuperación</tspan></text></g></svg>
