<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">RPO y RTO: Dos Límites Distintos</title><desc id="description">Los objetivos ilustrativos separan pérdida de datos y tiempo de recuperación. Ante un incidente a las 08:00, un RPO de una hora exige recuperar al menos el estado de las 07:00. Un RTO de dos horas fija las 10:00 como límite objetivo para recuperar el servicio. Comprueba ambos mediante evidencia de estados recuperables y ensayos; disponer de un respaldo no demuestra por sí solo que se cumplen.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">RPO y RTO: Dos Límites Distintos</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(-30 140)"><rect x="790.1" y="230" width="339.8" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="960" y="264.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="960" y="264.8">OBJETIVOS DE HORIZONTE</tspan></text><rect x="420" y="330" width="380" height="116" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M432 330 H788 Q800 330 800 342 V394 H420 V342 Q420 330 432 330 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="420" y="330" width="380" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="444" y="372.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-a