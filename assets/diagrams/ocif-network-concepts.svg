<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Una entrada pública, servidores privados</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Las subredes separan rangos y controles dentro de la VCN.</text><rect x="70" y="162" width="1060" height="385" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><text x="600" y="197" font-size="25" fill="#4f46b8" font-weight="700" text-anchor="middle">VCN regional · 10.0.0.0/16</text><rect x="104" y="239" width="428" height="266" rx="18" fill="url(#coral)" stroke="#c74436" stroke-width="1.5"/><text x="318" y="274" font-size="25" fill="#c74436" font-weight="700" text-anchor="middle">Pública · 10.0.1.0/24</text><rect x="650" y="239" width="440" height="266" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><text x="870" y="274" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle">Privada · 10.0.2.0/24</text><g data-layout="icon-label"><g data-artwork="true"><use data-icon="network" href="#network" x="278" y="312" width="76" height="76" color="#c74436"/></g><text x="316" y="423" font-size="24" fill="#17243b" font-weight="400" text-anchor="middle">Entrada del balanceador</text></g><g data-layout="centered-card"><rect x="692" y="337" width="150" height="112" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><g data-layout="icon-label"><g data-artwork="true"><use data-icon="server" href="#server" x="740" y="345" width="54" height="54" color="#087f7a"/></g><text x="767" y="422" font-size="22" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">App 1</text></g></g></g><g data-layout="centered-card"><rect x="891" y="337" width="150" height="112" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><g data-layout="icon-label"><g data-artwork="true"><use data-icon="server" href="#server" x="939" y="345" width="54" height="54" color="#087f7a"/></g><text x="966" y="422" font-size="22" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">App 2</text></g></g></g><path d="M540 373H631" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Una subred pública permite IP pública; no permite todo el tráfico.</text></g>
