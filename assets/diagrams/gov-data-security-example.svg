<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">La Protección Conserva las Relaciones Necesarias</title><desc id="description">Compara el original con el conjunto de prueba. El cliente C7 se sustituye por P7 y el contrato C3 actualiza su referencia al cliente protegido. La factura F42 sigue apuntando a C3 y conserva el importe 100. El recorrido P7 → C3 → F42 permite verificar que la protección de identidad mantiene las relaciones y la conciliación requeridas para la prueba.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">La Protección Conserva las Relaciones Necesarias</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 72)"><rect x="402.45" y="290" width="145.1" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="475" y="324.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="475" y="324.8">ORIGINAL</tspan></text><rect x="1294.9109375" y="290" width="300.178125" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1445" y="324.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1445" y="324.8">CONJUNTO DE PRUEBA</tspan></text><rect x="110" y="388" width="730" height="220" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M122 388 H828 Q840 388 840 400 V452 H110 V400 Q110 388 122 388 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g