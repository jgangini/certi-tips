<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">La Protección Conserva las Relaciones Necesarias</title><desc id="description">Compara el original con el conjunto de prueba. El cliente C7 se sustituye por P7 y el contrato C3 actualiza su referencia al cliente protegido. La factura F42 sigue apuntando a C3 y conserva el importe 100. El recorrido P7 → C3 → F42 permite verificar que la protección de identidad mantiene las relaciones y la conciliación requeridas para la prueba.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">La Protección Conserva las Relaciones Necesarias</tspan></text><text x="96" y="230.59" font-size="25.5" fill="#181818" font-weight="700" text-anchor="start"><tspan x="96" y="230.59">ORIGINAL</tspan></text><rect x="96" y="292" width="756" height="454" rx="0" fill="#FFFFFF" stroke="#3C4545" stroke-width="3"/><rect x="96" y="292" width="756" height="106" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="292" width="756" height="6" rx="0" fill="#2E5C70" stroke="none" stroke-width="2"/><text x="183.5" y="354.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="183.5" y="354.27">Entidad</tspan></text><text x="326.5" y="354.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="326.5" y="354.27">Clave</tspan></text><text x="497.0" y="354.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="497.0" y="354.27">Relación</tspan></text><text x="732.0" y="354.27" font-size="25.5" fill="#181818" font-weight="700" text-anchor="middle"><tspan x="732.0" y="354.27">Valor</ts