<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 665" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="recurrent-memory">
<title id="title">Una secuencia necesita recordar el orden</title>
<desc id="description">RNN transmite el estado de El a motor y a falla. LSTM mantiene una línea de memoria con compuertas de olvido, entrada y salida.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="665" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Una secuencia necesita recordar el orden</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">RNN transporta estado; LSTM añade compuertas para regular la memoria.</text><rect x="56" y="154" width="150" height="42" rx="21" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="131" y="182" font-size="21" fill="#c74436" font-weight="600" text-anchor="middle">RNN</text><text x="232" y="181" font-size="23" fill="#536078" font-weight="400" text-anchor="start">El estado pasa al siguiente instante</text><rect x="220" y="211" width="130" height="74" rx="18" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="285" y="258" font-size="29" fill="#c74436" font-weight="700" text-anchor="middle">h0</text><text x="285" y="329" font-size="25" fill="#17243b" font-weight="600" text-anchor="middle">El</text><path d="M361 248H522" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><text x="441" y="228" font-size="20" fill="#536078" font-weight="400" text-anchor="middle">estado</text><rect x="535" y="211" width="130" height="74" rx="18" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="600" y="258" font-size="29" fill="#c74436" font-weight="700" text-anchor="middle">h1</text><text x="600" y="329" font-size="25" fill="#17243b" font-weight="600" text-anchor="middle">motor</text><path d="M676 248H837" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><text x="756" y="228" font-size="20" fill="#536078" font-weight="400" text-anchor="middle">estado</text><rect x="850" y="211" width="130" height="74" rx="18" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="915" y="258" font-size="29" fill="#c74436" font-weight="700" text-anchor="middle">h2</text><text x="915" y="329" font-size="25" fill="#17243b" font-weight="600" text-anchor="middle">falla</text><path d="M56 364L1144 364" fill="none" stroke="#dce1ec" stroke-width="1.5"/><rect x="56" y="392" width="150" height="42" rx="21" fill="url(#indigo)" stroke="none" stroke-width="1.5"/><text x="131" y="420" font-size="21" fill="#4f46b8" font-weight="600" text-anchor="middle">LSTM</text><text x="232" y="419" font-size="23" fill="#536078" font-weight="400" text-anchor="start">La celda regula qué información conservar</text><path d="M145 481H1117" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><circle cx="300" cy="481" r="27" fill="#fff" stroke="#4f46b8" stroke-width="2"/><text x="300" y="491" font-size="30" fill="#4f46b8" font-weight="700" text-anchor="middle">×</text><text x="300" y="541" font-size="25" fill="#17243b" font-weight="600" text-anchor="middle">Olvidar</text><circle cx="620" cy="481" r="27" fill="#fff" stroke="#4f46b8" stroke-width="2"/><text x="620" y="491" font-size="30" fill="#4f46b8" font-weight="700" text-anchor="middle">+</text><text x="620" y="541" font-size="25" fill="#17243b" font-weight="600" text-anchor="middle">Incorporar</text><circle cx="940" cy="481" r="27" fill="#fff" stroke="#4f46b8" stroke-width="2"/><text x="940" y="491" font-size="30" fill="#4f46b8" font-weight="700" text-anchor="middle">×</text><text x="940" y="541" font-size="25" fill="#17243b" font-weight="600" text-anchor="middle">Exponer</text><rect x="56" y="591" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="625" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">La memoria ayuda con dependencias largas; también tiene límites.</text></g>
</svg>
