<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">El Control se Cierra Cuando Mejora el Origen</title><desc id="description">El control encuentra 198 claves para 200 filas frente a una exigencia de unicidad del 100 %. Se registra el incidente D-17, se asignan responsables y se corrige la causa en el origen. Después se repite la prueba sobre la misma población y regla y se conserva resultado y decisión. El incidente se cierra cuando la nueva medición demuestra la mejora, no solo cuando se limpia una copia.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">El Control se Cierra Cuando Mejora el Origen</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" transform="translate(-4.447 13.000)" data-center="960 608"><rect x="120" y="275" width="660" height="185" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M132.0 275.0 H768.0 Q780.0 275.0 780.0 287.0 V347.0 H120.0 V287.0 Q120.0 275.0 132.0 275.0 Z" fill="#59616E" stroke="none" data-table-header="true" /><text x="480.0" y="320.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="480.0" y="320.5">1 · DETECTAR</tspan></text><text x="155" y="386.942" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="155" y="386.942">Control de unicidad </tspan><tspan x="155" y="423.598">200 filas / 198 claves</tspan></text><g data-svgrepo-icon="audit" transform="translate(148 295) scale(1.83333)" color="#FFFFFF" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
