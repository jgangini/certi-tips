<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Cuatro capacidades alrededor de Oracle AI Database</title>
  <desc id="description">Una base de datos central se conecta a cuatro capacidades distintas. AI Vector Search recupera contenido por similitud. Select AI Agent orquesta herramientas, tareas, agentes y equipos. Private Agent Factory permite construir agentes y flujos visualmente. El servidor MCP de Autonomous AI Database expone herramientas a clientes compatibles. El mapa no supone que todas las capacidades estén disponibles en cualquier edición, versión o despliegue. Los controles de datos e identidad siguen aplicando.</desc>
  <defs>
    <linearGradient id="database-body" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34356f"/><stop offset=".6" stop-color="#4f46b8"/><stop offset="1" stop-color="#6558bd"/></linearGradient>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}.title{font-size:34px;font-weight:700}.subtitle{font-size:21px;fill:#536078}.label{font-size:24px;font-weight:700}.body{font-size:21px}.meta{font-size:21px;fill:#536078}.muted{fill:#536078}.white{fill:#fff}.coral{fill:#c74436}.teal{fill:#087f7a}.indigo{fill:#4f46b8}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#f7f8fc"/>
  <g transform="translate(0 -50)">
  <text x="56" y="98" class="title">Una base de datos. Cuatro trabajos diferentes.</text>
  <text x="56" y="134" class="subtitle">Elige la capacidad por la tarea: recuperar, orquestar, construir o conectar.</text>
  <!-- Four purpose-specific branches surround the shared data foundation. -->
  <path d="M465 348C419 348 434 283 384 283" fill="none" stroke="#4f46b8" stroke-width="3"/>
  <path d="M735 348C781 348 766 283 816 283" fill="none" stroke="#087f7a" stroke-width="3"/>
  <path d="M465 430C419 430 434 557 384 557" fill="none" stroke="#c74436" stroke-width="3"/>
  <path d="M735 430C781 430 766 557 816 557" fill="none" stroke="#4f46b8" stroke-width="3"/>
  <g fill="#f7f8fc" stroke-width="3"><circle cx="384" cy="283" r="6" stroke="#4f46b8"/><circle cx="816" cy="283" r="6" stroke="#087f7a"/><circle cx="384" cy="557" r="6" stroke="#c74436"/><circle cx="816" cy="557" r="6" stroke="#4f46b8"/></g>
  <!-- A semantic neighbourhood, not a generic database icon. -->
  <circle cx="330" cy="265" r="55" fill="#ebe8f9"/>
  <path d="m311 279 22-26 26 16m-26-16 7 35" stroke="#8e85cb" stroke-width="2"/>
  <circle cx="311" cy="279" r="7" fill="#4f46b8"/><circle cx="333" cy="253" r="8" fill="#4f46b8"/><circle cx="359" cy="269" r="7" fill="#4f46b8"/><circle cx="340" cy="288" r="7" fill="#4f46b8"/>
  <circle cx="298" cy="240" r="4" fill="#aaa4d7"/><circle cx="355" cy="232" r="4" fill="#aaa4d7"/><circle cx="307" cy="302" r="4" fill="#aaa4d7"/>
  <text x="56" y="215" class="meta indigo" font-weight="700">RECUPERAR</text>
  <text x="56" y="250" class="label">AI Vector</text><text x="56" y="288" class="label">Search</text>
  <text x="56" y="327" class="body">Busca contenido</text><text x="56" y="355" class="body">por similitud.</text>
  <g transform="translate(870 265)"><circle r="55" fill="#dff1eb"/><g transform="translate(-30 -30) scale(2.5)" fill="none" stroke="#087f7a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3M12 12V8"/></g></g>
  <text x="946" y="215" class="meta teal" font-weight="700">ORQUESTAR</text>
  <text x="946" y="250" class="label">Select AI</text><text x="946" y="288" class="label">Agent</text>
  <text x="946" y="327" class="body">Coordina tareas,</text><text x="946" y="355" class="body">tools y equipos.</text>
  <!-- This cylinder anchors the map; it does not imply LLM weights execute inside the database. -->
  <ellipse cx="600" cy="508" rx="134" ry="22" fill="#e1e2f0"/>
  <path d="M465 326v139c0 24 60 43 135 43s135-19 135-43V326Z" fill="url(#database-body)"/>
  <ellipse cx="600" cy="326" rx="135" ry="43" fill="#8b82d6"/>
  <ellipse cx="600" cy="321" rx="105" ry="25" fill="#b7afe8"/>
  <path d="M465 371c0 24 60 43 135 43s135-19 135-43M465 417c0 24 60 43 135 43s135-19 135-43" fill="none" stroke="#a49de1" stroke-width="1.3" opacity=".55"/>
  <rect x="494" y="371" width="212" height="79" rx="16" fill="#333269"/>
  <text x="600" y="402" text-anchor="middle" class="label white">Oracle AI</text><text x="600" y="434" text-anchor="middle" class="label white">Database</text>
  <text x="600" y="554" text-anchor="middle" class="meta">Datos + controles de acceso</text>
  <g transform="translate(330 563)"><circle r="55" fill="#fae6e2"/><g transform="translate(-30 -30) scale(2.5)" fill="none" stroke="#c74436" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 22V7a1 1 0 0 0-1-1H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5a1 1 0 0 0-1-1H2"/><rect x="14" y="2" width="8" height="8" rx="1"/></g></g>
  <text x="56" y="492" class="meta coral" font-weight="700">CONSTRUIR</text>
  <text x="56" y="527" class="label">Private Agent</text><text x="56" y="565" class="label">Factory</text>
  <text x="56" y="604" class="body">Ensambla agentes</text><text x="56" y="632" class="body">y flujos visuales.</text>
  <g transform="translate(870 563)"><circle r="55" fill="#ebe8f9"/><g transform="translate(-30 -30) scale(2.5)" fill="none" stroke="#4f46b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5M15 8V2M17 8a1 1 0 0 1 1 1v4a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1zM9 8V2"/></g></g>
  <text x="946" y="492" class="meta indigo" font-weight="700">CONECTAR</text>
  <text x="946" y="527" class="label">Servidor MCP</text><text x="946" y="555" class="meta">Autonomous</text>
  <text x="946" y="604" class="body">Expone tools a</text><text x="946" y="632" class="body">clientes de IA.</text>
  </g>
</svg>
