<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title description">
  <title id="title">Capacidades de Oracle AI Database</title>
  <desc id="description">Cuatro capacidades con propósitos distintos: AI Vector Search recupera por similitud; Select AI usa lenguaje natural para trabajar con datos según el perfil y modo configurados; Private Agent Factory permite crear flujos de agentes en su entorno; el servidor MCP de Autonomous AI Database expone capacidades a clientes MCP. No son nombres intercambiables.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#675f59"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#17665e"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#252321}
      .title{font-size:30px;font-weight:700}
      .subtitle{font-size:20px;fill:#675f59}
      .label{font-size:23px;font-weight:700}
      .body{font-size:20px}
      .small{font-size:18px;fill:#675f59}
      .white{fill:#fff}
      .red{fill:#b43d32}
      .teal{fill:#17665e}
      .card{fill:#fff;stroke:#d9d0c7;stroke-width:2}
      .line{fill:none;stroke:#675f59;stroke-width:2.5;marker-end:url(#arrow)}
      .return{fill:none;stroke:#17665e;stroke-width:2.5;marker-end:url(#arrow-teal)}
    </style>
  </defs>
  <rect width="1000" height="680" fill="#faf8f5"/>

  <text x="40" y="50" class="title">Cuatro capacidades, cuatro preguntas</text>
  <text x="40" y="86" class="subtitle">Elige según la tarea; comprueba versión, servicio y configuración disponibles.</text>
  <rect x="40" y="123" width="446" height="215" rx="20" class="card"/>
  <rect x="514" y="123" width="446" height="215" rx="20" class="card"/>
  <rect x="40" y="359" width="446" height="215" rx="20" class="card"/>
  <rect x="514" y="359" width="446" height="215" rx="20" class="card"/>
  <rect x="40" y="123" width="9" height="215" rx="4" fill="#b43d32"/>
  <rect x="514" y="123" width="9" height="215" rx="4" fill="#17665e"/>
  <rect x="40" y="359" width="9" height="215" rx="4" fill="#17665e"/>
  <rect x="514" y="359" width="9" height="215" rx="4" fill="#b43d32"/>
  <text x="68" y="168" class="label">AI Vector Search</text>
  <text x="68" y="209" class="body red">¿Qué contenido es semánticamente similar?</text>
  <text x="68" y="254" class="body"><tspan x="68">Compara embeddings y recupera datos.</tspan><tspan x="68" dy="29">Útil para búsqueda semántica y RAG.</tspan></text>
  <text x="68" y="317" class="small">No redacta por sí solo una respuesta.</text>
  <text x="543" y="168" class="label">Select AI / Select AI Agent</text>
  <text x="543" y="209" class="body teal">¿Cómo consultar o actuar con lenguaje?</text>
  <text x="543" y="254" class="body"><tspan x="543">Consulta datos con lenguaje natural.</tspan><tspan x="543" dy="29">Agent coordina tareas y herramientas.</tspan></text>
  <text x="543" y="317" class="small">Configura perfiles, herramientas y privilegios.</text>
  <text x="68" y="405" class="label">Private Agent Factory</text>
  <text x="68" y="446" class="body teal">¿Cómo construir flujos de agentes?</text>
  <text x="68" y="491" class="body"><tspan x="68">Entorno visual para crear y operar agentes</tspan><tspan x="68" dy="29">con datos y herramientas del entorno.</tspan></text>
  <text x="68" y="554" class="small">Verifica el despliegue y la versión soportados.</text>
  <text x="543" y="405" class="label">Autonomous AI Database MCP</text>
  <text x="543" y="446" class="body red">¿Cómo conectar un cliente de IA a la BD?</text>
  <text x="543" y="491" class="body"><tspan x="543">Expone capacidades mediante MCP.</tspan><tspan x="543" dy="29">El cliente las descubre y las invoca.</tspan></text>
  <text x="543" y="554" class="small">MCP no elimina los controles de acceso.</text>
  <rect x="40" y="598" width="920" height="52" rx="13" fill="#eee9e3"/>
  <text x="500" y="631" text-anchor="middle" class="body">Relacionadas, pero diferentes: recuperar · consultar/actuar · construir · conectar</text>
</svg>
