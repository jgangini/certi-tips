<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Un gateway para cada destino</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Esquema de selección; cada conexión necesita configuración adicional.</text><g data-layout="centered-card"><rect x="56" y="275" width="207" height="173" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><g data-card-content="true"><g data-layout="icon-label"><text x="159.5" y="331.5" font-size="25" fill="#4f46b8" font-weight="700" text-anchor="middle" dominant-baseline="central">VCN</text><g data-artwork="true"><use data-icon="network" href="#network" x="131" y="357" width="57" height="57" color="#4f46b8"/></g></g></g></g><path d="M275 360H326V213.5H397" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><g data-layout="centered-card"><rect x="419" y="178" width="307" height="71" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><g data-card-content="true"><text x="572.5" y="213.5" font-size="25" fill="#4f46b8" font-weight="700" text-anchor="middle" dominant-baseline="central">Internet Gateway</text></g></g><path d="M746 213.5H798" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="825" y="216" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">Internet · IP pública</text><path d="M275 360H326V316.5H397" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><g data-layout="centered-card"><rect x="419" y="281" width="307" height="71" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><g data-card-content="true"><text x="572.5" y="316.5" font-size="25" fill="#4f46b8" font-weight="700" text-anchor="middle" dominant-baseline="central">NAT Gateway</text></g></g><path d="M746 316.5H798" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="825" y="319" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">Internet · salida privada</text><path d="M275 360H326V419.5H397" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><g data-layout="centered-card"><rect x="419" y="384" width="307" height="71" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><text x="572.5" y="419.5" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle" dominant-baseline="central">Service Gateway</text></g></g><path d="M746 419.5H798" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="825" y="422" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">Servicios Oracle compatibles</text><path d="M275 360H326V522.5H397" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><g data-layout="centered-card"><rect x="419" y="487" width="307" height="71" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><g data-card-content="true"><text x="572.5" y="522.5" font-size="25" fill="#4f46b8" font-weight="700" text-anchor="middle" dominant-baseline="central">DRG</text></g></g><path d="M746 522.5H798" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="825" y="525" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">Otras redes / on-premises</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Las rutas eligen el camino; las reglas deciden el tráfico permitido.</text></g>
