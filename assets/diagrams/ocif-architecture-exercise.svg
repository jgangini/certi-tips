oke="#087f7a" stroke-width="1.5"/><text x="792" y="291" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle">FD 1</text><rect x="916" y="256" width="204" height="218" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><text x="1018" y="291" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle">FD 2</text><g data-layout="centered-card"><rect x="717" y="322" width="150" height="112" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><g data-layout="icon-label"><g data-artwork="true"><use data-icon="server" href="#server" x="765" y="330" width="54" height="54" color="#087f7a"/></g><text x="792" y="407" font-size="22" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">VM A</text></g></g></g><g data-layout="centered-card"><rect x="943" y="322" width="150" height="112" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><g data-layout="icon-label"><g data-artwork="true"><use data-icon="server" href="#server" x="991" y="330" width="54" height="54" color="#087f7a"/></g><text x="1018" y="407" font-size="22" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">VM B</text></g></g></g><path d="M560 353H643" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Mejora la separación de hardware; el AD sigue siendo compartido.</text></g>
