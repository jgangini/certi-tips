<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-design-audit="08-11-compact"><title id="title">Procedencia e Impacto Recorren el Mismo Grafo</title><desc id="description">El grafo enlaza contratos de origen, regla R-07, métrica de clientes activos y contexto de atención. Recorre hacia atrás para estudiar procedencia y hacia delante para analizar impacto. La hoja exportada está fuera del alcance capturado. El propietario aprueba significado, el steward enlaza término y regla y el ingeniero conserva evidencia técnica; declara cobertura antes de atribuir relaciones al grafo.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Procedencia e Impacto Recorren el Mismo Grafo</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 29)"><rect x="96" y="240" width="1728" height="388" rx="16" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><rect x="813.0" y="264" width="294" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="960" y="298.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="960" y="298.8">ALCANCE CAPTURADO</tspan></text><rect x="144" y="412" width="336" height="92" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="note" data-cell-align="center"><rect x="144" y="412" width="336" height="92" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="312.0" y="451.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="312.0" y="451.8">Contrato