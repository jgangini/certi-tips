<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="vector-versus-sql">
<title id="title">¿Necesitas significado o un cálculo sobre filas?</title>
<desc id="description">Vector Search busca documentos cercanos a una consulta representada en el mismo espacio de embeddings y aplica filtros. Select AI interpreta lenguaje natural sobre un esquema autorizado para realizar una consulta SQL y agregaciones.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v14H8l-5 5zM7 7h10M7 11h7"/></symbol><symbol id="table" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 9h20M2 15h20M9 3v18M16 9v12"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">¿Necesitas significado o un cálculo sobre filas?</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Oracle AI Database puede combinar vectores y datos relacionales.</text><rect x="56" y="160" width="526" height="370" rx="24" fill="#fff" stroke="#dce1ec" stroke-width="1.5"/><rect x="618" y="160" width="526" height="370" rx="24" fill="#fff" stroke="#dce1ec" stroke-width="1.5"/><text x="319" y="206" font-size="29" fill="#17243b" font-weight="700" text-anchor="middle">AI Vector Search</text><text x="881" y="206" font-size="29" fill="#17243b" font-weight="700" text-anchor="middle">Select AI</text><g data-visual="scatterplot"><path d="M123 379L274 379" fill="none" stroke="#536078" stroke-width="2.5"/><path d="M123 379L123 249" fill="none" stroke="#536078" stroke-width="2.5"/><circle cx="153.2" cy="353" r="6" fill="#4f46b8" stroke="none" stroke-width="2"/><circle cx="228.7" cy="288" r="6" fill="#4f46b8" stroke="none" stroke-width="2"/><circle cx="225.68" cy="301" r="6" fill="#4f46b8" stroke="none" stroke-width="2"/><circle cx="243.8" cy="294.5" r="6" fill="#4f46b8" stroke="none" stroke-width="2"/><circle cx="138.1" cy="275" r="6" fill="#4f46b8" stroke="none" stroke-width="2"/></g><circle cx="227" cy="287" r="42" fill="none" stroke="#087f7a" stroke-width="2"/><path d="M297 318H347" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><rect x="380" y="266" width="91" height="121" rx="12" fill="#e9eaf1" stroke="none" stroke-width="1.5"/><rect x="372" y="259" width="91" height="121" rx="12" fill="#fff" stroke="#087f7a" stroke-width="1.5"/><path d="M392 297L443 297" fill="none" stroke="#087f7a" stroke-width="3"/><path d="M392 320L443 320" fill="none" stroke="#087f7a" stroke-width="3"/><path d="M392 343L425 343" fill="none" stroke="#087f7a" stroke-width="3"/><text x="319" y="443" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">«Busca instrucciones parecidas»</text><text x="319" y="475" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Recupera por similitud + filtros</text><use data-icon="chat" href="#chat" x="686" y="285" width="60" height="60" color="#c74436"/><path d="M758 315H800" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><use data-icon="table" href="#table" x="826.5" y="279.5" width="71" height="71" color="#4f46b8"/><path d="M911 315H966" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="1050" y="326" font-size="49" fill="#087f7a" font-weight="700" text-anchor="middle">Σ</text><text x="881" y="443" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">«Suma reparaciones por sede»</text><text x="881" y="475" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Genera y ejecuta SQL autorizado</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Similitud semántica y consulta estructurada resuelven preguntas diferentes.</text></g>
</svg>
