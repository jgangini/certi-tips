<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" role="img" aria-labelledby="title description">
  <title id="title">El protocolo une; cada parte conserva su función</title>
  <desc id="description">El host gestiona interacción, contexto y permisos e incluye el cliente MCP. El cliente mantiene una conexión y envía mensajes al servidor. El servidor publica y ejecuta capacidades autorizadas. Compatibilidad requiere protocolo, transporte y autenticación compatibles.</desc>
  <defs>
    <!-- Lucide icons, ISC. See assets/icons/LICENSE-lucide.txt. -->
    <symbol id="app-window" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 4v4M2 8h20M6 4v4"/></symbol>
    <symbol id="plug" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5M15 8V2M17 8a1 1 0 0 1 1 1v4a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1zM9 8V2"/></symbol>
    <symbol id="server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><path d="M6 6h.01M6 18h.01"/></symbol>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}
      .title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}
      .body{font-size:22px;fill:#536078}.mono{font-family:Consolas,monospace;font-size:22px;fill:#536078}
      .card{fill:#fff;stroke:#dce1eb;stroke-width:1.5}
      .connector{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .bidirectional{marker-start:url(#arrow)}.divider{stroke:#dce1eb;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="624" fill="#f7f8fc"/>
  <text x="56" y="64" class="title" text-anchor="start">El protocolo une; cada parte conserva su función</text>
  <g class="icon-badge" data-icon="app-window"><circle cx="220" cy="199" r="48" fill="#fae6e1"/><use href="#app-window" x="194" y="173" width="52" height="52" color="#c74436"/></g>
  <g class="icon-badge" data-icon="plug"><circle cx="600" cy="199" r="48" fill="#e9e6fa"/><use href="#plug" x="574" y="173" width="52" height="52" color="#4f46b8"/></g>
  <g class="icon-badge" data-icon="server"><circle cx="980" cy="199" r="48" fill="#e1f2ee"/><use href="#server" x="954" y="173" width="52" height="52" color="#087f7a"/></g>
  <path d="M268 199H552" class="connector bidirectional"/>
  <text x="410" y="179" class="body" text-anchor="middle">Control local</text>
  <path d="M648 199H932" class="connector bidirectional"/>
  <text x="790" y="179" class="mono" text-anchor="middle">MCP</text>
  <text x="220" y="297" class="label" text-anchor="middle">Host</text>
  <text x="600" y="297" class="label" text-anchor="middle">Cliente</text>
  <text x="980" y="297" class="label" text-anchor="middle">Servidor</text>
  <text x="220" y="342" class="body" text-anchor="middle">Interacción y contexto</text>
  <text x="220" y="375" class="body" text-anchor="middle">Decisiones y controles</text>
  <text x="600" y="342" class="body" text-anchor="middle">Conexión y mensajes</text>
  <text x="600" y="375" class="body" text-anchor="middle">Descubrimiento y llamadas</text>
  <text x="980" y="342" class="body" text-anchor="middle">Capacidades y ejecución</text>
  <text x="980" y="375" class="body" text-anchor="middle">Validación del acceso</text>
  <rect x="76" y="416" width="668" height="44" rx="16" fill="#e9e6fa"/>
  <text x="410" y="445" class="body" text-anchor="middle">El cliente forma parte de la aplicación host.</text>
  <rect x="136" y="494" width="928" height="78" rx="22" class="card"/>
  <text x="600" y="543" class="body" text-anchor="middle">Compatibilidad: protocolo + transporte + autenticación</text>
</svg>
