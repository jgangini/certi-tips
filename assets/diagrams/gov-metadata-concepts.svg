<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-design-audit="08-11-compact"><title id="title">Una Columna Necesita Tres Tipos de Contexto</title><desc id="description">La columna estado_contrato necesita tres clases de contexto. El empresarial define «contrato vigente», propietario y uso. El técnico identifica tipo, columna y regla R-07. El operativo registra ejecución E-308, actualización y resultado del control. Relaciona los tres para interpretar el valor y comprobar cómo se produjo, sin confundir descripción con evidencia de ejecución.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Una Columna Necesita Tres Tipos de Contexto</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 3)"><rect x="96" y="489" width="600" height="136" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M108 489 H684 Q696 489 696 501 V553 H96 V501 Q96 489 108 489 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="start"><rect x="96" y="489" width="600" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="531.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="120" y="531.8">estado_contrato</tspan></text></g></g><g data-table-cell="tag-row" data-cell-align="center"><rect x="96" y="553" width="600" height="72" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><rect x="245.0" y="565" width="302" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" st