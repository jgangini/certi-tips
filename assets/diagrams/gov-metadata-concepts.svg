<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Una Columna Necesita Tres Tipos de Contexto</title><desc id="description">La columna estado_contrato necesita tres clases de contexto. El empresarial define «contrato vigente», propietario y uso. El técnico identifica tipo, columna y regla R-07. El operativo registra ejecución E-308, actualización y resultado del control. Relaciona los tres para interpretar el valor y comprobar cómo se produjo, sin confundir descripción con evidencia de ejecución.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Una Columna Necesita Tres Tipos de Contexto</tspan></text><rect x="100" y="470" width="600" height="180" rx="0" fill="#EEF3F4" stroke="#3C4545" stroke-width="2"/><rect x="100" y="470" width="600" height="6" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><g data-svgrepo-icon="database" transform="translate(129 496) scale(2.16667)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3" />
