<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Tres Catálogos, Tres Alcances Que Comprobar</title><desc id="description">Las filas comparan tres ámbitos: Master Catalog de Oracle AI Data Platform para catálogos, esquemas y activos; el catálogo federado de Oracle Autonomous AI Database para fuentes soportadas; y Oracle AI Data Catalog con interfaz REST de Iceberg. Comprueba objetos, interfaces, compatibilidad y permisos de cada integración. No deduzcas sincronización o acceso compartido por el hecho de que los tres sean catálogos.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Tres Catálogos, Tres Alcances Que Comprobar</tspan></text><rect x="120" y="246" width="1680" height="94" rx="0" fill="#EDF1F2" stroke="#C2D4D4" stroke-width="2"/><rect x="120" y="246" width="1680" height="6" rx="0" fill="#2E5C70" stroke="none" stroke-width="2"/><text x="150" y="304.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="150" y="304.27">PLANO</tspan></text><text x="760" y="304.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="760" y="304.27">OBJETOS Y USO</tspan></text><text x="1250" y="304.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1250" y="304.27">INTERFAZ Y VERIFICACIÓN</tspan></text><rect x="120" y="340" width="1680" height="204" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><rect x="120" y="340" width="6" height="204" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><line x1="730" y1="340" x2="730" y2="544" stroke="#C2D4D4" stroke-width="2"/><line x1="1220" y1="340" x2="1220" y2="544" stroke="#C2D4D4" stroke-width="2"/><rect x="120" y="544" width="1680" height="204" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><rect x="120" y="544" width="6" height="204" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><line x1="730" y1="544" x2="730" y2="748" stroke="#C2D4D4" stroke-width="2"/><line x1="1220" y1="544" x2="1220" y2="748" stroke="#C2D4D4" stroke-width="2"/><rect x="120" y="748" width="1680" height="204" rx="0" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><rect x="120" y="748" width="6" height="204" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><line x1="730" y1="748" x2="730" y2="952" stroke="#C2D4D4" stroke-width="2"/><line x1="1220" y1="748" x2="1220" y2="952" stroke="#C2D4D4" stroke-width="2"/><text x="150" y="396.444" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="150" y="396.444">Master Catalog de </tspan><tspan x="150" y="429.736">Oracle AI Data Platform</tspan></text><text x="760" y="395.942" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="760" y="395.942">Catálogos, esquemas </tspan><tspan x="760" y="432.598">y activos con permisos</tspan></text><text x="1250" y="400.614" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1250" y="400.614">Interfaz de la plataforma </tspan><tspan x="1250" y="437.27">Revisar permisos y alcance </tspan><tspan x="1250" y="473.926">del activo registrado</tspan></text><text x="150" y="607.298" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="150" y="607.298">Catálogo federado de </tspan><tspan x="150" y="640.59">Oracle Autonomous </tspan><tspan x="150" y="673.882">AI Database</tspan></text><text x="760" y="599.942" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="760" y="599.942">Explorar y montar </tspan><tspan x="760" y="636.598">fuentes soportadas</tspan></text><text x="1250" y="604.614" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1250" y="604.614">Data Studio / DBMS_CATALOG </tspan><tspan x="1250" y="641.27">Revisar fuentes soportadas </tspan><tspan x="1250" y="677.926">y controles de acceso</tspan></text><text x="150" y="797.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="150" y="797.59">Oracle AI Data Catalog</tspan></text><text x="760" y="803.942" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="760" y="803.942">Catálogo REST </tspan><tspan x="760" y="840.598">para tablas Iceberg</tspan></text><text x="1250" y="808.614" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1250" y="808.614">Interfaz REST de Iceberg </tspan><tspan x="1250" y="845.27">Revisar compatibilidad </tspan><tspan x="1250" y="881.926">y permisos de integración</tspan></text></g></svg>
