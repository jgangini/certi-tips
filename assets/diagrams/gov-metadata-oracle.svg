<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Tres Catálogos, Tres Alcances Que Comprobar</title><desc id="description">Las filas comparan tres ámbitos: Master Catalog de Oracle AI Data Platform para catálogos, esquemas y activos; el catálogo federado de Oracle Autonomous AI Database para fuentes soportadas; y Oracle AI Data Catalog con interfaz REST de Iceberg. Comprueba objetos, interfaces, compatibilidad y permisos de cada integración. No deduzcas sincronización o acceso compartido por el hecho de que los tres sean catálogos.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Tres Catálogos, Tres Alcances Que Comprobar</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" transform="translate(0.000 9.000)" data-center="960 608"><rect x="120" y="246" width="1680" height="94" rx="0" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><path d="M132.0 246.0 H1788.0 Q1800.0 246.0 1800.0 258.0 V340.0 H120.0 V258.0 Q120.0 246.0 132.0 246.0 Z" fill="#59616E" stroke="none" data-table-header="true" /><text x="425.0" y="302.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="425.0" y="302.5">PLANO</tspan></text><text x="975.0" y="302.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="975.0" y="302.5">OBJETOS Y USO</tspan></text><text x="1510.0" y="302.5" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="1510.0" y="302.5">INTERFAZ Y VERIFICACIÓN</tspan></text><rect x="120" y="340" width="1680" height="204" rx="0" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><line x1="730" y1="340" x2="730" y2="544" stroke="#59616E" stroke-width="2" /><line x1="1220" y1="340" x2="1220" y2="544" stroke="#59616E" stroke-width="2" /><rect x="120" y="544" width="1680" height="204" rx="0" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><line x1="730" y1="544" x2="730" y2="748" stroke="#59616E" stroke-width="2" /><line x1="1220" y1="544" x2="1220" y2="748" stroke="#59616E" stroke-width="2" /><rect x="120" y="748" width="1680" height="204" rx="0" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><line x1="730" y1="748" x2="730" y2="952" stroke="#59616E" stroke-width="2" /><line x1="1220" y1="748" x2="1220" y2="952" stroke="#59616E" stroke-width="2" /><text x="425.0" y="434.5" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="middle"><tspan x="425.0" y="434.5">Master Catalog de </tspan><tspan x="425.0" y="468.5">Oracle AI Data Platform</tspan></text><text x="975.0" y="434.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="975.0" y="434.5">Catálogos, esquemas </tspan><tspan x="975.0" y="468.5">y activos con permisos</tspan></text><text x="1510.0" y="417.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1510.0" y="417.5">Interfaz de la plataforma </tspan><tspan x="1510.0" y="451.5">Revisar permisos y alcance </tspan><tspan x="1510.0" y="485.5">del activo registrado</tspan></text><text x="425.0" y="621.5" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="middle"><tspan x="425.0" y="621.5">Catálogo federado de </tspan><tspan x="425.0" y="655.5">Oracle Autonomous </tspan><tspan x="425.0" y="689.5">AI Database</tspan></text><text x="975.0" y="638.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="975.0" y="638.5">Explorar y montar </tspan><tspan x="975.0" y="672.5">fuentes soportadas</tspan></text><text x="1510.0" y="621.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1510.0" y="621.5">Data Studio / DBMS_CATALOG </tspan><tspan x="1510.0" y="655.5">Revisar fuentes soportadas </tspan><tspan x="1510.0" y="689.5">y controles de acceso</tspan></text><rect x="281.2" y="825.0" width="287.6" height="48" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="425.0" y="859.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="425.0" y="859.5">Oracle AI Data Catalog</tspan></text><text x="975.0" y="842.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="975.0" y="842.5">Catálogo REST </tspan><tspan x="975.0" y="876.5">para tablas Iceberg</tspan></text><text x="1510.0" y="825.5" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1510.0" y="825.5">Interfaz REST de Iceberg </tspan><tspan x="1510.0" y="859.5">Revisar compatibilidad </tspan><tspan x="1510.0" y="893.5">y permisos de integración</tspan></text><rect x="120.0" y="246.0" width="1680.0" height="706.0" rx="12" fill="none" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /></g></g></svg>
