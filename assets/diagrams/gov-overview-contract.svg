<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Contrato del Producto de Datos</title><desc id="description">Negocio acuerda las condiciones del producto e ingeniería y seguridad las implementan. El contrato conecta esas condiciones con tres consumidores: facturación, analítica y atención con IA. La barra inferior reúne la evidencia verificable: definición, versión, resultados y accesos.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Contrato del Producto de Datos</tspan></text><rect x="650" y="272" width="630" height="516" rx="8" fill="#FFFFFF" stroke="none" stroke-width="2"/><path d="M658 272 H1272 Q1280 272 1280 280 V358 H650 V280 Q650 272 658 272 Z" fill="#59616E" stroke="none" stroke-width="3" stroke-linejoin="round"/><rect x="650" y="272" width="630" height="516" rx="8" fill="none" stroke="#59616E" stroke-width="3"/><g data-svgrepo-icon="contract" transform="translate(676 291) scale(2)" color="#FFFFFF" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.364 13.634a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506l4.013-4.009a1 1 0 0 0-3.004-3.004z" />
