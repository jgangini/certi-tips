<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="worked-neuron">
<title id="title">Sigue la señal: dos entradas, una salida</title>
<desc id="description">2 por 0,5 produce 1. 3 por menos 1 produce menos 3. Al sumar bias 1 resulta menos 1. La curva ReLU transforma esa entrada negativa en una salida de 0.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Sigue la señal: dos entradas, una salida</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Multiplica, suma el bias y observa qué hace la activación.</text><circle cx="120" cy="252" r="38" fill="url(#coral)" stroke="none" stroke-width="2"/><text x="120" y="263" font-size="34" fill="#c74436" font-weight="700" text-anchor="middle">2</text><circle cx="120" cy="405" r="38" fill="url(#coral)" stroke="none" stroke-width="2"/><text x="120" y="416" font-size="34" fill="#c74436" font-weight="700" text-anchor="middle">3</text><path d="M163 252H321" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><path d="M163 405H321" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><text x="238" y="227" font-size="26" fill="#c74436" font-weight="600" text-anchor="middle">× 0,5</text><text x="238" y="379" font-size="26" fill="#c74436" font-weight="600" text-anchor="middle">× (−1)</text><circle cx="372" cy="252" r="34" fill="#fff" stroke="#c74436" stroke-width="2"/><text x="372" y="262" font-size="32" fill="#c74436" font-weight="700" text-anchor="middle">1</text><circle cx="372" cy="405" r="34" fill="#fff" stroke="#c74436" stroke-width="2"/><text x="372" y="416" font-size="30" fill="#c74436" font-weight="700" text-anchor="middle">−3</text><path d="M410 252L508 326" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><path d="M410 405L508 326" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><circle cx="579" cy="326" r="64" fill="url(#indigo)" stroke="none" stroke-width="2"/><text x="579" y="341" font-size="50" fill="#4f46b8" font-weight="700" text-anchor="middle">Σ</text><rect x="519" y="176" width="120" height="42" rx="21" fill="url(#indigo)" stroke="none" stroke-width="1.5"/><text x="579" y="204" font-size="21" fill="#4f46b8" font-weight="600" text-anchor="middle">bias +1</text><path d="M579 226V251" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><text x="579" y="457" font-size="29" fill="#17243b" font-weight="700" text-anchor="middle">1 − 3 + 1 = −1</text><path d="M653 326H736" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><g data-visual="relu-curve"><path d="M771 351L992 351" fill="none" stroke="#adb6c8" stroke-width="2"/><path d="M864 402L864 199" fill="none" stroke="#adb6c8" stroke-width="2"/><path d="M777 351H864L983 232" fill="none" stroke="#087f7a" stroke-width="5"/><circle cx="815" cy="351" r="8" fill="#c74436" stroke="none" stroke-width="2"/><text x="814" y="388" font-size="22" fill="#c74436" font-weight="600" text-anchor="middle">−1</text><text x="881" y="388" font-size="22" fill="#536078" font-weight="400" text-anchor="middle">0</text><text x="880" y="183" font-size="28" fill="#087f7a" font-weight="700" text-anchor="middle">ReLU</text></g><path d="M1001 326H1031" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><circle cx="1090" cy="326" r="49" fill="url(#teal)" stroke="none" stroke-width="2"/><text x="1090" y="342" font-size="48" fill="#087f7a" font-weight="700" text-anchor="middle">0</text><text x="1090" y="457" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Salida</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">ReLU(z) = max(0, z): una suma negativa se convierte en cero.</text></g>
</svg>
