<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="storage-errors">
<title id="title">Ampliar el disco no siempre amplía el sistema de archivos</title>
<desc id="description">Ampliar el disco no siempre amplía el sistema de archivos</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Ampliar el disco no siempre amplía el sistema de archivos</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Unidades ilustrativas; Online Resizing aumenta, no reduce, el volumen.</text><rect x="66" y="178" width="495" height="355" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><text x="313.5" y="213" font-size="25" fill="#4f46b8" font-weight="700" text-anchor="middle">Antes</text><rect x="644" y="178" width="495" height="355" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><text x="891.5" y="213" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle">Después de ampliar volumen</text><rect x="103" y="253" width="420" height="215" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><text x="313" y="288" font-size="25" fill="#4f46b8" font-weight="700" text-anchor="middle">Volumen: 100</text><g data-layout="centered-card"><rect x="130" y="326" width="367" height="99" rx="18" fill="url(#coral)" stroke="#c74436" stroke-width="1.5"/><g data-card-content="true"><text x="313.5" y="375.5" font-size="25" fill="#c74436" font-weight="700" text-anchor="middle" dominant-baseline="central">Sistema de archivos: 100</text></g></g><rect x="681" y="253" width="420" height="215" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><text x="891" y="288" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle">Volumen: 200</text><g data-layout="centered-card"><rect x="708" y="326" width="236" height="99" rx="18" fill="url(#coral)" stroke="#c74436" stroke-width="1.5"/><g data-card-content="true"><text x="826" y="375.5" font-size="25" fill="#c74436" font-weight="700" text-anchor="middle" dominant-baseline="central">FS: 100</text></g></g><text x="1026" y="372" font-size="21" fill="#087f7a" font-weight="600" text-anchor="middle">Espacio</text><text x="1026" y="402" font-size="21" fill="#087f7a" font-weight="600" text-anchor="middle">por usar</text><path d="M574 358H628" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Detecta la capacidad y amplía el sistema de archivos cuando corresponda.</text></g>
