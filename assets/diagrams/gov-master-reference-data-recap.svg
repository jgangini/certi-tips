<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Publicar un Maestro Significa Entregar Evidencia</title><desc id="description">El maestro publicado incluye identidad estable, valores por atributo y versión. El paquete también conserva correspondencias entre fuentes, reglas de autoridad y supervivencia, y decisiones con responsable y evidencia. Cuando se corrige, registra el cambio y avisa al consumidor. Publicar la tabla sin esos elementos dificulta explicar por qué se eligió cada valor.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Publicar un Maestro Significa Entregar Evidencia</tspan></text><rect x="120" y="272" width="625" height="610" rx="0" fill="#F1EFED" stroke="#3C4545" stroke-width="3"/><rect x="120" y="272" width="625" height="6" rx="0" fill="#2E5C70" stroke="none" stroke-width="2"/><rect x="120" y="876" width="625" height="6" rx="0" fill="#749B6B" stroke="none" stroke-width="2"/><g data-svgrepo-icon="catalog" transform="translate(165 306) scale(2.08333)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14" />
  <path d="M12 6v14" />
  <path d="M8 8v12" />
  <path d="M4 4v16" />
</g><text x="239" y="340.75" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="239" y="340.75">MAESTRO PUBLICADO</tspan></text><text x="165" y="437.07" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="165" y="437.07">Cliente confirmado</tspan></text><text x="165" y="542.465" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="165" y="542.465">Identidad estable </tspan><tspan x="165" y="595.59">Valores por atributo </tspan><tspan x="165" y="648.715">Versión de publicación</tspan></text><line x1="745" y1="562" x2="960" y2="562" stroke="#3C4545" stroke-width="4"/><path d="M960 562 L944 570 L944 554 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><path d="M995 331 H975 V925 H995" fill="none" stroke="#3C4545" stroke-width="3" stroke-linejoin="round"/><text x="1225" y="280.59" font-size="25.5" fill="#C74634" font-weight="700" text-anchor="middle"><tspan x="1225" y="280.59">EL PAQUETE INCLUYE</tspan></text><circle cx="1020" cy="374" r="22" fill="#FFFFFF" stroke="#2E5C70" stroke-width="3"/><text x="1020" y="383.27" font-size="25.5" fill="#2E5C70" font-weight="700" text-anchor="middle"><tspan x="1020" y="383.27">1</tspan></text><text x="1075" y="376.75" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1075" y="376.75">Correspondencias</tspan></text><text x="1075" y="445.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1075" y="445.27">V-18 ↔ F-07</tspan></text><line x1="1010" y1="471" x2="1790" y2="471" stroke="#C2D4D4" stroke-width="2"/><circle cx="1020" cy="534" r="22" fill="#FFFFFF" stroke="#2E5C70" stroke-width="3"/><text x="1020" y="543.27" font-size="25.5" fill="#2E5C70" font-weight="700" text-anchor="middle"><tspan x="1020" y="543.27">2</tspan></text><text x="1075" y="536.75" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1075" y="536.75">Reglas vigentes</tspan></text><text x="1075" y="605.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1075" y="605.27">Autoridad y supervivencia</tspan></text><line x1="1010" y1="631" x2="1790" y2="631" stroke="#C2D4D4" stroke-width="2"/><circle cx="1020" cy="694" r="22" fill="#FFFFFF" stroke="#2E5C70" stroke-width="3"/><text x="1020" y="703.27" font-size="25.5" fill="#2E5C70" font-weight="700" text-anchor="middle"><tspan x="1020" y="703.27">3</tspan></text><text x="1075" y="696.75" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1075" y="696.75">Decisiones</tspan></text><text x="1075" y="765.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1075" y="765.27">Quién revisó y con qué evidencia</tspan></text><line x1="1010" y1="791" x2="1790" y2="791" stroke="#C2D4D4" stroke-width="2"/><text x="1020" y="903.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1020" y="903.27">Corrección: registrar el cambio y avisar al consumidor.</tspan></text></g></svg>
