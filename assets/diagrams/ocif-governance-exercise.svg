<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="governance-exercise">
<title id="title">Elegir la herramienta por su acción</title>
<desc id="description">Elegir la herramienta por su acción</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 5 10 8L22 5"/></symbol><symbol id="sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v6m0 5v7M12 3v12m0 5v1M20 3v2m0 5v11"/><circle cx="4" cy="11" r="2"/><circle cx="12" cy="17" r="2"/><circle cx="20" cy="7" r="2"/></symbol><symbol id="bars" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V3m0 18h19M7 21V12h3v9m4 0V5h3v16m4 0v-6"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Elegir la herramienta por su acción</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Avisa, restringe o analiza: tres objetivos distintos.</text><g data-layout="icon-label" data-axis="horizontal"><g data-artwork="true"><use data-icon="mail" href="#mail" x="78" y="195.5" width="54" height="54" color="#4f46b8"/></g><text x="144" y="222.5" font-size="25" fill="#17243b" font-weight="600" text-anchor="start" dominant-baseline="central">Avisar por gasto real o previsto</text></g><path d="M590 222.5H672" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><g data-layout="centered-card"><rect x="694" y="175" width="438" height="95" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><text x="913" y="222.5" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle" dominant-baseline="central">Budget</text></g></g><g data-layout="icon-label" data-axis="horizontal"><g data-artwork="true"><use data-icon="sliders" href="#sliders" x="78" y="321.5" width="54" height="54" color="#4f46b8"/></g><text x="144" y="348.5" font-size="25" fill="#17243b" font-weight="600" text-anchor="start" dominant-baseline="central">Limitar cantidad en Desarrollo</text></g><path d="M590 348.5H672" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><g data-layout="centered-card"><rect x="694" y="301" width="438" height="95" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><text x="913" y="348.5" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle" dominant-baseline="central">Quota</text></g></g><g data-layout="icon-label" data-axis="horizontal"><g data-artwork="true"><use data-icon="bars" href="#bars" x="78" y="447.5" width="54" height="54" color="#4f46b8"/></g><text x="144" y="474.5" font-size="25" fill="#17243b" font-weight="600" text-anchor="start" dominant-baseline="central">Explicar qué aumenta el gasto</text></g><path d="M590 474.5H672" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><g data-layout="centered-card"><rect x="694" y="427" width="438" height="95" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><text x="913" y="474.5" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle" dominant-baseline="central">Cost Analysis</text></g></g><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">La alerta requiere una decisión; la cuota requiere un recurso y ámbito.</text></g>
</svg>
