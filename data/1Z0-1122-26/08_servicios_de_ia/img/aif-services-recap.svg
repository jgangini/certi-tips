<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="input-api-output">
<title id="title">Justifica la elección con una transformación</title>
<desc id="description">Justifica la elección con una transformación</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10v4m4-8v12m4-16v20m4-15v10m4-13v16m4-10v4"/></symbol><symbol id="cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19H18a4 4 0 0 0 0-8h-1a6 6 0 0 0-12-1a4.6 4.6 0 0 0 1 9Z"/></symbol><symbol id="doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9Z"/><path d="M14 2v7h7M7 13h10M7 17h7"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Justifica la elección con una transformación</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Ejemplo completo: de una grabación a subtítulos sincronizados.</text><path d="M294 286H515" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="407.5" y="264" font-size="20" fill="#536078" font-weight="400" text-anchor="middle">enviar</text><path d="M679 286H900" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="792.5" y="264" font-size="20" fill="#536078" font-weight="400" text-anchor="middle">obtener</text><g data-concept="Entrada"><circle cx="215" cy="293" r="72" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="215" cy="286" r="72" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="wave" href="#wave" x="176.12" y="247.12" width="77.76" height="77.76" color="#c74436"/><text x="215" y="401" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Entrada</text><text x="215" y="436" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Grabación con voz</text></g><g data-concept="Transformación"><circle cx="600" cy="293" r="72" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="600" cy="286" r="72" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="cloud" href="#cloud" x="561.12" y="247.12" width="77.76" height="77.76" color="#4f46b8"/><text x="600" y="401" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Transformación</text><text x="600" y="436" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Speech transcribe</text><text x="600" y="468" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">y conserva tiempos</text></g><g data-concept="Salida útil"><circle cx="985" cy="293" r="72" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="985" cy="286" r="72" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="doc" href="#doc" x="946.12" y="247.12" width="77.76" height="77.76" color="#087f7a"/><text x="985" y="401" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Salida útil</text><text x="985" y="436" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">SRT para subtítulos</text><text x="985" y="468" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">o JSON para procesar</text></g><rect x="56" y="590" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="624" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Después comprueba calidad, permisos y requisitos del proceso.</text></g>
</svg>
