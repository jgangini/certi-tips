<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="repair-evidence-routing">
<title id="title">Un expediente, tres rutas de extracción</title>
<desc id="description">Llamada pasa por Speech y Language para obtener texto y tema. Foto pasa por Vision para localizar piezas. Factura pasa por Document Understanding para campos y tabla. El gasto se registra solo después de comprobar los importes.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10v4m4-8v12m4-16v20m4-15v10m4-13v16m4-10v4"/></symbol><symbol id="image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><circle cx="8" cy="8" r="2"/><path d="m3 18 6-6 4 4 4-5 5 7"/></symbol><symbol id="doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9Z"/><path d="M14 2v7h7M7 13h10M7 17h7"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Un expediente, tres rutas de extracción</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Cada archivo aporta una evidencia diferente de la misma reparación.</text><circle cx="108" cy="224" r="38" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="108" cy="217" r="38" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="wave" href="#wave" x="87.47999999999999" y="196.48" width="41.040000000000006" height="41.040000000000006" color="#c74436"/><text x="168" y="225" font-size="25" fill="#17243b" font-weight="700" text-anchor="start">Llamada</text><path d="M282 217H359" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><rect x="380" y="184" width="338" height="66" rx="16" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="549" y="225" font-size="24" fill="#c74436" font-weight="600" text-anchor="middle">Speech → Language</text><path d="M735 217H807" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><text x="832" y="225" font-size="25" fill="#17243b" font-weight="600" text-anchor="start">Texto + tema</text><circle cx="108" cy="359" r="38" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="108" cy="352" r="38" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="image" href="#image" x="87.47999999999999" y="331.48" width="41.040000000000006" height="41.040000000000006" color="#4f46b8"/><text x="168" y="360" font-size="25" fill="#17243b" font-weight="700" text-anchor="start">Foto</text><path d="M282 352H359" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><rect x="380" y="319" width="338" height="66" rx="16" fill="url(#indigo)" stroke="none" stroke-width="1.5"/><text x="549" y="360" font-size="24" fill="#4f46b8" font-weight="600" text-anchor="middle">Vision</text><path d="M735 352H807" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><text x="832" y="360" font-size="25" fill="#17243b" font-weight="600" text-anchor="start">Piezas localizadas</text><circle cx="108" cy="494" r="38" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="108" cy="487" r="38" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="doc" href="#doc" x="87.47999999999999" y="466.48" width="41.040000000000006" height="41.040000000000006" color="#087f7a"/><text x="168" y="495" font-size="25" fill="#17243b" font-weight="700" text-anchor="start">Factura</text><path d="M282 487H359" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><rect x="380" y="454" width="338" height="66" rx="16" fill="url(#teal)" stroke="none" stroke-width="1.5"/><text x="549" y="495" font-size="24" fill="#087f7a" font-weight="600" text-anchor="middle">Document Understanding</text><path d="M735 487H807" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="832" y="495" font-size="25" fill="#17243b" font-weight="600" text-anchor="start">Campos y tabla</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Antes de registrar un gasto: comprueba cantidades, precios, impuestos y total.</text></g>
