<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Aprender exige una prueba de generalización</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Una relación aprendida solo es útil si ayuda cuando cambia el ejemplo.</text><path d="M294 286H515" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="407.5" y="264" font-size="20" fill="#536078" font-weight="400" text-anchor="middle">elegir método</text><path d="M679 286H900" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="792.5" y="264" font-size="20" fill="#536078" font-weight="400" text-anchor="middle">comprobar</text><g data-concept="Define el objetivo"><circle cx="215" cy="293" r="72" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="215" cy="286" r="72" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="target" href="#target" x="176.12" y="247.12" width="77.76" height="77.76" color="#c74436"/><text x="215" y="401" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Define el objetivo</text><text x="215" y="436" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">¿Clase, número, grupo</text><text x="215" y="468" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">o decisión?</text></g><g data-concept="Reconoce la señal"><circle cx="600" cy="293" r="72" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="600" cy="286" r="72" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="table" href="#table" x="561.12" y="247.12" width="77.76" height="77.76" color="#4f46b8"/><text x="600" y="401" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Reconoce la señal</text><text x="600" y="436" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">¿Etiquetas, similitud</text><text x="600" y="468" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">o recompensa?</text></g><g data-concept="Prueba con datos nuevos"><circle cx="985" cy="293" r="72" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="985" cy="286" r="72" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="flask" href="#flask" x="946.12" y="247.12" width="77.76" height="77.76" color="#087f7a"/><text x="985" y="401" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Prueba con datos nuevos</text><text x="985" y="436" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">¿Funciona fuera de</text><text x="985" y="468" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">los ejemplos vistos?</text></g><rect x="56" y="590" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="624" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">El éxito es resolver la tarea sobre casos nuevos, con una métrica adecuada.</text></g>
