<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="agent-responsibilities">
<title id="title">Un agente necesita responsabilidades claras</title>
<desc id="description">Un agente necesita responsabilidades claras</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M8 2v3m4-3v3m4-3v3M8 19v3m4-3v3m4-3v3M2 8h3m-3 4h3m-3 4h3m14-8h3m-3 4h3m-3 4h3"/></symbol><symbol id="code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 8h20m-17-3h1m3 0h1m-5 7 3 3-3 3m6 0h5"/></symbol><symbol id="shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4v7c0 5-6 8-9 9-3-1-9-4-9-9V6Z"/><path d="m7 12 3 3 7-7"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Un agente necesita responsabilidades claras</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">No delegues los permisos del negocio en una decisión del modelo.</text><g data-concept="¿Quién decide?"><circle cx="215" cy="293" r="72" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="215" cy="286" r="72" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="cpu" href="#cpu" x="176.12" y="247.12" width="77.76" height="77.76" color="#c74436"/><text x="215" y="401" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">¿Quién decide?</text><text x="215" y="436" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">El modelo propone</text><text x="215" y="468" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">la siguiente acción</text></g><g data-concept="¿Quién ejecuta?"><circle cx="600" cy="293" r="72" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="600" cy="286" r="72" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="code" href="#code" x="561.12" y="247.12" width="77.76" height="77.76" color="#4f46b8"/><text x="600" y="401" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">¿Quién ejecuta?</text><text x="600" y="436" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Aplicación o runtime</text><text x="600" y="468" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">con la herramienta</text></g><g data-concept="¿Quién autoriza?"><circle cx="985" cy="293" r="72" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="985" cy="286" r="72" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="shield" href="#shield" x="946.12" y="247.12" width="77.76" height="77.76" color="#087f7a"/><text x="985" y="401" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">¿Quién autoriza?</text><text x="985" y="436" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">La política aplicada</text><text x="985" y="468" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">antes de la operación</text></g><rect x="56" y="590" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="624" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Memoria conserva contexto; permisos limitan acciones; límites detienen el loop.</text></g>
</svg>
