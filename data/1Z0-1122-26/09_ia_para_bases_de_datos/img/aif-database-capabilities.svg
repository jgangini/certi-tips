<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="database-capability-map">
<title id="title">Cuatro capacidades, cuatro responsabilidades</title>
<desc id="description">AI Vector Search recupera contenido por similitud. Private Agent Factory construye y prueba flujos visuales. Select AI Agent coordina tareas agentes y herramientas. Un servidor MCP conecta clientes con operaciones de base autorizadas.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="m15 15 7 7"/></symbol><symbol id="doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9Z"/><path d="M14 2v7h7M7 13h10M7 17h7"/></symbol><symbol id="bot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="3"/><path d="M12 3v4M9 16h6M1 12h3m16 0h3"/><circle cx="8.5" cy="12" r=".8" fill="currentColor"/><circle cx="15.5" cy="12" r=".8" fill="currentColor"/></symbol><symbol id="tools" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3a6 6 0 0 0-6 8L2 17l5 5 6-6a6 6 0 0 0 8-6l-4 3-4-4z"/></symbol><symbol id="code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 8h20m-17-3h1m3 0h1m-5 7 3 3-3 3m6 0h5"/></symbol><symbol id="database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 4 18 4 18 0V5M3 12c0 4 18 4 18 0"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Cuatro capacidades, cuatro responsabilidades</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Elige la pieza que falta en el recorrido de tu aplicación.</text><rect x="56" y="160" width="526" height="182" rx="22" fill="#fff" stroke="#dce1ec" stroke-width="1.5"/><rect x="618" y="160" width="526" height="182" rx="22" fill="#fff" stroke="#dce1ec" stroke-width="1.5"/><rect x="56" y="367" width="526" height="182" rx="22" fill="#fff" stroke="#dce1ec" stroke-width="1.5"/><rect x="618" y="367" width="526" height="182" rx="22" fill="#fff" stroke="#dce1ec" stroke-width="1.5"/><text x="87" y="205" font-size="27" fill="#17243b" font-weight="700" text-anchor="start">AI Vector Search</text><use data-icon="search" href="#search" x="92.5" y="236.5" width="55" height="55" color="#c74436"/><path d="M165 264H239" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><use data-icon="doc" href="#doc" x="256.5" y="234.5" width="61" height="61" color="#c74436"/><text x="355" y="260" font-size="23" fill="#536078" font-weight="400" text-anchor="start">Recuperar contenido</text><text x="355" y="292" font-size="23" fill="#536078" font-weight="400" text-anchor="start">por significado</text><text x="649" y="205" font-size="27" fill="#17243b" font-weight="700" text-anchor="start">Private Agent Factory</text><rect x="654" y="246" width="43" height="43" rx="10" fill="url(#indigo)" stroke="none" stroke-width="1.5"/><path d="M701 267H709" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><rect x="716" y="246" width="43" height="43" rx="10" fill="url(#indigo)" stroke="none" stroke-width="1.5"/><path d="M763 267H771" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><rect x="778" y="246" width="43" height="43" rx="10" fill="url(#indigo)" stroke="none" stroke-width="1.5"/><text x="868" y="260" font-size="23" fill="#536078" font-weight="400" text-anchor="start">Construir y probar</text><text x="868" y="292" font-size="23" fill="#536078" font-weight="400" text-anchor="start">un flujo visual</text><text x="87" y="414" font-size="27" fill="#17243b" font-weight="700" text-anchor="start">Select AI Agent</text><use data-icon="bot" href="#bot" x="91.5" y="451.5" width="49" height="49" color="#087f7a"/><path d="M155 476H196" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><use data-icon="tools" href="#tools" x="215.5" y="451.5" width="49" height="49" color="#087f7a"/><text x="330" y="468" font-size="23" fill="#536078" font-weight="400" text-anchor="start">Coordinar tareas,</text><text x="330" y="500" font-size="23" fill="#536078" font-weight="400" text-anchor="start">agentes y herramientas</text><text x="649" y="414" font-size="27" fill="#17243b" font-weight="700" text-anchor="start">Servidor MCP</text><use data-icon="code" href="#code" x="660.5" y="451.5" width="49" height="49" color="#4f46b8"/><path d="M724 476H765" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><use data-icon="database" href="#database" x="783.5" y="451.5" width="49" height="49" color="#4f46b8"/><text x="902" y="468" font-size="23" fill="#536078" font-weight="400" text-anchor="start">Conectar clientes</text><text x="902" y="500" font-size="23" fill="#536078" font-weight="400" text-anchor="start">con operaciones</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Recuperar, construir, coordinar y conectar no son la misma función.</text></g>
</svg>
