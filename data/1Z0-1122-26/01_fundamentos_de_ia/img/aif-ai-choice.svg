<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="decision-tree">
<title id="title">Tres caminos para tres resultados</title>
<desc id="description">Si la comprobación tiene una regla exacta se valida; si requiere aprender un patrón se predice; si requiere contenido nuevo se genera.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol><symbol id="code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 8h20m-17-3h1m3 0h1m-5 7 3 3-3 3m6 0h5"/></symbol><symbol id="cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M8 2v3m4-3v3m4-3v3M8 19v3m4-3v3m4-3v3M2 8h3m-3 4h3m-3 4h3m14-8h3m-3 4h3m-3 4h3"/></symbol><symbol id="spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Tres caminos para tres resultados</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Una solución puede combinar reglas, aprendizaje y generación.</text><circle cx="169" cy="336" r="67" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="169" cy="329" r="67" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="target" href="#target" x="132.82" y="292.82" width="72.36" height="72.36" color="#c74436"/><text x="169" y="442" font-size="26" fill="#17243b" font-weight="700" text-anchor="middle">Define la tarea</text><path d="M245 329L337 329" fill="none" stroke="#536078" stroke-width="2.5"/><path d="M337 226L337 463" fill="none" stroke="#536078" stroke-width="2.5"/><path d="M337 226H428" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="455" y="234" font-size="24" fill="#17243b" font-weight="600" text-anchor="start">Regla exacta conocida</text><path d="M787 226H846" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><use data-icon="code" href="#code" x="867.5" y="201.5" width="49" height="49" color="#c74436"/><text x="945" y="223" font-size="25" fill="#17243b" font-weight="700" text-anchor="start">Validación</text><text x="945" y="254" font-size="21" fill="#536078" font-weight="400" text-anchor="start">8 caracteres</text><path d="M337 345H428" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="455" y="353" font-size="24" fill="#17243b" font-weight="600" text-anchor="start">Patrón aprendido de datos</text><path d="M787 345H846" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><use data-icon="cpu" href="#cpu" x="867.5" y="320.5" width="49" height="49" color="#4f46b8"/><text x="945" y="342" font-size="25" fill="#17243b" font-weight="700" text-anchor="start">Predicción</text><text x="945" y="373" font-size="21" fill="#536078" font-weight="400" text-anchor="start">Clase o número</text><path d="M337 464H428" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="455" y="472" font-size="24" fill="#17243b" font-weight="600" text-anchor="start">Necesitas contenido nuevo</text><path d="M787 464H846" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><use data-icon="spark" href="#spark" x="867.5" y="439.5" width="49" height="49" color="#087f7a"/><text x="945" y="461" font-size="25" fill="#17243b" font-weight="700" text-anchor="start">Generación</text><text x="945" y="492" font-size="21" fill="#536078" font-weight="400" text-anchor="start">Texto, imagen o audio</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Elige por el resultado que necesitas, no por el nombre de la aplicación.</text></g>
</svg>
