<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="nested-families">
<title id="title">IA contiene a ML; ML contiene a DL</title>
<desc id="description">Tres rectángulos anidados muestran DL dentro de ML y ML dentro de IA. La IA generativa describe la tarea de producir contenido, a menudo con redes profundas.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">IA contiene a ML; ML contiene a DL</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Piensa en familias de métodos, no en tres tecnologías rivales.</text><rect x="70" y="159" width="690" height="379" rx="28" fill="#fbedE9" stroke="#ebc8be" stroke-width="1.5"/><text x="102" y="203" font-size="28" fill="#c74436" font-weight="700" text-anchor="start">IA · resolver tareas inteligentes</text><rect x="119" y="229" width="607" height="275" rx="24" fill="#edeafa" stroke="#ccc6ea" stroke-width="1.5"/><text x="151" y="273" font-size="27" fill="#4f46b8" font-weight="700" text-anchor="start">ML · aprender patrones de datos</text><rect x="172" y="299" width="516" height="170" rx="22" fill="#e0f2ed" stroke="#acd7cd" stroke-width="1.5"/><text x="205" y="343" font-size="27" fill="#087f7a" font-weight="700" text-anchor="start">DL · redes con muchas capas</text><circle cx="240" cy="399" r="18" fill="#fff" stroke="#087f7a" stroke-width="2"/><path d="M265 399H377" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><circle cx="403" cy="399" r="18" fill="#fff" stroke="#087f7a" stroke-width="2"/><path d="M428 399H540" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><circle cx="566" cy="399" r="18" fill="#fff" stroke="#087f7a" stroke-width="2"/><circle cx="958" cy="274" r="66" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="958" cy="267" r="66" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="spark" href="#spark" x="922.36" y="231.36" width="71.28" height="71.28" color="#4f46b8"/><text x="958" y="382" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Generar es una tarea</text><text x="958" y="421" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Produce contenido nuevo.</text><text x="958" y="453" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Muchos modelos generativos</text><text x="958" y="485" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">usan deep learning.</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Una red que clasifica imágenes también es DL, aunque no genere imágenes.</text></g>
</svg>
