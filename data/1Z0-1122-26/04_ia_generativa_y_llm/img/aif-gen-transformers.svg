<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="transformer-architectures">
<title id="title">Representar, continuar o transformar</title>
<desc id="description">Encoder recibe texto y produce una representación vectorial. Decoder continúa el contexto generando un token. Encoder-decoder transforma una secuencia, por ejemplo una traducción. La atención causal impide usar tokens futuros.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Representar, continuar o transformar</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Estas son funciones habituales, no una lista exhaustiva de usos.</text><text x="158" y="169" font-size="23" fill="#536078" font-weight="600" text-anchor="middle">Arquitectura</text><text x="439" y="169" font-size="23" fill="#536078" font-weight="600" text-anchor="middle">Entrada</text><text x="771" y="169" font-size="23" fill="#536078" font-weight="600" text-anchor="middle">Mecanismo</text><text x="1053" y="169" font-size="23" fill="#536078" font-weight="600" text-anchor="middle">Salida</text><rect x="56" y="212" width="217" height="42" rx="21" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="164.5" y="240" font-size="21" fill="#c74436" font-weight="600" text-anchor="middle">Encoder</text><text x="428" y="239" font-size="24" fill="#17243b" font-weight="600" text-anchor="middle">«El equipo falla»</text><path d="M549 231H649" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><rect x="670" y="196" width="195" height="73" rx="16" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="767" y="242" font-size="24" fill="#c74436" font-weight="600" text-anchor="middle">Representar</text><path d="M882 231H945" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><text x="1058" y="225" font-size="23" fill="#c74436" font-weight="700" text-anchor="middle">[0,2; −0,7; …]</text><text x="1058" y="259" font-size="21" fill="#536078" font-weight="400" text-anchor="middle">vector</text><rect x="56" y="341" width="217" height="42" rx="21" fill="url(#indigo)" stroke="none" stroke-width="1.5"/><text x="164.5" y="369" font-size="21" fill="#4f46b8" font-weight="600" text-anchor="middle">Decoder</text><text x="428" y="368" font-size="24" fill="#17243b" font-weight="600" text-anchor="middle">«El equipo está»</text><path d="M549 360H649" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><rect x="670" y="326" width="195" height="73" rx="16" fill="url(#indigo)" stroke="none" stroke-width="1.5"/><text x="767" y="372" font-size="24" fill="#4f46b8" font-weight="600" text-anchor="middle">Continuar</text><path d="M882 360H945" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><rect x="970" y="337" width="167" height="42" rx="21" fill="url(#indigo)" stroke="none" stroke-width="1.5"/><text x="1053.5" y="365" font-size="21" fill="#4f46b8" font-weight="600" text-anchor="middle">«listo»</text><rect x="56" y="472" width="217" height="42" rx="21" fill="url(#teal)" stroke="none" stroke-width="1.5"/><text x="164.5" y="500" font-size="21" fill="#087f7a" font-weight="600" text-anchor="middle">Encoder + decoder</text><text x="428" y="499" font-size="24" fill="#17243b" font-weight="600" text-anchor="middle">«Buenos días»</text><path d="M549 491H649" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><rect x="670" y="456" width="195" height="73" rx="16" fill="url(#teal)" stroke="none" stroke-width="1.5"/><text x="767" y="502" font-size="24" fill="#087f7a" font-weight="600" text-anchor="middle">Transformar</text><path d="M882 491H945" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="1053" y="485" font-size="24" fill="#087f7a" font-weight="600" text-anchor="middle">«Good</text><text x="1053" y="518" font-size="24" fill="#087f7a" font-weight="600" text-anchor="middle">morning»</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">La atención relaciona posiciones; la atención causal no mira tokens futuros.</text></g>
</svg>
