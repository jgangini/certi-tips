<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="architecture-console">
<title id="title">Tres coordenadas para encontrar un recurso</title>
<desc id="description">Tres coordenadas para encontrar un recurso</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="m15 15 7 7"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Tres coordenadas para encontrar un recurso</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Comprueba dónde estás antes de interpretar un listado vacío.</text><rect x="65" y="171" width="1070" height="335" rx="18" fill="#fff" stroke="#dce1ec" stroke-width="1.5"/><rect x="65" y="171" width="1070" height="70" rx="18" fill="#e7e9f5" stroke="#dce1ec" stroke-width="1.5"/><g data-layout="centered-card"><rect x="100" y="278" width="305" height="114" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><g data-card-content="true"><text x="252.5" y="314" font-size="25" fill="#4f46b8" font-weight="700" text-anchor="middle" dominant-baseline="central">Tenancy</text><text x="252.5" y="356" font-size="23" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">Tienda Andina</text></g></g><g data-layout="centered-card"><rect x="447" y="278" width="305" height="114" rx="18" fill="url(#coral)" stroke="#c74436" stroke-width="1.5"/><g data-card-content="true"><text x="599.5" y="314" font-size="25" fill="#c74436" font-weight="700" text-anchor="middle" dominant-baseline="central">Región</text><text x="599.5" y="356" font-size="23" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">Región elegida</text></g></g><g data-layout="centered-card"><rect x="794" y="278" width="305" height="114" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><g data-card-content="true"><text x="946.5" y="314" font-size="25" fill="#4f46b8" font-weight="700" text-anchor="middle" dominant-baseline="central">Compartimento</text><text x="946.5" y="356" font-size="23" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">Producción</text></g></g><use data-icon="search" href="#search" x="99" y="190" width="34" height="34" color="#4f46b8"/><text x="601" y="216" font-size="25" fill="#17243b" font-weight="400" text-anchor="middle">Buscar instancias en el contexto correcto</text><text x="600" y="462" font-size="25" fill="#087f7a" font-weight="600" text-anchor="middle">Revisa también permisos y estado del recurso.</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Cambiar de compartimento no cambia la región de la consola.</text></g>
</svg>
