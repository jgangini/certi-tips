rk" href="#network" x="78" y="447.5" width="54" height="54" color="#4f46b8"/></g><text x="144" y="474.5" font-size="25" fill="#17243b" font-weight="600" text-anchor="start" dominant-baseline="central">Evento regional</text></g><path d="M590 474.5H672" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><g data-layout="centered-card"><rect x="694" y="427" width="438" height="95" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><text x="913" y="474.5" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle" dominant-baseline="central">Diseñar en otra región</text></g></g><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">En todos los casos revisa datos, balanceo y recuperación.</text></g>
