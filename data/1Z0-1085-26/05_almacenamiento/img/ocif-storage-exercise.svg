<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="storage-exercise">
<title id="title">La espera aceptable cambia el nivel</title>
<desc id="description">La espera aceptable cambia el nivel</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 3"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">La espera aceptable cambia el nivel</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Dos archivos raramente consultados pueden necesitar niveles distintos.</text><rect x="68" y="172" width="492" height="362" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><text x="314" y="207" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle">Consulta poco frecuente</text><g data-layout="icon-label"><g data-artwork="true"><use data-icon="clock" href="#clock" x="270" y="252" width="88" height="88" color="#087f7a"/></g><text x="314" y="377" font-size="27" fill="#17243b" font-weight="400" text-anchor="middle">Necesito el dato ahora</text><text x="314" y="413" font-size="27" fill="#17243b" font-weight="400" text-anchor="middle">→ Infrequent Access</text></g><rect x="645" y="172" width="492" height="362" rx="18" fill="url(#coral)" stroke="#c74436" stroke-width="1.5"/><text x="891" y="207" font-size="25" fill="#c74436" font-weight="700" text-anchor="middle">Histórico que puede esperar</text><g data-layout="icon-label"><g data-artwork="true"><use data-icon="clock" href="#clock" x="847" y="252" width="88" height="88" color="#c74436"/></g><text x="891" y="377" font-size="27" fill="#17243b" font-weight="400" text-anchor="middle">Puedo restaurar primero</text><text x="891" y="413" font-size="27" fill="#17243b" font-weight="400" text-anchor="middle">→ Archive</text></g><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Incluye cargos de recuperación y retención en la decisión.</text></g>
</svg>
