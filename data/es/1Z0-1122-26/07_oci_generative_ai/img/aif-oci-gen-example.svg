<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="document-and-query">
<title id="title">Dos fuentes, una respuesta verificable</title>
<desc id="description">Un fragmento de política vigente y un conteo SQL de doce órdenes llegan como evidencias distintas al chat. La respuesta cita el documento para la política y la consulta para el número.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5C8 2 4 3 2 4v15c4-1 7-1 10 2 3-3 6-3 10-2V4c-4-1-7-1-10 1v16"/><path d="M5 8h4m-4 4h4m6-4h4m-4 4h4"/></symbol><symbol id="table" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 9h20M2 15h20M9 3v18M16 9v12"/></symbol><symbol id="cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M8 2v3m4-3v3m4-3v3M8 19v3m4-3v3m4-3v3M2 8h3m-3 4h3m-3 4h3m14-8h3m-3 4h3m-3 4h3"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Dos fuentes, una respuesta verificable</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Explica una política y cuenta las órdenes abiertas sin mezclar sus evidencias.</text><g data-concept="Política"><circle cx="194" cy="249" r="50" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="194" cy="242" r="50" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="book" href="#book" x="167" y="215" width="54" height="54" color="#c74436"/><text x="194" y="335" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Política</text><text x="194" y="370" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Fragmento vigente [1]</text></g><g data-concept="Órdenes"><circle cx="194" cy="432" r="50" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="194" cy="425" r="50" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="table" href="#table" x="167" y="398" width="54" height="54" color="#4f46b8"/><text x="194" y="518" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Órdenes</text><text x="194" y="553" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Conteo SQL: 12</text></g><path d="M256 242H424L506 331" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><path d="M256 425H424L506 371" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><g data-concept="Chat"><circle cx="589" cy="356" r="64" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="589" cy="349" r="64" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="cpu" href="#cpu" x="554.44" y="314.44" width="69.12" height="69.12" color="#4f46b8"/><text x="589" y="456" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Chat</text><text x="589" y="491" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Combina evidencia</text><text x="589" y="523" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">con un resultado calculado</text></g><path d="M664 349H826" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><rect x="848" y="236" width="293" height="235" rx="20" fill="#fff" stroke="#087f7a" stroke-width="1.5"/><text x="994" y="280" font-size="28" fill="#087f7a" font-weight="700" text-anchor="middle">Respuesta</text><text x="873" y="323" font-size="23" fill="#17243b" font-weight="400" text-anchor="start">«La política indica… [1]</text><text x="873" y="355" font-size="23" fill="#17243b" font-weight="400" text-anchor="start">Hay 12 órdenes abiertas</text><text x="873" y="387" font-size="23" fill="#17243b" font-weight="400" text-anchor="start">según la consulta».</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">La cita respalda la política; la consulta respalda el número.</text></g>
</svg>
