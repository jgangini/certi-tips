<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="task-selection">
<title id="title">En el taller, cada tarea tiene su técnica</title>
<desc id="description">AB123456 cumple un formato de ocho caracteres; un recuadro localiza una pieza en una foto; un documento representa un aviso generado con datos verificados.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 5"/></symbol><symbol id="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m9 2 6 0 1 4 4 1 2 5-3 3 0 5-5 2-3-3-5 0-2-5 3-3 0-5z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">En el taller, cada tarea tiene su técnica</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">No hace falta el mismo modelo para comprobar, localizar y redactar.</text><text x="224" y="182" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Serie del equipo</text><rect x="79" y="229" width="290" height="91" rx="18" fill="#fff" stroke="#c74436" stroke-width="1.5"/><text x="224" y="285" font-size="34" fill="#c74436" font-weight="700" text-anchor="middle">AB123456</text><text x="224" y="363" font-size="24" fill="#536078" font-weight="400" text-anchor="middle">8 caracteres</text><use data-icon="check" href="#check" x="193" y="390" width="62" height="62" color="#c74436"/><text x="224" y="498" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Validar formato</text><text x="600" y="182" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Foto de la pieza</text><rect x="467" y="222" width="266" height="174" rx="15" fill="#edf3f5" stroke="#dce1ec" stroke-width="1.5"/><use data-icon="gear" href="#gear" x="540.5" y="251.5" width="119" height="119" color="#4f46b8"/><rect x="528" y="241" width="143" height="139" rx="6" fill="none" stroke="#4f46b8" stroke-width="1.5"/><text x="600" y="437" font-size="24" fill="#536078" font-weight="400" text-anchor="middle">Pieza localizada</text><text x="600" y="498" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Detectar objeto</text><text x="976" y="182" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Aviso al cliente</text><rect x="874" y="235" width="220" height="171" rx="12" fill="#e9eaf1" stroke="none" stroke-width="1.5"/><rect x="866" y="228" width="220" height="171" rx="12" fill="#fff" stroke="#087f7a" stroke-width="1.5"/><path d="M886 266L1066 266" fill="none" stroke="#087f7a" stroke-width="3"/><path d="M886 289L1066 289" fill="none" stroke="#087f7a" stroke-width="3"/><path d="M886 312L1048 312" fill="none" stroke="#087f7a" stroke-width="3"/><use data-icon="spark" href="#spark" x="1040" y="216" width="48" height="48" color="#087f7a"/><text x="976" y="437" font-size="24" fill="#536078" font-weight="400" text-anchor="middle">Texto basado en datos</text><text x="976" y="498" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Generar el aviso</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Tres resultados diferentes: formato válido, ubicación y texto nuevo.</text></g>
</svg>
