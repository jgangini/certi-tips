<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Describe la solución en tres preguntas</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Ejemplo: localizar una pieza dentro de una fotografía.</text><path d="M294 286H515" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="407.5" y="264" font-size="20" fill="#536078" font-weight="400" text-anchor="middle">definir</text><path d="M679 286H900" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="792.5" y="264" font-size="20" fill="#536078" font-weight="400" text-anchor="middle">evaluar</text><g data-concept="¿Qué entra?"><circle cx="215" cy="293" r="72" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="215" cy="286" r="72" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="image" href="#image" x="176.12" y="247.12" width="77.76" height="77.76" color="#c74436"/><text x="215" y="401" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">¿Qué entra?</text><text x="215" y="436" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Foto de una pieza</text></g><g data-concept="¿Qué debe salir?"><circle cx="600" cy="293" r="72" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="600" cy="286" r="72" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="eye" href="#eye" x="561.12" y="247.12" width="77.76" height="77.76" color="#4f46b8"/><text x="600" y="401" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">¿Qué debe salir?</text><text x="600" y="436" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">La pieza y su ubicación</text></g><g data-concept="¿Cómo lo compruebo?"><circle cx="985" cy="293" r="72" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="985" cy="286" r="72" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="check" href="#check" x="946.12" y="247.12" width="77.76" height="77.76" color="#087f7a"/><text x="985" y="401" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">¿Cómo lo compruebo?</text><text x="985" y="436" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Comparo con una</text><text x="985" y="468" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">anotación revisada</text></g><rect x="56" y="590" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="624" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Puedes explicar la solución completa antes de nombrar un modelo.</text></g>
