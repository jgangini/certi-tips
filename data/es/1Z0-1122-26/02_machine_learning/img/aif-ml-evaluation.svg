<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="dataset-partition">
<title id="title">El examen debe contener ejemplos nuevos</title>
<desc id="description">Se separa entrenamiento, validación y prueba. Entrenamiento ajusta escalador y modelo; validación permite elegir configuración; prueba queda reservada para medir sin nuevos ajustes.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v6m0 5v7M12 3v12m0 5v1M20 3v2m0 5v11"/><circle cx="4" cy="11" r="2"/><circle cx="12" cy="17" r="2"/><circle cx="20" cy="7" r="2"/></symbol><symbol id="target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol><symbol id="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="12" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 15v3"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">El examen debe contener ejemplos nuevos</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Train aprende; validation orienta decisiones; test estima la generalización.</text><rect x="94" y="180" width="1012" height="57" rx="8" fill="#fff" stroke="#dce1ec" stroke-width="1.5"/><rect x="94" y="180" width="610" height="57" rx="8" fill="url(#coral)" stroke="none" stroke-width="1.5"/><rect x="704" y="180" width="200" height="57" rx="8" fill="url(#indigo)" stroke="none" stroke-width="1.5"/><rect x="904" y="180" width="202" height="57" rx="8" fill="url(#teal)" stroke="none" stroke-width="1.5"/><text x="399" y="216" font-size="23" fill="#c74436" font-weight="700" text-anchor="middle">TRAIN</text><text x="804" y="216" font-size="21" fill="#4f46b8" font-weight="700" text-anchor="middle">VALIDATION</text><text x="1005" y="216" font-size="23" fill="#087f7a" font-weight="700" text-anchor="middle">TEST</text><text x="600" y="276" font-size="24" fill="#17243b" font-weight="600" text-anchor="middle">Separa los datos antes de ajustar cualquier transformación</text><path d="M292 296V338" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><path d="M804 296V338" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><path d="M1005 296V338" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><g data-concept="Ajustar"><circle cx="291" cy="422" r="51" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="291" cy="415" r="51" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="sliders" href="#sliders" x="263.46" y="387.46" width="55.080000000000005" height="55.080000000000005" color="#c74436"/><text x="291" y="509" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Ajustar</text><text x="291" y="544" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Escalador y modelo</text></g><g data-concept="Elegir"><circle cx="804" cy="422" r="51" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="804" cy="415" r="51" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="target" href="#target" x="776.46" y="387.46" width="55.080000000000005" height="55.080000000000005" color="#4f46b8"/><text x="804" y="509" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Elegir</text><text x="804" y="544" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Configuración</text></g><g data-concept="Medir"><circle cx="1005" cy="422" r="51" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="1005" cy="415" r="51" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="lock" href="#lock" x="977.46" y="387.46" width="55.080000000000005" height="55.080000000000005" color="#087f7a"/><text x="1005" y="509" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Medir</text><text x="1005" y="544" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Resultado final</text></g><path d="M353 415H666" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><text x="510" y="392" font-size="22" fill="#536078" font-weight="400" text-anchor="middle">Reutiliza lo aprendido</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">El test no enseña: evita usarlo para escalar, seleccionar o afinar.</text></g>
</svg>
