<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="model-lifecycle">
<title id="title">Del experimento a una predicción disponible</title>
<desc id="description">Notebook permite explorar y entrenar; catálogo registra el artefacto; deployment lo expone como endpoint; aplicación lo invoca. Jobs y pipelines automatizan tareas repetibles del ciclo.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 8h20m-17-3h1m3 0h1m-5 7 3 3-3 3m6 0h5"/></symbol><symbol id="archive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M2 3h20v4H2zM9 12h6"/></symbol><symbol id="server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2" width="18" height="8" rx="2"/><rect x="3" y="14" width="18" height="8" rx="2"/><path d="M6 6h.1M6 18h.1M11 6h6M11 18h6"/></symbol><symbol id="chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v14H8l-5 5zM7 7h10M7 11h7"/></symbol><symbol id="calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M7 2v5M17 2v5M3 10h18M7 14h3m4 0h3m-10 4h3"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Del experimento a una predicción disponible</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Conserva datos, código y dependencias para reproducir lo aprendido.</text><path d="M239 274H368" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="306.5" y="252" font-size="20" fill="#536078" font-weight="400" text-anchor="middle">registrar</text><path d="M532 274H662" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="600" y="252" font-size="20" fill="#536078" font-weight="400" text-anchor="middle">desplegar</text><path d="M826 274H955" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="893.5" y="252" font-size="20" fill="#536078" font-weight="400" text-anchor="middle">invocar</text><g data-concept="Notebook"><circle cx="160" cy="281" r="58" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="160" cy="274" r="58" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="code" href="#code" x="128.68" y="242.68" width="62.64" height="62.64" color="#c74436"/><text x="160" y="375" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Notebook</text><text x="160" y="410" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Explorar y entrenar</text></g><g data-concept="Model Catalog"><circle cx="453" cy="281" r="58" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="453" cy="274" r="58" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="archive" href="#archive" x="421.68" y="242.68" width="62.64" height="62.64" color="#4f46b8"/><text x="453" y="375" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Model Catalog</text><text x="453" y="410" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Guardar artefacto</text><text x="453" y="442" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">y metadatos</text></g><g data-concept="Deployment"><circle cx="747" cy="281" r="58" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="747" cy="274" r="58" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="server" href="#server" x="715.68" y="242.68" width="62.64" height="62.64" color="#4f46b8"/><text x="747" y="375" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Deployment</text><text x="747" y="410" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Servir inferencia</text><text x="747" y="442" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">en un endpoint</text></g><g data-concept="Aplicación"><circle cx="1040" cy="281" r="58" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="1040" cy="274" r="58" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="chat" href="#chat" x="1008.68" y="242.68" width="62.64" height="62.64" color="#087f7a"/><text x="1040" y="375" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Aplicación</text><text x="1040" y="410" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Recibir predicciones</text></g><use data-icon="calendar" href="#calendar" x="160.5" y="470.5" width="53" height="53" color="#087f7a"/><text x="238" y="489" font-size="24" fill="#17243b" font-weight="700" text-anchor="start">Jobs / pipelines</text><text x="238" y="521" font-size="23" fill="#536078" font-weight="400" text-anchor="start">Repiten y coordinan preparación, entrenamiento o evaluación.</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Registrar un modelo no crea un endpoint: el despliegue es otro paso.</text></g>
</svg>
