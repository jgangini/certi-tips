<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="online-batch-branch">
<title id="title">Estimar horas de reparación, de punta a punta</title>
<desc id="description">El historial disponible antes de reparar permite entrenar y registrar una regresión. Si se necesita respuesta inmediata se crea un deployment con endpoint; para recalcular cada noche se ejecuta un job.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="table" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 9h20M2 15h20M9 3v18M16 9v12"/></symbol><symbol id="flask" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8M9 2v7L2 21h20L15 9V2M7 14h10"/></symbol><symbol id="server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2" width="18" height="8" rx="2"/><rect x="3" y="14" width="18" height="8" rx="2"/><path d="M6 6h.1M6 18h.1M11 6h6M11 18h6"/></symbol><symbol id="calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M7 2v5M17 2v5M3 10h18M7 14h3m4 0h3m-10 4h3"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Estimar horas de reparación, de punta a punta</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">La misma tarea puede consumirse en línea o procesarse periódicamente.</text><g data-concept="Historial propio"><circle cx="174" cy="317" r="62" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="174" cy="310" r="62" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="table" href="#table" x="140.51999999999998" y="276.52" width="66.96000000000001" height="66.96000000000001" color="#c74436"/><text x="174" y="415" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Historial propio</text><text x="174" y="450" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Features disponibles</text><text x="174" y="482" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">antes de reparar</text></g><path d="M247 310H401" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><g data-concept="Entrenar + registrar"><circle cx="499" cy="317" r="62" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="499" cy="310" r="62" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="flask" href="#flask" x="465.52" y="276.52" width="66.96000000000001" height="66.96000000000001" color="#4f46b8"/><text x="499" y="415" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Entrenar + registrar</text><text x="499" y="450" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Modelo de regresión</text><text x="499" y="482" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">para estimar horas</text></g><path d="M575 310L664 310" fill="none" stroke="#536078" stroke-width="2.5"/><path d="M664 216L664 435" fill="none" stroke="#536078" stroke-width="2.5"/><path d="M664 216H789" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M664 435H789" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><circle cx="852" cy="223" r="46" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="852" cy="216" r="46" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="server" href="#server" x="827.16" y="191.16" width="49.68000000000001" height="49.68000000000001" color="#087f7a"/><text x="928" y="203" font-size="27" fill="#17243b" font-weight="700" text-anchor="start">En línea</text><text x="928" y="240" font-size="23" fill="#536078" font-weight="400" text-anchor="start">Deployment → API</text><circle cx="852" cy="442" r="46" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="852" cy="435" r="46" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="calendar" href="#calendar" x="827.16" y="410.15999999999997" width="49.68000000000001" height="49.68000000000001" color="#087f7a"/><text x="928" y="422" font-size="27" fill="#17243b" font-weight="700" text-anchor="start">Cada noche</text><text x="928" y="459" font-size="23" fill="#536078" font-weight="400" text-anchor="start">Job por lotes</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">La frecuencia y la latencia requerida orientan cómo servir la predicción.</text></g>
</svg>
