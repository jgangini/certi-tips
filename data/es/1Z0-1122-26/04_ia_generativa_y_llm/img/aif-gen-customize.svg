<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="context-versus-weights">
<title id="title">Tres formas de adaptar una respuesta</title>
<desc id="description">Prompting entrega instrucciones a un modelo sin cambiar pesos. RAG recupera documentos y añade evidencia al contexto. Fine-tuning usa ejemplos de entrenamiento para actualizar parámetros entrenables.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M8 2v3m4-3v3m4-3v3M8 19v3m4-3v3m4-3v3M2 8h3m-3 4h3m-3 4h3m14-8h3m-3 4h3m-3 4h3"/></symbol><symbol id="search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="m15 15 7 7"/></symbol><symbol id="table" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 9h20M2 15h20M9 3v18M16 9v12"/></symbol><symbol id="sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v6m0 5v7M12 3v12m0 5v1M20 3v2m0 5v11"/><circle cx="4" cy="11" r="2"/><circle cx="12" cy="17" r="2"/><circle cx="20" cy="7" r="2"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Tres formas de adaptar una respuesta</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Primero identifica si falta una instrucción, evidencia o comportamiento aprendido.</text><text x="213" y="174" font-size="28" fill="#17243b" font-weight="700" text-anchor="middle">Prompting</text><rect x="167" y="222" width="108" height="130" rx="12" fill="#e9eaf1" stroke="none" stroke-width="1.5"/><rect x="159" y="215" width="108" height="130" rx="12" fill="#fff" stroke="#c74436" stroke-width="1.5"/><path d="M179 253L247 253" fill="none" stroke="#c74436" stroke-width="3"/><path d="M179 276L247 276" fill="none" stroke="#c74436" stroke-width="3"/><path d="M179 299L229 299" fill="none" stroke="#c74436" stroke-width="3"/><text x="213" y="328" font-size="19" fill="#c74436" font-weight="600" text-anchor="middle">Instrucción</text><path d="M213 358V388" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><circle cx="213" cy="449" r="42" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="213" cy="442" r="42" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="cpu" href="#cpu" x="190.32" y="419.32" width="45.36" height="45.36" color="#4f46b8"/><text x="213" y="529" font-size="24" fill="#17243b" font-weight="600" text-anchor="middle">Guía esta respuesta</text><text x="600" y="174" font-size="28" fill="#17243b" font-weight="700" text-anchor="middle">RAG</text><rect x="491" y="237" width="80" height="108" rx="12" fill="#e9eaf1" stroke="none" stroke-width="1.5"/><rect x="483" y="230" width="80" height="108" rx="12" fill="#fff" stroke="#087f7a" stroke-width="1.5"/><path d="M503 268L543 268" fill="none" stroke="#087f7a" stroke-width="3"/><path d="M503 291L543 291" fill="none" stroke="#087f7a" stroke-width="3"/><path d="M503 314L525 314" fill="none" stroke="#087f7a" stroke-width="3"/><use data-icon="search" href="#search" x="606.5" y="247.5" width="69" height="69" color="#087f7a"/><path d="M573 283H590" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M649 340Q649 393 615 399" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><circle cx="600" cy="449" r="42" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="600" cy="442" r="42" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="cpu" href="#cpu" x="577.32" y="419.32" width="45.36" height="45.36" color="#4f46b8"/><text x="600" y="529" font-size="24" fill="#17243b" font-weight="600" text-anchor="middle">Añade evidencia al contexto</text><text x="987" y="174" font-size="28" fill="#17243b" font-weight="700" text-anchor="middle">Fine-tuning</text><use data-icon="table" href="#table" x="898.5" y="237.5" width="81" height="81" color="#c74436"/><use data-icon="sliders" href="#sliders" x="1026" y="246" width="64" height="64" color="#4f46b8"/><path d="M995 337V389" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><circle cx="987" cy="449" r="42" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="987" cy="442" r="42" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="cpu" href="#cpu" x="964.32" y="419.32" width="45.36" height="45.36" color="#087f7a"/><text x="987" y="529" font-size="24" fill="#17243b" font-weight="600" text-anchor="middle">Ajusta parámetros entrenables</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Instrucciones y RAG cambian el contexto; fine-tuning cambia el modelo.</text></g>
</svg>
