<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="llm-concepts">
<title id="title">Reconoce qué cambia y qué se conserva</title>
<desc id="description">Reconoce qué cambia y qué se conserva</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 8h20m-17-3h1m3 0h1m-5 7 3 3-3 3m6 0h5"/></symbol><symbol id="link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m9 15 6-6M8 17l-2 2a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0m2-1 2-2a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0"/></symbol><symbol id="search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="m15 15 7 7"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Reconoce qué cambia y qué se conserva</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Tres piezas para explicar cómo una respuesta usa su contexto.</text><g data-concept="Token"><circle cx="215" cy="293" r="72" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="215" cy="286" r="72" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="code" href="#code" x="176.12" y="247.12" width="77.76" height="77.76" color="#c74436"/><text x="215" y="401" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Token</text><text x="215" y="436" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Unidad de una secuencia:</text><text x="215" y="468" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">palabra, fragmento o signo</text></g><g data-concept="Atención"><circle cx="600" cy="293" r="72" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="600" cy="286" r="72" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="link" href="#link" x="561.12" y="247.12" width="77.76" height="77.76" color="#4f46b8"/><text x="600" y="401" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Atención</text><text x="600" y="436" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Pondera relaciones entre</text><text x="600" y="468" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">posiciones del contexto</text></g><g data-concept="Evidencia"><circle cx="985" cy="293" r="72" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="985" cy="286" r="72" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="search" href="#search" x="946.12" y="247.12" width="77.76" height="77.76" color="#087f7a"/><text x="985" y="401" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Evidencia</text><text x="985" y="436" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Información recuperada</text><text x="985" y="468" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">para apoyar la respuesta</text></g><rect x="56" y="590" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="624" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Los parámetros se aprenden; el contexto condiciona cada invocación.</text></g>
</svg>
