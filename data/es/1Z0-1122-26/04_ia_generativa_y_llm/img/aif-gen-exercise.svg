<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="fresh-data-prompt">
<title id="title">El inventario cambia; consulta antes de responder</title>
<desc id="description">Una consulta autorizada al inventario devuelve 12 unidades; el contexto entrega ese dato y una instrucción de formato al modelo, que redacta una respuesta breve.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 4 18 4 18 0V5M3 12c0 4 18 4 18 0"/></symbol><symbol id="cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M8 2v3m4-3v3m4-3v3M8 19v3m4-3v3m4-3v3M2 8h3m-3 4h3m-3 4h3m14-8h3m-3 4h3m-3 4h3"/></symbol><symbol id="chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v14H8l-5 5zM7 7h10M7 11h7"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">El inventario cambia; consulta antes de responder</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Entrenar un modelo no sincroniza por sí solo las existencias de cada hora.</text><circle cx="196" cy="295" r="70" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="196" cy="288" r="70" fill="url(#coral)" stroke="none" stroke-width="2"/><use data-icon="database" href="#database" x="158.2" y="250.2" width="75.60000000000001" height="75.60000000000001" color="#c74436"/><text x="196" y="406" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Inventario actual</text><text x="196" y="445" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Consulta autorizada</text><text x="196" y="477" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">de esta hora</text><path d="M275 288H483" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><text x="379" y="263" font-size="21" fill="#536078" font-weight="400" text-anchor="middle">dato: 12 unidades</text><g data-concept="Modelo"><circle cx="600" cy="295" r="70" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="600" cy="288" r="70" fill="url(#indigo)" stroke="none" stroke-width="2"/><use data-icon="cpu" href="#cpu" x="562.2" y="250.2" width="75.60000000000001" height="75.60000000000001" color="#4f46b8"/><text x="600" y="401" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Modelo</text><text x="600" y="436" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Usa datos recuperados</text><text x="600" y="468" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">y el formato solicitado</text></g><rect x="510" y="155" width="84" height="65" rx="12" fill="#e9eaf1" stroke="none" stroke-width="1.5"/><rect x="502" y="148" width="84" height="65" rx="12" fill="#fff" stroke="#4f46b8" stroke-width="1.5"/><path d="M522 186L566 186" fill="none" stroke="#4f46b8" stroke-width="3"/><rect x="667" y="156" width="340" height="42" rx="21" fill="url(#indigo)" stroke="none" stroke-width="1.5"/><text x="837" y="184" font-size="21" fill="#4f46b8" font-weight="600" text-anchor="middle">Formato: una frase breve</text><path d="M766 205Q766 237 682 253" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><path d="M680 288H887" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><g data-concept="Respuesta"><circle cx="1005" cy="295" r="70" fill="#e9eaf1" stroke="none" stroke-width="2"/><circle cx="1005" cy="288" r="70" fill="url(#teal)" stroke="none" stroke-width="2"/><use data-icon="chat" href="#chat" x="967.2" y="250.2" width="75.60000000000001" height="75.60000000000001" color="#087f7a"/><text x="1005" y="401" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Respuesta</text><text x="1005" y="436" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">«Hay 12 unidades</text><text x="1005" y="468" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">disponibles ahora»</text></g><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Dato fresco: consultar. Formato breve: instrucciones y ejemplos.</text></g>
</svg>
