<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 606" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="misconceptions">
<title id="title">Cercanía no significa certeza ni permiso</title>
<desc id="description">Cercanía no significa certeza ni permiso</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m5 5 14 14M5 19 19 5"/></symbol><symbol id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 5"/></symbol></defs>
<rect width="1200" height="606" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Cercanía no significa certeza ni permiso</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Comprueba espacio de embeddings, calidad de recuperación y alcance de acceso.</text><text x="94" y="166" font-size="25" fill="#c74436" font-weight="700" text-anchor="start">Confusión</text><use data-icon="cross" href="#cross" x="54" y="144" width="28" height="28" color="#c74436"/><text x="694" y="166" font-size="25" fill="#087f7a" font-weight="700" text-anchor="start">Cómo pensarlo</text><use data-icon="check" href="#check" x="651" y="144" width="28" height="28" color="#087f7a"/><g class="comparison-row"><rect x="56" y="200" width="474" height="97" rx="16" fill="#fae6e1" stroke="#efc7be" stroke-width="1.5"/><text x="84" y="237" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">«Cercano = documento correcto»</text><path d="M551 248H618" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><rect x="644" y="200" width="500" height="97" rx="16" fill="#e1f2ee" stroke="#b7ddd5" stroke-width="1.5"/><text x="672" y="237" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">Verifica versión, equipo</text><text x="672" y="270" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">y metadatos del candidato.</text></g><g class="comparison-row"><rect x="56" y="319" width="474" height="97" rx="16" fill="#fae6e1" stroke="#efc7be" stroke-width="1.5"/><text x="84" y="356" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">«Índice aproximado = exacto»</text><path d="M551 367H618" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><rect x="644" y="319" width="500" height="97" rx="16" fill="#e1f2ee" stroke="#b7ddd5" stroke-width="1.5"/><text x="672" y="356" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">Mide recuperación frente</text><text x="672" y="389" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">a una referencia exacta.</text></g><g class="comparison-row"><rect x="56" y="438" width="474" height="97" rx="16" fill="#fae6e1" stroke="#efc7be" stroke-width="1.5"/><text x="84" y="475" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">«MCP concede acceso total»</text><path d="M551 486H618" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><rect x="644" y="438" width="500" height="97" rx="16" fill="#e1f2ee" stroke="#b7ddd5" stroke-width="1.5"/><text x="672" y="475" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">Autentica y limita herramientas,</text><text x="672" y="508" font-size="24" fill="#17243b" font-weight="400" text-anchor="start">parámetros y privilegios.</text></g></g>
</svg>
