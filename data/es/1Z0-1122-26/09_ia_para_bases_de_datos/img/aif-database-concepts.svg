<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="embedding-neighborhood">
<title id="title">Buscar por significado es comparar vectores</title>
<desc id="description">Un fragmento se convierte en un vector numérico. En una proyección esquemática del espacio de embeddings, una consulta se sitúa cerca de candidatos similares. La cercanía no prueba identidad ni autoriza el acceso.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Buscar por significado es comparar vectores</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Texto y consulta deben representarse con embeddings compatibles.</text><rect x="77" y="240" width="95" height="132" rx="12" fill="#e9eaf1" stroke="none" stroke-width="1.5"/><rect x="69" y="233" width="95" height="132" rx="12" fill="#fff" stroke="#c74436" stroke-width="1.5"/><path d="M89 271L144 271" fill="none" stroke="#c74436" stroke-width="3"/><path d="M89 294L144 294" fill="none" stroke="#c74436" stroke-width="3"/><path d="M89 317L126 317" fill="none" stroke="#c74436" stroke-width="3"/><text x="116" y="417" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Fragmento</text><path d="M179 298H255" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><rect x="279" y="253" width="266" height="89" rx="18" fill="url(#indigo)" stroke="none" stroke-width="1.5"/><text x="412" y="289" font-size="26" fill="#4f46b8" font-weight="700" text-anchor="middle">Embedding</text><text x="412" y="324" font-size="23" fill="#4f46b8" font-weight="600" text-anchor="middle">[0,2; −0,7; 0,4; …]</text><path d="M561 298H637" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><g data-visual="scatterplot"><path d="M672 475L1075 475" fill="none" stroke="#536078" stroke-width="2.5"/><path d="M672 475L672 183" fill="none" stroke="#536078" stroke-width="2.5"/><circle cx="724.39" cy="428.28" r="6" fill="#087f7a" stroke="none" stroke-width="2"/><circle cx="772.75" cy="261.84000000000003" r="6" fill="#087f7a" stroke="none" stroke-width="2"/><circle cx="905.74" cy="314.4" r="6" fill="#087f7a" stroke="none" stroke-width="2"/><circle cx="950.0699999999999" cy="288.12" r="6" fill="#087f7a" stroke="none" stroke-width="2"/><circle cx="990.37" cy="352.36" r="6" fill="#087f7a" stroke="none" stroke-width="2"/><circle cx="1022.61" cy="223.88" r="6" fill="#087f7a" stroke="none" stroke-width="2"/><circle cx="841.26" cy="399.08" r="6" fill="#087f7a" stroke="none" stroke-width="2"/></g><circle cx="941" cy="303" r="92" fill="none" stroke="#4f46b8" stroke-width="2"/><circle cx="941" cy="303" r="9" fill="#c74436" stroke="none" stroke-width="2"/><text x="975" y="292" font-size="21" fill="#c74436" font-weight="600" text-anchor="start">Consulta</text><text x="872" y="518" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Cercanía en el espacio aprendido</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">La distancia devuelve candidatos; los filtros limitan cuáles puedes consultar.</text></g>
</svg>
