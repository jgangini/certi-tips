<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="managed-service-mapping">
<title id="title">Cuatro servicios, cuatro transformaciones</title>
<desc id="description">Language analiza texto; Speech transcribe voz con tiempos; Vision clasifica y localiza objetos en imágenes; Document Understanding extrae campos tablas y texto de documentos.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v14H8l-5 5zM7 7h10M7 11h7"/></symbol><symbol id="wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10v4m4-8v12m4-16v20m4-15v10m4-13v16m4-10v4"/></symbol><symbol id="image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><circle cx="8" cy="8" r="2"/><path d="m3 18 6-6 4 4 4-5 5 7"/></symbol><symbol id="doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9Z"/><path d="M14 2v7h7M7 13h10M7 17h7"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Cuatro servicios, cuatro transformaciones</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Reconoce la modalidad y la estructura que necesitas obtener.</text><text x="130" y="169" font-size="24" fill="#536078" font-weight="600" text-anchor="middle">Entrada</text><text x="545" y="169" font-size="24" fill="#536078" font-weight="600" text-anchor="middle">Servicio</text><text x="983" y="169" font-size="24" fill="#536078" font-weight="600" text-anchor="middle">Resultado</text><use data-icon="chat" href="#chat" x="79.5" y="204.5" width="53" height="53" color="#c74436"/><text x="153" y="239" font-size="24" fill="#17243b" font-weight="600" text-anchor="start">Texto</text><path d="M313 231H395" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><rect x="414" y="201" width="328" height="59" rx="18" fill="url(#coral)" stroke="none" stroke-width="1.5"/><text x="578" y="239" font-size="24" fill="#c74436" font-weight="600" text-anchor="middle">Language</text><path d="M757 231H805" fill="none" stroke="#c74436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><text x="835" y="239" font-size="23" fill="#17243b" font-weight="400" text-anchor="start">Entidades, temas, sentimiento</text><use data-icon="wave" href="#wave" x="79.5" y="300.5" width="53" height="53" color="#4f46b8"/><text x="153" y="335" font-size="24" fill="#17243b" font-weight="600" text-anchor="start">Voz</text><path d="M313 327H395" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><rect x="414" y="297" width="328" height="59" rx="18" fill="url(#indigo)" stroke="none" stroke-width="1.5"/><text x="578" y="335" font-size="24" fill="#4f46b8" font-weight="600" text-anchor="middle">Speech</text><path d="M757 327H805" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><text x="835" y="335" font-size="23" fill="#17243b" font-weight="400" text-anchor="start">Transcripción y tiempos</text><use data-icon="image" href="#image" x="79.5" y="396.5" width="53" height="53" color="#087f7a"/><text x="153" y="431" font-size="24" fill="#17243b" font-weight="600" text-anchor="start">Imagen</text><path d="M313 423H395" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><rect x="414" y="393" width="328" height="59" rx="18" fill="url(#teal)" stroke="none" stroke-width="1.5"/><text x="578" y="431" font-size="24" fill="#087f7a" font-weight="600" text-anchor="middle">Vision</text><path d="M757 423H805" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="835" y="431" font-size="23" fill="#17243b" font-weight="400" text-anchor="start">Clases, objetos y ubicación</text><use data-icon="doc" href="#doc" x="79.5" y="492.5" width="53" height="53" color="#4f46b8"/><text x="153" y="527" font-size="24" fill="#17243b" font-weight="600" text-anchor="start">Documento</text><path d="M313 519H395" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><rect x="414" y="489" width="328" height="59" rx="18" fill="url(#indigo)" stroke="none" stroke-width="1.5"/><text x="578" y="527" font-size="24" fill="#4f46b8" font-weight="600" text-anchor="middle">Document Understanding</text><path d="M757 519H805" fill="none" stroke="#4f46b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><text x="835" y="527" font-size="23" fill="#17243b" font-weight="400" text-anchor="start">Campos, filas y columnas</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Empieza por «entrada → resultado» y después elige la API.</text></g>
</svg>
