ght="600" text-anchor="start">Precio</text><text x="1007" y="356" font-size="21" fill="#536078" font-weight="600" text-anchor="start">Total</text><text x="726" y="399" font-size="25" fill="#17243b" font-weight="600" text-anchor="middle">2</text><text x="885" y="399" font-size="25" fill="#17243b" font-weight="600" text-anchor="middle">50</text><text x="1034" y="399" font-size="25" fill="#17243b" font-weight="600" text-anchor="middle">100</text><text x="881" y="479" font-size="25" fill="#17243b" font-weight="600" text-anchor="middle">Campos + relaciones de tabla</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Leer texto no equivale a recuperar la relación entre sus campos y columnas.</text></g>
