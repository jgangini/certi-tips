<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="object-boxes-invoice">
<title id="title">Una foto y una factura tienen estructuras distintas</title>
<desc id="description">Vision localiza un engranaje y un servidor mediante cajas delimitadoras. Document Understanding interpreta proveedor y una tabla de factura con cantidad 2 precio 50 total 100. OCR por sí solo no garantiza relaciones tabulares.</desc>
