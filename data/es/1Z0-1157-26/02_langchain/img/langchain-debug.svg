<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title description">
<title id="title">Resultado correcto, loop que no termina</title><desc id="description">La depuración revisa primero si el resultado está en el contexto y vinculado al identificador adecuado; después si instrucciones, descripción y condiciones permiten reconocer que la tarea terminó. Se mantiene un límite de pasos para controlar el fallo.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff4ef"/><stop offset="1" stop-color="#f1ccc5"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f2f0ff"/><stop offset="1" stop-color="#d8d4f5"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#effaf7"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}.title{font-size:32px;font-weight:700}.label{font-size:26px;font-weight:700}.body{font-size:23px;fill:#536078}.small{font-size:22px;fill:#536078}.mono{font-family:Consolas,monospace;font-size:22px}.line{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.icon{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#dce1eb;stroke-width:1.5}</style></defs>
<rect width="1200" height="570" fill="#f7f8fc"/>
<text x="56" y="64" class="title">Resultado correcto, loop que no termina</text><circle cx="220" cy="225" r="52" fill="#087f7a" opacity=".09"/><circle cx="215" cy="218" r="52" fill="url(#teal)" stroke="#087f7a" stroke-opacity=".15"/><g transform="translate(215 218)" class="icon" stroke="#087f7a"><rect x="-23" y="-29" width="46" height="58" rx="6"/><path d="M-13-14h26M-13-3h20M-13 8h26M-13 19H3"/></g><circle cx="605" cy="225" r="52" fill="#4f46b8" opacity=".09"/><circle cx="600" cy="218" r="52" fill="url(#indigo)" stroke="#4f46b8" stroke-opacity=".15"/><g transform="translate(600 218)" class="icon" stroke="#4f46b8"><circle cx="-6" cy="-6" r="20"/><path d="m9 9 21 21M-15-6h18M-6-15V3"/></g><circle cx="990" cy="225" r="52" fill="#c74436" opacity=".09"/><circle cx="985" cy="218" r="52" fill="url(#coral)" stroke="#c74436" stroke-opacity=".15"/><g transform="translate(985 218)" class="icon" stroke="#c74436"><path d="m-12-29 24 0 17 17v24L12 29h-24l-17-17v-24Z"/><path d="m-10-10 20 20m0-20-20 20"/></g><path d="M267 218H548" class="line"/><path d="M652 218H933" class="line"/><text x="215" y="318" class="label" text-anchor="middle">1. Evidencia</text><text x="600" y="318" class="label" text-anchor="middle">2. Continuación</text><text x="985" y="318" class="label" text-anchor="middle">3. Límite</text><text x="215" y="364" class="body" text-anchor="middle">¿call-a tiene resultado?</text><text x="215" y="395" class="body" text-anchor="middle">¿El contexto incluye 90?</text><text x="600" y="364" class="body" text-anchor="middle">¿Se reconoce el resultado?</text><text x="600" y="395" class="body" text-anchor="middle">¿Cuándo debe terminar?</text><text x="985" y="364" class="body" text-anchor="middle">Controla pasos y errores.</text><text x="985" y="395" class="body" text-anchor="middle">No amplíes sin corregir.</text></svg>
