<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 674" role="img" aria-labelledby="title description">
  <title id="title">Primero acordar, después descubrir y operar</title>
  <desc id="description">La inicialización acuerda versión y capacidades. tools/list descubre esquemas y tools/call solicita una operación. La respuesta contiene el resultado o error asociado al ID. Los mensajes JSON-RPC viajan por stdio entre procesos locales o por Streamable HTTP hacia un endpoint.</desc>
  <defs>
    <!-- Lucide icons, ISC. See assets/icons/LICENSE-lucide.txt. -->
    <symbol id="plug" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5M15 8V2M17 8a1 1 0 0 1 1 1v4a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1zM9 8V2"/></symbol>
    <symbol id="search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></symbol>
    <symbol id="wrench" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/></symbol>
    <symbol id="file-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2zM14 2v5a1 1 0 0 0 1 1h5M10 9H8M16 13H8M16 17H8"/></symbol>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}
      .title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}
      .body{font-size:22px;fill:#536078}.mono{font-family:Consolas,monospace;font-size:22px;fill:#536078}
      .card{fill:#fff;stroke:#dce1eb;stroke-width:1.5}
      .connector{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .bidirectional{marker-start:url(#arrow)}.divider{stroke:#dce1eb;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="674" fill="#f7f8fc"/>
  <text x="56" y="64" class="title" text-anchor="start">Primero acordar, después descubrir y operar</text>
  <g class="icon-badge" data-icon="plug"><circle cx="170" cy="164" r="44" fill="#e9e6fa"/><use href="#plug" x="146" y="140" width="48" height="48" color="#4f46b8"/></g>
  <text x="170" y="246" class="label" text-anchor="middle">Inicializar</text>
  <text x="170" y="289" class="body" text-anchor="middle">Versión y</text>
  <text x="170" y="322" class="body" text-anchor="middle">capacidades</text>
  <g class="icon-badge" data-icon="search"><circle cx="455" cy="164" r="44" fill="#e9e6fa"/><use href="#search" x="431" y="140" width="48" height="48" color="#4f46b8"/></g>
  <text x="455" y="246" class="mono" text-anchor="middle">tools/list</text>
  <text x="455" y="289" class="body" text-anchor="middle">Nombres, propósito</text>
  <text x="455" y="322" class="body" text-anchor="middle">y argumentos</text>
  <g class="icon-badge" data-icon="wrench"><circle cx="740" cy="164" r="44" fill="#fae6e1"/><use href="#wrench" x="716" y="140" width="48" height="48" color="#c74436"/></g>
  <text x="740" y="246" class="mono" text-anchor="middle">tools/call</text>
  <text x="740" y="289" class="body" text-anchor="middle">Nombre y</text>
  <text x="740" y="322" class="body" text-anchor="middle">argumentos</text>
  <g class="icon-badge" data-icon="file-text"><circle cx="1025" cy="164" r="44" fill="#e1f2ee"/><use href="#file-text" x="1001" y="140" width="48" height="48" color="#087f7a"/></g>
  <text x="1025" y="246" class="label" text-anchor="middle">Respuesta</text>
  <text x="1025" y="289" class="body" text-anchor="middle">Resultado o error</text>
  <text x="1025" y="322" class="body" text-anchor="middle">asociado al ID</text>
  <path d="M214 164H411" class="connector"/>
  <path d="M499 164H696" class="connector"/>
  <path d="M784 164H981" class="connector"/>
  <rect x="56" y="369" width="1088" height="258" rx="22" class="card"/>
  <text x="88" y="415" class="label" text-anchor="start">El mismo formato JSON-RPC, dos transportes</text>
  <text x="88" y="489" class="body" text-anchor="start">Cliente local</text>
  <path d="M299 481H796" class="connector bidirectional"/>
  <text x="550" y="465" class="mono" text-anchor="middle">stdio</text>
  <text x="844" y="489" class="body" text-anchor="start">Proceso servidor</text>
  <path d="M88 522H1112" class="divider"/>
  <text x="88" y="585" class="body" text-anchor="start">Cliente</text>
  <path d="M299 577H796" class="connector bidirectional"/>
  <text x="550" y="561" class="mono" text-anchor="middle">Streamable HTTP</text>
  <text x="844" y="585" class="body" text-anchor="start">Endpoint HTTP</text>
</svg>
