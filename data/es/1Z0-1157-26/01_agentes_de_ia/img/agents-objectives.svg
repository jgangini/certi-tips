<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
<title id="title">Chatbot, workflow y agente</title>
<desc id="description">Un chatbot responde a una consulta. Un workflow sigue pasos definidos. Un agente elige un siguiente paso y usa observaciones para continuar, con controles de ejecución.</desc>
<defs>
  <!-- Lucide icons, ISC. See assets/icons/LICENSE-lucide.txt. -->
  <symbol id="messages-square" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2zM20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"/></symbol>
  <symbol id="workflow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></symbol>
  <symbol id="bot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></symbol>
  <linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient>
  <linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient>
  <linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}.title{font-size:34px;font-weight:700}.label{font-size:27px;font-weight:700}.body{font-size:23px;fill:#536078}.small{font-size:22px;fill:#536078}.flow{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.icon{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.white{fill:#fff}</style>
</defs>
<rect width="1200" height="560" fill="#f7f8fc"/>
<text x="56" y="70" class="title">Tres formas de resolver una petición</text>
<g transform="translate(228 204)" data-concept="chatbot" data-icon="messages-square"><circle cy="7" r="66" fill="#e9eaf1"/><circle r="66" fill="url(#coral)"/><use href="#messages-square" x="-38" y="-38" width="76" height="76" color="#c74436"/></g>
<g transform="translate(600 204)" data-concept="workflow" data-icon="workflow"><circle cy="7" r="66" fill="#e9eaf1"/><circle r="66" fill="url(#indigo)"/><use href="#workflow" x="-38" y="-38" width="76" height="76" color="#4f46b8"/></g>
<g transform="translate(972 204)" data-concept="agent" data-icon="bot"><circle cy="7" r="66" fill="#e9eaf1"/><circle r="66" fill="url(#teal)"/><use href="#bot" x="-38" y="-38" width="76" height="76" color="#087f7a"/></g>
<g text-anchor="middle"><text x="228" y="313" class="label">Chatbot</text><text x="600" y="313" class="label">Workflow</text><text x="972" y="313" class="label">Agente</text>
<text x="228" y="354" class="body">Responde una pregunta</text><text x="600" y="354" class="body">Sigue una secuencia fija</text><text x="972" y="354" class="body">Decide el próximo paso</text></g>
<path d="M192 418H246" class="flow"/><path d="M527 418H559" class="flow"/><path d="M634 418H667" class="flow"/>
<g fill="#fff" stroke="#cbd2df"><rect x="74" y="392" width="118" height="52" rx="12"/><rect x="246" y="392" width="134" height="52" rx="12"/><rect x="452" y="392" width="75" height="52" rx="12"/><rect x="559" y="392" width="75" height="52" rx="12"/><rect x="667" y="392" width="75" height="52" rx="12"/></g>
<g text-anchor="middle" class="small"><text x="133" y="425">Pregunta</text><text x="313" y="425">Respuesta</text><text x="490" y="425">A</text><text x="597" y="425">B</text><text x="705" y="425">C</text></g>
<path d="M968 418H998" class="flow"/><path d="M1062 444V465Q1062 483 1044 483H922Q904 483 904 465V444" class="flow"/><g fill="#fff" stroke="#b9ddd6"><rect x="840" y="392" width="128" height="52" rx="12"/><rect x="998" y="392" width="128" height="52" rx="12"/></g>
<text x="904" y="425" text-anchor="middle" class="small">Decisión</text><text x="1062" y="425" text-anchor="middle" class="small">Acción</text><text x="967" y="520" text-anchor="middle" class="small">Observación y límites</text>
</svg>
