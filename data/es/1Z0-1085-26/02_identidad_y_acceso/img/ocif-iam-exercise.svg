<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Por qué Luis puede crear usuarios pero no redes</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Tiene el rol del dominio; necesita además una política sobre los recursos.</text><g data-layout="icon-label"><g data-artwork="true" data-badge="true"><circle cx="164" cy="313" r="51" fill="#fff" stroke="#4f46b8" stroke-width="2.5"/><use data-icon="user" href="#user" x="136" y="285" width="56" height="56" color="#4f46b8"/></g><g data-layout="caption"><text x="164" y="401" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Luis</text></g></g><path d="M223 293H394V238.5H592" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><path d="M223 333L394 333" fill="none" stroke="#c74436" stroke-width="2.5" stroke-dasharray="7 7"/><path d="M394 333L394 458.5" fill="none" stroke="#c74436" stroke-width="2.5" stroke-dasharray="7 7"/><path d="M394 458.5L592 458.5" fill="none" stroke="#c74436" stroke-width="2.5" stroke-dasharray="7 7"/><use data-icon="cross" href="#cross" x="540" y="444.5" width="28" height="28" color="#c74436"/><g data-layout="centered-card"><rect x="614" y="160" width="501" height="157" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><g data-card-content="true"><text x="864.5" y="217.5" font-size="25" fill="#4f46b8" font-weight="700" text-anchor="middle" dominant-baseline="central">Rol del dominio</text><text x="864.5" y="259.5" font-size="23" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">Administrar usuarios y grupos</text></g></g><g data-layout="centered-card"><rect x="614" y="380" width="501" height="157" rx="18" fill="url(#coral)" stroke="#c74436" stroke-width="1.5"/><g data-card-content="true"><text x="864.5" y="437.5" font-size="25" fill="#c74436" font-weight="700" text-anchor="middle" dominant-baseline="central">Falta política en Desarrollo</text><text x="864.5" y="479.5" font-size="23" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">Crear VCN: operación denegada</text></g></g><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Un administrador autorizado debe conceder el permiso al grupo adecuado.</text></g>
