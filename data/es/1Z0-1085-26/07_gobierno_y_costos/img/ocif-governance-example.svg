<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="governance-example">
<title id="title">La alerta no reduce sola el consumo</title>
<desc id="description">La alerta no reduce sola el consumo</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">La alerta no reduce sola el consumo</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">El equipo investiga y ajusta los recursos cuando corresponde.</text><path d="M121 499L1100 499" fill="none" stroke="#536078" stroke-width="2.5"/><path d="M121 499L121 170" fill="none" stroke="#536078" stroke-width="2.5"/><path d="M121 281L1100 281" fill="none" stroke="#c74436" stroke-width="2.5" stroke-dasharray="7 7"/><text x="1100" y="267" font-size="22" fill="#c74436" font-weight="600" text-anchor="end">Umbral de alerta</text><path d="M140 454L312 409L484 337L656 238L828 206L1000 375" fill="none" stroke="#087f7a" stroke-width="5"/><circle cx="656" cy="238" r="8" fill="#c74436" stroke="none" stroke-width="2"/><circle cx="828" cy="206" r="8" fill="#4f46b8" stroke="none" stroke-width="2"/><text x="568" y="189" font-size="24" fill="#c74436" font-weight="700" text-anchor="middle">Alerta</text><text x="929" y="166" font-size="24" fill="#4f46b8" font-weight="700" text-anchor="middle">Acción del equipo</text><path d="M873 178L839 198" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="611" y="545" font-size="24" fill="#536078" font-weight="400" text-anchor="middle">Tiempo →</text><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Curva ilustrativa de consumo por periodo; no es una tarifa OCI.</text></g>
