<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" data-design="illustrated-v2" data-visual="governance-controls">
<title id="title">No confundas dinero, cantidades y límites</title>
<desc id="description">No confundas dinero, cantidades y límites</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff0eb"/><stop offset="1" stop-color="#f8d8d1"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#ded9f6"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#e7f7f3"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#536078" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c74436" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4f46b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#087f7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><symbol id="mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 5 10 8L22 5"/></symbol><symbol id="server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2" width="18" height="8" rx="2"/><rect x="3" y="14" width="18" height="8" rx="2"/><path d="M6 6h.1M6 18h.1M11 6h6M11 18h6"/></symbol></defs>
<rect width="1200" height="660" fill="#f7f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">No confundas dinero, cantidades y límites</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Tres controles responden a tres preguntas diferentes.</text><rect x="59" y="165" width="330" height="372" rx="18" fill="url(#coral)" stroke="#c74436" stroke-width="1.5"/><text x="224" y="292" font-size="25" fill="#c74436" font-weight="700" text-anchor="middle">Budget</text><g data-layout="icon-label"><g data-artwork="true"><use data-icon="mail" href="#mail" x="188" y="294" width="72" height="72" color="#c74436"/></g><text x="224" y="398" font-size="25" fill="#17243b" font-weight="400" text-anchor="middle">Umbral de dinero</text><text x="224" y="432" font-size="25" fill="#17243b" font-weight="400" text-anchor="middle">→ alerta</text></g><rect x="435" y="165" width="330" height="372" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><text x="600" y="292" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle">Quota</text><g data-layout="icon-label"><g data-artwork="true"><use data-icon="server" href="#server" x="516" y="308" width="44" height="44" color="#087f7a"/><use data-icon="server" href="#server" x="578" y="308" width="44" height="44" color="#087f7a"/><use data-icon="server" href="#server" x="640" y="308" width="44" height="44" color="#087f7a"/></g><text x="600" y="398" font-size="25" fill="#17243b" font-weight="400" text-anchor="middle">Cantidad permitida</text><text x="600" y="432" font-size="25" fill="#17243b" font-weight="400" text-anchor="middle">por compartimento</text></g><rect x="811" y="165" width="330" height="372" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><text x="976" y="292" font-size="25" fill="#4f46b8" font-weight="700" text-anchor="middle">Service limit</text><g data-layout="icon-label"><g data-artwork="true"><path d="M863 310L1089 310" fill="none" stroke="#4f46b8" stroke-width="5"/><use data-icon="server" href="#server" x="954" y="313" width="44" height="44" color="#4f46b8"/></g><text x="976" y="398" font-size="25" fill="#17243b" font-weight="400" text-anchor="middle">Límite del servicio</text><text x="976" y="432" font-size="25" fill="#17243b" font-weight="400" text-anchor="middle">en su ámbito</text></g><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">El presupuesto informa: no apaga automáticamente tus recursos.</text></g>
</svg>
