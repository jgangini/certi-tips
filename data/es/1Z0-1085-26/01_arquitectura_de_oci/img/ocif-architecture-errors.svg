<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Un compartimento no es un centro de datos</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">Dos límites diferentes pueden describir el mismo recurso.</text><rect x="70" y="164" width="475" height="363" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><text x="308" y="263" font-size="25" fill="#4f46b8" font-weight="700" text-anchor="middle">Organización lógica</text><rect x="655" y="164" width="475" height="363" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><text x="893" y="263" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle">Ubicación física</text><g data-layout="icon-label"><g data-artwork="true"><use data-icon="layers" href="#layers" x="263" y="283" width="90" height="90" color="#4f46b8"/></g><text x="308" y="414" font-size="25" fill="#17243b" font-weight="400" text-anchor="middle">Producción / Desarrollo</text><text x="308" y="448" font-size="25" fill="#17243b" font-weight="400" text-anchor="middle">Políticas y responsabilidad</text></g><g data-layout="icon-label"><g data-artwork="true"><use data-icon="server" href="#server" x="848" y="283" width="90" height="90" color="#087f7a"/></g><text x="893" y="414" font-size="25" fill="#17243b" font-weight="400" text-anchor="middle">Región → AD → FD</text><text x="893" y="448" font-size="25" fill="#17243b" font-weight="400" text-anchor="middle">Separación de hardware</text></g><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Crear un compartimento no mueve una VM a otro servidor.</text></g>
