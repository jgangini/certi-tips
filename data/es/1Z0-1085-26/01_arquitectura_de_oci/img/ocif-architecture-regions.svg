<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Ubicación y separación de fallos</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">El dibujo muestra un AD; no presupone tres AD en todas las regiones.</text><rect x="56" y="160" width="818" height="392" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><text x="465" y="195" font-size="25" fill="#4f46b8" font-weight="700" text-anchor="middle">Región A</text><rect x="88" y="222" width="750" height="292" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><text x="463" y="257" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle">Availability Domain ilustrado</text><rect x="113" y="292" width="212" height="195" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><text x="219" y="327" font-size="25" fill="#4f46b8" font-weight="700" text-anchor="middle">FD 1</text><g data-layout="centered-card"><rect x="144" y="353" width="150" height="112" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><g data-layout="icon-label"><g data-artwork="true"><use data-icon="server" href="#server" x="192" y="361" width="54" height="54" color="#087f7a"/></g><text x="219" y="438" font-size="22" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">VM 1</text></g></g></g><rect x="353" y="292" width="212" height="195" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><text x="459" y="327" font-size="25" fill="#4f46b8" font-weight="700" text-anchor="middle">FD 2</text><g data-layout="centered-card"><rect x="384" y="353" width="150" height="112" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><g data-layout="icon-label"><g data-artwork="true"><use data-icon="server" href="#server" x="432" y="361" width="54" height="54" color="#087f7a"/></g><text x="459" y="438" font-size="22" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">VM 2</text></g></g></g><rect x="593" y="292" width="212" height="195" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><text x="699" y="327" font-size="25" fill="#4f46b8" font-weight="700" text-anchor="middle">FD 3</text><g data-layout="centered-card"><rect x="624" y="353" width="150" height="112" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><g data-layout="icon-label"><g data-artwork="true"><use data-icon="server" href="#server" x="672" y="361" width="54" height="54" color="#087f7a"/></g><text x="699" y="438" font-size="22" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">VM 3</text></g></g></g><rect x="905" y="239" width="240" height="275" rx="18" fill="url(#coral)" stroke="#c74436" stroke-width="1.5"/><text x="1025" y="274" font-size="25" fill="#c74436" font-weight="700" text-anchor="middle">Región B</text><g data-layout="icon-label"><g data-artwork="true"><use data-icon="cloud" href="#cloud" x="980" y="300" width="90" height="90" color="#c74436"/></g><text x="1025" y="410" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">Otra ubicación</text><text x="1025" y="442" font-size="23" fill="#536078" font-weight="400" text-anchor="middle">geográfica</text></g><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Una región tiene uno o varios AD; cada AD tiene tres FD.</text></g>
