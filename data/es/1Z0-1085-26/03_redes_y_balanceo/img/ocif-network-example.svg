<g font-family="Segoe UI, Arial, sans-serif"><text x="56" y="68" font-size="34" fill="#17243b" font-weight="700" text-anchor="start">Una petición a Tienda Andina</text><text x="56" y="107" font-size="22" fill="#536078" font-weight="400" text-anchor="start">El cliente y la aplicación no utilizan el mismo camino.</text><g data-layout="icon-label"><g data-artwork="true" data-badge="true"><circle cx="115" cy="235" r="51" fill="#fff" stroke="#4f46b8" stroke-width="2.5"/><use data-icon="users" href="#users" x="87" y="207" width="56" height="56" color="#4f46b8"/></g><g data-layout="caption"><text x="115" y="323" font-size="25" fill="#17243b" font-weight="700" text-anchor="middle">Cliente</text></g></g><path d="M169 235H308" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><text x="240" y="207" font-size="21" fill="#536078" font-weight="400" text-anchor="middle">HTTPS</text><rect x="335" y="168" width="338" height="230" rx="18" fill="url(#coral)" stroke="#c74436" stroke-width="1.5"/><text x="504" y="203" font-size="25" fill="#c74436" font-weight="700" text-anchor="middle">Subred pública</text><g data-layout="icon-label"><g data-artwork="true"><use data-icon="network" href="#network" x="471" y="249" width="66" height="66" color="#c74436"/></g><text x="504" y="350" font-size="27" fill="#17243b" font-weight="700" text-anchor="middle">Load Balancer</text></g><rect x="796" y="168" width="340" height="230" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><text x="966" y="203" font-size="25" fill="#087f7a" font-weight="700" text-anchor="middle">Subred privada</text><g data-layout="centered-card"><rect x="861" y="247" width="150" height="112" rx="18" fill="url(#teal)" stroke="#087f7a" stroke-width="1.5"/><g data-card-content="true"><g data-layout="icon-label"><g data-artwork="true"><use data-icon="server" href="#server" x="909" y="255" width="54" height="54" color="#087f7a"/></g><text x="936" y="332" font-size="22" fill="#17243b" font-weight="400" text-anchor="middle" dominant-baseline="central">App</text></g></g></g><path d="M690 303H781" fill="none" stroke="#536078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><path d="M936 365V418" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><g data-layout="icon-label"><g data-artwork="true"><use data-icon="network" href="#network" x="912" y="429" width="48" height="48" color="#087f7a"/></g><text x="936" y="519" font-size="23" fill="#087f7a" font-weight="600" text-anchor="middle">Service Gateway</text></g><path d="M898 453H671" fill="none" stroke="#087f7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><g data-layout="centered-card"><rect x="360" y="423" width="293" height="121" rx="18" fill="url(#indigo)" stroke="#4f46b8" stroke-width="1.5"/><g data-card-content="true"><g data-layout="icon-label"><text x="506.5" y="453.5" font-size="25" fill="#4f46b8" font-weight="700" text-anchor="middle" dominant-baseline="central">Object Storage</text><g data-artwork="true"><use data-icon="archive" href="#archive" x="478" y="479" width="57" height="57" color="#4f46b8"/></g></g></g></g><rect x="56" y="576" width="1088" height="52" rx="22" fill="#e4f2ef" stroke="none" stroke-width="1.5"/><text x="600" y="610" font-size="24" fill="#076762" font-weight="600" text-anchor="middle">Object Storage es un servicio regional; no reside dentro de una subred.</text></g>
