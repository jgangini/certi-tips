<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Quién Decide y Quién Ejecuta</title><desc id="description">Cada fila es una tarea y cada columna es un rol. Las letras indican su responsabilidad en esa tarea: A responde por la decisión, R ejecuta, C es consultado e I recibe información. En este ejemplo, el steward tiene R al definir el uso y C al aplicar permisos; el custodio tiene R al aplicar permisos. Los círculos plomos destacan al propietario, que responde por la decisión en las cuatro tareas.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Quién Decide y Quién Ejecuta</tspan></text><g data-person-icon="user-supplied" transform="translate(813 190) scale(3)" fill="#59616E"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"/><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z"/></g><g data-person-icon="user-supplied" transform="translate(1095 190) scale(3)" fill="#007E87"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"/><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z"/></g><g data-person-icon="user-supplied" transform="translate(1377 190) scale(3)" fill="#397C46"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"/><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z"/></g><g data-person-icon="user-supplied" transform="translate(1659 190) scale(3)" fill="#C74634"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"/><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z"/></g><defs><clipPath id="raci-table-clip"><rect x="96" y="260" width="1728" height="604" rx="20"/></clipPath></defs><g clip-path="url(#raci-table-clip)"><rect x="96" y="260" width="1728" height="100" rx="0" fill="#59616E" stroke="#59616E" stroke-width="2"/><text x="122" y="320.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="122" y="320.8">Decisión o Tarea</tspan></text><text x="837.0" y="320.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="837.0" y="320.8">Propietario</tspan></text><rect x="978" y="260" width="282" height="100" rx="0" fill="#007E87" stroke="none" stroke-width="2"/><text x="1119.0" y="320.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="1119.0" y="320.8">Steward</tspan></text><rect x="1260" y="260" width="282" height="100" rx="0" fill="#397C46" stroke="none" stroke-width="2"/><text x="1401.0" y="320.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="1401.0" y="320.8">Custodio</tspan></text><rect x="1542" y="260" width="282" height="100" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="1683.0" y="320.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="1683.0" y="320.8">Consumidor</tspan></text><rect x="96" y="360" width="1728" height="126" rx="0" fill="#FFFFFF" stroke="#59616E" stroke-width="2"/><text x="122" y="433.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="122" y="433.8">Definir el uso</tspan></text><circle cx="837.0" cy="423" r="28" fill="#59616E" stroke="#59616E" stroke-width="2"/><text x="837.0" y="433.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="837.0" y="433.8">A</tspan></text><text x="1119.0" y="433.8" font-size="25.5" fill="#181818" font-