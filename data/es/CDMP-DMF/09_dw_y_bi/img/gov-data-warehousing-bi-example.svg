<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-design-audit="08-11-compact"><title id="title">Un Join Puede Duplicar el Importe de Cabecera</title><desc id="description">Después del join, F-01 aparece una vez por cada línea. El importe de cabecera 100 se repite y su suma produce 200. Los importes de línea 60 y 40 mantienen su grano y suman el total real de 100. Elige la medida que corresponde a la granularidad del resultado y concilia contra la factura de origen.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Un Join Puede Duplicar el Importe de Cabecera</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 55)"><rect x="837.0" y="240" width="246" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="960" y="274.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="960" y="274.8">DESPUÉS DEL JOIN</tspan></text><rect x="390" y="328" width="1140" height="172" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M402 328 H1518 Q1530 328 1530 340 V392 H390 V340 Q390 328 402 328 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="center"><rect x="390" y="328" width="240" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="510.0" y="370.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="510.0" y="370.8">Factura</tspan></text></g></g><g data-table-cell="header" data-cell-align="cent