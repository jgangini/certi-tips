nt-weight="400" text-anchor="middle"><tspan x="710.0" y="429.8">1</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="790" y="392" width="320" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="950.0" y="429.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="950.0" y="429.8">100</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="1110" y="392" width="420" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1320.0" y="429.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1320.0" y="429.8">60</tspan></text></g></g><line x1="390" y1="446" x2="1530" y2="446" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="center"><rect x="390" y="446" width="240" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="510.0" y="483.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="510.0" y="483.8">F-01</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="630" y="446" width="160" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="710.0" y="483.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="710.0" y="483.8">2</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="790" y="446" width="320" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="950.0" y="483.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="950.0" y="483.8">100</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="1110" y="446" width="420" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1320.0" y="483.8" fo