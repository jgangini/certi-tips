  <path d="m8.5 7.5 8 8" />
</g><text x="190" y="301.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="190" y="301.59">Acuerdo de negocio</tspan></text><text x="128" y="386.801" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="128" y="386.801">Responsable: propietario comercial </tspan><tspan x="128" y="429.036">Uso: indicador de clientes </tspan><tspan x="128" y="471.27">Audiencia: equipo de analítica </tspan><tspan x="128" y="513.504">Datos: identificador y estado </tspan><tspan x="128" y="555.739">Teléfono: fuera del producto</tspan></text><line x1="636" y1="435" x2="740" y2="435" stroke="#C74634" stroke-width="4"/><path d="M740 435 L724 443 L724 427 Z" fill="#C74634" stroke="#C74634" stroke-width="1" stroke-linejoin="round"/><rect x="740" y="242" width="1084" height="430" rx="8" fill="#FFFFFF" stroke="#C2D4D4" stroke-width="2"/><rect x="740" y="242" width="1084" height="86" rx="8" fill="#EDF1F2" stroke="none" stroke-width="2"/><text x="772" y="290.91" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="772" y="290.91">Oracle AI Data Platform</tspan></text><text x="774" y="376.59" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="774" y="376.59">Permiso configurado sobre el objeto</tspan></text><line x1="774" y1="487" x2="1778" y2="487" stroke="#C2D4D4" stroke-width="2"/><text x="774" y="457.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="774" y="457.27">Leer producto aprobado</tspan></text><text x="1778" y="457.27" font-size="25.5" fill="#33553C" font-weight="700" text-anchor="end"><tspan x="1778" y="457.27">PERMITIDO</tspan></text><line x1="774" y1="577" x2="1778" y2="577" stroke="#C2D4D4" stroke-width="2"/><text x="774" y="547.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="774" y="547.27">Administrar todos los activos</tspan></text><text x="1778" y="547.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="end"><tspan x="1778" y="547.27">NO CONCEDIDO</tspan></text><text x="774" y="632.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="774" y="632.27">Comprobar también privilegios heredados e identidad efectiva.</tspan></text><line x1="1270" y1="672" x2="1270" y2="774" stroke="#3C4545" stroke-width="4"/><path d="M1270 774 L1262 758 L1278 758 Z" fill="#3C4545" stroke="#3C4545" stroke-width="1" stroke-linejoin="round"/><text x="1300" y="728.129" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1300" y="728.129">conservar evidencia </tspan><tspan x="1300" y="758.411">del acceso</tspan></text><rect x="96" y="774" width="1728" height="161" rx="8" fill="#FFFFFF" stroke="#3C4545" stroke-width="2"/><rect x="96" y="774" width="13" height="161" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><g data-svgrepo-icon="audit" transform="translate(139 805) scale(2)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
