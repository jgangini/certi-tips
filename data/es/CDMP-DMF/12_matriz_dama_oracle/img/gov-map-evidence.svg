<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">De la Decisión de Acceso a la Evidencia</title><desc id="description">El acuerdo empresarial autoriza un indicador para Analítica con identificador y estado, y deja el teléfono fuera del producto. La configuración permite leer el producto aprobado y no concede administración general. Comprueba también privilegios heredados e identidad efectiva. Finalmente, contrasta pruebas de acceso y registros soportados con el alcance aprobado; una decisión de negocio y un permiso técnico son evidencias complementarias.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">De la Decisión de Acceso a la Evidencia</tspan></text><rect x="96" y="242" width="540" height="430" rx="8" fill="#F1EFED" stroke="#C2D4D4" stroke-width="2"/><rect x="96" y="242" width="540" height="8" rx="0" fill="#C06D30" stroke="none" stroke-width="2"/><g data-svgrepo-icon="policy" transform="translate(128 269) scale(2)" color="#3C4545" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 13-8.381 8.38a1 1 0 0 1-3.001-3l8.384-8.381" />
