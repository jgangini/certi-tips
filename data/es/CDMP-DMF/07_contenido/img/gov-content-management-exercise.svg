<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Conservar la Historia; Responder con la Versión Vigente</title><desc id="description">La versión v1 sustituida tiene dos tratamientos. Para auditoría puede conservarse con su relación a v2 y acceso según la política. Para recuperación actual se usa el conjunto autorizado con v2 y se retira v1 de ese uso. El propietario decide conservación, el steward documenta la relación y el custodio comprueba el índice. Prueba consultas históricas y actuales para verificar que cada una recibe la versión que corresponde.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Conservar la Historia; Responder con la Versión Vigente</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 74)"><rect x="788.425" y="250" width="343.15" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="960" y="284.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="960" y="284.8">CONTRATO SUSTITUIDO v1</tspan></text><rect x="150" y="380" width="680" height="168" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M162 380 H818 Q830 380 830 392 V444 H150 V392 Q150 380 162 380 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="150" y="380" width="680" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="174" y="422.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="174" y="422.8">CONSERVACIÓN HISTÓRICA</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="150" y="444" width="680" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="490.0" y="480.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="490.0" y="480.8">Versión v1 + relación con v2</tspan></text></g></g><line x1="150" y1="496" x2="830" y2="496" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="center"><rect x="150" y="496" width="680" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="490.0" y="532.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="490.0" y="532.8">Acceso acorde con la política</tspan></text></g></g><line x1="830" y1="464" x2="1090" y2="464" stroke="#59616E" stroke-width="3" /><path d="M1090 464 L1074.0 472.0 L1074.0 456.0 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><rect x="1090" y="380" width="680" height="168" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1102 380 H1758 Q1770 380 1770 392 V444 H1090 V392 Q1090 380 1102 380 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="1090" y="380" width="680" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1114" y="422.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="1114" y="422.8">Evidencia para auditoría</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="1090" y="444" width="680" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1430.0" y="480.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1430.0" y="480.8">Propietario: decide conservación</tspan></text></g></g><line x1="1090" y1="496" x2="1770" y2="496" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="center"><rect x="1090" y="496" width="680" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1430.0" y="532.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1430.0" y="532.8">Steward: documenta la relación</tspan></text></g></g><rect x="150" y="650" width="680" height="168" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M162 650 H818 Q830 650 830 662 V714 H150 V662 Q150 650 162 650 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="150" y="650" width="680" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="174" y="692.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="174" y="692.8">RECUPERACIÓN ACTUAL</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="150" y="714" width="680" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="490.0" y="750.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="490.0" y="750.8">Conjunto autorizado con v2</tspan></text></g></g><line x1="150" y1="766" x2="830" y2="766" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="center"><rect x="150" y="766" width="680" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="490.0" y="802.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="490.0" y="802.8">Retirar v1 de este uso actual</tspan></text></g></g><line x1="830" y1="734" x2="1090" y2="734" stroke="#59616E" stroke-width="3" /><path d="M1090 734 L1074.0 742.0 L1074.0 726.0 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><rect x="1090" y="650" width="680" height="168" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1102 650 H1758 Q1770 650 1770 662 V714 H1090 V662 Q1090 650 1102 650 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="left"><rect x="1090" y="650" width="680" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1114" y="692.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="start"><tspan x="1114" y="692.8">Respuesta con versión vigente</tspan></text></g></g><g data-table-cell="row" data-cell-align="center"><rect x="1090" y="714" width="680" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1430.0" y="750.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1430.0" y="750.8">Custodio: comprueba el índice</tspan></text></g></g><line x1="1090" y1="766" x2="1770" y2="766" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="center"><rect x="1090" y="766" width="680" height="52" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1430.0" y="802.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1430.0" y="802.8">Prueba: consulta anterior y actual</tspan></text></g></g></g></g></svg>
