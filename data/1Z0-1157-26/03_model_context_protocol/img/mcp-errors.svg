<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 538" role="img" aria-labelledby="title description">
  <title id="title">Descubrir no equivale a ejecutar</title>
  <desc id="description">La lista de herramientas comunica capacidades, no ejecuta operaciones. El protocolo no concede permisos por sí mismo. La depuración debe registrar evidencia pertinente sin exponer secretos ni datos privados completos.</desc>
  <defs>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b;font-size:24px}
      .title{font-size:34px;font-weight:700}
      .label{font-size:26px;font-weight:700}
      .mistake rect{fill:#fae6e1;stroke:#efc7be;stroke-width:1.5}
      .correction rect{fill:#e1f2ee;stroke:#b7ddd5;stroke-width:1.5}
      .arrow{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .icon{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="538" fill="#f7f8fc"/>
  <text x="56" y="64" class="title">Descubrir no equivale a ejecutar</text>
  <g class="column-headings">
    <circle cx="80" cy="118" r="16" fill="#fae6e1"/>
    <path d="m75 113 10 10m0-10-10 10" class="icon" stroke="#c74436"/>
    <text x="108" y="127" class="label">Error o confusión</text>
    <circle cx="648" cy="118" r="16" fill="#e1f2ee"/>
    <path d="m641 118 5 5 9-10" class="icon" stroke="#087f7a"/>
    <text x="676" y="127" class="label">Qué comprobar</text>
  </g>
  <g class="comparison-row" transform="translate(0 154)">
    <g class="mistake">
      <rect x="56" width="480" height="96" rx="16"/>
      <text x="82" y="40">tools/list:</text>
      <text x="82" y="74">«Ya ejecuté la herramienta»</text>
    </g>
    <path d="M553 48h50m-13-9 13 9-13 9" class="arrow"/>
    <g class="correction">
      <rect x="624" width="520" height="96" rx="16"/>
      <text x="650" y="40">Lista nombres y esquemas.</text>
      <text x="650" y="74">tools/call solicita la ejecución.</text>
    </g>
  </g>
  <g class="comparison-row" transform="translate(0 270)">
    <g class="mistake">
      <rect x="56" width="480" height="96" rx="16"/>
      <text x="82" y="40">«Es compatible con MCP,</text>
      <text x="82" y="74">entonces tiene acceso»</text>
    </g>
    <path d="M553 48h50m-13-9 13 9-13 9" class="arrow"/>
    <g class="correction">
      <rect x="624" width="520" height="96" rx="16"/>
      <text x="650" y="40">Comprueba identidad, permisos</text>
      <text x="650" y="74">y alcance de cada operación.</text>
    </g>
  </g>
  <g class="comparison-row" transform="translate(0 386)">
    <g class="mistake">
      <rect x="56" width="480" height="96" rx="16"/>
      <text x="82" y="40">«Para depurar, registro</text>
      <text x="82" y="74">toda la conversación y secretos»</text>
    </g>
    <path d="M553 48h50m-13-9 13 9-13 9" class="arrow"/>
    <g class="correction">
      <rect x="624" width="520" height="96" rx="16"/>
      <text x="650" y="40">Registra datos mínimos y útiles.</text>
      <text x="650" y="74">Protege credenciales y privacidad.</text>
    </g>
  </g>
</svg>
