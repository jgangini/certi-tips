<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 706" role="img" aria-labelledby="title description">
  <title id="title">Una respuesta necesita modelos, capacidad y controles</title>
  <desc id="description">En recuperación documental, embeddings convierten texto en vectores usados para buscar candidatos. Rerank puede priorizarlos por relevancia; chat redacta con el contexto seleccionado. On-demand y Dedicated AI Clusters son modalidades de capacidad del modelo. Red, IAM y guardrails protegen capas distintas.</desc>
  <defs>
    <!-- Lucide icons, ISC. See assets/icons/LICENSE-lucide.txt. -->
    <symbol id="cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v2M12 2v2M17 20v2M17 2v2M2 12h2M2 17h2M2 7h2M20 12h2M20 17h2M20 7h2M7 20v2M7 2v2"/><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/></symbol>
    <symbol id="list-ordered" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5h10M11 12h10M11 19h10M4 4h1v5M4 9h2M6.5 20H3.4c0-1 2.6-1.925 2.6-3.5a1.5 1.5 0 0 0-2.6-1.02"/></symbol>
    <symbol id="messages-square" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2zM20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"/></symbol>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}
      .title{font-size:32px;font-weight:700}.label{font-size:25px;font-weight:700}
      .body{font-size:22px;fill:#536078}.mono{font-family:Consolas,monospace;font-size:22px;fill:#536078}
      .card{fill:#fff;stroke:#dce1eb;stroke-width:1.5}
      .connector{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .bidirectional{marker-start:url(#arrow)}.divider{stroke:#dce1eb;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="706" fill="#f7f8fc"/>
  <text x="56" y="64" class="title" text-anchor="start">Una respuesta necesita modelos, capacidad y controles</text>
  <g class="icon-badge" data-icon="cpu"><circle cx="220" cy="177" r="48" fill="#e9e6fa"/><use href="#cpu" x="194" y="151" width="52" height="52" color="#4f46b8"/></g>
  <g class="icon-badge" data-icon="list-ordered"><circle cx="600" cy="177" r="48" fill="#e9e6fa"/><use href="#list-ordered" x="574" y="151" width="52" height="52" color="#4f46b8"/></g>
  <g class="icon-badge" data-icon="messages-square"><circle cx="980" cy="177" r="48" fill="#fae6e1"/><use href="#messages-square" x="954" y="151" width="52" height="52" color="#c74436"/></g>
  <path d="M268 177H552" class="connector"/>
  <text x="410" y="157" class="body" text-anchor="middle">Candidatos</text>
  <path d="M648 177H932" class="connector"/>
  <text x="790" y="157" class="body" text-anchor="middle">Contexto elegido</text>
  <text x="220" y="268" class="label" text-anchor="middle">Embed</text>
  <text x="220" y="311" class="body" text-anchor="middle">Texto → vectores</text>
  <text x="220" y="345" class="body" text-anchor="middle">Búsqueda por similitud</text>
  <text x="600" y="268" class="label" text-anchor="middle">Rerank · opcional</text>
  <text x="600" y="311" class="body" text-anchor="middle">Ordena los candidatos</text>
  <text x="600" y="345" class="body" text-anchor="middle">según la consulta</text>
  <text x="980" y="268" class="label" text-anchor="middle">Chat</text>
  <text x="980" y="311" class="body" text-anchor="middle">Redacta usando</text>
  <text x="980" y="345" class="body" text-anchor="middle">el contexto seleccionado</text>
  <rect x="56" y="397" width="528" height="103" rx="22" class="card"/>
  <text x="84" y="441" class="label" text-anchor="start">On-demand</text>
  <text x="84" y="477" class="body" text-anchor="start">Capacidad compartida · consumo según uso</text>
  <rect x="616" y="397" width="528" height="103" rx="22" class="card"/>
  <text x="644" y="441" class="label" text-anchor="start">Dedicated AI Clusters</text>
  <text x="644" y="477" class="body" text-anchor="start">Capacidad dedicada · tiempo reservado</text>
  <rect x="56" y="536" width="1088" height="122" rx="22" fill="#17243b"/>
  <text x="238" y="582" class="label" text-anchor="middle" style="fill:#fff">Red</text>
  <text x="238" y="626" class="body" text-anchor="middle" style="fill:#d1d8e7">Ruta privada · ZPR</text>
  <text x="600" y="582" class="label" text-anchor="middle" style="fill:#fff">IAM</text>
  <text x="600" y="626" class="body" text-anchor="middle" style="fill:#d1d8e7">Identidades y permisos</text>
  <text x="962" y="582" class="label" text-anchor="middle" style="fill:#fff">Guardrails</text>
  <text x="962" y="626" class="body" text-anchor="middle" style="fill:#d1d8e7">Controles de contenido</text>
  <path d="M418 560v74M782 560v74" fill="none" stroke="#5b6982" stroke-width="1.5"/>
</svg>
