  <text x="26" y="151">Publicar la imagen</text>
</g>
<g class="step-card" transform="translate(56 388)">
  <rect width="320" height="184" rx="20" class="card"/>
  <circle cx="45" cy="42" r="22" fill="#087f7a"/>
  <text x="45" y="50" text-anchor="middle" class="white" font-weight="700">4</text>
  <text x="26" y="111" class="label">Aplicación</text>
