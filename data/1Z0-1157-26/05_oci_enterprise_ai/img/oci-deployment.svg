<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 664" role="img" aria-labelledby="title description">
<title id="title">Publicación de una aplicación compatible en OCI Generative AI</title>
<desc id="description">La aplicación probada se empaqueta como imagen, se sube a OCI Container Registry, se configura una aplicación, se crea su deployment y se atienden solicitudes por el endpoint. La evaluación y la versión anterior permiten detectar regresiones y volver atrás.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m2 2 6 3-6 3" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b;font-size:23px}.h{font-size:34px;font-weight:700}.label{font-size:26px;font-weight:700}.muted{fill:#536078}.white{fill:#fff}.edge{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.card{fill:#fff;stroke:#dce1ec;stroke-width:1.5}</style></defs>
<rect width="1200" height="664" fill="#f7f8fc"/>
<text x="56" y="65" class="h">Publicar el runtime, no solo llamar al modelo</text>
