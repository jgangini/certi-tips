<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title description">
  <title id="title">El Runner coordina capacidades con lugares de ejecución distintos</title>
  <desc id="description">Agent define instrucciones, modelo y herramientas. El Runner coordina el loop en tu aplicación: invoca el modelo, solicita una capacidad y recoge el resultado. Una hosted tool se ejecuta en el servicio, una function tool en tu aplicación y un agente como herramienta devuelve su resultado al principal.</desc>
  <!-- Lucide workflow, cloud, wrench and bot; license: ../icons/LICENSE-lucide.txt -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m2 2 6 3-6 3" fill="none" stroke="#536078" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b;font-size:22px}.h{font-size:34px;font-weight:700}.label{font-size:26px;font-weight:700}.muted{fill:#536078}.line{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.icon{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.white{fill:#fff}</style>
  </defs>
  <rect width="1200" height="690" fill="#f7f8fc"/><text x="56" y="62" class="h">El Runner coordina; cada capacidad tiene su ejecutor</text>
  <rect x="56" y="104" width="1088" height="60" rx="16" fill="#17243b"/><text x="82" y="142" class="white">Agent define: responsabilidad · instrucciones · modelo · herramientas</text>
  <rect x="56" y="249" width="296" height="284" rx="24" fill="#fff" stroke="#dce1ec"/>
  <circle cx="204" cy="329" r="48" fill="#e9e6fa"/>
  <g data-icon="workflow" transform="translate(176 301) scale(2.33)" fill="none" stroke="#4f46b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></g>
  <text x="204" y="412" text-anchor="middle" class="label">Runner</text>
  <text x="204" y="450" text-anchor="middle">Invoca el modelo</text><text x="204" y="484" text-anchor="middle" class="muted">Coordina y repite</text>
  <path d="M352 391H384Q404 391 404 371V272Q404 252 424 252H496" class="line"/>
  <path d="M352 391H496" class="line"/>
  <path d="M352 391H384Q404 391 404 411V510Q404 530 424 530H496" class="line"/>
  <rect x="496" y="192" width="648" height="120" rx="20" fill="#fae6e1"/>
  <circle cx="554" cy="252" r="34" fill="#fff"/>
  <g data-icon="cloud" transform="translate(532 230) scale(1.83)" fill="none" stroke="#c74436" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></g>
  <text x="611" y="238" class="label">Hosted tool</text><text x="611" y="275">El servicio ejecuta la capacidad compatible</text>
  <rect x="496" y="331" width="648" height="120" rx="20" fill="#e9e6fa"/>
  <circle cx="554" cy="391" r="34" fill="#fff"/>
  <g data-icon="wrench" transform="translate(532 369) scale(1.83)" fill="none" stroke="#4f46b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/></g>
  <text x="611" y="377" class="label">Function tool</text><text x="611" y="414">Tu aplicación valida y ejecuta su función</text>
  <rect x="496" y="470" width="648" height="120" rx="20" fill="#e1f2ee"/>
  <circle cx="554" cy="530" r="34" fill="#fff"/>
  <g data-icon="bot" transform="translate(532 508) scale(1.83)" class="icon" stroke="#087f7a"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></g>
  <text x="611" y="516" class="label">Agent as tool</text><text x="611" y="553">El especialista devuelve su resultado</text>
