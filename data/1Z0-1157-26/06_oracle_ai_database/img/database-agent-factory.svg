<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Private Agent Factory: fuentes distintas, recorridos distintos</title>
  <desc id="description">Dos casos del curso: documentos aprobados alimentan Knowledge Agent para responder con citas; tablas permitidas alimentan Data Analysis Agent para análisis estructurado. Agent Builder permite configurar fuentes, modelo y herramientas, probar y publicar un flujo propio. Los dos ejemplos no pretenden enumerar todo el catálogo actual.</desc>
  <defs><linearGradient id="source" x2="1" y2="1"><stop stop-color="#e7f4ef"/><stop offset="1" stop-color="#c5e4df"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}.title{font-size:34px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:22px;fill:#536078}.line{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="620" fill="#f7f8fc"/>
  <text x="48" y="61" class="title">Construye según el tipo de información</text>
  <rect x="48" y="110" width="400" height="132" rx="20" fill="#fff" stroke="#dbe0eb"/><g transform="translate(125 173)"><circle cx="5" cy="7" r="58" fill="#cbe3df"/><circle r="58" fill="url(#source)"/><g transform="translate(-30 -30) scale(2.5)" fill="none" stroke="#087f7a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5M10 9H8M16 13H8M16 17H8"/></g></g>
  <text x="217" y="160" class="label">Documentos</text><text x="217" y="196" class="body">Contenido aprobado</text><path d="M448 174H528" class="line"/>
  <rect x="528" y="129" width="280" height="92" rx="18" fill="#eae7fa"/><text x="668" y="164" text-anchor="middle" class="label">Knowledge Agent</text><text x="668" y="200" text-anchor="middle" class="body">Recupera y fundamenta</text><path d="M808 174H916" class="line"/>
  <rect x="916" y="129" width="236" height="92" rx="18" fill="#e1f2ee"/><text x="1034" text-anchor="middle" y="163" class="label">Respuesta + citas</text><text x="1034" text-anchor="middle" y="199" class="body">Revisar la fuente</text>
  <rect x="48" y="263" width="400" height="132" rx="20" fill="#fff" stroke="#dbe0eb"/><g transform="translate(125 326)"><circle cx="5" cy="7" r="58" fill="#cbe3df"/><circle r="58" fill="url(#source)"/><g transform="translate(-30 -30) scale(2.5)" fill="none" stroke="#087f7a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18M3 15h18"/></g></g>
  <text x="217" y="315" class="label">Tablas</text><text x="217" y="351" class="body">Datos permitidos</text><path d="M448 327H528" class="line"/>
  <rect x="528" y="282" width="280" height="92" rx="18" fill="#eae7fa"/><text x="668" y="317" text-anchor="middle" class="label">Data Analysis Agent</text><text x="668" y="353" text-anchor="middle" class="body">Consulta y analiza</text><path d="M808 327H916" class="line"/>
  <rect x="916" y="282" width="236" height="92" rx="18" fill="#e1f2ee"/><text x="1034" text-anchor="middle" y="316" class="label">Resultados</text><text x="1034" text-anchor="middle" y="352" class="body">Tablas y explicación</text>
  <rect x="48" y="433" width="1104" height="145" rx="20" fill="#fff" stroke="#dbe0eb"/>
  <text x="76" y="478" class="label">Agent Builder</text><text x="76" y="517" class="body">Flujos propios</text>
  <path d="M285 505H414" class="line"/>
  <rect x="414" y="467" width="314" height="76" rx="13" fill="#fae6e2"/><text x="571" y="498" text-anchor="middle" class="body">Fuentes + modelo + tools</text><text x="571" y="529" text-anchor="middle" class="body">Configuración visual</text>
  <path d="M728 505H808" class="line"/><text x="824" y="514" class="label">Probar</text><path d="M915 505H976" class="line"/><text x="990" y="514" class="label">Publicar</text>
