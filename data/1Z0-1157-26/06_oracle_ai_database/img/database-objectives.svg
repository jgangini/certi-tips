<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 518" role="img" aria-labelledby="title description">
<title id="title">Del significado a una operación autorizada</title><desc id="description">Representa los datos como embeddings compatibles, recupera evidencia con similitud y filtros, elige una capacidad adecuada y comprueba identidad y permisos.</desc>
