<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title description">
<title id="title">Dos herramientas, una respuesta comprobable</title><desc id="description">La solicitud 18 por 5 dividido entre 3 se resuelve en dos llamadas. El modelo solicita multiplicar con call-a; el runtime obtiene 90. Después solicita dividir 90 entre 3 con call-b; el runtime valida y obtiene 30. La respuesta final usa esos resultados.</desc>
<defs><linearGradient id="coral" x2="1" y2="1"><stop stop-color="#fff4ef"/><stop offset="1" stop-color="#f1ccc5"/></linearGradient><linearGradient id="indigo" x2="1" y2="1"><stop stop-color="#f2f0ff"/><stop offset="1" stop-color="#d8d4f5"/></linearGradient><linearGradient id="teal" x2="1" y2="1"><stop stop-color="#effaf7"/><stop offset="1" stop-color="#c9e9e3"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m2 1 6 4-6 4" fill="none" stroke="#536078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243b}.title{font-size:32px;font-weight:700}.label{font-size:26px;font-weight:700}.body{font-size:23px;fill:#536078}.small{font-size:22px;fill:#536078}.mono{font-family:Consolas,monospace;font-size:22px}.line{fill:none;stroke:#536078;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.icon{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#dce1eb;stroke-width:1.5}</style></defs>
<rect width="1200" height="610" fill="#f7f8fc"/>
<text x="56" y="64" class="title">Dos herramientas, una respuesta comprobable</text><text x="210" y="135" fill="#c74436" style="fill:#c74436" class="label" text-anchor="middle">Modelo: solicita</text><text x="608" y="135" style="fill:#4f46b8" class="label" text-anchor="middle">Runtime: ejecuta</text><text x="1005" y="135" style="fill:#087f7a" class="label" text-anchor="middle">Evidencia</text><path d="M406 157V548M805 157V548" stroke="#dce1eb" stroke-width="2" stroke-dasharray="6 8"/><rect x="56" y="182" width="310" height="100" rx="22" class="card"/><text x="82" y="223" class="mono" text-anchor="start">multiplicar(18, 5)</text><text x="82" y="254" class="mono" text-anchor="start">call-a</text><rect x="451" y="182" width="310" height="100" rx="22" class="card"/><text x="606" y="243" class="label" text-anchor="middle">18 × 5 = 90</text><rect x="847" y="182" width="300" height="100" rx="22" class="card"/><text x="997" y="243" class="mono" text-anchor="middle">call-a → 90</text><path d="M366 232H451" class="line"/><path d="M761 232H847" class="line"/><rect x="56" y="342" width="310" height="100" rx="22" class="card"/><text x="82" y="383" class="mono" text-anchor="start">dividir(90, 3)</text><text x="82" y="414" class="mono" text-anchor="start">call-b</text><rect x="451" y="342" width="310" height="100" rx="22" class="card"/><text x="606" y="401" class="label" text-anchor="middle">90 ÷ 3 = 30</text><rect x="847" y="342" width="300" height="100" rx="22" class="card"/><text x="997" y="401" class="mono" text-anchor="middle">call-b → 30</text><path d="M366 392H451" class="line"/><path d="M761 392H847" class="line"/><path d="M997 282V293Q997 310 980 310H227Q210 310 210 327V342" class="line"/><text x="584" y="333" class="small" text-anchor="middle">90 pasa a la segunda llamada</text><text x="600" y="531" class="title" text-anchor="middle">Respuesta final: 30</text></svg>
