<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">El Consentimiento se Interpreta en una Fecha</title><desc id="description">El consentimiento comercial de C7 comienza el 1 de marzo y se retira el 20 de abril. La campaña del 15 de abril cae dentro del intervalo mostrado, pero la decisión también debe corresponder a la finalidad autorizada y a su evidencia. Modela sujeto, finalidad, inicio y retirada; un indicador de consentimiento actual no reconstruye por sí solo la autorización de una fecha pasada.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">El Consentimiento se Interpreta en una Fecha</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 78)"><g data-timeline="consent">
