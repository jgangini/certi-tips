<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">La Unión Repite el Total de la Factura</title><desc id="description">F42 tiene un total de cabecera de 100 y dos líneas: Servicio por 60 e Instalación por 40. Al unir cabecera y detalle, el total 100 se repite en las dos filas. Sumar ese campo produce 200 y cuenta dos veces la factura; sumar los importes de línea conserva 100. Comprueba el grano de cada medida antes de agregar el resultado de una unión.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">La Unión Repite el Total de la Factura</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 46)"><rect data-layout="reference-tag" x="244.0" y="300" width="288" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><text x="388" y="334.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="388" y="334.8">Cabecera de factura</tspan></text><defs><clipPath id="invoice"><rect x="128" y="364" width="520" height="118" rx="12" /></clipPath></defs><g clip-path="url(#invoice)"><g data-table-cell="header" data-cell-align="center"><rect data-cell-frame="true" x="128" y="364" width="312" height="64" fill="#59616E" /><g data-cell-content="true"><text x="284.0" y="406.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="middle"><tspan x="284.0" y="406.8">Factura</tspan></text></g></g><g data-table-cell="header" data-cell-align="center"><rect data-cell-frame="true" x="440" y="364" width="208" height="64" fill="#59616E" /><g data-cell-content="true"><text x="544.0" y=