<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Un Archivo, un Documento y una Evidencia</title><desc id="description">Los tres bloques representan objetos distintos. C-104.pdf es el archivo digital; el contrato C-104 es el documento cuyo significado depende de versión y vigencia; y la aprobación de la versión 2 es un registro de evidencia. Cambiar el nombre del PDF no cambia la vigencia del acuerdo. Conserva contexto y evidencia para demostrar qué contenido aplica y quién lo aprobó.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Un Archivo, un Documento y una Evidencia</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 80)"><rect x="96" y="280" width="1728" height="496" rx="16" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" /><path d="M108 280 H1812 Q1824 280 1824 292 V344 H96 V292 Q96 280 108 280 Z" fill="#59616E" stroke="#59616E" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g data-table-cell="header" data-cell-align="center"><rect x="96" y="280" width="576" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="384.0" y="322.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="middle"><tspan x="384.0" y="322.8">ARCHIVO</tspan></text></g></g><g data-table-cell="header" data-cell-align="center"><rect x="672" y="280" width="576" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="960.0" y="322.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="middle"><tspan x="960.0" y="322.8">DOCUMENTO</tspan></text></g></g><line x1="672" y1="280" x2="672" y2="344" stroke="#FFFFFF" stroke-width="1.5" /><line x1="672" y1="344" x2="672" y2="776" stroke="#59616E" stroke-width="1.5" stroke-dasharray="8 10" /><g data-table-cell="header" data-cell-align="center"><rect x="1248" y="280" width="576" height="64" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1536.0" y="322.8" fill="#FFFFFF" font-size="25.5" font-weight="700" text-anchor="middle"><tspan x="1536.0" y="322.8">REGISTRO</tspan></text></g></g><line x1="1248" y1="280" x2="1248" y2="344" stroke="#FFFFFF" stroke-width="1.5" /><line x1="1248" y1="344" x2="1248" y2="776" stroke="#59616E" stroke-width="1.5" stroke-dasharray="8 10" /><rect x="312.7" y="384" width="142.6" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="384" y="418.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="384" y="418.8">C-104.pdf</tspan></text><text x="384" y="526.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="384" y="526.8">Representación digital</tspan></text><rect x="132" y="630" width="504" height="96" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="note" data-cell-align="center"><rect x="132" y="630" width="504" height="96" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="384.0" y="670.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="384.0" y="670.8">Cambiar el nombre del PDF </tspan><tspan x="384.0" y="706.8">no cambia la vigencia.</tspan></text></g></g><rect x="857.4015625" y="384" width="205.196875" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="960" y="418.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="960" y="418.8">Contrato C-104</tspan></text><text x="960" y="490.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="960" y="490.8">Contenido acordado </tspan><tspan x="960" y="526.8">Versión 2 </tspan><tspan x="960" y="562.8">Vigente desde 01/09</tspan></text><rect x="708" y="630" width="504" height="96" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="note" data-cell-align="center"><rect x="708" y="630" width="504" height="96" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="960.0" y="670.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="960.0" y="670.8">El contexto permite </tspan><tspan x="960.0" y="706.8">interpretar el contenido.</tspan></text></g></g><rect x="1420.6546875" y="384" width="230.690625" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1536" y="418.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1536" y="418.8">Aprobación de v2</tspan></text><text x="1536" y="490.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1536" y="490.8">Quién aprobó </tspan><tspan x="1536" y="526.8">Cuándo y para qué </tspan><tspan x="1536" y="562.8">Evidencia conservada</tspan></text><rect x="1284" y="630" width="504" height="96" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="note" data-cell-align="center"><rect x="1284" y="630" width="504" height="96" rx="0" fill="none" stroke="none" stroke-width="0" data-cell-frame="true" /><g data-cell-content="true"><text x="1536.0" y="670.8" fill="#181818" font-size="25.5" font-weight="400" text-anchor="middle"><tspan x="1536.0" y="670.8">El registro demuestra </tspan><tspan x="1536.0" y="706.8">una actividad o decisión.</tspan></text></g></g></g></g></svg>
