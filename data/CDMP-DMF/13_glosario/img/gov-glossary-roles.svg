<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">Gobierno y Ejecución: Responsabilidades Distintas</title><desc id="description">El propietario aprueba significado, finalidad y excepciones y deja una decisión con alcance y fecha. El data steward documenta la definición y trata discrepancias. El custodio configura y opera accesos y ejecuciones con resultados comprobables. Una excepción de finalidad vuelve al propietario. Tener una cuenta administradora no concede autoridad para aprobar el uso empresarial.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2"/><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">Gobierno y Ejecución: Responsabilidades Distintas</tspan></text><text x="96" y="265.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="265.27">QUIÉN</tspan></text><text x="596" y="265.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="596" y="265.27">QUÉ DECIDE O HACE</tspan></text><text x="1200" y="265.27" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="1200" y="265.27">QUÉ DEJA PARA REVISAR</tspan></text><rect x="96" y="305" width="1728" height="162" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="305" width="8" height="162" rx="0" fill="#C06D30" stroke="none" stroke-width="2"/><g data-person-icon="user-supplied" transform="translate(124 322) scale(2.625)" fill="#3C4545"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"/><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z"/></g><text x="183" y="354.91" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="183" y="354.91">Propietario</tspan></text><text x="183" y="413.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="183" y="413.27">Responde por el uso</tspan></text><text x="596" y="358.739" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="596" y="358.739">Aprueba significado, finalidad </tspan><tspan x="596" y="393.801">y aceptación de excepciones.</tspan></text><text x="1200" y="358.739" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1200" y="358.739">Decisión de publicación </tspan><tspan x="1200" y="393.801">con alcance y fecha</tspan></text><rect x="96" y="493" width="1728" height="162" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="96" y="493" width="8" height="162" rx="0" fill="#00B0F0" stroke="none" stroke-width="2"/><g data-person-icon="user-supplied" transform="translate(124 510) scale(2.625)" fill="#3C4545"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"/><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z"/></g><text x="183" y="542.91" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="183" y="542.91">Data steward</tspan></text><text x="183" y="601.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="183" y="601.27">Cuida el significado</tspan></text><text x="596" y="546.739" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="596" y="546.739">Define la regla y comprueba </tspan><tspan x="596" y="581.801">cómo se resuelven discrepancias.</tspan></text><text x="1200" y="546.739" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1200" y="546.739">Definición versionada </tspan><tspan x="1200" y="581.801">y registro de incidencias</tspan></text><rect x="96" y="681" width="1728" height="162" rx="0" fill="#F1EFED" stroke="none" stroke-width="2"/><rect x="96" y="681" width="8" height="162" rx="0" fill="#749B6B" stroke="none" stroke-width="2"/><g data-person-icon="user-supplied" transform="translate(124 698) scale(2.625)" fill="#3C4545"><path d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"/><path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z"/></g><text x="183" y="730.91" font-size="25.5" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="183" y="730.91">Custodio</tspan></text><text x="183" y="789.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="183" y="789.27">Implementa y opera</tspan></text><text x="596" y="734.739" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="596" y="734.739">Configura acceso, ejecución </tspan><tspan x="596" y="769.801">y conservación de evidencia.</tspan></text><text x="1200" y="734.739" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="start"><tspan x="1200" y="734.739">Permisos comprobados </tspan><tspan x="1200" y="769.801">y resultados de ejecución</tspan></text><path d="M1790 837 V955 H64 V360" fill="none" stroke="#C74634" stroke-width="4" stroke-linejoin="round"/><line x1="64" y1="360" x2="110" y2="360" stroke="#C74634" stroke-width="4"/><path d="M110 360 L94 368 L94 352 Z" fill="#C74634" stroke="#C74634" stroke-width="1" stroke-linejoin="round"/><text x="1050" y="927.27" font-size="25.5" fill="#3C4545" font-weight="400" text-anchor="middle"><tspan x="1050" y="927.27">Una excepción de finalidad vuelve al propietario</tspan></text></g></svg>
