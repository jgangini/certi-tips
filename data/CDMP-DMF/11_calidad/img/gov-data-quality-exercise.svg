<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-design-audit="08-11-compact"><title id="title">La Unicidad Decide Si se Publica</title><desc id="description">La población tiene 200 filas y 198 claves distintas: unicidad del 99 % frente a una exigencia del 100 %, aunque la completitud sea del 100 %. La ruta bloquea la publicación, investiga las filas y repite la prueba después de corregir. Una excepción formal, si se autoriza, registra propietario, motivo, alcance y vigencia; no convierte el resultado en cumplimiento del umbral.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">La Unicidad Decide Si se Publica</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 54.5)"><rect x="96" y="270" width="600" height="190" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M108 270 H684 Q696 270 696 282 V334 H96 V282 Q96 270 108 270 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="start"><rect x="96" y="270" width="600" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="312.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="120" y="312.8">POBLACIÓN EVALUADA</tspan></text></g></g><g data-table-cell="tag-row" data-cell-align="center"><rect x="96" y="334" width="600" height="72" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><rect x="283.5" y="346" width="225" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="396.0" y="380.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="396.0" y="380.8">198 / 200 = 99 %</tspan></text></g></g><line x1="96" y1="406" x2="696" y2="406" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="start"><rect x="96" y="406" width="600" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="443.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="120" y="443.8">Completitud: 100 %</tspan></text></g></g><line x1="696" y1="365" x2="824" y2="365" stroke="#59616E" stroke-width="3" /><path d="M824 365 L808.0 373.0 L808.0 357.0 Z" fill="#59616E" /><path d="M1044.0 245 L1264 365.0 L1044.0 485 L824 365.0 Z" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" stroke-linejoin="round" /><text x="1044.0" y="358.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1044.0" y="358.8">Unicidad exigida:</tspan><tspan x="1044.0" y="392.8">100 %</tspan></text><line x1="1264" y1="365" x2="1404" y2="365" stroke="#59616E" stroke-width="3" /><path d="M1404 365 L1388.0 373.0 L1388.0 357.0 Z" fill="#59616E" /><rect x="1404" y="333" width="420" height="64" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1416 333 H1812 Q1824 333 1824 345 V397 H1404 V345 Q1404 333 1416 333 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="start"><rect x="1404" y="333" width="420" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1428" y="375.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="1428" y="375.8">BLOQUEAR publicación</tspan></text></g></g><path d="M1044 485 L1044.0 554.0 Q1044 570 1028.0 570.0 L504.0 570.0 Q488 570 488.0 586.0 L488 690" fill="none" stroke="#59616E" stroke-width="3" stroke-linejoin="round" /><path d="M488 690 L480.0 674.0 L496.0 674.0 Z" fill="#59616E" /><path d="M1044 570 L1412.0 570.0 Q1428 570 1428.0 586.0 L1428 690" fill="none" stroke="#59616E" stroke-width="3" stroke-linejoin="round" /><path d="M1428 690 L1420.0 674.0 L1436.0 674.0 Z" fill="#59616E" /><rect x="96" y="690" width="784" height="172" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M108 690 H868 Q880 690 880 702 V754 H96 V702 Q96 690 108 690 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="start"><rect x="96" y="690" width="784" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="732.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="120" y="732.8">REMEDIAR</tspan></text></g></g><g data-table-cell="row" data-cell-align="start"><rect x="96" y="754" width="784" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="791.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="120" y="791.8">Separar e investigar las filas.</tspan></text></g></g><line x1="96" y1="808" x2="880" y2="808" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="start"><rect x="96" y="808" width="784" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="120" y="845.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="120" y="845.8">Corregir y repetir la prueba.</tspan></text></g></g><rect x="1032" y="690" width="792" height="172" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M1044 690 H1812 Q1824 690 1824 702 V754 H1032 V702 Q1032 690 1044 690 Z" fill="#59616E" data-table-header="true" /><g data-table-cell="header" data-cell-align="start"><rect x="1032" y="690" width="792" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1056" y="732.8" font-size="25.5" fill="#FFFFFF" font-weight="700" text-anchor="start"><tspan x="1056" y="732.8">EXCEPCIÓN FORMAL, SI SE AUTORIZA</tspan></text></g></g><g data-table-cell="row" data-cell-align="start"><rect x="1032" y="754" width="792" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1056" y="791.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1056" y="791.8">Propietario, motivo, alcance y vigencia.</tspan></text></g></g><line x1="1032" y1="808" x2="1824" y2="808" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="row" data-cell-align="start"><rect x="1032" y="808" width="792" height="54" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="1056" y="845.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="start"><tspan x="1056" y="845.8">No equivale a cumplir el umbral.</tspan></text></g></g></g></g></svg>