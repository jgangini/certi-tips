<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-design-audit="08-11-compact"><title id="title">El Último Grafo No Reconstruye el Pasado</title><desc id="description">Para auditar una ejecución de hace tres meses reúne versiones de notebook y regla, identificador de ejecución, entradas, salidas y aprobación aplicable al periodo. El último linaje y el código actual explican relaciones presentes, pero no prueban aquella ejecución. Si falta evidencia histórica, registra la limitación y evita reconstruirla como si hubiera sido capturada.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F1EFED" stroke="none" stroke-width="2" /><rect x="96" y="128" width="88" height="6" rx="0" fill="#C74634" stroke="none" stroke-width="2" /><text x="96" y="99" font-size="56" fill="#3C4545" font-weight="700" text-anchor="start"><tspan x="96" y="99">El Último Grafo No Reconstruye el Pasado</tspan></text><g data-layout="module-artwork" data-reference="governance-architecture" data-center="960 608" transform="translate(0 66)"><line x1="350" y1="282" x2="1570" y2="282" stroke="#59616E" stroke-width="3" /><path d="M1570 282 L1554.0 290.0 L1554.0 274.0 Z" fill="#59616E" /><rect x="270.0" y="218" width="240" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="390" y="252.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="390" y="252.8">HACE TRES MESES</tspan></text><rect x="1488.0" y="218" width="84" height="48" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-layout="reference-tag" /><text x="1530" y="252.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="1530" y="252.8">HOY</tspan></text><rect x="96" y="410" width="930" height="280" rx="12" fill="#FFFFFF" stroke="#59616E" stroke-width="1.5" data-table-frame="true" /><path d="M108 41