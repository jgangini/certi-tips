troke="#59616E" stroke-width="3" /><path d="M390 410 L382.0 394.0 L398.0 394.0 Z" fill="#59616E" /><line x1="1530" y1="282" x2="1530" y2="410" stroke="#59616E" stroke-width="3" /><path d="M1530 410 L1522.0 394.0 L1538.0 394.0 Z" fill="#59616E" /><rect x="96" y="802" width="1728" height="64" rx="12" fill="#F1EFED" stroke="#59616E" stroke-width="1.5" /><g data-table-cell="note" data-cell-align="center"><rect x="96" y="802" width="1728" height="64" fill="none" stroke="none" data-cell-frame="true" /><g data-cell-content="true"><text x="960.0" y="844.8" font-size="25.5" fill="#181818" font-weight="400" text-anchor="middle"><tspan x="960.0" y="844.8">Si falta evidencia histórica, registra la limitación; no la presentes como capturada.</tspan></text></g></g></g></g></svg>