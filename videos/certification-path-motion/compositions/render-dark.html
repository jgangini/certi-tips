<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>CertiTips · Ruta de certificación · oscuro</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b1d25;
      }
      #root,
      #pipeline-host {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main-dark" data-start="0" data-duration="15.5" data-fps="30" data-width="1920" data-height="1080">
      <div id="pipeline-host" class="clip" data-composition-id="hw-pipeline" data-composition-src="compositions/hw-pipeline.html" data-variable-values='{"theme":"dark"}' data-start="0" data-duration="15.5" data-track-index="0" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main-dark"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
