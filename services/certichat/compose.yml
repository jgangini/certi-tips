x-hardened: &hardened
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  tmpfs:
    - /tmp:size=256m,mode=1770,uid=10001,gid=10001
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

x-models: &models
  CERTICHAT_INDEX_MODEL: ${CERTICHAT_INDEX_MODEL:-anthropic/claude-haiku-5.5}
  CERTICHAT_CHAT_MODEL: ${CERTICHAT_CHAT_MODEL:-openai/gpt-5.4}
  CERTICHAT_INDEX_REASONING: ${CERTICHAT_INDEX_REASONING:-high}
  CERTICHAT_CHAT_REASONING: ${CERTICHAT_CHAT_REASONING:-medium}
  CERTICHAT_INDEX_MAX_TOKENS: ${CERTICHAT_INDEX_MAX_TOKENS:-16384}
  CERTICHAT_CHAT_MAX_TOKENS: ${CERTICHAT_CHAT_MAX_TOKENS:-8192}

services:
  api:
    <<: *hardened
    image: certichat-api:${CERTICHAT_IMAGE_TAG:-local}
    build: {context: ., dockerfile: services/certichat/Dockerfile, target: runtime}
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --workers, "1", --proxy-headers, --forwarded-allow-ips, "${CERTICHAT_TRUSTED_PROXY_IPS:-127.0.0.1}", --limit-concurrency, "64", --no-access-log, --no-server-header, --timeout-graceful-shutdown, "50"]
    environment:
      <<: *models
      CERTICHAT_MODE: ${CERTICHAT_MODE:-VPS}
      CERTICHAT_REFRESH: ${CERTICHAT_REFRESH:-6}
      CERTICHAT_QUESTIONS: ${CERTICHAT_QUESTIONS:-20}
      CERTICHAT_INDEX_BUDGET_USD: ${CERTICHAT_INDEX_BUDGET_USD:-10}
      CERTICHAT_CHAT_BUDGET_USD: ${CERTICHAT_CHAT_BUDGET_USD:-50}
      CERTICHAT_VOICE_ENABLED: ${CERTICHAT_VOICE_ENABLED:-false}
      CERTICHAT_LOCAL_VOICE_PILOT: ${CERTICHAT_LOCAL_VOICE_PILOT:-false}
      CERTICHAT_VOICE_MODEL: ${CERTICHAT_VOICE_MODEL:-openai/gpt-audio-mini}
      CERTICHAT_VOICE_PILOT_BUDGET_USD: ${CERTICHAT_VOICE_PILOT_BUDGET_USD:-4.58}
      CERTICHAT_JEV_VIDEO_ENABLED: ${CERTICHAT_JEV_VIDEO_ENABLED:-false}
      CERTICHAT_DATABASE_URL: ${CERTICHAT_DATABASE_URL:?Configure private database credentials}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Configure the private OpenRouter key}
      CERTICHAT_TURNSTILE_SECRET: ${CERTICHAT_TURNSTILE_SECRET:?Configure Turnstile}
      CERTICHAT_TURNSTILE_HOSTNAME: ${CERTICHAT_TURNSTILE_HOSTNAME:-jgangini.github.io}
      CERTICHAT_NETWORK_SECRET: ${CERTICHAT_NETWORK_SECRET:?Generate an independent network secret}
      CERTICHAT_CHAT_INTERNAL_TOKEN: ${CERTICHAT_CHAT_INTERNAL_TOKEN:?Generate the private chat token}
      CERTICHAT_INDEX_INTERNAL_TOKEN: ${CERTICHAT_INDEX_INTERNAL_TOKEN:?Generate the private index token}
      CERTICHAT_KNOWLEDGE_URL: http://knowledge:8001
      CERTICHAT_PUBLIC_ORIGIN: ${CERTICHAT_PUBLIC_ORIGIN:-https://certichat.cloudtechnext.net}
      CERTICHAT_ALLOWED_ORIGINS: ${CERTICHAT_ALLOWED_ORIGINS:-https://jgangini.github.io}
      CERTICHAT_SECURE_COOKIES: ${CERTICHAT_SECURE_COOKIES:-true}
    ports: ["127.0.0.1:${CERTICHAT_PORT:-18741}:8000"]
    networks: [app, data, knowledge]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 55s
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 4s
      retries: 12

  knowledge:
    <<: *hardened
    image: certichat-knowledge:${CERTICHAT_IMAGE_TAG:-local}
    build: {context: ., dockerfile: services/certichat/Dockerfile, target: knowledge}
    command: [uvicorn, app.knowledge:app, --host, 0.0.0.0, --port, "8001", --workers, "1", --limit-concurrency, "64", --no-access-log, --no-server-header, --timeout-graceful-shutdown, "45"]
    environment:
      <<: *models
      CERTICHAT_CHAT_INTERNAL_TOKEN: ${CERTICHAT_CHAT_INTERNAL_TOKEN:?Generate the private chat token}
      CERTICHAT_DATA_DIR: ${CERTICHAT_DATA_DIR:-/data}
    volumes: [knowledge_data:/data]
    networks: [knowledge]
    restart: unless-stopped
    stop_grace_period: 55s
    cpus: 1.5
    mem_limit: 3g
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 60s

  indexer:
    <<: *hardened
    image: certichat-knowledge:${CERTICHAT_IMAGE_TAG:-local}
    profiles: [ops]
    entrypoint: [python, -m, app.indexer]
    command: [build]
    environment:
      <<: *models
      CERTICHAT_INDEX_INTERNAL_TOKEN: ${CERTICHAT_INDEX_INTERNAL_TOKEN:?Generate the private index token}
      CERTICHAT_DATA_DIR: ${CERTICHAT_DATA_DIR:-/data}
    volumes: [knowledge_data:/data]
    networks: [app, knowledge]
    cpus: 1.5
    mem_limit: 6g

  local-refresh:
    <<: *hardened
    image: certichat-knowledge:${CERTICHAT_IMAGE_TAG:-local}
    profiles: [local]
    entrypoint: [/bin/sh, -c]
    command: ['test "$$CERTICHAT_MODE" = LOCAL || exit 1; case "$$CERTICHAT_INDEX_REFRESH_MINUTES" in [1-9]|1[0-5]) ;; *) exit 1;; esac; while true; do python -m app.indexer refresh; sleep "$$((CERTICHAT_INDEX_REFRESH_MINUTES * 60))"; done']
    environment:
      CERTICHAT_MODE: ${CERTICHAT_MODE:-VPS}
      CERTICHAT_INDEX_REFRESH_MINUTES: ${CERTICHAT_INDEX_REFRESH_MINUTES:-5}
      CERTICHAT_DATA_DIR: ${CERTICHAT_DATA_DIR:-/data}
    volumes: [knowledge_data:/data]
    networks: [app]
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 256m

  volume-init:
    image: certichat-api:${CERTICHAT_IMAGE_TAG:-local}
    profiles: [ops]
    user: "0:0"
    command: [python, -c, "import os; os.chown('/data',10001,10001); os.chmod('/data',0o700)"]
    volumes: [knowledge_data:/data]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25

  postgres:
    image: postgres:16-alpine
    user: postgres
    environment:
      POSTGRES_USER: certichat_admin
      POSTGRES_PASSWORD: ${CERTICHAT_POSTGRES_ADMIN_PASSWORD:?Generate the private database password}
      POSTGRES_DB: certichat
    command: [postgres, -c, max_connections=40, -c, shared_buffers=128MB]
    networks: [data]
    volumes: [postgres_data:/var/lib/postgresql/data]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=64m, /var/run/postgresql:size=16m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: [CMD, pg_isready, -U, certichat_admin, -d, certichat]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *hardened
    image: certichat-api:${CERTICHAT_IMAGE_TAG:-local}
    profiles: [ops]
    command: [python, /app/migrate.py]
    environment:
      CERTICHAT_POSTGRES_ADMIN_PASSWORD: ${CERTICHAT_POSTGRES_ADMIN_PASSWORD:?Generate the admin password}
      CERTICHAT_POSTGRES_RUNTIME_PASSWORD: ${CERTICHAT_POSTGRES_RUNTIME_PASSWORD:?Generate the runtime password}
    networks: [data]
    cpus: 0.5
    mem_limit: 128m

  test:
    <<: *hardened
    image: certichat-test:${CERTICHAT_IMAGE_TAG:-local}
    profiles: [test]
    build: {context: ., dockerfile: services/certichat/Dockerfile, target: test}
    environment:
      CERTICHAT_TEST_DATABASE_URL: postgresql://certichat_runtime:certichat-disposable-test-runtime-password@test-postgres:5432/certichat
    depends_on:
      test-migrate: {condition: service_completed_successfully}
    networks: [test]
    cpus: 1.0
    mem_limit: 512m

  test-postgres:
    image: postgres:16-alpine
    profiles: [test]
    user: postgres
    environment:
      POSTGRES_USER: certichat_admin
      POSTGRES_PASSWORD: certichat-disposable-test-admin-password
      POSTGRES_DB: certichat
    networks: [test]
    read_only: true
    tmpfs:
      - /var/lib/postgresql/data:size=256m,mode=0700,uid=70,gid=70
      - /var/run/postgresql:size=16m,mode=1777
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 96
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: [CMD, pg_isready, -U, certichat_admin, -d, certichat]
      interval: 2s
      timeout: 3s
      retries: 30

  test-migrate:
    <<: *hardened
    image: certichat-api:${CERTICHAT_IMAGE_TAG:-local}
    profiles: [test]
    command: [python, /app/migrate.py]
    environment:
      CERTICHAT_POSTGRES_HOST: test-postgres
      CERTICHAT_POSTGRES_ADMIN_PASSWORD: certichat-disposable-test-admin-password
      CERTICHAT_POSTGRES_RUNTIME_PASSWORD: certichat-disposable-test-runtime-password
    networks: [test]
    depends_on:
      test-postgres: {condition: service_healthy}
    cpus: 0.5
    mem_limit: 128m

volumes:
  postgres_data:
  knowledge_data:

networks:
  app:
  data: {internal: true}
  knowledge: {internal: true}
  test: {internal: true}
